e ti o homem falou qualidades infindáveis.\n4 – Complemento\nNominal\n( ) Os olhos tristes da fotografia não desculpavam a ti, que fingias não saber.","o":{"A":"4 - 2 - 3 - 1","B":"3 - 4 - 2 - 3","C":"4 - 1 - 3 - 2","D":"2 - 3 - 1 - 4"},"t":"Sintaxe","tp":"Termos da oração: complementos e adjuntos","src":"prova_eags_2025_cod_52_09 05 2024 14 59 33.pdf · p. 4"},{"id":"EAGS2025-C52-PT-011","s":"por","y":2025,"c":"52","n":11,"a":"B","an":false,"du":false,"l":"","e":"Assinale a alternativa que não contém oração subordinada adjetiva.","o":{"A":"Não há quem dele se apiede.","B":"“Deus, ó Deus, onde estás que não respondes?” (Castro\nAlves)","C":"“Sei rezas com quem venço a qualquer mau olhado.”\n(Clarice Lispector)","D":"“Pálidas crianças/ A quem ninguém diz:/ – Anjos, debandai” (Manuel Bandeira)"},"t":"Sintaxe","tp":"Período composto e orações","src":"prova_eags_2025_cod_52_09 05 2024 14 59 33.pdf · p. 4"},{"id":"EAGS2025-C52-PT-012","s":"por","y":2025,"c":"52","n":12,"a":"B","an":false,"du":false,"l":"","e":"Leia atentamente os pares de oração a seguir.\nI- Ao saber da partida, fiquei triste./ Quando soube da partida, fiquei triste.\nII- Foi à palestra sem ser convidado./ Foi à palestra sem ter sido convidado.\nIII- Ele foi o primeiro aluno a se apresentar./ Ele foi o primeiro aluno da apresentação.\nIV- Considero estar preparado para assumir o cargo./\nConsidero que eu estou preparado para assumir o cargo.\nA relação entre as orações reduzidas e desenvolvidas está correta nas sentenças","o":{"A":"I e II.","B":"I e IV.","C":"II e III.","D":"III e IV."},"t":"Sintaxe","tp":"Período composto e orações","src":"prova_eags_2025_cod_52_09 05 2024 14 59 33.pdf · p. 4"},{"id":"EAGS2025-C52-PT-013","s":"por","y":2025,"c":"52","n":13,"a":"C","an":false,"du":false,"l":"","e":"Leia:\n(…) eu vinha a pé, ela veio galopando a cavalo (…). E saltou, me chamando pelo nome, conversou comigo. Séria, como se eu fosse um rapaz mais velho do que ela, um homem como os de sua roda, com calças de palm-beach, relógio de\npulso. Perguntou coisas sobre peixes; fiquei com vergonha\nde não saber quase nada, não sabia os nomes dos peixes que ela dizia, deviam ser peixes de outros lugares mais importantes, com certeza mais bonitos. Perguntou se a gente comia aqueles cocos dos coqueirinhos junto da praia\n– e falou de minha irmã, que conhecera, quis saber se era verdade que eu nadara desde a ponta do Boi até perto da lagoa. (…) De repente me fulminou: “Por que você não gosta de mim? Você me trata sempre de um modo esquisito…” (Rubem Braga)\nAssinale a alternativa que traz a correta informação sobre os tipos de discurso presentes ao texto.","o":{"A":"Apenas o discurso direto pode ser apontado no texto.","B":"Os discursos direto, indireto e indireto livre fazem-se presentes ao texto.","C":"Por duas vezes verifica-se o discurso indireto no texto; por\numa vez, o direto.","D":"A frase entre aspas caracteriza a presença de discurso indireto livre, visto não haver a presença do verbo dicendi."},"t":"Interpretação de texto","tp":"Compreensão, inferência e finalidade textual","src":"prova_eags_2025_cod_52_09 05 2024 14 59 33.pdf · p. 5"},{"id":"EAGS2025-C52-PT-014","s":"por","y":2025,"c":"52","n":14,"a":"B","an":false,"du":false,"l":"","e":"Assinale a alternativa em que o adjetivo em destaque não possui uma locução adjetiva correspondente.","o":{"A":"Todos esperavam que voltasse ileso de sua heroica jornada.","B":"Foram encontradas cartas inéditas entre os papéis do famoso escritor.","C":"A garota desiludiu-se; a faixa etária não permitia sua\nparticipação no evento.","D":"Correu ao quintal e jogou-se no chão naquela noite de céu límpido, com a palavra sideral ecoando em seus ouvidos."},"t":"Classes de palavras","tp":"Substantivo, adjetivo, advérbio e demais classes","src":"prova_eags_2025_cod_52_09 05 2024 14 59 33.pdf · p. 5"},{"id":"EAGS2025-C52-PT-015","s":"por","y":2025,"c":"52","n":15,"a":"B","an":false,"du":false,"l":"","e":"Considerando-se as afirmativas a seguir, pode-se afirmar que\nI- verbos classificados como abundantes não possuem a conjugação completa.\nII- a forma verbal abole está conjugada na 3.ª pessoa do presente do indicativo.\nIII- os verbos colorir, carpir e urgir são exemplos de verbos abundantes.\nIV- falir é um exemplo de verbo defectivo e, no imperativo afirmativo, apresenta apenas a 2.ª pessoa do plural.\nEstá correto o que se afirma em","o":{"A":"III e IV.","B":"II e IV.","C":"I e III.","D":"I e II."},"t":"Verbos","tp":"Tempos, modos e formas verbais","src":"prova_eags_2025_cod_52_09 05 2024 14 59 33.pdf · p. 5"},{"id":"EAGS2025-C52-PT-016","s":"por","y":2025,"c":"52","n":16,"a":"D","an":false,"du":false,"l":"","e":"Assinale a alternativa em que se verifica a mesma figura de linguagem presente em O primeiro efeito dessa lei antifumo radical e cheia de furos, não foi apagar os cigarros, mas acender uma grande polêmica. (Ventura)","o":{"A":"“Durante quinze dias, o visitante saturou-se até os ossos de euforia paisagística.” (Rodrigues)","B":"“Uma velha que trazia a fome nos ombros e nos ossos/ E trazia a seca no ventre e no seio.” (Cardozo)","C":"“Cassi Jones, sem mais percalços, se viu lançado em pleno\nCampo de Sant’Ana, no meio da multidão que jorrava das portas da Central, cheia da honesta pressa de quem vai trabalhar. (Lima Barreto)","D":"“Supõe um campo de batatas e duas tribos famintas (...) se as duas tribos dividirem em paz as batatas do campo, não chegam a nutrir-se suficientemente e morrem de inanição\n(...) a paz, nesse caso, é a destruição; a guerra é a\nconservação. Uma das tribos extermina a outra e recolhe os despojos. (Machado de Assis)"},"t":"Semântica e estilística","tp":"Sentido, relações semânticas e figuras de linguagem","src":"prova_eags_2025_cod_52_09 05 2024 14 59 33.pdf · p. 5","vr":1},{"id":"EAGS2025-C52-PT-017","s":"por","y":2025,"c":"52","n":17,"a":"C","an":false,"du":false,"l":"","e":"Marque a alternativa cujos vocábulos apresentam a seguinte ordem de classificação quanto à tonicidade: oxítona, paroxítona e proparoxítona.","o":{"A":"juriti - hifens - rubrica","B":"nobel - córtex - ciclope","C":"mister - avaro - binóculo","D":"carcará - condor - crisântemo"},"t":"Sintaxe","tp":"Revisão manual da classificação","src":"prova_eags_2025_cod_52_09 05 2024 14 59 33.pdf · p. 5"},{"id":"EAGS2025-C52-PT-018","s":"por","y":2025,"c":"52","n":18,"a":"B","an":false,"du":false,"l":"","e":"Assinale a alternativa em que o termo em destaque não poderá ser transformado em agente da passiva, considerando- se a possibilidade de a frase ser escrita em voz passiva.","o":{"A":"Você a conduzirá até a entrada do salão de festas.","B":"Alugaram a chácara por intermédio da imobiliária.","C":"Todo mundo conhece a fama de seus itens de coleção.","D":"Quem se sentiu prejudicado fez a representação ao anunciante."},"t":"Verbos","tp":"Tempos, modos e formas verbais","src":"prova_eags_2025_cod_52_09 05 2024 14 59 33.pdf · p. 5"},{"id":"EAGS2025-C52-PT-019","s":"por","y":2025,"c":"52","n":19,"a":"B","an":false,"du":false,"l":"","e":"Assinale a alternativa correta quanto ao que se afirma sobre formação de palavras.","o":{"A":"Os sufixos -mente e -mento são os únicos, em Português, considerados adverbiais, como se vê em piamente e aprovisionamento.","B":"As palavras amorico, populacho, ilhéu e serrote são formadas por derivação sufixal e a todas se acrescentam sufixo de diminutivo.","C":"O substantivo ameaço é palavra primitiva, que forma, por derivação sufixal, o verbo ameaçar.","D":"Em película, nódulo e homúnculo não aparecem sufixos diminutivos eruditos."},"t":"Verbos","tp":"Tempos, modos e formas verbais","src":"prova_eags_2025_cod_52_09 05 2024 14 59 33.pdf · p. 5"},{"id":"EAGS2025-C52-PT-020","s":"por","y":2025,"c":"52","n":20,"a":"D","an":false,"du":false,"l":"","e":"Leia o texto abaixo e assinale a alternativa que apresenta o número de encontros vocálicos nele presentes.\nQuando encontra uma presa, o guepardo sai em disparada. Se demora muito para pegá-la, acaba desistindo, porque tem necessidade de descansar. Dependendo do esforço, ele vai tentar de novo no dia seguinte. Mas a verdade era que nosso felino estava furioso: era a quinquagésima vez que a zebra lhe dava um baile.","o":{"A":"7","B":"8","C":"9","D":"10"},"t":"Interpretação de texto","tp":"Compreensão, inferência e finalidade textual","src":"prova_eags_2025_cod_52_09 05 2024 14 59 33.pdf · p. 6","vr":1},{"id":"EAGS2025-C52-PT-021","s":"por","y":2025,"c":"52","n":21,"a":"A","an":false,"du":false,"l":"","e":"Assinale a alternativa em que o termo em destaque exerce função sintática de objeto direto.","o":{"A":"“Eu tinha fama de professor carrasco, que até hoje considero injustíssima, e ficava muito incomodado com aqueles rapazes e moças pálidos e trêmulos diante de mim.\n“ (João Ubaldo Ribeiro)","B":"“Acordei pensando em rios - que dão sempre um toque feminino a qualquer cidade - e me dizendo que o único possível defeito do Rio de Janeiro é não ter um rio.”\n(Antonio Callado)","C":"“Não te contentas com o remédio de Sêneca (...) a vida retirada, em que a alma acha todo o seu sossego.”\n(Machado de Assis)","D":"“Roubo-te um casto beijo à luz da lua/ — E tua és Julieta...\n(Castro Alves)"},"t":"Sintaxe","tp":"Termos da oração: complementos e adjuntos","src":"prova_eags_2025_cod_52_09 05 2024 14 59 33.pdf · p. 6"},{"id":"EAGS2025-C52-PT-022","s":"por","y":2025,"c":"52","n":22,"a":"D","an":false,"du":false,"l":"","e":"Leia as orações a seguir atentando para as figuras de linguagem.\nI- “O poema é uma pedra no abismo.” (Mario Quintana)\nII- “Que negro segredo guardava o porão da alma?” (Autran\nDourado)\nIII- “E trabalhavam nos seus versos como um carpinteiro nas tábuas!” (Alberto Caeiro)\nIV- “A pupila se dilata e transborda como tinta preta derramando no olho inteiro.” (Lygia Fagundes Telles)\nHá metáfora em","o":{"A":"III e IV.","B":"II e IV.","C":"I e III.","D":"I e II."},"t":"Semântica e estilística","tp":"Sentido, relações semânticas e figuras de linguagem","src":"prova_eags_2025_cod_52_09 05 2024 14 59 33.pdf · p. 6"},{"id":"EAGS2025-C52-PT-023","s":"por","y":2025,"c":"52","n":23,"a":"A","an":false,"du":false,"l":"","e":"Assinale a alternativa em que a concordância verbal ou a nominal está incorreta.","o":{"A":"É esplendorosamente louvável os textos da turma.\nPortanto, qualquer que sejam os resultados, vocês estão de parabéns.","B":"As plantas solicitadas para o jardim estão entregues. Deixo anexa à nota fiscal uma relação delas.","C":"O olhar dos pais, no filho do meio, mais que em nenhum dos outros filhos, campeava o talento musical.","D":"Embora não alcançasse seu intento, ficava registrado o protesto, a discordância com toda aquela situação."},"t":"Concordância","tp":"Concordância verbal e nominal","src":"prova_eags_2025_cod_52_09 05 2024 14 59 33.pdf · p. 6"},{"id":"EAGS2025-C52-PT-024","s":"por","y":2025,"c":"52","n":24,"a":"C","an":false,"du":false,"l":"","e":"Em “O sonho foi realizado; deves, pois, alegrar-te.”, a\nconjunção coordenativa em destaque inicia uma oração que recebe a classificação de oração coordenada sindética","o":{"A":"aditiva.","B":"explicativa.","C":"conclusiva.","D":"adversativa."},"t":"Sintaxe","tp":"Período composto e orações","src":"prova_eags_2025_cod_52_09 05 2024 14 59 33.pdf · p. 6"},{"id":"EAGS2025-C52-PT-025","s":"por","y":2025,"c":"52","n":25,"a":"C","an":false,"du":false,"l":"","e":"Leia as sentenças, relativas à transitividade do verbo implicar.\nI- A regência direta é censurada, como na oração “O desacordo implica punição”.\nII- Implicar em algo é uma inovação e, por isso, é considerado um brasileirismo: “O sucesso implica em muita dedicação”.\nIII- A transitividade indireta é admitida quando o verbo é pronominal e tem sentido de envolver-se, comprometer- se: “Implicou-se num projeto contraproducente”.\nIV- A transitividade indireta não é admitida no sentido de promover desentendimentos: “Aquele funcionário que implicava com todo mundo foi mandado embora”.\nEstá correto o que se afirma em","o":{"A":"I e II.","B":"I e IV.","C":"II e III.","D":"III e IV."},"t":"Sintaxe","tp":"Período composto e orações","src":"prova_eags_2025_cod_52_09 05 2024 14 59 33.pdf · p. 6"},{"id":"EAGS2025-C52-PT-026","s":"por","y":2025,"c":"52","n":26,"a":"A","an":false,"du":false,"l":"","e":"Analise as orações a seguir e assinale a alternativa incorreta quanto ao uso do acento indicador de crase.","o":{"A":"Vende-se a vista e a prazo.","B":"Chegavam a casa quase sempre atrasados.","C":"O aluno escreveu uma redação à Rui Barbosa.","D":"Paramos à distância de alguns metros do ocorrido."},"t":"Crase","tp":"Emprego do acento indicativo de crase","src":"prova_eags_2025_cod_52_09 05 2024 14 59 33.pdf · p. 6"},{"id":"EAGS2025-C52-PT-027","s":"por","y":2025,"c":"52","n":27,"a":"C","an":false,"du":false,"l":"","e":"Assinale a alternativa em que há conjunção subordinativa consecutiva.","o":{"A":"Que havia feito doidice, isso se dizia por toda a cidade.","B":"Andava lentamente, como as pernas exigissem o descanso merecido.","C":"Tamanha era sua indignação, que não esperaria a noite acabar para dizer-lhe umas boas, muito boas!","D":"Como um cãozinho sabedor da arte feita, o garotinho foi recostando-se ao canto da parede."},"t":"Sintaxe","tp":"Período composto e orações","src":"prova_eags_2025_cod_52_09 05 2024 14 59 33.pdf · p. 6"},{"id":"EAGS2025-C52-PT-028","s":"por","y":2025,"c":"52","n":28,"a":"D","an":false,"du":false,"l":"","e":"Assinale a alternativa cujo emprego da vírgula segue a mesma regra da oração abaixo.\nA gargalhada inesperada, quebrando o silêncio, ressoou pelo salão.","o":{"A":"O estudo, diz o professor, é o mestre da vida.","B":"Olhe, menino, isso não é brincadeira que se faça!","C":"Os viajantes chegavam, olhavam, perguntavam e se acomodavam.","D":"Da janela eu observava, sem ser visto, as pessoas chegando para a festa."},"t":"Sintaxe","tp":"Período composto e orações","src":"prova_eags_2025_cod_52_09 05 2024 14 59 33.pdf · p. 6","vr":1},{"id":"EAGS2025-C52-PT-029","s":"por","y":2025,"c":"52","n":29,"a":"B","an":false,"du":false,"l":"","e":"Leia as sentenças, observando a classificação dos advérbios.\nI- As crianças corriam depressa para a casa.\nII- Quanto empenho tive para terminar o trabalho.\nIII- Silenciosamente, Maria saiu da sala de reuniões.\nIV- O pai ficara completamente imóvel ao saber da notícia.\nHá o emprego de advérbio de modo em","o":{"A":"I e II.","B":"I e III.","C":"II e IV.","D":"III e IV."},"t":"Classes de palavras","tp":"Substantivo, adjetivo, advérbio e demais classes","src":"prova_eags_2025_cod_52_09 05 2024 14 59 33.pdf · p. 7"},{"id":"EAGS2025-C52-PT-030","s":"por","y":2025,"c":"52","n":30,"a":"C","an":false,"du":false,"l":"","e":"Assinale a alternativa em que a relação entre as orações coordenadas é a mesma da presente em Era covarde, mas principalmente mentiroso.","o":{"A":"Avançamos na tecnologia, mas a perplexidade fundamental não diminui.","B":"Todos ficaram apreensivos, mas a responsabilidade era grande.","C":"Trovejava, mas as crianças brincavam...","D":"Está artrítico, mas é uma raposa."},"t":"Sintaxe","tp":"Revisão manual da classificação","src":"prova_eags_2025_cod_52_09 05 2024 14 59 33.pdf · p. 7"},{"id":"EAGS2025-C52-PT-031","s":"por","y":2025,"c":"52","n":31,"a":"B","an":false,"du":false,"l":"","e":"Leia as afirmativas quanto ao emprego dos pronomes.\nI- O pronome reto de terceira pessoa pode desempenhar a função de objeto indireto quando precedido de preposição e ligado a verbos que exprimem sentimento.\nII- Os pronomes possessivos não só expressam posse mas também valores afetivos.\nIII- No português brasileiro, o pronome de tratamento você pode ser empregado fora do campo de intimidade, porém não deve ser utilizado para tratamento de superior para inferior.\nIV- O pronome mim, na linguagem familiar, pode desempenhar a função de sujeito do verbo no infinitivo.\nEstá correto o que se afirma em","o":{"A":"III e IV.","B":"II e IV.","C":"I e III.","D":"I e II."},"t":"Interpretação de texto","tp":"Compreensão, inferência e finalidade textual","src":"prova_eags_2025_cod_52_09 05 2024 14 59 33.pdf · p. 7"},{"id":"EAGS2025-C52-PT-032","s":"por","y":2025,"c":"52","n":32,"a":"","an":true,"du":false,"l":"","e":"Considerando o número dos substantivos, analise os pares de palavras a seguir.\nI- corrimão/corrimões - anão/anões - sultão/sultões\nII- ermitão/ermitãos - vilão/vilãos - charlatão/charlatãos\nIII- guardião/guardiães - ancião/anciães - escrivão/escrivães\nIV- sacristão/sacristãos - cidadão/cidadãos - cristão/cristãos\nEstá correto o que se afirma em","o":{"A":"I e II.","B":"I e III.","C":"II e IV.","D":"III e IV."},"t":"Sintaxe","tp":"Revisão manual da classificação","src":"prova_eags_2025_cod_52_09 05 2024 14 59 33.pdf · p. 7"},{"id":"EAGS2025-C52-PT-033","s":"por","y":2025,"c":"52","n":33,"a":"C","an":false,"du":false,"l":"","e":"Assinale a alternativa em que o verbo em destaque não está conjugado no modo subjuntivo.","o":{"A":"Se levardes amarras demais, vossas almas hão de sucumbir.","B":"Vivam as canções de amor para a glória dos apaixonados!","C":"Sê o luzeiro dos que estão em torno a ti.","D":"Que recolham tudo, sem desperdícios."},"t":"Verbos","tp":"Tempos, modos e formas verbais","src":"prova_eags_2025_cod_52_09 05 2024 14 59 33.pdf · p. 7"},{"id":"EAGS2025-C52-PT-034","s":"por","y":2025,"c":"52","n":34,"a":"D","an":false,"du":false,"l":"","e":"Na oração “O paulista ainda tenta preservar o verde da cidade.”, as palavras em destaque representam qual figura de linguagem?","o":{"A":"Antítese","B":"Metáfora","C":"Hipérbole","D":"Metonímia"},"t":"Sintaxe","tp":"Período composto e orações","src":"prova_eags_2025_cod_52_09 05 2024 14 59 33.pdf · p. 7","vr":1},{"id":"EAGS2025-C52-PT-035","s":"por","y":2025,"c":"52","n":35,"a":"D","an":false,"du":false,"l":"","e":"Assinale a alternativa em que a grafia de uma de suas palavras, ainda que correta, não se aplica ao contexto.","o":{"A":"Andava pelo labirinto de corredores à procura daquele som wagneriano que insistia em surgir de uma das salas...\nNada! Era um som fantasmal.","B":"Na sala de espera, o senhor não conseguia parar de agitar suas pernas. Estava irritado. Volta e meia, levantava os olhos e as grossas sobrancelhas para a mulher que, nem de longe, continha o comportamento insultuoso de seu filho.","C":"O parque era um regalo para os visitantes, com vistas espetaculares. Todos os caminhos conduziam ao centro do jardim, onde se via um caramanchão, belamente ornado de flores. e de grande dimensão a oferecer inigualáveis momentos de descanso para a alma.","D":"Parquet SP: pise firme neste sonho. — A orquestra Parquet\nSP, premiada pela excelência na qualidade da prestação de serviços, é totalmente afinada com os desejos de sua plateia, com grande repertório de opções. Depois que ela fizer o conserto no seu piso, haverá fila para assistir ao espetáculo."},"t":"Ortografia e acentuação","tp":"Ortografia, grafia e hífen","src":"prova_eags_2025_cod_52_09 05 2024 14 59 33.pdf · p. 7"},{"id":"EAGS2025-C52-PT-036","s":"por","y":2025,"c":"52","n":36,"a":"A","an":false,"du":false,"l":"","e":"Leia:\nUm belo transatlântico cortando as águas enchia as duas páginas da revista, e o garoto encostou seu queixo sobre a mesa mal contendo sua emoção.\nEm relação ao que se afirma a respeito da separação silábica da palavra transatlântico, contida no trecho acima, assinale a alternativa correta.","o":{"A":"A separação silábica não leva em conta a existência de prefixo na palavra, por isso será tran - sa - tlân - ti - co.","B":"A palavra possui dois encontros consonantais separáveis e dois inseparáveis: transatlântico.","C":"A palavra não contém prefixo; daí que prevaleça a\nsilabação: tran - sa - tlân - ti - co.","D":"O prefixo nela existente mantém-se, de regra, em uma única sílaba: trans - a - tlân - ti -co."},"t":"Interpretação de texto","tp":"Compreensão, inferência e finalidade textual","src":"prova_eags_2025_cod_52_09 05 2024 14 59 33.pdf · p. 7","vr":1},{"id":"EAGS2025-C52-PT-037","s":"por","y":2025,"c":"52","n":37,"a":"B","an":false,"du":false,"l":"","e":"Assinale a alternativa correta em relação ao que se afirma quanto aos termos sintáticos do texto que segue:\nO que mais a impressionou no passeio foi a miséria geral, a falta de cultivo, a pobreza das casas, o ar triste, abatido da gente pobre. (…) Havendo tanto barro, tanta água, por que as casas não eram de tijolos e não tinham telhas? Era sempre aquele sapê sinistro e aquele “sopapo” que deixava ver a trama de varas, como o esqueleto de um doente. Por que ao redor dessas casas não havia culturas, uma horta, um pomar? (…) Não podia ser preguiça só ou indolência. Para o seu gasto, para uso próprio, o homem tem sempre energia para trabalhar relativamente. (…) Seria a terra? Que seria? E todas essas questões desafiavam a sua curiosidade, o seu desejo de saber, e também a sua piedade e simpatia por aqueles párias, talvez com fome, sorumbáticos!… (Lima Barreto)","o":{"A":"A sequência a miséria geral, a falta de cultivo, a pobreza das casas, o ar triste, abatido da gente pobre e o adjetivo energia classificam-se como predicativos do sujeito.","B":"A sequência O que mais a impressionou no passeio compõe o predicativo do sujeito do primeiro período.","C":"Com fome e sorumbáticos classificam-se como predicativos do objeto direto párias.","D":"De tijolos e telhas são, respectivamente, predicativos do sujeito casas."},"t":"Interpretação de texto","tp":"Compreensão, inferência e finalidade textual","src":"prova_eags_2025_cod_52_09 05 2024 14 59 33.pdf · p. 8"},{"id":"EAGS2025-C52-PT-038","s":"por","y":2025,"c":"52","n":38,"a":"A","an":false,"du":false,"l":"","e":"Assinale a alternativa que apresenta uma oração sem sujeito.","o":{"A":"Era março e ainda fazia calor.","B":"Acordaram o menino às pressas.","C":"Alguém estará no consultório para atendê-lo.","D":"Ficamos um bom tempo sem falar sobre o assunto."},"t":"Sintaxe","tp":"Período composto e orações","src":"prova_eags_2025_cod_52_09 05 2024 14 59 33.pdf · p. 8"},{"id":"EAGS2025-C52-PT-039","s":"por","y":2025,"c":"52","n":39,"a":"B","an":false,"du":false,"l":"","e":"Na oração “As doenças incuráveis dos animais fizeram com que toda a boiada fosse sacrificada.”, o termo em destaque possui o papel de","o":{"A":"adjunto adverbial.","B":"adjunto adnominal.","C":"predicativo do objeto.","D":"complemento nominal."},"t":"Sintaxe","tp":"Período composto e orações","src":"prova_eags_2025_cod_52_09 05 2024 14 59 33.pdf · p. 8"},{"id":"EAGS2025-C52-PT-040","s":"por","y":2025,"c":"52","n":40,"a":"C","an":false,"du":false,"l":"","e":"Marque a alternativa cujos vocábulos são formados, respectivamente, pelos seguintes processos de derivação:\nprefixal, regressiva e parassintética.","o":{"A":"enlace - recuo - alistar","B":"planalto - combate - boquiaberto","C":"supersônico - amostra - emudecer","D":"passatempo - enegrecer - sapataria\nAS QUESTÕES DE 41 A 100 REFEREM-SE\nÀ INFORMÁTICA"},"t":"Formação de palavras","tp":"Estrutura e formação de palavras","src":"prova_eags_2025_cod_52_09 05 2024 14 59 33.pdf · p. 8"},{"id":"EAGS2025-C52-INF-041","s":"inf","y":2025,"c":"52","n":41,"a":"D","an":false,"du":false,"l":"","e":"Considerando os conceitos da Programação Orientada a\nObjetos, assinale a alternativa que apresenta o mecanismo que permite o desenvolvedor basear uma classe na definição de uma classe previamente existente.","o":{"A":"Encapsulamento","B":"Polimorfismo","C":"Parâmetros","D":"Herança"},"t":"Programação orientada a objetos","tp":"Classes, herança, encapsulamento e polimorfismo","src":"prova_eags_2025_cod_52_09 05 2024 14 59 33.pdf · p. 8"},{"id":"EAGS2025-C52-INF-042","s":"inf","y":2025,"c":"52","n":42,"a":"C","an":false,"du":false,"l":"","e":"Considerando-se os conceitos de normalização em bancos de dados, assinale a alternativa que completa a frase abaixo.\nUma entidade encontra-se na _____ caso nenhum de seus atributos possua dependência transitiva em relação a outro __________ da entidade que não participe da chave primária.","o":{"A":"2FN - diagrama","B":"3FN - diagrama","C":"3FN - atributo","D":"2FN - atributo"},"t":"Linguagens de programação","tp":"Revisão manual da classificação","src":"prova_eags_2025_cod_52_09 05 2024 14 59 33.pdf · p. 8","vr":1},{"id":"EAGS2025-C52-INF-043","s":"inf","y":2025,"c":"52","n":43,"a":"C","an":false,"du":false,"l":"","e":"Considerando que as classes e a interface abaixo estão em arquivos separados dentro do mesmo pacote Java, assinale a alternativa que representa o que acontece quando executamos a classe Programa.java.\npublic class Programa {\npublic static void main(String[] args) {\nPessoa pessoa = new Pessoa(“João”);\npessoa.fazerContinencia();\n}\n}\npublic class Pessoa implements AlunoEEAR {\nprivate String nome;\npublic Pessoa(String nome) {\nthis.nome = nome;\n}\npublic void fazerContinencia() {\nSystem.out.println(\n“Bom dia sargento! Sou o “ + this.nome);\n}\n}\npublic interface AlunoEEAR {\ndefault void fazerContinencia(){\nSystem.out.println(“Bom dia sargento!”);\n}\n}","o":{"A":"O programa não imprime nada na tela.","B":"O programa imprime na tela o texto “Bom dia sargento!”.","C":"O programa imprime na tela o texto “Bom dia sargento! Sou o João”.","D":"O programa não executa, pois não é possível que a classe\nPessoa implemente a interface AlunoEEAR."},"t":"Programação orientada a objetos","tp":"Classes, herança, encapsulamento e polimorfismo","src":"prova_eags_2025_cod_52_09 05 2024 14 59 33.pdf · p. 8","vr":1},{"id":"EAGS2025-C52-INF-044","s":"inf","y":2025,"c":"52","n":44,"a":"C","an":false,"du":false,"l":"","e":"Considere a tabela “GASTOS” MySQL abaixo, em que\nos campos “FATURA” e “MÊS” são do tipo STRING; e\n“VALOR” do tipo DOUBLE.\nGASTOS\nFATURA\nMÊS\nVALOR\n9870001 02/2021\n1800\n9870002 03/2021\n3200\n9870003 04/2021\n450\nAssinale a alternativa que apresenta uma consulta que retorna as faturas cujo valor é maior ou igual a R$ 1000,00.","o":{"A":"SELECT HAVING COUNT (FATURA)>1000","B":"SELECT * HAVING COUNT (VALOR)>1000","C":"SELECT * FROM GASTOS WHERE VALOR >= 1000","D":"SELECT * FROM GASTOS WHERE FATURA >= 1000"},"t":"Banco de dados","tp":"SQL, SGBD, modelagem e administração de dados","src":"prova_eags_2025_cod_52_09 05 2024 14 59 33.pdf · p. 9","vr":1},{"id":"EAGS2025-C52-INF-045","s":"inf","y":2025,"c":"52","n":45,"a":"B","an":false,"du":false,"l":"","e":"Considerando o contexto da camada de transporte, assinale a alternativa que apresenta uma das características do protocolo UDP.","o":{"A":"Apresenta robustez em caso de falhas diversas.","B":"Trata-se de protocolo não orientado a conexões.","C":"Projetado para possibilitar um fluxo de bytes fim a fim confiável, em uma rede não confiável.","D":"Faz com que os datagramas IP sejam enviados à entidade\nUDP, que restaura os fluxos de byte originais."},"t":"Redes de computadores","tp":"Protocolos, endereçamento e arquitetura de redes","src":"prova_eags_2025_cod_52_09 05 2024 14 59 33.pdf · p. 9"},{"id":"EAGS2025-C52-INF-046","s":"inf","y":2025,"c":"52","n":46,"a":"D","an":false,"du":false,"l":"","e":"Cookies são arquivos gravados no computador do usuário quando do acesso a sítios eletrônicos na Internet, pelos quais são mantidas informações como preferências de navegação, carrinhos de compras de lojas online, etc.\nAssinale a alternativa que não apresenta um dos riscos relacionados ao armazenamento de cookies.","o":{"A":"Autenticação automática.","B":"Exploração de vulnerabilidades.","C":"Levantamento de informações pessoais.","D":"Apresentação de mensagens indesejadas."},"t":"Linguagens de programação","tp":"Revisão manual da classificação","src":"prova_eags_2025_cod_52_09 05 2024 14 59 33.pdf · p. 9"},{"id":"EAGS2025-C52-INF-047","s":"inf","y":2025,"c":"52","n":47,"a":"C","an":false,"du":false,"l":"","e":"Considerando o contexto de camada de rede, analise o problema:\nDuas redes IPv6 distintas comunicam-se entre si. Elas estão interligadas por uma rede IPv4.\nAssinale a alternativa que apresenta a técnica que possibilita tal comunicação.","o":{"A":"Bridge","B":"ALOHA","C":"Tunelamento","D":"Algoritmo de Nagle"},"t":"Redes de computadores","tp":"Protocolos, endereçamento e arquitetura de redes","src":"prova_eags_2025_cod_52_09 05 2024 14 59 33.pdf · p. 9"},{"id":"EAGS2025-C52-INF-048","s":"inf","y":2025,"c":"52","n":48,"a":"C","an":false,"du":false,"l":"","e":"Relacione as colunas, considerando o término de processos, e assinale a alternativa com a sequência correta.\n1 – Voluntário\n( ) Morto por outro processo\n2 – Involuntário\n( ) Saída por erro\n( ) Saída normal\n( ) Erro fatal","o":{"A":"1 - 2 - 2 - 1","B":"1 - 1 - 2 - 2","C":"2 - 1 - 1 - 2","D":"2 - 2 - 1 - 1"},"t":"Algoritmos e lógica","tp":"Fluxogramas, estruturas de controle e pseudocódigo","src":"prova_eags_2025_cod_52_09 05 2024 14 59 33.pdf · p. 9"},{"id":"EAGS2025-C52-INF-049","s":"inf","y":2025,"c":"52","n":49,"a":"A","an":false,"du":false,"l":"","e":"Relacione as colunas, considerando as exigências para a virtualização e para as três dimensões que os hipervisores devem se sair bem, e assinale a alternativa correta.\n1 – Segurança ( ) Grande parte do código na máquina virtual deve executar sem a intervenção do hipervisor.\n2 – Fidelidade ( ) O hipervisor deve ter o controle completo dos recursos virtualizados.\n3 – Eficiência\n( ) O comportamento de um programa em uma máquina virtual deve ser idêntico àquele do mesmo programa executado diretamente no hardware.","o":{"A":"3 - 1 - 2","B":"2 - 3 - 1","C":"1 - 2 - 3","D":"2 - 1 - 3"},"t":"Segurança da informação","tp":"Autenticação, controle de acesso e proteção","src":"prova_eags_2025_cod_52_09 05 2024 14 59 33.pdf · p. 9"},{"id":"EAGS2025-C52-INF-050","s":"inf","y":2025,"c":"52","n":50,"a":"B","an":false,"du":false,"l":"","e":"O conceito de Ethernet comutada surgiu para que o aumento de carga em uma rede fosse tratado e resolvido, oferecendo ganho de desempenho. Considerando a camada de enlace de dados, assinale a alternativa que apresenta o equipamento utilizado nesse tipo de configuração.","o":{"A":"Hub","B":"Switch","C":"Roteador","D":"Repetidor"},"t":"Redes de computadores","tp":"Protocolos, endereçamento e arquitetura de redes","src":"prova_eags_2025_cod_52_09 05 2024 14 59 33.pdf · p. 9"},{"id":"EAGS2025-C52-INF-051","s":"inf","y":2025,"c":"52","n":51,"a":"C","an":false,"du":false,"l":"","e":"O MySQL possui diversas funções nativas que possibilitam a realização de diversas operações matemáticas.\nAssinale a alternativa que apresenta uma consulta\nMySQL que retorne o valor do Seno de Pi (π).","o":{"A":"SELECT sin(pi)","B":"SELECT seno(π)","C":"SELECT sin(pi())","D":"SELECT seno(pi())"},"t":"Banco de dados","tp":"SQL, SGBD, modelagem e administração de dados","src":"prova_eags_2025_cod_52_09 05 2024 14 59 33.pdf · p. 9"},{"id":"EAGS2025-C52-INF-052","s":"inf","y":2025,"c":"52","n":52,"a":"A","an":false,"du":false,"l":"","e":"Qual a instrução do MySQL é utilizada para excluir objetos do banco de dados, como colunas, views e procedures?","o":{"A":"drop","B":"init 0","C":"delete","D":"remove"},"t":"Banco de dados","tp":"SQL, SGBD, modelagem e administração de dados","src":"prova_eags_2025_cod_52_09 05 2024 14 59 33.pdf · p. 9"},{"id":"EAGS2025-C52-INF-053","s":"inf","y":2025,"c":"52","n":53,"a":"B","an":false,"du":false,"l":"","e":"Observe a classe Java ItemX descrita abaixo e assinale a alternativa que representa um parâmetro de método.\npublic class ItemX {\nprotected int x = 0;\npublic static String y = “texto”;\npublic int obterTriplo(int z){\nint w = z * 3;\nreturn w;\n}\n}","o":{"A":"w","B":"z","C":"y","D":"x"},"t":"Programação orientada a objetos","tp":"Classes, herança, encapsulamento e polimorfismo","src":"prova_eags_2025_cod_52_09 05 2024 14 59 33.pdf · p. 10","vr":1},{"id":"EAGS2025-C52-INF-054","s":"inf","y":2025,"c":"52","n":54,"a":"A","an":false,"du":false,"l":"","e":"Avalie as afirmações abaixo que referem-se aos quatro eventos principais que fazem com que os processos sejam criados, e coloque V para verdadeiro e F para falso. Em seguida, assinale a sequência correta.\n( ) Inicialização do sistema.\n( ) Início de uma tarefa em lote.\n( ) Solicitação de um administrador para criar um novo usuário.\n( ) Execução de uma chamada de sistema de criação de processo por um processo em execução.","o":{"A":"V - V - F - V","B":"F - F - V - V","C":"V - V - F - F","D":"F - F - V - F"},"t":"Algoritmos e lógica","tp":"Fluxogramas, estruturas de controle e pseudocódigo","src":"prova_eags_2025_cod_52_09 05 2024 14 59 33.pdf · p. 10","vr":1},{"id":"EAGS2025-C52-INF-055","s":"inf","y":2025,"c":"52","n":55,"a":"C","an":false,"du":false,"l":"","e":"Assinale a alternativa referente às fases da modelagem de dados.","o":{"A":"1FN, 2FN, 3FN e 4FN","B":"Lógica, Prática e Física","C":"Conceitual, Lógica e Física","D":"1FN, 2FN, 3FN, FNBC, 4FN e 5FN"},"t":"Engenharia de software","tp":"Modelagem, qualidade, desenvolvimento e documentação","src":"prova_eags_2025_cod_52_09 05 2024 14 59 33.pdf · p. 10"},{"id":"EAGS2025-C52-INF-056","s":"inf","y":2025,"c":"52","n":56,"a":"C","an":false,"du":false,"l":"","e":"Considerando a definição de nice e renice no controle de processos, coloque V para verdadeiro e F para falso. Em seguida assinale a alternativa com a sequência correta.\n( ) Um valor de nice negativo gera um kill no processo.\n( ) Um valor nice alto significa baixa prioridade para o processo.\n( ) Um valor nice baixo significa baixa prioridade para o processo.\n( ) A prioridade de um processo já criado pode ser ajustado com o comando renice.","o":{"A":"V - F - V - F","B":"F - F - V - V","C":"F - V - F - V","D":"V - V - F - F"},"t":"Algoritmos e lógica","tp":"Fluxogramas, estruturas de controle e pseudocódigo","src":"prova_eags_2025_cod_52_09 05 2024 14 59 33.pdf · p. 10"},{"id":"EAGS2025-C52-INF-057","s":"inf","y":2025,"c":"52","n":57,"a":"D","an":false,"du":false,"l":"","e":"Considerando que as classes Java descritas encontram- se no mesmo pacote, assinale a alternativa que representa a saída do programa.\npublic class Calculadora {\npublic int add(int a, int b){\nreturn a + b;\n}\npublic String add(String a, String b){\nreturn a + b;\n}\n}\npublic class Programa {\npublic static void main(String[] args) {\nCalculadora calc = new Calculadora();\nSystem.out.println(calc.add(“3”, “6”));\n}\n}","o":{"A":"2","B":"9","C":"18","D":"36"},"t":"Linguagens de programação","tp":"PHP, Java e sintaxe de linguagens","src":"prova_eags_2025_cod_52_09 05 2024 14 59 33.pdf · p. 10"},{"id":"EAGS2025-C52-INF-058","s":"inf","y":2025,"c":"52","n":58,"a":"C","an":false,"du":false,"l":"","e":"Assinale a alternativa que contém a técnica utilizada na maioria dos sistemas de memória virtual.","o":{"A":"Concatenação","B":"Sobreposição","C":"Paginação","D":"Variação"},"t":"Sistemas operacionais","tp":"Linux, Unix, processos, arquivos e comandos","src":"prova_eags_2025_cod_52_09 05 2024 14 59 33.pdf · p. 10"},{"id":"EAGS2025-C52-INF-059","s":"inf","y":2025,"c":"52","n":59,"a":"B","an":false,"du":false,"l":"","e":"Analise a classe “Pessoa” representada pelo modelo\nUML abaixo e assinale a alternativa correta.\nPessoa\n-nome:String\n+sobrenome:String\n-idade:int\n+dormir():void\n-falar():String","o":{"A":"O atributo dormir é público.","B":"O método falar retorna um texto.","C":"A visibilidade dos atributos nome e sobrenome é igual.","D":"O atributo idade pode ser acessado por qualquer classe."},"t":"Programação orientada a objetos","tp":"Classes, herança, encapsulamento e polimorfismo","src":"prova_eags_2025_cod_52_09 05 2024 14 59 33.pdf · p. 10","vr":1},{"id":"EAGS2025-C52-INF-060","s":"inf","y":2025,"c":"52","n":60,"a":"C","an":false,"du":false,"l":"","e":"Observe a tabela MySQL “ALUNO_EAGS2025” abaixo.\nConsidere que os campos “NOME” e “ESPECIALIDADE” são do tipo varchar. Em seguida, assinale a alternativa que apresenta uma consulta que retorne apenas os alunos cuja especialidade é “SIN”, ordenados pelo nome, pela ordem alfabética.\nALUNO_EAGS2025\nALUNO\nESPECIALIDADE","o":{"A":"SELECT\n*\nFROM\nALUNO_EAGS2025\nWHERE\nESPECIALIDADE=“SIN” ASC","B":"SELECT ALUNO FROM ALUNO_EAGS2025 WHERE\nESPECIALIDADE=“SIN” DESC","C":"SELECT\n*\nFROM\nALUNO_EAGS2025\nWHERE\nESPECIALIDADE=“SIN” ORDER BY ALUNO ASC","D":"SELECT\n*\nFROM\nALUNO_EAGS2025\nWHERE\nESPECIALIDADE=“SIN” ORDER BY ALUNO DESC"},"t":"Banco de dados","tp":"SQL, SGBD, modelagem e administração de dados","src":"prova_eags_2025_cod_52_09 05 2024 14 59 33.pdf · p. 10","vr":1},{"id":"EAGS2025-C52-INF-061","s":"inf","y":2025,"c":"52","n":61,"a":"C","an":false,"du":false,"l":"","e":"Considere os conceitos relacionados a bancos de dados e marque V para verdadeiro e F para falso. Em seguida, assinale a alternativa com a sequência correta.\n( ) Abstração, ou capacidade de abstração, é um processo mental que usamos quando selecionamos (ou isolamos) várias características e propriedades de um conjunto de objetos ou fatos e excluímos outras que não são relevantes ou com as quais não interessa trabalhar no momento.\n( ) Definimos atributos como o fato, o acontecimento que associa dois objetos existentes no mundo real.\n( ) As formas normais não são restrições de integridade.\n( ) Define-se relacionamento como aquele objeto que existe no mundo real com uma identificação distinta e um significado próprio.","o":{"A":"F - V - F - V","B":"V - F - V - V","C":"V - F - F - F","D":"F - V - V - F"},"t":"Algoritmos e lógica","tp":"Fluxogramas, estruturas de controle e pseudocódigo","src":"prova_eags_2025_cod_52_09 05 2024 14 59 33.pdf · p. 11"},{"id":"EAGS2025-C52-INF-062","s":"inf","y":2025,"c":"52","n":62,"a":"C","an":false,"du":false,"l":"","e":"Assinale a alternativa que evidencia o modo de operação do sistema operacional, peça fundamental de software para a maioria dos computadores.","o":{"A":"Modo software","B":"Modo usuário","C":"Modo núcleo","D":"Modo GUI"},"t":"Sistemas operacionais","tp":"Linux, Unix, processos, arquivos e comandos","src":"prova_eags_2025_cod_52_09 05 2024 14 59 33.pdf · p. 11"},{"id":"EAGS2025-C52-INF-063","s":"inf","y":2025,"c":"52","n":63,"a":"D","an":false,"du":false,"l":"","e":"Qual das alternativas a seguir melhor descreve o uso da instrução “break” em Java 8?","o":{"A":"A instrução “break” é usada para encerrar imediatamente uma classe.","B":"A instrução “break” é usada para separar o contexto de um método composto.","C":"A instrução “break” é usada para sair de uma função ou método imediatamente.","D":"A instrução “break” é usada para interromper a execução de instruções while, for, do…while ou switch."},"t":"Programação orientada a objetos","tp":"Classes, herança, encapsulamento e polimorfismo","src":"prova_eags_2025_cod_52_09 05 2024 14 59 33.pdf · p. 11"},{"id":"EAGS2025-C52-INF-064","s":"inf","y":2025,"c":"52","n":64,"a":"A","an":false,"du":false,"l":"","e":"Assinale a alternativa com a função PHP que retorna o número de colunas de uma consulta a um banco de dados\nMySQL.","o":{"A":"mysql_num_fields","B":"mysql_fetch_cols","C":"mysql_num_rows","D":"mysql_num_cols"},"t":"Banco de dados","tp":"SQL, SGBD, modelagem e administração de dados","src":"prova_eags_2025_cod_52_09 05 2024 14 59 33.pdf · p. 11"},{"id":"EAGS2025-C52-INF-065","s":"inf","y":2025,"c":"52","n":65,"a":"B","an":false,"du":false,"l":"","e":"O sniffing é uma técnica utilizada por profissionais de segurança da informação para inspecionar dados trafegados em rede. Avalie as informações a seguir.\nI- Descobrir, por método de tentativa e erro, credenciais de acesso a sítios eletrônicos, computadores ou serviços.\nII- Detectar problemas, analisar desempenho e monitorar atividades maliciosas em estações na rede.\nIII- Explorar vulnerabilidades de linguagens de programação ou pacotes utilizados no desenvolvimento web.\nIV- Capturar informações sensíveis que trafegam por conexões de rede inseguras.\nConsiderando o exposto, pode-se dizer que as possibilidades de utilização da referida técnica estão corretamente descritas em","o":{"A":"I e III.","B":"II e IV.","C":"III e IV.","D":"I e II."},"t":"Redes de computadores","tp":"Protocolos, endereçamento e arquitetura de redes","src":"prova_eags_2025_cod_52_09 05 2024 14 59 33.pdf · p. 11"},{"id":"EAGS2025-C52-INF-066","s":"inf","y":2025,"c":"52","n":66,"a":"A","an":false,"du":false,"l":"","e":"Considerando o contexto de segurança da comunicação em redes, assinale a alternativa que apresenta uma das características associadas aos firewalls.","o":{"A":"Atuam como filtros de pacotes.","B":"Fornecem proteção contra ataques de DNS spoofing.","C":"Otimizam informações de GPS para aumentar a segurança de conexões.","D":"Armazenam chaves secretas de comunicação entre diferentes usuários, protegendo-os contra ataques man-in- the-middle."},"t":"Redes de computadores","tp":"Protocolos, endereçamento e arquitetura de redes","src":"prova_eags_2025_cod_52_09 05 2024 14 59 33.pdf · p. 11"},{"id":"EAGS2025-C52-INF-067","s":"inf","y":2025,"c":"52","n":67,"a":"A","an":false,"du":false,"l":"","e":"Avalie as informações abaixo sobre o gerenciamento de volumes lógicos.\nI- Permite usar e alocar armazenamento em disco de maneira mais eficiente.\nII- Permite aumentar e diminuir o tamanho de volumes lógicos somente com o sistema completamente desligado.\nIII- Permite substituir unidades on-line com uma pequena interrupção de serviço.\nIV- Permite mover volumes lógicos entre diferentes dispositivos físicos.\nEstá correto o que se afirma em","o":{"A":"I e IV.","B":"I e III.","C":"II e III.","D":"III somente."},"t":"Hardware e arquitetura","tp":"Componentes, memória, processamento e sistemas digitais","src":"prova_eags_2025_cod_52_09 05 2024 14 59 33.pdf · p. 11","vr":1},{"id":"EAGS2025-C52-INF-068","s":"inf","y":2025,"c":"52","n":68,"a":"D","an":false,"du":false,"l":"","e":"Qual a função que o MySQL permite somar todos os valores de uma coluna?","o":{"A":"Max e min.","B":"Between.","C":"Orderby.","D":"Sum."},"t":"Banco de dados","tp":"SQL, SGBD, modelagem e administração de dados","src":"prova_eags_2025_cod_52_09 05 2024 14 59 33.pd aria social. Tal prática consiste no envio de mensagens eletrônicas, simulando virem de instituições conhecidas como bancos ou lojas, atraindo a atenção do usuário oferecendo-lhes vantagens, dentre outros.\nAssinale a alternativa que apresenta o golpe em questão.","o":{"A":"Hoax","B":"Trojan","C":"Phishing","D":"Spoofing"},"t":"Segurança da informação","tp":"Autenticação, controle de acesso e proteção","src":"prova_eags_2025_cod_52_09 05 2024 14 59 33.pdf · p. 12"},{"id":"EAGS2025-C52-INF-077","s":"inf","y":2025,"c":"52","n":77,"a":"C","an":false,"du":false,"l":"","e":"Dada a tabela MySQL abaixo, como podemos adicionar uma coluna chamada SARAM do tipo varchar(7)?\nSARGENTO\nNOME\nIDENTIDADE\nOM","o":{"A":"ALTER TABLE COLUMN SARAM VARCHAR (7)","B":"ALTER TABLE COLUMNS (SARAM VARCHAR (7))","C":"ALTER TABLE SARGENTO ADD COLUMN SARAM\nVARCHAR(7)","D":"ALTER TABLE SARGENTO SUM COLUMNS SARAM\nVARCHAR(70)"},"t":"Banco de dados","tp":"SQL, SGBD, modelagem e administração de dados","src":"prova_eags_2025_cod_52_09 05 2024 14 59 33.pdf · p. 12","vr":1},{"id":"EAGS2025-C52-INF-078","s":"inf","y":2025,"c":"52","n":78,"a":"D","an":false,"du":false,"l":"","e":"Assinale a alternativa que apresenta a função do\nMySQL que permite consultar a data e a hora atual.","o":{"A":"dayname","B":"curtime","C":"curdate","D":"sysdate"},"t":"Banco de dados","tp":"SQL, SGBD, modelagem e administração de dados","src":"prova_eags_2025_cod_52_09 05 2024 14 59 33.pdf · p. 13"},{"id":"EAGS2025-C52-INF-079","s":"inf","y":2025,"c":"52","n":79,"a":"B","an":false,"du":false,"l":"","e":"Qual cabo contém um núcleo de vidro, revestido por outra camada de vidro e um revestimento de plástico fino para a proteção do revestimento interno?","o":{"A":"Coaxial.","B":"Fibra óptica.","C":"Par trançado.","D":"Linha de energia elétrica."},"t":"Redes de computadores","tp":"Protocolos, endereçamento e arquitetura de redes","src":"prova_eags_2025_cod_52_09 05 2024 14 59 33.pdf · p. 13"},{"id":"EAGS2025-C52-INF-080","s":"inf","y":2025,"c":"52","n":80,"a":"A","an":false,"du":false,"l":"","e":"Os processos podem se encontrar em três estados.\nQuanto a essa situação, assinale a alternativa que apresenta o estado do processo quando ele encontra-se momentaneamente parado para deixar outro processo ser executado.","o":{"A":"Pronto","B":"Execução","C":"Bloqueado","D":"Temporário"},"t":"Sistemas operacionais","tp":"Linux, Unix, processos, arquivos e comandos","src":"prova_eags_2025_cod_52_09 05 2024 14 59 33.pdf · p. 13"},{"id":"EAGS2025-C52-INF-081","s":"inf","y":2025,"c":"52","n":81,"a":"A","an":false,"du":false,"l":"","e":"Assinale a alternativa que apresenta a função do\nMySQL que retorna um valor aleatório.","o":{"A":"rand","B":"value","C":"round","D":"number"},"t":"Banco de dados","tp":"SQL, SGBD, modelagem e administração de dados","src":"prova_eags_2025_cod_52_09 05 2024 14 59 33.pdf · p. 13"},{"id":"EAGS2025-C52-INF-082","s":"inf","y":2025,"c":"52","n":82,"a":"B","an":false,"du":false,"l":"","e":"Avalie as informações abaixo sobre virtualização.\nI- Ajuda no uso de máquinas virtuais para executar aplicações legadas em sistemas operacionais que não têm mais suporte.\nII- Permite que um único computador seja hospedeiro de múltiplas máquinas.\nIII- Se uma máquina virtual falha, todas as outras serão derrubadas.\nIV- Um uso comum hoje de virtualização é encontrado na nuvem.\nEstá correto o que se afirma em","o":{"A":"I, II e III.","B":"I, II e IV.","C":"IV somente.","D":"III somente."},"t":"Linguagens de programação","tp":"Revisão manual da classificação","src":"prova_eags_2025_cod_52_09 05 2024 14 59 33.pdf · p. 13","vr":1},{"id":"EAGS2025-C52-INF-083","s":"inf","y":2025,"c":"52","n":83,"a":"B","an":false,"du":false,"l":"","e":"Analise o diagrama de blocos abaixo e assinale a alternativa que apresenta qual será a sequência exibida no display do usuário ao fim do programa quando os valores de entrada de A e B são 9 e 3 respectivamente.","o":{"A":"9 6 9","B":"9 6 6","C":"6 3 6","D":"3 3 6"},"t":"Linguagens de programação","tp":"PHP, Java e sintaxe de linguagens","src":"prova_eags_2025_cod_52_09 05 2024 14 59 33.pdf · p. 13","vr":1},{"id":"EAGS2025-C52-INF-084","s":"inf","y":2025,"c":"52","n":84,"a":"A","an":false,"du":false,"l":"","e":"Considerando os conceitos utilizados na modelagem de bancos de dados relacionais, pode-se definir objetos que existem no mundo real, com uma identificação distinta e um significado próprio como","o":{"A":"entidade.","B":"atributos.","C":"agregação.","D":"modelagem."},"t":"Engenharia de software","tp":"Modelagem, qualidade, desenvolvimento e documentação","src":"prova_eags_2025_cod_52_09 05 2024 14 59 33.pdf · p. 13"},{"id":"EAGS2025-C52-INF-085","s":"inf","y":2025,"c":"52","n":85,"a":"A","an":false,"du":false,"l":"","e":"Relacione as colunas quanto às características das redes de comunicação. Em seguida, assinale a alternativa com a sequência correta.\n1 – LAN\n( ) Permite que dispositivos se comuniquem no alcance de uma pessoa, geralmente utilizando o padrão Bluetooth.\n2 – MAN\n( ) Funciona dentro ou próxima a uma edificação, tais como casas, fábricas ou escritórios.\n3 – PAN\n( ) Pode abranger uma cidade, utilizando conexões com ou sem fio.\n4 – WAN\n( ) Abrange grandes áreas geográficas, alcançando a extensão de um país ou mesmo de um continente.","o":{"A":"3 - 1 - 2 - 4","B":"2 - 4 - 3 - 1","C":"1 - 2 - 4 - 3","D":"4 - 3 - 1 - 2"},"t":"Redes de computadores","tp":"Protocolos, endereçamento e arquitetura de redes","src":"prova_eags_2025_cod_52_09 05 2024 14 59 33.pdf · p. 13"},{"id":"EAGS2025-C52-INF-086","s":"inf","y":2025,"c":"52","n":86,"a":"D","an":false,"du":false,"l":"","e":"Assinale a alternativa referente à definição de banco de dados.","o":{"A":"É um SGBD gratuito, livre, robusto e seguro.","B":"São softwares que fazem o controle de versão de seus arquivos.","C":"É uma representação gráfica das tabelas que serão desenvolvidas.","D":"É um local no qual é possível armazenar informações para consulta ou utilização, quando necessário."},"t":"Banco de dados","tp":"SQL, SGBD, modelagem e administração de dados","src":"prova_eags_2025_cod_52_09 05 2024 14 59 33.pdf · p. 13"},{"id":"EAGS2025-C52-INF-087","s":"inf","y":2025,"c":"52","n":87,"a":"A","an":false,"du":false,"l":"","e":"Assinale a alternativa que representa a saída do trecho de código Java abaixo.\npublic class Programa {\npublic static void main(String[] args) {\nList numeros =\nArrays.asList(1, 2, 3, 4, 5);\nList saida = numeros.stream()\n.map(x -> x * x)\n.collect(Collectors.toList());\nSystem.out.println(saida);\n}\n}","o":{"A":"[1, 4, 9, 16, 25]","B":"[2, 4, 6, 8, 10]","C":"[1, 2, 3, 4, 5]","D":"[1, 3, 5, 7, 9]"},"t":"Linguagens de programação","tp":"PHP, Java e sintaxe de linguagens","src":"prova_eags_2025_cod_52_09 05 2024 14 59 33.pdf · p. 14","vr":1},{"id":"EAGS2025-C52-INF-088","s":"inf","y":2025,"c":"52","n":88,"a":"A","an":false,"du":false,"l":"","e":"Relacione as colunas quanto aos tipos de registro DNS.\nEm seguida, assinale a alternativa com a sequência correta.\n1 – SOA\n( ) Nome canônico\n2 – A\n( ) Início de autoridade\n3 – MX\n( ) Servidor de nomes\n4 – NS\n( ) Endereço IPv4 de host\n5 – CNAME\n( ) Troca de mensagens de correio","o":{"A":"5 - 1 - 4 - 2 - 3","B":"1 - 4 - 2 - 5 - 3","C":"2 - 3 - 5 - 1 - 4","D":"5 - 3 - 1 - 4 - 2"},"t":"Redes de computadores","tp":"Protocolos, endereçamento e arquitetura de redes","src":"prova_eags_2025_cod_52_09 05 2024 14 59 33.pdf · p. 14"},{"id":"EAGS2025-C52-INF-089","s":"inf","y":2025,"c":"52","n":89,"a":"A","an":false,"du":false,"l":"","e":"Considerando o contexto de erros de transmissão na camada de enlace de dados, assinale a alternativa que não apresenta um código de detecção de erros.","o":{"A":"Walsh","B":"Paridade","C":"Checksums","D":"Verificações de redundância cíclicas (CRCs)"},"t":"Redes de computadores","tp":"Protocolos, endereçamento e arquitetura de redes","src":"prova_eags_2025_cod_52_09 05 2024 14 59 33.pdf · p. 14"},{"id":"EAGS2025-C52-INF-090","s":"inf","y":2025,"c":"52","n":90,"a":"D","an":false,"du":false,"l":"","e":"Assinale a alternativa que não apresenta um tipo de dado aceito pelo MySQL.","o":{"A":"BLOB","B":"CHAR","C":"FLOAT","D":"STRING"},"t":"Banco de dados","tp":"SQL, SGBD, modelagem e administração de dados","src":"prova_eags_2025_cod_52_09 05 2024 14 59 33.pdf · p. 14"},{"id":"EAGS2025-C52-INF-091","s":"inf","y":2025,"c":"52","n":91,"a":"D","an":false,"du":false,"l":"","e":"Assinale a alternativa que apresenta o uso da função\nSQRT no MySQL.","o":{"A":"Possibilita o cálculo de caracteres.","B":"Utilizada para arredondar um valor.","C":"É usada para calcular a tangente de um valor.","D":"Serve para obter a raiz quadrada de um número."},"t":"Banco de dados","tp":"SQL, SGBD, modelagem e administração de dados","src":"prova_eags_2025_cod_52_09 05 2024 14 59 33.pdf · p. 14"},{"id":"EAGS2025-C52-INF-092","s":"inf","y":2025,"c":"52","n":92,"a":"D","an":false,"du":false,"l":"","e":"Avalie as afirmações abaixo quanto ao Acesso Direto à\nMemória (DMA) e coloque V para verdadeiro e F para falso.\nEm seguida, assinale a sequência correta.\n( ) Não importa onde esteja localizado fisicamente, o controlador de DMA tem acesso ao barramento do sistema independente da CPU.\n( ) Quando o DMA é utilizado, primeiro o controlador de disco lê o bloco do dispositivo serialmente, bit por bit.\n( ) Controladores de DMA mais simples lidam com múltiplas transferências ao mesmo tempo.\n( ) O sistema operacional somente pode usar DMA se o hardware tiver um controlador de DMA.","o":{"A":"F - F - V - V","B":"V - V - F - F","C":"F - V - V - F","D":"V - F - F - V"},"t":"Algoritmos e lógica","tp":"Fluxogramas, estruturas de controle e pseudocódigo","src":"prova_eags_2025_cod_52_09 05 2024 14 59 33.pdf · p. 14","vr":1},{"id":"EAGS2025-C52-INF-093","s":"inf","y":2025,"c":"52","n":93,"a":"C","an":false,"du":false,"l":"","e":"Considere a fórmula para conversão de escalas termométricas abaixo, no qual Tc representa a temperatura em Graus Celsius e Tk a temperatura em Graus Kelvin.\nTc = Tk - 273,15\nAssinale a alternativa que corresponde a uma função\nPHP que calcule a conversão de temperaturas de graus Kelvin para graus Celsius.","o":{"A":"function kelvinParaCelsius() {\nreturn $temp - 273.15;\n}","B":"function kelvinParaCelsius($kelvin) {\nreturn $temp - 273.15;\n}","C":"function kelvinParaCelsius($temp) {\nreturn $temp - 273.15;\n}","D":"function kelvinParaCelsius($temp) {\nreturn $temp + 273.15;\n}"},"t":"Linguagens de programação","tp":"PHP, Java e sintaxe de linguagens","src":"prova_eags_2025_cod_52_09 05 2024 14 59 33.pdf · p. 14","vr":1},{"id":"EAGS2025-C52-INF-094","s":"inf","y":2025,"c":"52","n":94,"a":"B","an":false,"du":false,"l":"","e":"Utiliza-se o termo spam para classificar os e-mails não solicitados, comumente enviados a grandes quantidades de usuários.\nQuanto aos problemas enfrentados por provedores e empresas prestadoras de serviço, assinale a alternativa incorreta.","o":{"A":"Impacto na banda","B":"Furto de identidade","C":"Má utilização de servidores","D":"Investimento extra em recursos"},"t":"Segurança da informação","tp":"Autenticação, controle de acesso e proteção","src":"prova_eags_2025_cod_52_09 05 2024 14 59 33.pdf · p. 14"},{"id":"EAGS2025-C52-INF-095","s":"inf","y":2025,"c":"52","n":95,"a":"B","an":false,"du":false,"l":"","e":"Analise o programa abaixo, representado em português estruturado, e assinale a alternativa que contém a saída exibida ao usuário.\nprograma EXERCICIO procedimento SUBPROGRAMA(N : inteiro) var\nI, X : inteiro início\nX ← 5 para I de 1 até N passo 1 faça escreva X * 2 fim_para fim var\nY : inteiro início\nY ← 1\nSUBPROGRAMA(Y) fim","o":{"A":"2","B":"10","C":"2 10","D":"1 5 10 15"},"t":"Linguagens de programação","tp":"PHP, Java e sintaxe de linguagens","src":"prova_eags_2025_cod_52_09 05 2024 14 59 33.pdf · p. 15","vr":1},{"id":"EAGS2025-C52-INF-096","s":"inf","y":2025,"c":"52","n":96,"a":"B","an":false,"du":false,"l":"","e":"Assinale a alternativa cujas palavras possuem uma relação que poderia ser representada utilizando-se de classes e o conceito de herança em programas orientados a objetos.","o":{"A":"Abelha / Colmeia","B":"Pessoa / Aluno","C":"Lobo / Cinza","D":"Carro / Freio"},"t":"Programação orientada a objetos","tp":"Classes, herança, encapsulamento e polimorfismo","src":"prova_eags_2025_cod_52_09 05 2024 14 59 33.pdf · p. 15","vr":1},{"id":"EAGS2025-C52-INF-097","s":"inf","y":2025,"c":"52","n":97,"a":"A","an":false,"du":false,"l":"","e":"Considere a assertiva.\nPara a devida transmissão de conteúdos sigilosos via navegação web, é importante que sejam utilizadas conexões seguras. O protocolo _____ faz uso de certificados digitais para garantir a identidade dos sites envolvidos na comunicação, além de prover criptografia, que possibilita preservar tanto a confidencialidade quanto à integridade das informações transmitidas. Por outro lado, o protocolo _____ não impede que tais informações possam ser interceptadas e/ou modificadas e não oferece garantias de que a comunicação não esteja sendo realizada com um site malicioso.\nAssinale a alternativa que completa as lacunas.","o":{"A":"HTTPS - HTTP","B":"SSH - Telnet","C":"FTPS - FTP","D":"TCP - UDP"},"t":"Redes de computadores","tp":"Protocolos, endereçamento e arquitetura de redes","src":"prova_eags_2025_cod_52_09 05 2024 14 59 33.pdf · p. 15"},{"id":"EAGS2025-C52-INF-098","s":"inf","y":2025,"c":"52","n":98,"a":"A","an":false,"du":false,"l":"","e":"Considere o trecho de código PHP abaixo e assinale a alternativa que representa a saída impressa na tela.\n<?php\nfunction recursividade($num){\nif($num == 0){\necho “Fim”;\n} else {\n$valor = $num % 2 == 0 ? ($num * 2) : $num;\necho $valor.”, “;\nrecursividade($num - 1);\n}\n}\nrecursividade(5);\n?>","o":{"A":"5, 8, 3, 4, 1, Fim","B":"5, 4, 3, 2, 1, Fim","C":"5, 8, 3, 4, 1,","D":"5, 4, 3, 2, 1,"},"t":"Linguagens de programação","tp":"PHP, Java e sintaxe de linguagens","src":"prova_eags_2025_cod_52_09 05 2024 14 59 33.pdf · p. 15","vr":1},{"id":"EAGS2025-C52-INF-099","s":"inf","y":2025,"c":"52","n":99,"a":"B","an":false,"du":false,"l":"","e":"Relacione as colunas, considerando a inicialização em ambiente linux e que o init define sete níveis de execução, cada um executando um determinado complemento de serviços que o sistema deve estar executando. Em seguida, assinale a alternativa com a sequência correta.\n1 – Nível 0\n( ) Níveis multiusuário\n2 – Nível 1 ou S\n( ) Nível de reinicialização\n3 – Nível 2 a 5\n( ) Representa o modo monousuário\n4 – Nível 6\n( ) Nível no qual o sistema está completamente desligado","o":{"A":"1 - 2 - 3 - 4","B":"3 - 4 - 2 - 1","C":"2 - 1 - 4 - 3","D":"4 - 3 - 1 - 2"},"t":"Algoritmos e lógica","tp":"Fluxogramas, estruturas de controle e pseudocódigo","src":"prova_eags_2025_cod_52_09 05 2024 14 59 33.pdf · p. 15"},{"id":"EAGS2025-C52-INF-100","s":"inf","y":2025,"c":"52","n":100,"a":"D","an":false,"du":false,"l":"","e":"Relacione as colunas, considerando a codificação de tipos de arquivos que o comando ls utiliza, e assinale a alternativa com a sequência correta.\n1 – Arquivo regular\n( ) l\n2 – Diretório\n( ) b\n3 – Socket de domínio local\n( ) d\n4 – Arquivo de dispositivo de blocos ( ) -\n5 – Link simbólico\n( ) s","o":{"A":"1 - 5 - 4 - 2 - 3","B":"3 - 2 - 1 - 4 - 5","C":"4 - 1 - 5 - 3 - 2","D":"5 - 4 - 2 - 1 - 3"},"t":"Algoritmos e lógica","tp":"Fluxogramas, estruturas de controle e pseudocódigo","src":"prova_eags_2025_cod_52_09 05 2024 14 59 33.pdf · p. 15"}];const SUP=["AS QUESTÕES DE  01  A  40  REFEREM-SE\nÀ LÍNGUA PORTUGUESA\nOtimismo\nO otimismo é o vinho tinto das emoções. Uma ou duas taças por dia fazem um bem enorme. Duas garrafas arruínam a pessoa.\nA diferença do volume da bebida ilustra os dois tipos de otimismo, o racional, uma das conquistas evolutivas mais preciosas da espécie, e o irracional, a fonte de grandes tragédias históricas e fracassos pessoais. A média das mais amplas pesquisas já conduzidas sobre o tema revela que cerca de 80% das pessoas são otimistas. Essa é a parcela da humanidade capaz de enxergar o copo meio cheio. A outra parcela, a minoria, cuja mente vê o mesmo copo meio vazio, tem uma única vantagem sobre a maioria, pois, como diz o ditado, “o pessimista só tem boas surpresas”.\nOs otimistas têm más surpresas e são capazes de assimilá-las e transformar o azedume em doce limonada. Eles vivem mais e têm maior resistência às doenças. Quando presos a um leito de hospital, são eles que têm maior chance de cura. Essas pessoas ousam mais, poupam mais e aposentam-se mais tarde. Se a consciência da morte torna o pessimismo inerente à condição humana, o instinto vital se alimenta do otimismo para que a ideia da finitude não nos enlouqueça.\nAs pessoas mais interessantes são os otimistas com os pés bem plantados no chão. São os arquitetos do futuro, que tomam uma ou mais taças diárias do vinho da ousadia. São as personalidades com um olho nas lições do passado e o outro nas questões do presente e nos desafios do futuro. São, ao mesmo tempo, raízes e asas. Ilusão e realidade.\n(Revista Veja, 23 de janeiro de 2013 – texto adaptado)\nAs questões de 01 a 04 referem-se ao texto anterior.","AS QUESTÕES DE  01  A  40  REFEREM-SE À\nLÍNGUA PORTUGUESA\nVários planetas são visíveis a olho nu: Marte, Júpiter,\nVênus, Saturno e Mercúrio. Esses astros já eram conhecidos não apenas dos gregos mas também de povos ainda mais antigos, como os babilônios. Apesar de sua semelhança com as estrelas, os planetas eram identificados pelos povos da\nAntiguidade graças a duas características que os diferenciavam. Primeiro: as estrelas, em curtos períodos, não variam de posição umas em relação às outras. Já os planetas mudam de posição no céu com o passar das horas. À noite, esse movimento pode ser percebido com facilidade. Segundo:\nas estrelas têm uma luz que, por ser própria, pisca levemente.\nJá os planetas, que apenas refletem a luz do Sol, têm um brilho fixo. Os planetas mais distantes da Terra só puderam ser descobertos bem mais tarde, com a ajuda de aparelhos ópticos como o telescópio. “O primeiro deles a ser identificado foi Urano, descoberto em 1781 pelo astrônomo inglês William Herschel”, afirma a astrônoma Daniela\nLázzaro, do Observatório Nacional do Rio de Janeiro.\nFonte: Revista Superinteressante – agosto/2001.\nAs questões de 01 a 04 referem-se ao texto acima.","AS QUESTÕES DE  01  A  40  REFEREM-SE À\nLÍNGUA PORTUGUESA\nPoesia do Tempo\nO equívoco entre poesia e povo já é demasiadamente sabido para que valha a pena insistir nele. Denunciemos antes o equívoco entre poesia e poetas. A poesia não se “dá”, é hermética ou inumana, queixam-se por aí. Ora, eu creio que os poetas poderiam demonstrar o contrário ao público. De que maneira? Abandonando a ideia de que poesia é evasão.\nE aceitando alegremente a ideia de que poesia é participação.\nNão basta dizer que já não há torres de marfim; a torre\ndesmoronou-se pelo ridículo, porém muitos poetas continuam vendo na poesia um instrumento de fuga da realidade ou de correção do que essa realidade ofereça de monstruoso e de errado. Desenvolve-se então entre eles a linguagem cifrada, que nenhum leigo entende, e que suscita o equívoco já célebre entre poesia e povo.\nParticipação na vida, identificação com os ideais do tempo (e esses ideais existem sempre, mesmo sob as mais sórdidas aparências de decomposição), curiosidade e interesse pelos outros homens, apetite sempre renovado em face das coisas, desconfiança da própria e excessiva riqueza interior, eis aí algumas indicações que permitirão talvez ao poeta deixar de ser um bicho esquisito para voltar a ser, simplesmente, um homem.\n(Carlos Drummond de Andrade)\nAs questões de 01 a 04 referem-se ao texto acima.","AS QUESTÕES DE  01  A  40  REFEREM-SE À\nLÍNGUA PORTUGUESA\nFim de livro\nHá escritores que precisam de silêncio, solidão e ambiente adequado para a prática da escrita. Se fosse esperar por essas condições, teria demorado vinte anos para publicar meu último livro, tempo de vida que não terei mais.\nPor força da necessidade, aprendi a escrever em qualquer lugar em que haja espaço para sentar com o computador. Minha carreira de escritor começou com “Estação Carandiru”, quando eu tinha 56 anos. Foi tão grande o prazer de contar aquelas histórias, que senti ódio de mim mesmo por ter vivido meio século sem escrever livros.\nA dificuldade vinha da timidez e da autocrítica. Para mim, o que eu escrevesse seria fatalmente comparado com\nMachado de Assis, Gogol, Faulkner, Joyce, Pushkin,\nTurgenev, Dante Alighieri. Depois do que disseram esses e outros gênios, que livro valeria a pena ser escrito?\nEm conversa com um estudante, Hemingway diz que ao escritor de nossos tempos cabem duas alternativas: escrever melhor do que os grandes mestres já falecidos, ou contar histórias que nunca foram contadas. De fato, se eu escrevesse melhor do que Machado de Assis, poderia recriar personagens como Dom Casmurro ou descrever com mais poesia o olhar de ressaca de Capitu.\nRestava, então, a segunda alternativa: a vida numa cadeia com mais de sete mil presidiários, na cidade de\nSão Paulo, nas últimas décadas do século XX, não poderia ser descrita por Homero ou padre Antônio Vieira. O médico que atendia pacientes no Carandiru havia dez anos era quem reunia as condições para fazê-lo.\nSeguindo o mesmo critério, publiquei outros livros.\nÀs cotoveladas, a literatura abriu espaço em minha agenda.\nHá escritores talentosos que se queixam dos tormentos e da angústia inerentes ao processo de criação. Não é o meu caso, escrever só me traz alegria.\nDráuzio Varella, texto adaptado\nAs questões de 01 a 04 referem-se ao texto acima.","AS QUESTÕES DE  01  A  40  REFEREM-SE\nÀ LÍNGUA PORTUGUESA\nVergonha de viver\nClarice Lispector\nHá pessoas que têm vergonha de viver: são os tímidos, entre os quais me incluo. Desculpem, por exemplo, estar tomando lugar no espaço. Desculpem eu ser eu. Quero ficar só! grita a alma do tímido que só se liberta na solidão. Contraditoriamente quer o quente aconchego das pessoas. (...)\nSempre fui uma tímida muito ousada. Lembro-me de quando há muitos anos fui passar férias numa grande fazenda. Ia-se de trem até uma pequeníssima estação deserta. Donde se telefonava para a fazenda que ficava a meia hora dali, num caminho perigosíssimo, rude e tosco (...). Telefonei para a fazenda e eles me perguntaram se queria carro ou cavalo. Eu disse logo cavalo. E nunca tinha montado na vida.\nFoi tudo muito dramático. Caiu uma grande chuva de tempestade furiosa e fez-se subitamente noite fechada. Eu, montada no belo cavalo, nada enxergava a minha frente. Mas os relâmpagos revelavam-me verdadeiros abismos. (...) E eu, ensopada, morria de medo: sabia que corria risco de vida. Quando finalmente cheguei à fazenda, não tinha força de desmontar (...).\nDe 12 para 13 anos mudamo-nos do Recife para o Rio, a bordo de um navio inglês. Eu não sabia ainda inglês. Mas escolhia no cardápio ousadamente os nomes de comida mais complicados.\n(...)\nCom sete anos eu mandava histórias e histórias para a seção infantil que saía às quintas-feiras num diário. Nunca foram aceitas.\nE eu, teimosa, continuava escrevendo. (...) www.cronicabrasileira.org.br.\nAs questões de 01 a 04 referem-se ao texto acima.","AS QUESTÕES DE  01  A  40  REFEREM-SE\nÀ LÍNGUA PORTUGUESA\nO pulo do gato\nMauro Santayana\nO grande perigo do jornalista que começa é o de cair na presunção sociológica. É claro que, tratando da sociedade, o jornalismo é também um pouco de sociologia — mas a sociologia deve ir para o lugar próprio, os artigos elaborados com mais tempo, os editoriais e tópicos e, bem digerida em um texto fluido, a reportagem.\nJornalismo é razão e emoção. O texto apenas racional é frio, e só comunica aos que se encontrem diretamente interessados no assunto. O texto deve saber dosar emoção e razão, e é nesse equilíbrio que está o chamado “pulo do gato”. Muitos jornalistas acreditam que o adjetivo emociona.\nEnganam-se. Quanto mais despida uma frase, mais cortante o seu efeito.\n“E amolou o machado, preparou um toco para servir de cepo, chamou o menino, amarrou-lhe as mãos, fez-lhe um sinal para que ficasse calado, e rachou o seu corpo em sete pedaços. O menino P., de cinco anos, não era seu filho e F.\ndescobrira isso poucos minutos antes, quando discutia com a mulher.” Leads como esse são sempre possíveis na reportagem de polícia: não necesitam de adjetivos. As tragédias, como os cantores famosos, dispensam apresentações.\nFIORIN, José Luiz. SAVIOLI, Francisco Platão. Para entender vo texto:\nLeitura e Redação. São Paulo: Editora Ática, 1999.\nAs questões de 01 a 04 referem-se ao texto acima.","Uma visão inteligente da Natureza\nArtur Diniz Neto\nSob vários aspectos, parece-me pouco inteligente encarecer que o homem deveria olhar mais a Natureza e sobretudo tratá-la de forma adequada, já que ele faz parte dela. De fato, quando a encaramos atentamente, percebemos que ela se porta de forma tão inteligente que deveríamos, antes, perguntar se o homem não precisaria observar o comportamento equilibrado da Natureza, reaprendendo, com ela, a agir de forma a não destruí-la, como vem fazendo. (...)\nÉ de se perguntar se os graves males que afligem a humanidade não residiriam no fato de o homem ter-se distinguido da Natureza, tendo construído uma outra, totalmente artificial, quando deveria integrar-se com inteligência nos processos e no equilíbrio perfeitos, que seus olhos, ofuscados pela extrema pretensão e pelo interesse desmedido, não conseguem penetrar.\nTalvez a Natureza olhe para ele com mais inteligência e paciência, pois, se não o fizesse, já o teria aniquilado. “Parece que a Natureza” — pondera Eugene Conseliet — “como boa mãe, procura acomodar-se da melhor forma à impertinência do homem e consertar pacientemente tudo o que ele danifica”. (...)\nMas, afinal, o que é inteligência? A palavra originária do latim “inter” e “legere”, que significam escolher entre, discernir, entender, conhecer, compreender. É a faculdade de conhecer as ideias e as relações que existem entre elas. É, em suma, ver as coisas não em sua forma exterior, mas penetrar em sua essência, em seu “númeno”. Filosoficamente, a inteligência se manifesta por meio de quatro processos, que são: conhecer, armazenar\n(memória), elaborar, comunicar (expressar). Animais, vegetais e minerais conhecem, porque vivem em contato com o meio\nambiente; memorizam, porque gravam tudo o que lhes é útil ou\nnocivo; elaboram, porque criam constantemente mecanismos e\natitudes novos; comunicam-se, porque se inter-relacionam\nequilibradamente.\nNão sabemos quando, nem onde, nem por que o homem resolveu pedir emancipação. (...)\nVox Clamantis in Deserto: A voz daquele que clama num deserto -\nGRAFIST, Lorena - SP, 2006.\nAs questões de 01 a 04 referem-se ao texto acima.","O pavão\nRubem Braga\nEu considerei a glória de um pavão ostentando o\nesplendor de suas cores; é um luxo imperial. Mas andei lendo\nlivros, e descobri que aquelas cores todas não existem na pena do pavão. Não há pigmentos. O que há são minúsculas bolhas d’água em que a luz se fragmenta, como em um prisma. O pavão é um arco-íris de plumas.\nEu considerei que este é o luxo do grande artista, atingir o máximo de matizes com um mínimo de elementos. De água\ne luz ele faz seu esplendor; seu grande mistério é a\nsimplicidade.\nConsiderei, por fim, que assim é o amor, oh minha\namada; de tudo que ele suscita e esplende e estremece e delira\nem mim existem apenas meus olhos recebendo a luz do teu olhar. Ele me cobre de glórias e me faz magnífico.\n(Crônicas Escolhidas)\nAs questões de 01 a 04 referem-se ao texto acima.","O espelho\nJoão Guimarães Rosa (texto adaptado)\nSe quer seguir-me, narro-lhe; não uma aventura, mas\nexperiência, a que me induziram, alternadamente, séries de raciocínios e intuições. Tomou-me tempo, desânimos, esforços.\n— Foi num lavatório de edifício público, por acaso. Eu era moço, comigo contente, vaidoso. Descuidado, avistei...\nExplico-lhe: dois espelhos — um de parede, o outro de porta lateral, aberta em ângulo propício — faziam jogo. E o que enxerguei, por instante, foi uma figura, perfil humano. Deu- me náusea, aquele homem, causava-me ódio e susto. E era — logo descobri... era eu, mesmo!\nDesde aí, comecei a procurar-me — ao eu por detrás de mim — à tona dos espelhos, em sua funda lâmina. Concluí que, interpenetrando-se no disfarce do rosto externo diversas componentes, meu problema seria o de submetê-las a um bloqueio “visual”, desde as mais rudimentares. Tomei o elemento animal, para começo. Meu sósia inferior na escala era — a onça. E, então, eu teria que aprender a não ver, no espelho, os traços que em mim recordavam o grande felino.\nAtirei-me a tanto.\nProssegui... O elemento hereditário — as parecenças com os pais e avós — que são também, nos nossos rostos, um lastro evolutivo residual. E, em seguida, o que se deveria ao contágio das paixões, manifestadas ou latentes, o que ressaltava das desordenadas pressões psicológicas transitórias.\nE, ainda, o que, em nossas caras, materializa ideias e\nsugestões de outrem; e os efêmeros interesses...\nUm dia... Simplesmente lhe digo que me olhei num espelho e não me vi. Não vi nada. Só o campo, liso. Eu não tinha formas, rosto? Apalpei-me, em muito... Aturdi-me, a ponto de me deixar cair numa poltrona. Voltei a querer encarar-me. Nada. Eu não via os meus olhos... Não haveria em mim uma existência central, pessoal, autônoma? Seria eu um... desalmado?\nPois foi que, mais tarde, anos, ao fim de uma ocasião de sofrimentos grandes, de novo me defrontei — não rosto a rosto. O espelho mostrou-me. Que luzinha, aquela, que de mim se emitia, para deter-se acolá, refletida, surpresa? Sim, vi, a mim mesmo, mal emergindo... E era não mais que rostinho de menino, de menos-que-menino, só. Só... E o julgamento-problema: “Você chegou a existir?” [...]\nPrimeiras estórias - Nova Fronteira, 2001.\nAs questões de 01 a 04 referem-se ao texto ac function parseExam(txt,lo,hi){
const t=txt.replace(/\r/g,'').replace(/[ \t\u00a0]+/g,' '),re=/(?:^|\n) ?(?:quest[ãa]o ?)?(\d{1,3}) ?(?:[–—.)-]|\n) ?/gi,H=[];let m,x=lo;
while((m=re.exec(t))){if(+m[1]===x&&x<=hi){H.push({n:x,a:m.index,b:m.index+m[0].length});x++}}
const out={},fl=s=>s.replace(/([^.:?!;\n])\n(?=[^\n])/g,'$1 ').replace(/\n{3,}/g,'\n\n').trim();
H.forEach((h,i)=>{const b=t.slice(h.b,i+1<H.length?H[i+1].a:t.length),re2=/(?:^|\n) ?\(?([a-d])\) ?/gi,P=[];let k,y='a';
while((k=re2.exec(b))){if(k[1].toLowerCase()===y){P.push({l:y.toUpperCase(),a:k.index,b:k.index+k[0].length});y=String.fromCharCode(y.charCodeAt(0)+1)}}
const o={};P.forEach((p,j)=>{let s=b.slice(p.b,j+1<P.length?P[j+1].a:b.length);if(j===3)s=s.split(/\n\s*\n/)[0];o[p.l]=s.replace(/\s*\n\s*/g,' ').trim()});
out[h.n]={e:fl(P.length?b.slice(0,P[0].a):b),o,full:P.length===4}});
return out}
function doImp(){const e=D.find(x=>x.id===$('#ie').value),t=$('#it').value;if(t.trim().length<200)return toast('Cole o texto completo da prova.');
const ks=Object.keys(e.ans).map(Number),r=parseExam(t,Math.min(...ks),Math.max(...ks));let n=0,f=0;
for(const k in r){const q=r[k],id=e.id+'-'+k;if(!q.e&&!q.full)continue;S.q[id]={...(S.q[id]||{}),e:q.e,o:{A:'',B:'',C:'',D:'',...q.o}};n++;if(q.full)f++}
save();$('#dlg').close();toast(n?n+' enunciados importados ('+f+' com as 4 alternativas).':'Não encontrei questões nesse texto. Confira se é a prova certa.');render()}

/* ---------- PDF ---------- */
let PD=null;
const pdfL=id=>{const l=S.lists.find(x=>x.id===id);pdfDlg(l.ids,l.name)};
function pdfDlg(ids,name){const ok=ids.map(QI).filter(q=>q.e);
PD={ids:ok.map(q=>q.id),nm:name||'Questões EAGS',g:1,s:1,t:1};
const ck=(k,l)=>`<label class="ck" style="flex-direction:row;align-items:center;gap:8px;color:var(--ink);font-size:14px"><input type="checkbox" checked onchange="PD.${k}=+this.checked">${l}</label>`;
$('#dlg').innerHTML=`<h2>Gerar PDF</h2><p class="mut">${ok.length} questões com texto completo${ids.length>ok.length?' · '+(ids.length-ok.length)+' sem enunciado ficam de fora':''}.</p>
<label>Título do documento<input value="${E(PD.nm)}" oninput="PD.nm=this.value"></label>
<div class="step"><h3>Incluir</h3><div class="gap" style="gap:8px">${ck('s','Texto de apoio, quando a questão tiver')}${ck('t','Tema e origem de cada questão')}${ck('g','Gabarito em página separada, no final')}</div></div>
<p class="mut" style="font-size:13px">Vai abrir a janela de impressão: escolha “Salvar como PDF” como destino.</p>
<div style="display:flex;gap:10px;justify-content:flex-end;margin-top:16px"><button class="btn ghost" onclick="$('#dlg').close()">Cancelar</button><button class="btn" ${ok.length?'':'disabled'} onclick="pdfGo()">Gerar PDF</button></div>`;
$('#dlg').showModal()}
function pdfGo(){let h='',ps=-1,key='';
PD.ids.forEach((id,i)=>{const q=QI(id);
if(PD.s&&q.sp!=null&&q.sp!==ps)h+=`<div class="ps"><b>Texto de apoio</b>\n${E(SUP[q.sp])}</div>`;ps=q.sp??-1;
h+=`<div class="pq"><h4>Questão ${i+1}</h4>${PD.t?`<small>EAGS ${q.y} · Cód. ${E(q.c)} · Q${q.n}${q.t?' · '+E(q.t):''}${q.tp?' › '+E(q.tp):''}</small>`:''}<div class="pt">${E(q.e)}</div>${['A','B','C','D'].map(l=>`<div class="po"><b>${l})</b> ${E((q.o||{})[l])}</div>`).join('')}${q.vr?'<small>Pode haver figura ou trecho não extraído: confira na prova original.</small>':''}</div>`;
key+=`<p>${i+1}. <b>${q.an?'Anulada':q.a||'—'}</b></p>`});
$('#pa').innerHTML=`<h1>${E(PD.nm)}</h1><p class="pm">${PD.ids.length} questões · gerado em ${new Date().toLocaleDateString('pt-BR')}</p>${h}${PD.g?`<div class="gb"><h1>Gabarito</h1><p class="pm">${E(PD.nm)}</p><div>${key}</div></div>`:''}`;
$('#dlg').close();toast('Na janela de impressão, escolha “Salvar como PDF”.');setTimeout(()=>print(),150)}
addEventListener('afterprint',()=>{$('#pa').innerHTML=''});

render();
</script>
