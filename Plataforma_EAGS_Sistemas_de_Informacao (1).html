"e":"Coloque C para Certo e E para Errado quanto à concordância nominal dos termos destacados nas frases abaixo.\nDepois assinale a alternativa com a sequência correta.\n(    ) Conheci, na passeata, rapazes e moças com as quais travei ótimo relacionamento.\n(    ) Deixaram jogados, sobre a carteira, o livro de inglês e a gramática.\n(    ) Estavam assustadas as garotas e o lindo cãozinho.","o":{"A":"E – C – C","B":"E – E – E","C":"C – C – C","D":"C – E – E"},"t":"Concordância","tp":"Concordância verbal e nominal","src":"EAGS_2018_codigo_73_SIN.pdf · p. 3"},{"id":"EAGS2018-C73-PT-006","s":"por","y":2018,"c":"73","n":6,"a":"C","an":false,"du":false,"l":"","e":"Assinale a alternativa em que o termo destacado é advérbio.","o":{"A":"O bravo chefe falou com o empregado.","B":"Rodolfo foi o melhor aluno que eu já tive.","C":"Aquele candidato ao cargo de vereador discursa mal.","D":"Meu irmão fez um mau negócio ao comprar aquele sítio."},"t":"Classes de palavras","tp":"Substantivo, adjetivo, advérbio e demais classes","src":"EAGS_2018_codigo_73_SIN.pdf · p. 3"},{"id":"EAGS2018-C73-PT-007","s":"por","y":2018,"c":"73","n":7,"a":"D","an":false,"du":false,"l":"","e":"Em que alternativa o pronome oblíquo em destaque tem função de objeto direto?","o":{"A":"Rogo-te que fiques, meu pai!","B":"Desesperada, a mãe confiou-nos a segurança de seu filho.","C":"Qualidades não lhe faltavam para merecer o reconhecimento.","D":"Ah! Quanta beleza! Por isso olhavam-na com tanta admiração."},"t":"Sintaxe","tp":"Termos da oração: complementos e adjuntos","src":"EAGS_2018_codigo_73_SIN.pdf · p. 3"},{"id":"EAGS2018-C73-PT-008","s":"por","y":2018,"c":"73","n":8,"a":"C","an":false,"du":false,"l":"","e":"Assinale a alternativa em que há oração coordenada sindética conclusiva.","o":{"A":"Não grite, pois estamos em um velório.","B":"Apronte-se logo, pois estamos em cima da hora.","C":"Eles trabalham demais; merecem, pois, descanso.","D":"Façam silêncio, por favor, pois estamos em um velório."},"t":"Sintaxe","tp":"Período composto e orações","src":"EAGS_2018_codigo_73_SIN.pdf · p. 3"},{"id":"EAGS2018-C73-PT-009","s":"por","y":2018,"c":"73","n":9,"a":"B","an":false,"du":false,"l":"","e":"Leia:\nI.\nO alcoolismo é um dos fatores que contribui para a violência contra crianças e mulheres.\nII. Nos EUA, os gastos com a violência doméstica entre casais ultrapassa 5,8 bilhões de dólares anuais.\nIII. O olhar dos estrangeiros sobre o Brasil vai além das belezas\nnaturais; o turismo sexual é um forte atrativo do país.\nIV. As denúncias de turismo sexual precisam ser feitas, a fim de enfraquecer esse sistema doente.\nO processo de formação das palavras destacadas acima é, respectivamente, derivação","o":{"A":"sufixal / prefixal / regressiva / prefixal e sufixal.","B":"sufixal / prefixal / imprópria / parassintética.","C":"prefixal / regressiva / imprópria / sufixal.","D":"prefixal / sufixal / regressiva / prefixal."},"t":"Formação de palavras","tp":"Estrutura e formação de palavras","src":"EAGS_2018_codigo_73_SIN.pdf · p. 3"},{"id":"EAGS2018-C73-PT-010","s":"por","y":2018,"c":"73","n":10,"a":"B","an":false,"du":false,"l":"","e":"Coloque C para as alternativas em que o acento indicador de crase está correto e E para as alternativas em que ele está errado.\n(    ) Aquela é a recepcionista à qual pedimos informações.\n(    ) Centenas de pessoas assistiram àquela peça teatral.\n(    ) Você se refere àquele professor de Filosofia?\n(    ) Estava disposta à dormir cedo no domingo.","o":{"A":"E – E – E – E","B":"C – C – C – E","C":"C – C – C – C","D":"E – C – E – C"},"t":"Crase","tp":"Emprego do acento indicativo de crase","src":"EAGS_2018_codigo_73_SIN.pdf · p. 4"},{"id":"EAGS2018-C73-PT-011","s":"por","y":2018,"c":"73","n":11,"a":"C","an":false,"du":false,"l":"","e":"Leia:\n“A língua tibetana é complicada até para os nativos, conquanto seja bem antiga, com cerca de 1300 anos. Consoante declara a embaixada chinesa no Brasil, só agora, com o rápido crescimento econômico, algumas palavras têm sido introduzidas no vocabulário tibetano.”\nSobre o trecho acima, é correto afirmar que nele há","o":{"A":"uma oração subordinada adverbial causal e uma oração subordinada adverbial concessiva.","B":"uma oração subordinada adverbial final e uma oração subordinada adverbial consecutiva.","C":"uma oração subordinada adverbial concessiva e uma oração subordinada adverbial conformativa.","D":"uma oração subordinada adverbial consecutiva e uma oração subordinada adverbial conformativa."},"t":"Sintaxe","tp":"Período composto e orações","src":"EAGS_2018_codigo_73_SIN.pdf · p. 4"},{"id":"EAGS2018-C73-PT-012","s":"por","y":2018,"c":"73","n":12,"a":"B","an":false,"du":false,"l":"","e":"Leia:\n“Naquele tempo, as janelas da escola eram muito grandes e as ruas eram um teatro – não como são hoje as ruas de São Paulo, tomadas pelos carros, sem calçadas. Tinha o sujeito que vinha com a matraca, vendendo biju, tinha o padeiro que trazia o cheiro do pão e a beleza de seus arranjos na perua.”\nEm qual alternativa há duas locuções adjetivas retiradas do texto acima?","o":{"A":"do pão / na perua","B":"da escola / de São Paulo","C":"pelos carros / sem calçadas","D":"com a matraca / muito grandes"},"t":"Sintaxe","tp":"Termos da oração: sujeito e predicado","src":"EAGS_2018_codigo_73_SIN.pdf · p. 4"},{"id":"EAGS2018-C73-PT-013","s":"por","y":2018,"c":"73","n":13,"a":"D","an":false,"du":false,"l":"","e":"Considerando o número dos substantivos, assinale a alternativa que completa, correta e respectivamente, as lacunas.\n1 – Na Itália há vários _______em atividade.\n2 – Os _______ são músculos da mastigação originados na arcada zigomática e inseridos na mandíbula.\n3 – Segundo a crença popular, as amásias de padres recebem a seguinte punição: são transformadas em _______.\n4 – Os _______ são pássaros cuja língua fina e comprida serve para sugar o néctar das flores.","o":{"A":"vulcães, masseter, mulas sem cabeças, beijas-flores","B":"vulcãos, masseteres, mula sem cabeça, beijas-flores","C":"vulcões, masseteres, mulas sem cabeças, beija-flores","D":"vulcões, masseteres, mulas sem cabeça, beija-flores"},"t":"Classes de palavras","tp":"Substantivo, adjetivo, advérbio e demais classes","src":"EAGS_2018_codigo_73_SIN.pdf · p. 4"},{"id":"EAGS2018-C73-PT-014","s":"por","y":2018,"c":"73","n":14,"a":"A","an":false,"du":false,"l":"","e":"Una as frases abaixo por meio de um pronome relativo e assinale a alternativa correta.\nNa Finlândia, a Aurora Boreal encanta os turistas. A magia da\nAurora Boreal afaga a alma.","o":{"A":"Na Finlândia, a Aurora Boreal, cuja magia afaga a alma, encanta os turistas.","B":"Na Finlândia, a Aurora Boreal, que a magia afaga a alma, encanta os turistas.","C":"Na Finlândia, a Aurora Boreal, cuja a magia afaga a alma, encanta os turistas.","D":"Na Finlândia, a Aurora Boreal, aonde a magia afaga a alma, encanta os turistas."},"t":"Pronomes","tp":"Emprego e classificação dos pronomes","src":"EAGS_2018_codigo_73_SIN.pdf · p. 4"},{"id":"EAGS2018-C73-PT-015","s":"por","y":2018,"c":"73","n":15,"a":"C","an":false,"du":false,"l":"","e":"Assinale a alternativa em que os termos destacados estão corretamente classificados.","o":{"A":"O encontro dos jovens foi emocionante. (predicativo do sujeito)","B":"O sótão daquela velha mansão está cheio de morcegos.\n(predicativo do objeto)","C":"Meu pai e meu avô achavam ótimo qualquer filme de terror.\n(predicativo do objeto)","D":"Teu silêncio gélido fulmina meu coração já cansado de gritar por teu amor. (predicativo do sujeito)"},"t":"Sintaxe","tp":"Termos da oração: sujeito e predicado","src":"EAGS_2018_codigo_73_SIN.pdf · p. 4"},{"id":"EAGS2018-C73-PT-016","s":"por","y":2018,"c":"73","n":16,"a":"D","an":false,"du":false,"l":"","e":"Em relação ao gênero do substantivo, assinale a alternativa incorreta.","o":{"A":"O champanha que compramos para a ceia de Natal não era francês. Fomos enganados!","B":"Todos ficaram com muito dó das vítimas do último ataque terrorista.","C":"O eclipse da Lua até hoje inspira os poetas.","D":"A maracajá é uma espécie de jaguatirica."},"t":"Classes de palavras","tp":"Substantivo, adjetivo, advérbio e demais classes","src":"EAGS_2018_codigo_73_SIN.pdf · p. 4"},{"id":"EAGS2018-C73-PT-017","s":"por","y":2018,"c":"73","n":17,"a":"C","an":false,"du":false,"l":"","e":"Leia:\nQuixote não desanimava em suas investidas. Ele acumulava sucessivas derrotas.\nUna as duas orações acima, fazendo as adaptações necessárias, e depois assinale a alternativa que contém a conjunção/locução conjuntiva que estabelece a correta relação entre elas.","o":{"A":"a fim de que","B":"uma vez que","C":"mesmo que","D":"caso"},"t":"Sintaxe","tp":"Período composto e orações","src":"EAGS_2018_codigo_73_SIN.pdf · p. 4"},{"id":"EAGS2018-C73-PT-018","s":"por","y":2018,"c":"73","n":18,"a":"C","an":false,"du":false,"l":"","e":"Em todas as alternativas há aposto, exceto em uma.\nAssinale-a.","o":{"A":"Aqui está a mercadoria perdida: batata, cebola e alho.","B":"O poeta Mário de Andrade participou da Semana de Arte\nModerna.","C":"Tiradentes, que fica em Minas Gerais, é a mais simpática das cidades históricas.","D":"Ouro Preto, a antiga Vila Rica do período da mineração, recebe milhares de visitantes todos os anos."},"t":"Sintaxe","tp":"Termos da oração: complementos e adjuntos","src":"EAGS_2018_codigo_73_SIN.pdf · p. 4"},{"id":"EAGS2018-C73-PT-019","s":"por","y":2018,"c":"73","n":19,"a":"A","an":false,"du":false,"l":"","e":"Quanto à classificação das orações subordinadas substantivas, relacione as colunas. Em seguida, assinale a alternativa com a sequência correta.\n1 – objetiva direta\n2 – completiva nominal\n3 – subjetiva\n(\n) Todos sabem onde ocorreu o desastre.\n(\n) Sabe-se que o preço da cesta básica aumentará em 2017.\n(\n) Durante a noite, Riobaldo teve a sensação de que alguém o fitava.\n(\n) Convém que conheçamos o plano de governo do futuro prefeito.","o":{"A":"1 – 3 – 2 – 3","B":"2 – 2 – 1 – 3","C":"1 – 3 – 2 – 1","D":"3 – 2 – 1 – 1"},"t":"Sintaxe","tp":"Período composto e orações","src":"EAGS_2018_codigo_73_SIN.pdf · p. 5"},{"id":"EAGS2018-C73-PT-020","s":"por","y":2018,"c":"73","n":20,"a":"C","an":false,"du":false,"l":"","e":"Conforme a norma culta, coloque C para as frases corretas e E para as erradas quanto à regência nominal e verbal dos termos destacados. Em seguida, assinale a alternativa com a sequência correta.\n(    ) O professor residia à Rua dos Ipês.\n(    ) A lírica pós-moderna não é acessível de todos.\n(    ) O projeto de que éramos favoráveis não foi discutido durante a reunião.\n(    ) Aquele colega de trabalho ansiava-lhe. Já não aguentava mais tanta angústia.","o":{"A":"C – E – C – E","B":"C – C – E – C","C":"E – E – E – E","D":"E – E – C – C"},"t":"Regência","tp":"Regência verbal e nominal","src":"EAGS_2018_codigo_73_SIN.pdf · p. 5"},{"id":"EAGS2018-C73-PT-021","s":"por","y":2018,"c":"73","n":21,"a":"D","an":false,"du":false,"l":"","e":"Assinale a alternativa em que as lacunas devem ser preenchidas, respectivamente, com Z, S, Z.","o":{"A":"calabre ___a / qui ___er / vi ___inho","B":"parali___ar / improvi ___ar / ga ___es","C":"anali ___ ar / cicatri ___ / finali ___ar","D":"catequi ___ar / atra ___ar / va ___amento"},"t":"Ortografia e acentuação","tp":"Emprego de S e Z na grafia de palavras","src":"EAGS_2018_codigo_73_SIN.pdf · p. 5"},{"id":"EAGS2018-C73-PT-022","s":"por","y":2018,"c":"73","n":22,"a":"D","an":false,"du":false,"l":"","e":"Leia:\nSegundo uma pesquisa recente da Unicamp, três das principais rodovias que dão acesso à cidade de Campinas estão com o solo contaminado por materiais potencialmente tóxicos, como cromo e chumbo.\nA oração subordinada destacada no texto acima classifica-se como","o":{"A":"substantiva completiva nominal.","B":"substantiva apositiva.","C":"adverbial causal.","D":"adjetiva restritiva."},"t":"Sintaxe","tp":"Período composto e orações","src":"EAGS_2018_codigo_73_SIN.pdf · p. 5"},{"id":"EAGS2018-C73-PT-023","s":"por","y":2018,"c":"73","n":23,"a":"C","an":false,"du":false,"l":"","e":"Cada espaço abaixo corresponde a uma conjunção. Assinale a alternativa que completa, correta e respectivamente, cada um deles.\n1 – A poligamia faz parte da tradição do povo tibetano, ________ hoje está em desuso, afinal essa prática é proibida pelo governo chinês.\n2 – O candidato gastou uma fortuna na campanha, fez inúmeras promessas, distribuiu cestas básicas, ________ não ganhou a eleição.\n3 – Por favor, abaixem o som, ________ eu quero estudar.","o":{"A":"porque, pois, logo","B":"pois, e, entretanto","C":"entretanto, e, que","D":"logo, pois, que"},"t":"Sintaxe","tp":"Período composto e orações","src":"EAGS_2018_codigo_73_SIN.pdf · p. 5"},{"id":"EAGS2018-C73-PT-024","s":"por","y":2018,"c":"73","n":24,"a":"B","an":false,"du":false,"l":"","e":"Relacione as colunas quanto à classificação das figuras de linguagem presentes nos trechos destacados. Em seguida, assinale a alternativa com a sequência correta.\n1 – hipérbole\n2 – antítese\n3 – metonímia\n4 – eufemismo\n(\n) “O sonho de um céu e de um mar/ E de uma vida perigosa/Trocando o amargo pelo mel/E as cinzas pelas rosas.”\n(\n) “Senhora, partem tão tristes/Meus olhos por vós (...)/tão tristes, tão saudosos,/tão doentes da partida,/tão cansados, tão chorosos/da morte mais desejosos/ cem mil vezes que da vida”.\n(\n) “Sobre um mar de rosas que arde/Em ondas fulvas, distante,\nErram meus olhos, diamantes,/Como a nau dentro da tarde”.\n(\n) “Às vezes tenho que concordar com a ideia de que meu filho não atingiu o índice normal de aproveitamento para meninos de sua idade”.","o":{"A":"4 – 2 – 1 – 3","B":"2 – 1 – 3 – 4","C":"3 – 4 – 2 – 1","D":"2 – 4 – 3 – 1"},"t":"Semântica e estilística","tp":"Sentido, relações semânticas e figuras de linguagem","src":"EAGS_2018_codigo_73_SIN.pdf · p. 5","vr":1},{"id":"EAGS2018-C73-PT-025","s":"por","y":2018,"c":"73","n":25,"a":"C","an":false,"du":false,"l":"","e":"Leia:\n1 – A extinção de grandes áreas de vegetação no Brasil ocorre, em muitos casos, devido a queimadas provocadas pelo próprio nativo.\n2 – Durante o inverno, as pousadas de Maromba, Visconde de\nMauá e Maringá ficam cheias de turistas.\n3 – A aldeia dos tupinambás fica perto da área litorânea para facilitar o contato com o mar.\nSobre os termos destacados acima, é correto afirmar que","o":{"A":"há apenas dois complementos nominais.","B":"há apenas dois adjuntos adnominais.","C":"todos são complementos nominais.","D":"todos são adjuntos adnominais."},"t":"Sintaxe","tp":"Complemento nominal e adjunto adnominal","src":"EAGS_2018_codigo_73_SIN.pdf · p. 5"},{"id":"EAGS2018-C73-PT-026","s":"por","y":2018,"c":"73","n":26,"a":"B","an":false,"du":false,"l":"","e":"Leia:\n“Um vento furioso, atrevido e vociferante provocava fantasmagóricos redemoinhos de areia enquanto o faraó\nTutankhamon era retirado de seu local de repouso na antiga necrópole egípcia conhecida como Vale dos Reis.”\nAssinale a alternativa em que não aparece a mesma figura de linguagem presente no trecho destacado.","o":{"A":"“Vi a Ciência desertar do Egito.”","B":"“A vida é um incêndio: nela/dançamos, salamandras mágicas.”","C":"“O silêncio de quando nos vimos à primeira vez atravessa a cozinha como um rio profundo.”","D":"“A ilha era deserta e o mar com medo/ da própria solidão já te sonhava./ Ia em vento chamar-te para longe./ E longamente, em espuma te aguardava.”"},"t":"Semântica e estilística","tp":"Sentido, relações semânticas e figuras de linguagem","src":"EAGS_2018_codigo_73_SIN.pdf · p. 6","vr":1},{"id":"EAGS2018-C73-PT-027","s":"por","y":2018,"c":"73","n":27,"a":"A","an":false,"du":false,"l":"","e":"Assinale a alternativa em que o uso de todas as vírgulas tenha sido feito adequadamente.","o":{"A":"No tráfico de pessoas, um subproduto do turismo sexual, as vítimas são aliciadas por agentes aparentemente confiáveis, mas que se condenam por oferecer muitas facilidades a elas.\nNão se deve acreditar, portanto, em promessas milagrosas de emprego em outro Estado ou país.","B":"No tráfico de pessoas, um subproduto do turismo sexual, as vítimas, são aliciadas por agentes aparentemente confiáveis, mas que, se condenam por oferecer muitas facilidades a elas.\nNão se deve acreditar, portanto em promessas milagrosas de emprego em outro Estado ou país.","C":"No tráfico de pessoas, um subproduto do turismo sexual, as vítimas, são aliciadas por agentes, aparentemente confiáveis, mas, que se condenam por oferecer muitas facilidades a elas.\nNão se deve acreditar, portanto, em promessas milagrosas de emprego em outro Estado ou país.","D":"No tráfico de pessoas, um subproduto do turismo sexual, as vítimas são aliciadas, por agentes, aparentemente confiáveis, mas que se condenam por oferecer muitas facilidades a elas.\nNão se deve acreditar portanto, em promessas milagrosas de emprego, em outro Estado ou país."},"t":"Pontuação","tp":"Sinais de pontuação","src":"EAGS_2018_codigo_73_SIN.pdf · p. 6"},{"id":"EAGS2018-C73-PT-028","s":"por","y":2018,"c":"73","n":28,"a":"B","an":false,"du":false,"l":"","e":"Leia:\nAmigos, um passeio numa máquina do tempo não seria divertido? Não seria incrível? Imaginem se, numa das viagens, vocês pudessem encontrar um personagem importante da história, como Einstein, e ajudá-lo a elaborar suas teorias! Já pensaram nisso?\nAs formas verbais destacadas no texto acima estão conjugadas, respectivamente, no","o":{"A":"futuro do presente do indicativo / presente do subjuntivo / pretérito imperfeito do indicativo.","B":"futuro do pretérito do indicativo / imperativo afirmativo / pretérito imperfeito do subjuntivo.","C":"pretérito imperfeito do subjuntivo / presente do subjuntivo / pretérito perfeito do indicativo.","D":"futuro do subjuntivo / imperativo afirmativo / pretérito perfeito do indicativo."},"t":"Verbos","tp":"Tempos, modos e formas verbais","src":"EAGS_2018_codigo_73_SIN.pdf · p. 6"},{"id":"EAGS2018-C73-PT-029","s":"por","y":2018,"c":"73","n":29,"a":"B","an":false,"du":false,"l":"","e":"Assinale a alternativa em que a palavra destacada deveria ter sido acentuada.","o":{"A":"Colmeia é o nome dado à habitação das abelhas.","B":"Halux é o nome dado ao primeiro dedo das patas traseiras dos animais.","C":"Androide é o autômato que tem figura de homem e imita os movimentos humanos.","D":"Hifens são pequenos traços horizontais usados para unir os elementos de palavras compostas, separar sílabas em final de linha e marcar ligações enclíticas e mesoclíticas."},"t":"Ortografia e acentuação","tp":"Ortografia, grafia e hífen","src":"EAGS_2018_codigo_73_SIN.pdf · p. 6","vr":1},{"id":"EAGS2018-C73-PT-030","s":"por","y":2018,"c":"73","n":30,"a":"D","an":false,"du":false,"l":"","e":"Leia:\nI.\nO meu trabalho é nobre. É nobilíssimo/nobrérrimo.\nII. Cuidado! Esta violeta é frágil. É fragílima/ fragilíssima.\nIII. O anoréxico quer ficar muito magro. Quer ficar magríssimo/macérrimo.\nSegundo a norma culta da língua, as duas formas superlativas indicadas para os adjetivos destacados estão corretas apenas em","o":{"A":"I.","B":"II.","C":"I e III.","D":"II e III."},"t":"Classes de palavras","tp":"Substantivo, adjetivo, advérbio e demais classes","src":"EAGS_2018_codigo_73_SIN.pdf · p. 6"},{"id":"EAGS2018-C73-PT-031","s":"por","y":2018,"c":"73","n":31,"a":"C","an":false,"du":false,"l":"","e":"Leia:\nI. A euforia e o calor daquela noite expulsaram da sala o silêncio.\nII. Naquela noite, sob o calor da euforia, o silêncio partiu.\nOs termos destacados, nos textos acima, são, na sequência,","o":{"A":"adjunto adnominal / adjunto adnominal.","B":"adjunto adverbial / adjunto adnominal.","C":"adjunto adnominal / adjunto adverbial.","D":"adjunto adverbial / adjunto adverbial."},"t":"Sintaxe","tp":"Termos da oração: complementos e adjuntos","src":"EAGS_2018_codigo_73_SIN.pdf · p. 6"},{"id":"EAGS2018-C73-PT-032","s":"por","y":2018,"c":"73","n":32,"a":"C","an":false,"du":false,"l":"","e":"Assinale a alternativa em que o verbo ver encontra-se na voz passiva.","o":{"A":"De madrugada, viram vultos brancos saindo da escuridão.","B":"Creio que seu coração bondoso verá minhas dores e súplicas com ternura.","C":"Já não se veem locomotivas nas estações das pequenas e grandes cidades. É a modernidade!","D":"A estranha criatura, na sombra projetada no lago, via-se imensa, monstruosa, assustadora."},"t":"Verbos","tp":"Tempos, modos e formas verbais","src":"EAGS_2018_codigo_73_SIN.pdf · p. 6"},{"id":"EAGS2018-C73-PT-033","s":"por","y":2018,"c":"73","n":33,"a":"D","an":false,"du":false,"l":"","e":"O termo destacado é agente da passiva em que alternativa?","o":{"A":"O poeta saiu cantando seus versos de norte a sul, naquela noite escura e fria.","B":"A sua história de luta e resistência emocionou a todos daquela plateia.","C":"O interesse daquele poeta pelas histórias em quadrinhos levou-o à escrita.","D":"Naquela noite, o contador de histórias foi aplaudido de pé por aquela plateia."},"t":"Sintaxe","tp":"Termos da oração: complementos e adjuntos","src":"EAGS_2018_codigo_73_SIN.pdf · p. 6"},{"id":"EAGS2018-C73-PT-034","s":"por","y":2018,"c":"73","n":34,"a":"D","an":false,"du":false,"l":"","e":"Leia:\n“Muita gente ainda se ofende com a insistência dos cientistas em nos chamarem de macacos evoluídos. Mas devíamos nos orgulhar de nossos antepassados, que encontraram meios de sobreviver em um ambiente austero e cheio de predadores.”\nA correta e respectiva classificação dos pronomes destacados no texto acima é","o":{"A":"indefinido / reto / oblíquo átono / possessivo/ interrogativo.","B":"demonstrativo / reto / oblíquo tônico / demonstrativo / relativo.","C":"possessivo / oblíquo átono / oblíquo tônico / demonstrativo / interrogativo.","D":"indefinido / oblíquo átono / oblíquo átono / possessivo / relativo."},"t":"Pronomes","tp":"Emprego e classificação dos pronomes","src":"EAGS_2018_codigo_73_SIN.pdf · p. 7"},{"id":"EAGS2018-C73-PT-035","s":"por","y":2018,"c":"73","n":35,"a":"D","an":false,"du":false,"l":"","e":"Complete as lacunas das frases abaixo com os verbos indicados e depois assinale a alternativa com a sequência correta.\n1 – Que encanto! Metade das folhas dos ipês _________ sobre a calçada, completando a beleza do tapete rosa.\n(estava/estavam)\n2 – Sempre __________ muitos buracos na minha avenida, mas o esplendor dos ipês me fazia esquecê-los. (houve/houveram)\n3 – __________ dez anos que não vinha à minha cidade. Mas minha avenida está do mesmo jeito. E os ipês, mais lindos e floridos! (Fazia/Faziam)\n4 – Em agosto e setembro, minha avenida fica em festa, e\n__________ maravilhosos ipês rosa. Um espetáculo para os olhos! (observa-se/observam-se)","o":{"A":"estavam/houveram/Faziam/observa-se","B":"estava/houveram/Fazia/observam-se","C":"estavam/houve/Faziam/observa-se","D":"estava/houve/Fazia/observam-se"},"t":"Verbos","tp":"Tempos, modos e formas verbais","src":"EAGS_2018_codigo_73_SIN.pdf · p. 7"},{"id":"EAGS2018-C73-PT-036","s":"por","y":2018,"c":"73","n":36,"a":"A","an":false,"du":false,"l":"","e":"Leia:\n“Eram aves gigantescas, palmípedes monstruosos, que mal se sustinham nas asas grosseiras, e que traziam ainda, na fragilidade dos ossos, a umidade do barro modelado da véspera.”\nSubstituindo-se por pronome pessoal oblíquo o complemento de traziam, obtém-se","o":{"A":"a traziam.","B":"traziam-na.","C":"traziam-lhe.","D":"lhe traziam."},"t":"Pronomes","tp":"Emprego e classificação dos pronomes","src":"EAGS_2018_codigo_73_SIN.pdf · p. 7"},{"id":"EAGS2018-C73-PT-037","s":"por","y":2018,"c":"73","n":37,"a":"B","an":false,"du":false,"l":"","e":"Há predicativo do sujeito em qual alternativa?","o":{"A":"O silêncio ensurdecedor até agredia os ouvidos naquela calma manhã.","B":"Naquela triste manhã de primavera, a chuva caía fria sobre a cidade.","C":"Alegres e saltitantes sabiás faziam festa sobre a branca areia da praia.","D":"O rei da floresta, naquela tarde, julgou o cãozinho inocente pelo sumiço do gato."},"t":"Sintaxe","tp":"Termos da oração: sujeito e predicado","src":"EAGS_2018_codigo_73_SIN.pdf · p. 7"},{"id":"EAGS2018-C73-PT-038","s":"por","y":2018,"c":"73","n":38,"a":"A","an":false,"du":false,"l":"","e":"Assinale a alternativa que classifica, respectivamente, os predicados das frases abaixo.\n1 – A justificativa do aluno parecia plausível.\n2 – O professor considerou plausível a justificativa do aluno.\n3 – Finalmente, o professor considerou a justificativa do aluno.","o":{"A":"nominal, verbo-nominal, verbal","B":"verbo-nominal, nominal, verbal","C":"verbal, nominal, nominal","D":"nominal, verbal, nominal"},"t":"Verbos","tp":"Tempos, modos e formas verbais","src":"EAGS_2018_codigo_73_SIN.pdf · p. 7"},{"id":"EAGS2018-C73-PT-039","s":"por","y":2018,"c":"73","n":39,"a":"B","an":false,"du":false,"l":"","e":"Leia:\n“O croissant foi inventado em 1869, quando os turcos otomanos se preparavam para invadir Viena, na Áustria. Durante a madrugada, deram o alarme, e o exército local conseguiu evitar a invasão. Então o imperador da Áustria pediu aos padeiros que fizessem um pão que tornasse o fato inesquecível. Assim nasceu o croissant, representando a lua crescente do estandarte otomano.”\nPossui função de objeto indireto, no texto acima, o termo","o":{"A":"na Áustria.","B":"aos padeiros.","C":"o exército local.","D":"do estandarte otomano."},"t":"Sintaxe","tp":"Termos da oração: complementos e adjuntos","src":"EAGS_2018_codigo_73_SIN.pdf · p. 7"},{"id":"EAGS2018-C73-PT-040","s":"por","y":2018,"c":"73","n":40,"a":"A","an":false,"du":false,"l":"","e":"Assinale a alternativa em que não há oração sem sujeito.","o":{"A":"Desconfiou-se do Plano de Governo publicado na página virtual daquele candidato ao cargo de governador.","B":"Não choveu o suficiente no mês de setembro.","C":"Há muitos ipês na cidade de Lorena.","D":"São cinco horas da tarde."},"t":"Sintaxe","tp":"Termos da oração: sujeito e predicado","src":"EAGS_2018_codigo_73_SIN.pdf · p. 7"},{"id":"EAGS2018-C73-INF-041","s":"inf","y":2018,"c":"73","n":41,"a":"D","an":false,"du":false,"l":"","e":"A segurança da informação vem ganhando cada vez mais atenção e espaço no mundo da tecnologia da informação, pois a todo momento novas formas de ataques aos recursos de informática são aplicadas. Assinale a alternativa incorreta no que diz respeito à segurança em redes.","o":{"A":"O vírus de computador é um programa feito com código malicioso, com o objetivo de causar algum tipo de dano ao computador.","B":"A engenharia social é o nome atribuído a técnica utilizada para obter informações importantes e sigilosas das empresas ou usuários domésticos sem a utilização de uma ameaça virtual.","C":"O sniffer é um software ou hardware que tem a função de analisar o tráfego de informações da rede e capturar pacotes para verificar seu conteúdo.","D":"Firewall é o nome atribuído aos softwares responsáveis por ações como publicidade, coleta de informações pessoais ou alteração da configuração do computador sem consentimento do usuário."},"t":"Linguagens de programação","tp":"PHP, Java e sintaxe de linguagens","src":"EAGS_2018_codigo_73_SIN.pdf · p. 8","vr":1},{"id":"EAGS2018-C73-INF-042","s":"inf","y":2018,"c":"73","n":42,"a":"C","an":false,"du":false,"l":"","e":"Em uma tabela de banco de dados, cada linha é chamada de:","o":{"A":"fonte","B":"código","C":"registro","D":"categoria"},"t":"Banco de dados","tp":"SQL, SGBD, modelagem e administração de dados","src":"EAGS_2018_codigo_73_SIN.pdf · p. 8"},{"id":"EAGS2018-C73-INF-043","s":"inf","y":2018,"c":"73","n":43,"a":"A","an":false,"du":false,"l":"","e":"Considerando as afirmativas abaixo, assinale a opção correta.\nI - A Information Technology Infrastructure Library (ITIL) oferece uma abordagem sistemática para a entrega de serviços de TI de qualidade.\nII - A Information Technology Infrastructure Library (ITIL) tem proporcionado não só uma estrutura baseada nas melhores práticas, mas também uma abordagem e uma filosofia compartilhada pelas pessoas que trabalham com ela na prática.\nIII-A Information Technology Infrastructure Library (ITIL) combina uma série de características que a tornam um instrumento valioso e eficaz, visando a um objetivo que realmente importa: entrega de valor para o negócio.\nIV - A Information Technology Infrastructure Library (ITIL), em um primeiro momento, mantém-se neutra em relação ao\nfornecedor; conforme é aplicada, demonstra ser aplicável a\nqualquer organização de TI.\nV - Pode-se afirmar que apenas uma organização está envolvida na manutenção da documentação de melhores práticas: a OGC\n(Office of Government Commerce).\nEstão corretas as afimativas","o":{"A":"I, II e III apenas.","B":"III e IV apenas.","C":"IV e V apenas.","D":"I e II apenas."},"t":"Governança e serviços de TI","tp":"ITIL, gestão de serviços e processos de TI","src":"EAGS_2018_codigo_73_SIN.pdf · p. 8"},{"id":"EAGS2018-C73-INF-044","s":"inf","y":2018,"c":"73","n":44,"a":"B","an":false,"du":false,"l":"","e":"Tendo por base incremento e decremento em PHP, analise o script abaixo e responda qual a saída do programa.\n<?php\n$x=8;\n$y=2;\necho ++$x;\necho $x++;\necho $y--;\n?>","o":{"A":"892","B":"992","C":"9101","D":"9102"},"t":"Linguagens de programação","tp":"PHP, Java e sintaxe de linguagens","src":"EAGS_2018_codigo_73_SIN.pdf · p. 8"},{"id":"EAGS2018-C73-INF-045","s":"inf","y":2018,"c":"73","n":45,"a":"A","an":false,"du":false,"l":"","e":"Em um programa PHP, para fazer a conexão com um banco de dados PostgreSQL, qual função é utilizada ?","o":{"A":"pg_connect","B":"pg_insert","C":"pg_close","D":"connect"},"t":"Banco de dados","tp":"SQL, SGBD, modelagem e administração de dados","src":"EAGS_2018_codigo_73_SIN.pdf · p. 8"},{"id":"EAGS2018-C73-INF-046","s":"inf","y":2018,"c":"73","n":46,"a":"D","an":false,"du":false,"l":"","e":"Com relação a Redes de Computadores, assinale V para verdadeiro ou F para falso, em seguida, assinale a alternativa com a sequência correta.\n) Existem dois tipos de cabo par trançado: o UTP (Unshielded\n(\nTwisted Pair) e o STP (Shielded Twisted Pair). A diferença entre eles é que o cabo STP não possui blindagem contra interferências eletromagnéticas.\n(\n) O comprimento máximo permitido para um cabo UTP é 50 metros.\n(\n) As fibras ópticas podem ser de dois tipos: modo múltiplo\n(multímodo) ou modo único (monomodo).\n(\n) SC, ST, LC e MT-RJ são tipos de conectores de fibra óptica.","o":{"A":"F – F – F – F","B":"F – V – V – V","C":"V – F – V – V","D":"F – F – V – V"},"t":"Redes de computadores","tp":"Protocolos, endereçamento e arquitetura de redes","src":"EAGS_2018_codigo_73_SIN.pdf · p. 8"},{"id":"EAGS2018-C73-INF-047","s":"inf","y":2018,"c":"73","n":47,"a":"A","an":false,"du":false,"l":"","e":"Sobre o LibreOffice Writer 4.2, marque V para verdadeiro e\nF para falso. A seguir, assinale a alternativa com a sequência correta.\n) No Writer também é possível formatar o texto em colunas,\n( aplicando o efeito em todo o documento ou apenas em alguns parágrafos.\n(\n) O Writer possui diversos estilos prontos e tembém permite que sejam definidos novos estilos de formatação.\n(\n) No Writer não é possível transformar os dados em imagens, ou seja, a utilizar gráfico para representar uma informação.\n) O Math é um editor presente no LibreOffice, desenvolvido\n( para criar fórmulas matemáticas e científicas.","o":{"A":"V – V – F – V","B":"V – V – F – F","C":"F – F – V – V","D":"F – V – F – V"},"t":"Aplicativos e ferramentas","tp":"Suítes de escritório, planilhas e apresentações","src":"EAGS_2018_codigo_73_SIN.pdf · p. 8","vr":1},{"id":"EAGS2018-C73-INF-048","s":"inf","y":2018,"c":"73","n":48,"a":"B","an":false,"du":false,"l":"","e":"Um concurso público exige alguns critérios a admissão.\nBaseado nesses critérios, construa um algoritmo em português estruturado, que deverá analisar se o candidato atenderá ou não aos critérios exigidos. Deverão ser ressaltados os critérios a seguir e as suas variáveis: idade, peso e escolaridade. Convém destacar que a idade deverá ser representada em anos, o peso deverá ser representado em kg e a escolaridade deverá ser representada em literal.  Deverá ser analisada qual será a condição no algoritmo que indicará se o candidato atenderá aos critérios para ser admitido em um concurso público.\nCRITÉRIOS:\nIdade: de 18 a 25 anos\nPeso: de 70  a 90 kg\nEscolaridade: superior ou médio","o":{"A":"se (idade>18 .e. idade <=25) .e. (peso >70 .ou. peso <=90) .e.\n(esco=”superior” .ou. esco=”médio”)","B":"se (idade >=18 .e. idade <=25) .e. (peso >=70 .e. peso <=90)\n.e. (esco=”superior” .ou. esco=”médio”)","C":"se (idade>=18 .e. idade <=25) .e. (peso >=70 .e. peso <=90)\n.ou. (esco=”superior” .ou. esco=”médio”)","D":"se (idade>18 .e. idade <=25) .ou. (peso >=70 .e. peso <=90)\n.ou. (esco=”superior” .ou. esco=”médio”)"},"t":"Algoritmos e lógica","tp":"Fluxogramas, estruturas de controle e pseudocódigo","src":"EAGS_2018_codigo_73_SIN.pdf · p. 9"},{"id":"EAGS2018-C73-INF-049","s":"inf","y":2018,"c":"73","n":49,"a":"B","an":false,"du":false,"l":"","e":"Em relação à Placa de Vídeo, marque V para verdadeiro e\nF para falso e, em seguida, assinale a alternativa com a sequência correta.\n) É um componente localizado somente na placa-mãe do\n( computador.\n) Executa tarefas que antes estavam sob responsabilidade do\n( processador principal.\n(\n) É o componente responsável por converter informações digitais geradas pelo processador a partir de programas em um formato que será utilizado pelo monitor de vídeo, para que o usuário possa ver essas informações.\n(\n) É também chamada por algumas pessoas de “placa aceleradora”.","o":{"A":"V – F – F– F","B":"F – V – V – V","C":"V – F– F – V","D":"F – V – V – F"},"t":"Hardware e arquitetura","tp":"Componentes, memória, processamento e sistemas digitais","src":"EAGS_2018_codigo_73_SIN.pdf · p. 9"},{"id":"EAGS2018-C73-INF-050","s":"inf","y":2018,"c":"73","n":50,"a":"C","an":false,"du":false,"l":"","e":"Equipamentos de rede são essenciais para a conectividade de uma rede, além de serem responsáveis pela comunicação entre clientes e servidores. Assinale a alternativa correta no que diz respeito aos equipamentos de rede.","o":{"A":"O repetidor é um equipamento analógico utilizado para ampliar o sinal de um segmento de rede. Os repetidores trabalham na camada de transporte do modelo OSI.","B":"O hub é um equipamento que concentra todos os nós de uma rede local utilizando a topologia estrela. O hub trabalha na camada de apresentação do modelo OSI.","C":"O switch é capaz de verificar o cabeçalho dos pacotes e consegue identificar a máquina destino. O switch trabalha na camada de enlace do modelo OSI.","D":"O roteador executa as mesmas funções do switch, não havendo diferença entre eles. O roteador trabalha na camada de transporte do modelo OSI."},"t":"Redes de computadores","tp":"Protocolos, endereçamento e arquitetura de redes","src":"EAGS_2018_codigo_73_SIN.pdf · p. 9"},{"id":"EAGS2018-C73-INF-051","s":"inf","y":2018,"c":"73","n":51,"a":"C","an":false,"du":false,"l":"","e":"“A topologia é a estrutura física da rede de computadores, ou seja, o tipo de conexão dos equipamentos (nós) na rede e como eles são conectados”.\nAssinale a alternativa correta quanto à topologia de redes:","o":{"A":"As estações, na topologia barramento, compartilham o mesmo cabo, e são realizadas várias transações simultaneamente.","B":"A topologia anel realiza a transmissão em um caminho circular e em várias direções.","C":"As estações de trabalho, na topologia estrela, são conectadas em um controlador especializado, como um hub, roteador ou switch.","D":"Na topologia malha, os nós não se comunicam, e a informação só pode ser transmitida por um caminho fixo."},"t":"Redes de computadores","tp":"Protocolos, endereçamento e arquitetura de redes","src":"EAGS_2018_codigo_73_SIN.pdf · p. 9"},{"id":"EAGS2018-C73-INF-052","s":"inf","y":2018,"c":"73","n":52,"a":"D","an":false,"du":false,"l":"","e":"Considerando A = 2, B = 4, C = 7 e D = 8, informe o valor\nde X conforme a saída do trecho de programa em português estruturado, que segue abaixo:\nse (C >= 3) .e. (B <= 5) então\nX  (D + A) / 2 senão\nX  C * D fim_se escreva X","o":{"A":"56","B":"36","C":"6","D":"5"},"t":"Algoritmos e lógica","tp":"Execução de algoritmo e avaliação de expressões condicionais","src":"EAGS_2018_codigo_73_SIN.pdf · p. 9"},{"id":"EAGS2018-C73-INF-053","s":"inf","y":2018,"c":"73","n":53,"a":"D","an":false,"du":false,"l":"","e":"Analise as assertivas abaixo, colocando V para verdadeiro ou F para falso e, em seguida, assinale a alternativa correta.\n(\n) Slots de Expansão: local onde placas de vídeo e outras placas de expansão são instaladas.\n) Conectores do Painel Frontal: local onde os módulos de\n( memória (RAM) deverão ser instalados.\n(\n) Super I/O: chip responsável por controlar dispositivos “antigos”, tais como portas serial e paralela, portas PS/2 para teclado e mouse e porta para a unidade de disquete.\n) Chipset: chip responsável pela interface infravermelha (se\n( existente) e pelo monitoramento das ventoinhas e sensores de temperatura.","o":{"A":"V –V – V – F","B":"V – F – F – F","C":"F – V – V – F","D":"V– F – V– F"},"t":"Redes de computadores","tp":"Protocolos, endereçamento e arquitetura de redes","src":"EAGS_2018_codigo_73_SIN.pdf · p. 9"},{"id":"EAGS2018-C73-INF-054","s":"inf","y":2018,"c":"73","n":54,"a":"C","an":false,"du":false,"l":"","e":"Assinale a alternativa correta quanto à sentença abaixo.\nNo LibreOffice Impress 4.2, para alterar o Modo Gráfico de uma imagem, é possível escolher entre os quatro tipos de efeitos:","o":{"A":"Padrão, Colorido, Preto/Branco e Transparente.","B":"Imagem original, Envelhecimento, Suavizar e Inverter.","C":"Padrão, Escala de cinza, Preto/Branco e Marca d’água.","D":"Imagem original, Colorido, Transparente e Marca d’água."},"t":"Aplicativos e ferramentas","tp":"Suítes de escritório, planilhas e apresentações","src":"EAGS_2018_codigo_73_SIN.pdf · p. 9","vr":1},{"id":"EAGS2018-C73-INF-055","s":"inf","y":2018,"c":"73","n":55,"a":"D","an":false,"du":false,"l":"","e":"Em um banco de dados, qual o comando será utilizado para excluir a categoria “Artigos Esportivos” da tabela de categorias?","o":{"A":"DELETE FROM categoria where nome_categorias = ‘Artigos\nEsportivos’;","B":"DELETE FROM Artigos Esportivos where nome_categoria =\n‘categorias’;","C":"DELETE FROM categorias where nome_Artigos Esportivos =\n‘categoria’;","D":"DELETE FROM categorias where nome_categoria = ‘Artigos\nEsportivos’;"},"t":"Banco de dados","tp":"SQL, SGBD, modelagem e administração de dados","src":"EAGS_2018_codigo_73_SIN.pdf · p. 10"},{"id":"EAGS2018-C73-INF-056","s":"inf","y":2018,"c":"73","n":56,"a":"","an":true,"du":false,"l":"","e":"Tendo por base laços de repetição utilizados em lógica de programação, analise o algoritmo escrito em português estruturado e verifique se as afirmativas são verdadeiras (V) ou falsas (F). A seguir, assinale a alternativa correta.\nprograma LOOPING\nX, R: inteiro\nRESP: caractere inicio\nRESP  “SIM”\nenquanto (RESP <> “NÃO”) faça\nescreva(“Digite um número”)\nA N U L A D A leia X\nR  X*3 escreva R escreva “Deseja continuar? SIM / NÃO” leia RESP fim_enquanto fim\n(\n) O laço de repetição ou looping apenas continuará se a opção “SIM” for lida como RESP.\n(\n) O looping será repetido pelo menos uma vez.\n(\n) O laço está incorreto, pois não há um contador para controlar o loop, causando um loop infinito.\n(\n)  Dado os valores lidos para X: 3,5 e 2. Dado os valores lidos para RESP: SIM, SIM e NÃO, os valores escritos para R serão: 9, 15 e 6.","o":{"A":"V – V – F – V","B":"F – V – F – V","C":"F – V – V – V","D":"V – F – V – F"},"t":"Algoritmos e lógica","tp":"Fluxogramas, estruturas de controle e pseudocódigo","src":"EAGS_2018_codigo_73_SIN.pdf · p. 10"},{"id":"EAGS2018-C73-INF-057","s":"inf","y":2018,"c":"73","n":57,"a":"A","an":false,"du":false,"l":"","e":"“O __________ é um software livre desenvolvido para\nLinux e que funciona como um servidor de compartilhamento de arquivos e recursos em redes que possuem estações de trabalho com o sistema operacional Windows”.","o":{"A":"Samba","B":"Proxy","C":"IPsec","D":"FTP"},"t":"Redes de computadores","tp":"Protocolos, endereçamento e arquitetura de redes","src":"EAGS_2018_codigo_73_SIN.pdf · p. 10"},{"id":"EAGS2018-C73-INF-058","s":"inf","y":2018,"c":"73","n":58,"a":"D","an":false,"du":false,"l":"","e":"Correlacione os diretórios padrão do Linux aos seus respectivos conteúdos, relacionando a coluna da esquerda com a\nda direita; em seguida, assinale a alternativa que contém a\nsequência correta.\n1 – /boot\n(\n) Arquivos de  configuração e dados específicos ao sistema.\n2 – /var\n(\n) Entradas de dispositivos para discos,\n3 – /sbin impressoras, pseudoterminais, etc.\n4 – /dev\n(\n) Comandos para inicializar, reparar e recuperar o sistema.\n(\n)  Kernel e arquivos necessários para carregar o Kernel.","o":{"A":"3 – 4 – 2 – 1","B":"2 – 1 – 3 – 4","C":"3 – 1 – 2 – 4","D":"2 – 4 – 3 – 1"},"t":"Redes de computadores","tp":"Protocolos, endereçamento e arquitetura de redes","src":"EAGS_2018_codigo_73_SIN.pdf · p. 10","vr":1},{"id":"EAGS2018-C73-INF-059","s":"inf","y":2018,"c":"73","n":59,"a":"D","an":false,"du":false,"l":"","e":"“Servidores são computadores dedicados a uma determinada tarefa que atende a outros computadores ligados a ele por meio de uma rede cliente-servidor”.\nRelacione a coluna da esquerda com a da direita de acordo com cada definição e assinale a alternativa julgada correta.\n(\n) Armazena e executa\n1 – Servidor de Backup aplicações que são\n2 – Servidor de Comunicação compartilhadas pelos\n3 – Servidor de Aplicações usuários da rede.\n4 – Servidor de Arquivos\n(\n) Responsável pela comunicação entre a rede a qual ele pertence e outras redes.\n(\n) Executa e armazena cópias de segurança das informações.\n(\n) Armazena informações que são compartilhadas entre os usuários da rede, como planilhas, textos, gráficos entre outros.","o":{"A":"4 – 1 – 2 – 3","B":"3 – 4 – 2 – 1","C":"2 – 3 – 1 – 4","D":"3 – 2 – 1 – 4"},"t":"Aplicativos e ferramentas","tp":"Suítes de escritório, planilhas e apresentações","src":"EAGS_2018_codigo_73_SIN.pdf · p. 10","vr":1},{"id":"EAGS2018-C73-INF-060","s":"inf","y":2018,"c":"73","n":60,"a":"C","an":false,"du":false,"l":"","e":"Os discos rígidos atualmente têm uma tecnologia chamada\nS.M.A.R.T.\n(Self-Monitoring\nAnalysis and\nReporting\nTechnology), que permite informar ao usuário se o disco rígido está prestes a falhar, permitindo a compra de um novo disco rígido e a cópia do conteúdo do disco rígido problemático.\nContudo, para esse recurso funcionar, ele deverá ser habilitado no programa de configuração (setup) da placa-mãe. Nos dias atuais, em placas-mãe mais recentes, essa tecnologia já se encontra habilitada. Assim sendo, dentre os parâmetros elencados abaixo, selecione o parâmetro INCORRETO, ou seja, aquele parâmetro que não acionará a tecnologia S.M.A.R.T.","o":{"A":"O número de setores reserva está muito alto.","B":"A taxa de transferência de dados está abaixo do normal.","C":"O número de erros de leitura está muito abaixo do normal.","D":"O tempo que o disco rígido leva para atingir sua velocidade de rotação máxima está acima do normal."},"t":"Linguagens de programação","tp":"PHP, Java e sintaxe de linguagens","src":"EAGS_2018_codigo_73_SIN.pdf · p. 10","vr":1},{"id":"EAGS2018-C73-INF-061","s":"inf","y":2018,"c":"73","n":61,"a":"A","an":false,"du":false,"l":"","e":"Tendo por base operadores e variáveis em linguagem de programação PHP, analise o script abaixo e responda qual a saída do programa.\n<?php\n$x=30;\n$y=2.3;\n$resultado= (int) $y + $x*2;\necho $resultado;\n?>","o":{"A":"62","B":"62.3","C":"64","D":"64.6"},"t":"Linguagens de programação","tp":"PHP, Java e sintaxe de linguagens","src":"EAGS_2018_codigo_73_SIN.pdf · p. 11"},{"id":"EAGS2018-C73-INF-062","s":"inf","y":2018,"c":"73","n":62,"a":"C","an":false,"du":false,"l":"","e":"Correlacione os comandos utilizados em Banco de Dados\ncom as suas respectivas características; após, selecione a opção\ncorreta.\nCOMANDOS\nCARACTERÍSTICAS\n(    ) Comando responsável por incluir\nI - show dados em uma tabela.\nII - creat\n(    ) O comando exclui um ou mais table registros de determinada tabela.\n(    ) O comando serve para mostrar os\nIII - insert nomes das tabelas criadas utilizando um gerenciador mysql.\n(    ) O comando serve para criar tabelas\nIV - delete em um determinado banco de dados.","o":{"A":"III – II – IV – I","B":"II – III – I – IV","C":"III – IV – I – II","D":"I – IV – III – II"},"t":"Banco de dados","tp":"SQL, SGBD, modelagem e administração de dados","src":"EAGS_2018_codigo_73_SIN.pdf · p. 11"},{"id":"EAGS2018-C73-INF-063","s":"inf","y":2018,"c":"73","n":63,"a":"D","an":false,"du":false,"l":"","e":"Levando em consideração funções e comandos de repetição em PHP, realize a análise do script abaixo e responda qual a saída do programa.\n<?php\nfunction executa($param){\n$resultado=0;\nforeach($param as $valor){\n$resultado+=$valor;\n}\nreturn $resultado;\n}\necho executa(  array(3,5,10,2)  );\n?>","o":{"A":"0","B":"2","C":"3","D":"20"},"t":"Sistemas operacionais","tp":"Linux, Unix, processos, arquivos e comandos","src":"EAGS_2018_codigo_73_SIN.pdf · p. 11"},{"id":"EAGS2018-C73-INF-064","s":"inf","y":2018,"c":"73","n":64,"a":"D","an":false,"du":false,"l":"","e":"Assinale a alternativa que contenha a entrada correta do arquivo crontab, que executa o script “script_eags” no diretório\n/home, todas as sextas-feiras às 23h55min.","o":{"A":"23\n*\n*\n/home/script_eags","B":"55\n*\n*\n/home/script_eags","C":"23\n*\n*\n/home/script_eags","D":"55\n*\n*\n/home/script_eags"},"t":"Sistemas operacionais","tp":"Linux, Unix, processos, arquivos e comandos","src":"EAGS_2018_codigo_73_SIN.pdf · p. 11"},{"id":"EAGS2018-C73-INF-065","s":"inf","y":2018,"c":"73","n":65,"a":"C","an":false,"du":false,"l":"","e":"“O protocolo __________ é utilizado para gerar e administrar endereço IP”.","o":{"A":"DNS","B":"POP3","C":"DHCP","D":"SNMP"},"t":"Redes de computadores","tp":"Protocolos, endereçamento e arquitetura de redes","src":"EAGS_2018_codigo_73_SIN.pdf · p. 11"},{"id":"EAGS2018-C73-INF-066","s":"inf","y":2018,"c":"73","n":66,"a":"A","an":false,"du":false,"l":"","e":"“Na década de 1990, o modelo baseado na orientação a objeto foi aplicado também aos bancos de dados, criando um novo modelo de programação conhecido como bancos de dados orientados a objeto.\nOs_________são valores definidos segundo_________, ou tipos de _________ complexos, com seus próprios operadores (métodos).”.","o":{"A":"objetos – classes – dados","B":"classes – dados – objetos","C":"objetos – dados – classes","D":"classes – objetos – dados"},"t":"Programação orientada a objetos","tp":"Classes, herança, encapsulamento e polimorfismo","src":"EAGS_2018_codigo_73_SIN.pdf · p. 11"},{"id":"EAGS2018-C73-INF-067","s":"inf","y":2018,"c":"73","n":67,"a":"D","an":false,"du":false,"l":"","e":"Um banco de dados se compõe essencialmente de","o":{"A":"uma base de dados, um sistema gerenciador de exploração, linguagem(ens) de programas, programas voltados a necessidades objetivas.","B":"uma base de dados, um sistema gerenciador de exploração, linguagem(ens) de exploração, programas voltados a necessidades objetivas.","C":"um sistema gerenciador de bd(sgbd), linguagem(ens) de programas, uma base de dados, programas voltados a necessidades de exploração.","D":"uma base de dados, um sistema gerenciador de bd(sgbd), linguagem(ens) de exploração, programas voltados a necessidades objetivas."},"t":"Banco de dados","tp":"SQL, SGBD, modelagem e administração de dados","src":"EAGS_2018_codigo_73_SIN.pdf · p. 11"},{"id":"EAGS2018-C73-INF-068","s":"inf","y":2018,"c":"73","n":68,"a":"D","an":false,"du":false,"l":"","e":"Qual tecnologia permite que uma mesma máquina possa rodar como se fossem vários computadores separados, inclusive podendo rodar sistemas operacionais distintos ao mesmo tempo?","o":{"A":"Pipeline","B":"Overdrive","C":"Overclock","D":"Virtualização"},"t":"Hardware e arquitetura","tp":"Componentes, memória, processamento e sistemas digitais","src":"EAGS_2018_codigo_73_SIN.pdf · p. 12"},{"id":"EAGS2018-C73-INF-069","s":"inf","y":2018,"c":"73","n":69,"a":"B","an":false,"du":false,"l":"","e":"A maioria das linguagens orientadas a objetos (OO) suporta três níveis de acesso. Com base nesses três principais níveis, relacione-os com as suas características, sabendo que, das numerações abaixo, devem ser escolhidas 3 das 5 existentes.\n1 – pacote\n2 – público\n3 – restrito\n4 – protegido\n5 – privado\n(\n) Garante acesso apenas para a instância, ou seja, aquele objeto.\n(\n) Garante acesso a todos os objetos.\n(\n) Garante acesso a instância e a todas as subclasses.","o":{"A":"1 – 2 – 3","B":"5 – 2 – 4","C":"3 – 1 – 2","D":"4 – 1 – 5"},"t":"Programação orientada a objetos","tp":"Classes, herança, encapsulamento e polimorfismo","src":"EAGS_2018_codigo_73_SIN.pdf · p. 12"},{"id":"EAGS2018-C73-INF-070","s":"inf","y":2018,"c":"73","n":70,"a":"B","an":false,"du":false,"l":"","e":"Por meio do comando ________________, em um banco de dados, podem-se incluir campos em uma tabela e alterar o nome de um campo ou até mesmo de uma tabela. Assinale abaixo o comando que possui essas características.","o":{"A":"delete","B":"alter table","C":"drop table","D":"creat table"},"t":"Banco de dados","tp":"SQL, SGBD, modelagem e administração de dados","src":"EAGS_2018_codigo_73_SIN.pdf · p. 12"},{"id":"EAGS2018-C73-INF-071","s":"inf","y":2018,"c":"73","n":71,"a":"A","an":false,"du":false,"l":"","e":"A POO (Programação Orientada a Objetos) é baseada em\n3 pilares: encapsulamento, herança e polimorfismo. Com base nesse fundamento, relacione os pilares abaixo com sua definição.\n1 – Encapsulamento\n2 – Herança\n3 – Polimorfismo\n(\n) Permite basear uma nova classe na definição de uma classe previamente existente.\n(\n) Permite que um único nome expresse muitos comportamentos diferentes.\n(\n) Oculta partes independentes da implementação.","o":{"A":"2 – 3 – 1","B":"2 – 1 – 3","C":"1 – 2 – 3","D":"3 – 1 – 2"},"t":"Programação orientada a objetos","tp":"Classes, herança, encapsulamento e polimorfismo","src":"EAGS_2018_codigo_73_SIN.pdf · p. 12"},{"id":"EAGS2018-C73-INF-072","s":"inf","y":2018,"c":"73","n":72,"a":"D","an":false,"du":false,"l":"","e":"Sobre a programação orientada a objetos, informe se a assertiva é falsa (F) ou verdadeira (V) e assinale a alternativa com a sequência correta.\n(\n) As três características de encapsulamento eficaz são:\nabstração, ocultação da implementação e divisão de responsabilidade.\n(\n) Abstração é o processo mais complexo de um problema.\n) O nível de acesso Público garante o acesso apenas para a\n( instância.\n) O encapsulamento permite que você divida o programa em\n( várias partes menores e independentes.","o":{"A":"F – V – F – V","B":"F – V – V – F","C":"V – F – F – F","D":"V – F – F – V"},"t":"Programação orientada a objetos","tp":"Classes, herança, encapsulamento e polimorfismo","src":"EAGS_2018_codigo_73_SIN.pdf · p. 12"},{"id":"EAGS2018-C73-INF-073","s":"inf","y":2018,"c":"73","n":73,"a":"B","an":false,"du":false,"l":"","e":"Em relação a funções matemáticas e estatísticas no\nLibreOffice Calc 4.2, quais dos tipos abaixo não corresponde a arredondamento de um número?","o":{"A":"=INT","B":"=ABS","C":"=ÍMPAR","D":"=ARRED"},"t":"Aplicativos e ferramentas","tp":"Suítes de escritório, planilhas e apresentações","src":"EAGS_2018_codigo_73_SIN.pdf · p. 12"},{"id":"EAGS2018-C73-INF-074","s":"inf","y":2018,"c":"73","n":74,"a":"A","an":false,"du":false,"l":"","e":"No sistema operacional Linux, qual arquivo do diretório\n/etc tem uma lista dos dispositivos que correspondem aos sistemas de arquivos?","o":{"A":"fstab","B":"fdisk","C":"resolv.conf","D":"mdadm.conf"},"t":"Redes de computadores","tp":"Protocolos, endereçamento e arquitetura de redes","src":"EAGS_2018_codigo_73_SIN.pdf · p. 12"},{"id":"EAGS2018-C73-INF-075","s":"inf","y":2018,"c":"73","n":75,"a":"D","an":false,"du":false,"l":"","e":"Tendo por base constantes e strings em PHP, analise o script abaixo e responda qual a saída do programa.\n<?php\ndefine(“extra”, “super”);\n$palavra=“teste”;\n$frase= ‘Isto é um $palavra ’.extra;\necho $frase;\n?>","o":{"A":"Isto é um teste super","B":"Isto é um palavra extra","C":"Isto é um $palavra extra","D":"Isto é um $palavra super"},"t":"Linguagens de programação","tp":"PHP, Java e sintaxe de linguagens","src":"EAGS_2018_codigo_73_SIN.pdf · p. 12"},{"id":"EAGS2018-C73-INF-076","s":"inf","y":2018,"c":"73","n":76,"a":"C","an":false,"du":false,"l":"","e":"Analise o algoritmo abaixo escrito em português estruturado. Considerando o valor lido para A como 10 e para B como 10, qual a saída de X.\nprograma TESTA_LOGICA var\nA, B, X: inteiro início leia A, B\nse .não. (A>B) então\nX  A+2*B senão\nX  (A-B) +1 fim_se escreva X fim","o":{"A":"1","B":"-1","C":"30","D":"120"},"t":"Algoritmos e lógica","tp":"Fluxogramas, estruturas de controle e pseudocódigo","src":"EAGS_2018_codigo_73_SIN.pdf · p. 13"},{"id":"EAGS2018-C73-INF-077","s":"inf","y":2018,"c":"73","n":77,"a":"D","an":false,"du":false,"l":"","e":"Das características a seguir, qual a alternativa não corresponde a vantagens e/ou objetivos da programação orientada a objetos?","o":{"A":"Reutilizável","B":"Confiável","C":"Oportuno","D":"Mutável"},"t":"Programação orientada a objetos","tp":"Classes, herança, encapsulamento e polimorfismo","src":"EAGS_2018_codigo_73_SIN.pdf · p. 13"},{"id":"EAGS2018-C73-INF-078","s":"inf","y":2018,"c":"73","n":78,"a":"A","an":false,"du":false,"l":"","e":"“O arquivo /etc/passwd representa uma lista de usuários reconhecidos pelo sistema.” Cada linha no arquivo indica um usuário e contém sete campos separados.\nAssinale a alternativa que não representa um campo nesse arquivo.","o":{"A":"Data de expiração da conta","B":"Número de GID padrão","C":"Informações “GECOS”","D":"Shell de login"},"t":"Sistemas operacionais","tp":"Linux, Unix, processos, arquivos e comandos","src":"EAGS_2018_codigo_73_SIN.pdf · p. 13"},{"id":"EAGS2018-C73-INF-079","s":"inf","y":2018,"c":"73","n":79,"a":"D","an":false,"du":false,"l":"","e":"Em qual diretório padrão do Linux encontram-se os diretórios iniciais para usuários?","o":{"A":"/lib","B":"/usr","C":"/bin","D":"/home"},"t":"Sistemas operacionais","tp":"Linux, Unix, processos, arquivos e comandos","src":"EAGS_2018_codigo_73_SIN.pdf · p. 13"},{"id":"EAGS2018-C73-INF-080","s":"inf","y":2018,"c":"73","n":80,"a":"C","an":false,"du":false,"l":"","e":"Tendo por base a programação orientada a objetos (POO), analise as afirmativas abaixo e responda V para verdadeiro e F para falso.\n) Interfaces são métodos usados para inicializar objetos\n( durante sua instanciação. Inicializam um objeto durante sua criação.\n(\n) Uma interface lista os serviços fornecidos por um componente. É o contrato com o mundo exterior, que define exatamente o que uma entidade externa pode fazer com o objeto, informando com detalhes como o componente fará seu trabalho.\n(\n) O encapsulamento permite que se forneça uma implementação mais eficiente ou se corrijam erros, porém não permite que se atualize seu componente.\n(\n) A herança permite à classe que está herdando redefinir qualquer comportamento herdado de que não goste.","o":{"A":"F – V – F – V","B":"V – V – V – F","C":"F – F – F – V","D":"V – F – F – F"},"t":"Programação orientada a objetos","tp":"Classes, herança, encapsulamento e polimorfismo","src":"EAGS_2018_codigo_73_SIN.pdf · p. 13"},{"id":"EAGS2018-C73-INF-081","s":"inf","y":2018,"c":"73","n":81,"a":"A","an":false,"du":false,"l":"","e":"Sobre o sistema operacional Linux, assinale a alternativa que descreve corretamente a função do comando.","o":{"A":"“shutdown -h +15” - desliga a máquina depois de 15 minutos.","B":"“getfacl ” - modifica ou configura uma ACL.","C":"“mkdir” - remove uma árvore de diretórios.","D":"“halt -n” - reinicializa a máquina."},"t":"Sistemas operacionais","tp":"Linux, Unix, processos, arquivos e comandos","src":"EAGS_2018_codigo_73_SIN.pdf · p. 13","vr":1},{"id":"EAGS2018-C73-INF-082","s":"inf","y":2018,"c":"73","n":82,"a":"A","an":false,"du":false,"l":"","e":"Associe corretamente:\n1 – Canal\n(\n) Sinal usado para sincronizar o transmissor e o receptor, de forma\n2 – Clock que possam se comunicar “no\n3 – Transmissão momento certo”.\nParalela\n(\n) Transmissão de vários “bits”.\n4 – Transmissão\n(\n) Meio usado para transmissão de em Série dados.\n(\n) Transmissão de apenas um “bit”.","o":{"A":"2 – 3 – 1 – 4","B":"2 – 3 – 4 – 1","C":"3 – 4 – 1 – 2","D":"1 – 2 – 3 – 4"},"t":"Hardware e arquitetura","tp":"Componentes, memória, processamento e sistemas digitais","src":"EAGS_2018_codigo_73_SIN.pdf · p. 13"},{"id":"EAGS2018-C73-INF-083","s":"inf","y":2018,"c":"73","n":83,"a":"A","an":false,"du":false,"l":"","e":"Sobre o Bacula, marque V, se a afirmativa for verdadeira, ou F, se a afirmativa for falsa. Em seguida, assinale a alternativa com a sequência correta.\n) É uma solução de backup cliente/servidor corporativa que\n( gerencia backup, recuperação e verificação de arquivos em uma rede.\n(\n) Faz backup somente de sistemas UNIX.\n) Permite iniciar o console a partir do diretório de instalação\n( digitando ./baconsole.\n) Pode executar scripts ou comandos antes e depois das tarefas\n( de backup.","o":{"A":"V – F – F – V","B":"V – F – V – F","C":"F – V – V – F","D":"F – V – F – V"},"t":"Sistemas operacionais","tp":"Linux, Unix, processos, arquivos e comandos","src":"EAGS_2018_codigo_73_SIN.pdf · p. 13"},{"id":"EAGS2018-C73-INF-084","s":"inf","y":2018,"c":"73","n":84,"a":"D","an":false,"du":false,"l":"","e":"Na linguagem de programação PHP, utilizando-se o script abaixo, qual será à saída do programa?\n<?php\n$nota=7.5;\n$resultado= ($nota<=6)?($nota-1):($nota+1);\necho $resultado;\n?>","o":{"A":"1","B":"-1","C":"6.5","D":"8.5"},"t":"Linguagens de programação","tp":"PHP, Java e sintaxe de linguagens","src":"EAGS_2018_codigo_73_SIN.pdf · p. 14"},{"id":"EAGS2018-C73-INF-085","s":"inf","y":2018,"c":"73","n":85,"a":"C","an":false,"du":false,"l":"","e":"“Indica a proporção entre o número de linhas e o número de colunas, que é obtido dividindo-se a resolução horizontal (número de colunas) pela resolução vertical (número de linhas). Além disso, é utilizada por aparelhos de TV usando tubos de raios catódicos (CRT).” As informações acima referem-se à","o":{"A":"Resolução","B":"Varredura","C":"Relação de Aspecto","D":"Taxa de Atualização"},"t":"Hardware e arquitetura","tp":"Componentes, memória, processamento e sistemas digitais","src":"EAGS_2018_codigo_73_SIN.pdf · p. 14"},{"id":"EAGS2018-C73-INF-086","s":"inf","y":2018,"c":"73","n":86,"a":"A","an":false,"du":false,"l":"","e":"Levando em consideração o script abaixo, escrito em linguagem de programação PHP, qual será à saída do programa?\n<?php\n$vetor= array(1,2,3,4);\nforeach($vetor as $chave=>$valor){\necho $chave;\nif($valor==3){\nbreak;\n}\n}\n?>","o":{"A":"012","B":"123","C":"0123","D":"1234"},"t":"Algoritmos e lógica","tp":"Fluxogramas, estruturas de controle e pseudocódigo","src":"EAGS_2018_codigo_73_SIN.pdf · p. 14"},{"id":"EAGS2018-C73-INF-087","s":"inf","y":2018,"c":"73","n":87,"a":"B","an":false,"du":false,"l":"","e":"Relacione as colunas e, em seguida, assinale a alternativa correta quanto ao uso dos botões que facilitam o acesso as principais funções do programa Libre Office Writer 4.2.\n1 – Ctrl+O\n(\n) Novo\n2 – Ctrl+H\n(\n) Abrir\n3 – Ctrl+N\n(\n) Tabela\n4 – Ctrl+F12\n(\n) Localizar e substituir","o":{"A":"2 – 1 – 4 – 3","B":"3 – 1 – 4 – 2","C":"3 – 4 – 2 – 1","D":"1 – 2 – 3 – 4"},"t":"Banco de dados","tp":"SQL, SGBD, modelagem e administração de dados","src":"EAGS_2018_codigo_73_SIN.pdf · p. 14"},{"id":"EAGS2018-C73-INF-088","s":"inf","y":2018,"c":"73","n":88,"a":"B","an":false,"du":false,"l":"","e":"No LibreOffice Calc 4.2 temos a referência absoluta, que é utilizada para bloquear a fórmula de uma célula, mesmo que ela seja copiada para outras células. Podemos afirmar que essa referência é representada pelo sinal?","o":{"A":"#","B":"$","C":"?","D":"*"},"t":"Aplicativos e ferramentas","tp":"Suítes de escritório, planilhas e apresentações","src":"EAGS_2018_codigo_73_SIN.pdf · p. 14"},{"id":"EAGS2018-C73-INF-089","s":"inf","y":2018,"c":"73","n":89,"a":"A","an":false,"du":false,"l":"","e":"Quais são os tipos de variáveis existentes no PHP?","o":{"A":"Numéricas, alfanuméricas, arrays e objetos","B":"Aritméticas, de controle, lógicas e vetoriais","C":"Aritméticas, binárias, lógicas e de atribuição","D":"Aritméticas, binárias, condicionais e de repetição"},"t":"Linguagens de programação","tp":"PHP, Java e sintaxe de linguagens","src":"EAGS_2018_codigo_73_SIN.pdf · p. 14"},{"id":"EAGS2018-C73-INF-090","s":"inf","y":2018,"c":"73","n":90,"a":"D","an":false,"du":false,"l":"","e":"Considerando a linguagem PHP, o dado 0x01 está representado em que base numérica?","o":{"A":"Base octal","B":"Base binária","C":"Base decimal","D":"Base hexadecimal"},"t":"Linguagens de programação","tp":"PHP, Java e sintaxe de linguagens","src":"EAGS_2018_codigo_73_SIN.pdf · p. 14"},{"id":"EAGS2018-C73-INF-091","s":"inf","y":2018,"c":"73","n":91,"a":"A","an":false,"du":false,"l":"","e":"Assinale a opção que corresponde às características abaixo.\n“Está diretamente ligado às propriedades cinéticas da matéria e, sempre aparecerá, ainda que seja forçada sua atenuação. Nos casos em que se trata de comunicações de longo alcance, ou quando o emissor é de pouca potência, adquire importância preponderante.”","o":{"A":"Ruídos","B":"Distorção","C":"Técnica de Pulsos","D":"Faixas de Frequências"},"t":"Redes de computadores","tp":"Ruído e interferência em sistemas de comunicação","src":"EAGS_2018_codigo_73_SIN.pdf · p. 14"},{"id":"EAGS2018-C73-INF-092","s":"inf","y":2018,"c":"73","n":92,"a":"D","an":false,"du":false,"l":"","e":"Complete as sentenças corretamente.\nO ciclo de vida de serviço ITIL, baseia-se no conceito central da\nITIL, de\n________________________ e nos conceitos relacionados de ____________ e ____________.\nO ciclo de vida de serviço consiste em  __________ etapas. Cada um dos novos volumes básicos da ITIL descreve uma dessas etapas.","o":{"A":"estratégia do serviço – estratégia de entrega – gerenciamento de serviço – três","B":"desenho de serviço – clientes externos – clientes internos – cinco","C":"melhoria contínua do serviço – serviço – valor – quatro","D":"gerenciamento de serviços – serviços – valor – cinco"},"t":"Engenharia de software","tp":"Modelagem, qualidade, desenvolvimento e documentação","src":"EAGS_2018_codigo_73_SIN.pdf · p. 14"},{"id":"EAGS2018-C73-INF-093","s":"inf","y":2018,"c":"73","n":93,"a":"B","an":false,"du":false,"l":"","e":"Quando um micro do padrão PC é ligado, o BIOS é executado, e ele executa um outro programa, que é armazenado no mesmo chip de memória ROM. Qual o nome desse outro programa?","o":{"A":"Pilha","B":"POST","C":"Memória Cache","D":"GPRs (General Purpose Registers)"},"t":"Hardware e arquitetura","tp":"Componentes, memória, processamento e sistemas digitais","src":"EAGS_2018_codigo_73_SIN.pdf · p. 15"},{"id":"EAGS2018-C73-INF-094","s":"inf","y":2018,"c":"73","n":94,"a":"D","an":false,"du":false,"l":"","e":"Selecione a alternativa que completa corretamente a afirmativa.\nO ____________ é um comando que revela a sequência de gateways que um pacote IP percorre para alcançar seu destino.","o":{"A":"arp","B":"netstat","C":"tcpdump","D":"traceroute"},"t":"Redes de computadores","tp":"Protocolos, endereçamento e arquitetura de redes","src":"EAGS_2018_codigo_73_SIN.pdf · p. 15"},{"id":"EAGS2018-C73-INF-095","s":"inf","y":2018,"c":"73","n":95,"a":"B","an":false,"du":false,"l":"","e":"Leia a característica enunciadas abaixo e escolha a opção que detém essa característica.\n“É responsável pelo controle do ciclo de vida de todos os problemas. O objetivo primário é evitar problemas e incidentes, eliminar os incidentes que se repetem e minimizar o impacto de incidentes que não podem ser evitados”.","o":{"A":"Gerenciamento de Demanda","B":"Gerenciamento de Problemas","C":"Gerenciamento de Conhecimento","D":"Gerenciamento de Nível de Serviço"},"t":"Engenharia de software","tp":"Modelagem, qualidade, desenvolvimento e documentação","src":"EAGS_2018_codigo_73_SIN.pdf · p. 15"},{"id":"EAGS2018-C73-INF-096","s":"inf","y":2018,"c":"73","n":96,"a":"B","an":false,"du":false,"l":"","e":"O nome de uma variável é utilizado para sua identificação e posterior uso dentro de um programa. Julgue os itens abaixo, de acordo com as regras de utilização de variáveis, colocando V para verdadeiro e F para Falso e, em seguida, marque a sequência correta.\n(\n) Nomes de uma variável poderão ser atribuídos com no mínimo dois ou mais caracteres.\n(\n) O primeiro caractere do nome de uma variável não poderá\nser, em hipótese alguma, um número; sempre deverá ser\numa letra.\n(\n) O nome da variável poderá possuir espaços em branco, desde que utilizados somente uma vez.\n(\n) Não poderá ser nome de uma variável uma palavra reservada a uma instrução de programa.\n(\n) Não poderão ser utilizados outros caracteres a não ser letras, números e espaços em branco.","o":{"A":"V – F – V – V – F","B":"F – V – F – V – F","C":"V – F – F – F – V","D":"F – V – V – F – V"},"t":"Algoritmos e lógica","tp":"Fluxogramas, estruturas de controle e pseudocódigo","src":"EAGS_2018_codigo_73_SIN.pdf · p. 15"},{"id":"EAGS2018-C73-INF-097","s":"inf","y":2018,"c":"73","n":97,"a":"","an":true,"du":false,"l":"","e":"Selecione a alternativa que completa o enunciado corretamente.\nA N U L A D A\nA interface de comunicação ________ é sucessora da interface\n___________, é voltada para servidores e é mais usada atualmente para este tipo de aplicação. Está disponível em duas velocidades, ________ e __________.","o":{"A":"ESDI – PATA – SATA 150 – SATA 600","B":"SATA – SAS – SATA 300 – SATA 600","C":"SCIS – SAS – SATA 150 – SAS 300","D":"SAS – SCIS – SAS 300 – SAS 600"},"t":"Hardware e arquitetura","tp":"Componentes, memória, processamento e sistemas digitais","src":"EAGS_2018_codigo_73_SIN.pdf · p. 15"},{"id":"EAGS2018-C73-INF-098","s":"inf","y":2018,"c":"73","n":98,"a":"C","an":false,"du":false,"l":"","e":"Após ler as características enunciadas abaixo, escolha a opção que detenha essas características.\n- “Qualquer componente ou outro ativo de serviço que precise ser gerenciado de forma que entregue um serviço de TI”.\n- “Está sob controle do gerenciamento de mudança”.","o":{"A":"Sistema de Gerenciamento de Configuração (SGC)","B":"Comunicação da Operação de Serviço","C":"Item de Configuração (IC)","D":"Registro de MCS"},"t":"Governança e serviços de TI","tp":"ITIL: item de configuração e gerenciamento de mudanças","src":"EAGS_2018_codigo_73_SIN.pdf · p. 15","vr":1},{"id":"EAGS2018-C73-INF-099","s":"inf","y":2018,"c":"73","n":99,"a":"B","an":false,"du":false,"l":"","e":"Tendo por base o algoritmo abaixo escrito em português estruturado, caso o SALÁRIO lido seja 1000, qual será a saída escrita do NOVO_SALÁRIO ?\nprograma REAJUSTA_SALÁRIO var\nNOVO_SALÁRIO: real\nSALÁRIO: real início leia SALÁRIO\nse (SALÁRIO < 500) então\nNOVO_SALÁRIO  SALÁRIO * 1.10 senão\nse (SALÁRIO < 1000) então\nNOVO_SALÁRIO  SALÁRIO * 1.05 senão\nNOVO_SALÁRIO  SALÁRIO * 1.02 fim_se fim_se escreva NOVO_SALÁRIO fim","o":{"A":"1000","B":"1020","C":"1050","D":"1100"},"t":"Algoritmos e lógica","tp":"Fluxogramas, estruturas de controle e pseudocódigo","src":"EAGS_2018_codigo_73_SIN.pdf · p. 15"},{"id":"EAGS2018-C73-INF-100","s":"inf","y":2018,"c":"73","n":100,"a":"A","an":false,"du":false,"l":"","e":"Qual estrutura de controle efetua a execução de um conjunto de instruções pelo menos uma vez antes de verificar a validade da condição estabelecida?","o":{"A":"repita ... até_que","B":"caso ... enquanto ... fim_caso","C":"enquanto ... faça ... fim_enquanto","D":"para ... de ... até ... passo ... faça ... fim_ para"},"t":"Algoritmos e lógica","tp":"Fluxogramas, estruturas de controle e pseudocódigo","src":"EAGS_2018_codigo_73_SIN.pdf · p. 15"},{"id":"EAGS2019-C04-PT-001","s":"por","y":2019,"c":"04","n":1,"a":"C","an":false,"du":false,"l":"","e":"De acordo com o texto, parte do equívoco que existe entre poesia e povo se dá","o":{"A":"porque o povo, que carece de facilidade para ler poesias, compreende a poesia como evasão, fuga da realidade.","B":"porque a poesia é um instrumento de aceitação da realidade, podendo ser considerada, também, como correção do que essa realidade oferece de monstruoso e de errado.","C":"por conta da crença, de alguns autores, de que poesia é evasão, possibilitando assim a criação de linguagem cifrada, que o povo não entende.","D":"por conta de serem os poetas pessoas voltadas ao povo em suas maneiras de escrever e de pensar, conceito que populariza a poesia durante gerações."},"t":"Ortografia e acentuação","tp":"Ortografia, grafia e hífen","src":"EAGS_2019_codigo_04_SAD.pdf · p. 3","esp":"Administração","sp":2},{"id":"EAGS2019-C04-PT-002","s":"por","y":2019,"c":"04","n":2,"a":"A","an":false,"du":false,"l":"","e":"Leia:\n“A poesia não se “dá”, é hermética ou inumana.”\nDe acordo com o fragmento do texto, qual é o significado da palavra  “inumana”?","o":{"A":"Inatingível para os homens, superior à condição humana.","B":"Compreensível para os homens, inferior à capacidade humana.","C":"Acessível a todos, equilibrada à linguagem humana.","D":"Incompreensível para o povo, elucidativa a todos."},"t":"Semântica e estilística","tp":"Sentido, relações semânticas e figuras de linguagem","src":"EAGS_2019_codigo_04_SAD.pdf · p. 3","esp":"Administração","sp":2},{"id":"EAGS2019-C04-PT-003","s":"por","y":2019,"c":"04","n":3,"a":"D","an":false,"du":false,"l":"","e":"Assinale a alternativa que apresenta, de acordo com o autor, indicações que permitirão ao poeta deixar de ser “um bicho esquisito”.","o":{"A":"Linguagem hermética; participação na vida; interesse pelos\noutros homens.","B":"Identificação com os ideais do tempo; linguagem cifrada;\naceitação de que a poesia seja “participação”.","C":"Desconfiança da própria e excessiva riqueza interior;\nlinguagem inumana, curiosidade e interesse pelos outros homens.","D":"Percepção social; atenção aos fatos de seu tempo; e\ndesconfiança de suas próprias riquezas interiores."},"t":"Interpretação de texto","tp":"Compreensão da tese e dos argumentos do autor","src":"EAGS_2019_codigo_04_SAD.pdf · p. 3","esp":"Administração","sp":2},{"id":"EAGS2019-C04-PT-004","s":"por","y":2019,"c":"04","n":4,"a":"B","an":false,"du":false,"l":"","e":"Coloque (V) para verdadeiro e (F) para falso, em seguida assinale a alternativa com a sequência correta. No texto Poesia do\nTempo, Carlos Drummond de Andrade se opõe\n(\n) à facilidade de leitura do povo.\n(\n) à clareza da linguagem poética.\n(\n) à expressão de alguns poetas de linguagem cifrada.\n) ao hermetismo provocado pelo distanciamento entre poesia e\n( povo.","o":{"A":"V – V – F – V","B":"F – F – V – V","C":"F – V – F – F","D":"V – F – V – V"},"t":"Interpretação de texto","tp":"Compreensão, inferência e finalidade textual","src":"EAGS_2019_codigo_04_SAD.pdf · p. 3","esp":"Administração","sp":2},{"id":"EAGS2019-C04-PT-005","s":"por","y":2019,"c":"04","n":5,"a":"A","an":false,"du":false,"l":"","e":"Leia:\nA menina ficou só, ao pé de amora carregada. Tão só que escutou as batidas de seu coração. Somente a solidão a acompanhava.\nAs palavras sublinhadas são classificadas, respectivamente, em:","o":{"A":"adjetivo – adjetivo","B":"advérbio – adjetivo","C":"adjetivo – advérbio","D":"advérbio – advérbio"},"t":"Classes de palavras","tp":"Substantivo, adjetivo, advérbio e demais classes","src":"EAGS_2019_codigo_04_SAD.pdf · p. 3","esp":"Administração"},{"id":"EAGS2019-C04-PT-006","s":"por","y":2019,"c":"04","n":6,"a":"C","an":false,"du":false,"l":"","e":"Assinale a alternativa que apresenta a colocação pronominal de acordo com a norma padrão.","o":{"A":"Nunca encontraremo-nos novamente.","B":"Nos falaram que tudo era uma questão de escolha.","C":"Parece-nos que o mais acertado era retomar os estudos.","D":"Gostaria de entender por que fizeram-nos vir neste local."},"t":"Pronomes","tp":"Emprego e classificação dos pronomes","src":"EAGS_2019_codigo_04_SAD.pdf · p. 3","esp":"Administração"},{"id":"EAGS2019-C04-PT-007","s":"por","y":2019,"c":"04","n":7,"a":"A","an":false,"du":false,"l":"","e":"Complete as  lacunas das frases abaixo com a, à, as, às, de acordo com a justificativa do emprego ou ausência do acento grave. Em seguida, assinale a alternativa com a sequência correta.\n1 – Caminhava pela avenida de ponta ____ ponta. (locução formada por palavra repetida)\n2 – Após longa viagem, a filha voltou ____ casa paterna. (palavra casa acompanhada de adjetivo)\n3 – Saiu de sua residência ____ pressas. (locução adverbial feminina)\n4 – Era um senhor distinto, possuía calçados ____ Luís XV.\n(elipse diante de palavra masculina)","o":{"A":"a – à – às – à","B":"à – à – as – a","C":"à – a – às – à","D":"a – a – as – a"},"t":"Crase","tp":"Emprego do acento indicativo de crase","src":"EAGS_2019_codigo_04_SAD.pdf · p. 3","esp":"Administração"},{"id":"EAGS2019-C04-PT-008","s":"por","y":2019,"c":"04","n":8,"a":"D","an":false,"du":false,"l":"","e":"Das alternativas abaixo, apenas uma preenche, de modo correto, as lacunas das seguintes frases. Assinale-a.\n1 – Não se ponha entre ____ e ela.\n2 – Quando saíres, avisa-nos que iremos ____.\n3 – Já ____ disse várias vezes que você deve insistir.\n4 – Você só é capaz de pensar em ____ . Você só se preocupa ____ mesmo?","o":{"A":"eu – contigo – te – ti – consigo","B":"eu – consigo – te – si – contigo","C":"mim – consigo – lhe – ti – contigo","D":"mim – contigo – lhe – si – consigo"},"t":"Pronomes","tp":"Pronomes pessoais, oblíquos e de tratamento","src":"EAGS_2019_codigo_04_SAD.pdf · p. 3","esp":"Administração"},{"id":"EAGS2019-C04-PT-009","s":"por","y":2019,"c":"04","n":9,"a":"C","an":false,"du":false,"l":"","e":"Leia atentamente as afirmativas abaixo.\nI – No vocábulo “alistar”, observa-se a derivação parassintética.\nII – Os vocábulos “riacho”, “quietude” e “amanhecer” são formados por sufixos nominais.\nIII – “Automóvel” é formado por hibridismo.\nEstá(ão) correta(s) apenas a(s) afirmativa(s)","o":{"A":"I","B":"II","C":"I e III","D":"II e III"},"t":"Formação de palavras","tp":"Estrutura e formação de palavras","src":"EAGS_2019_codigo_04_SAD.pdf · p. 4","esp":"Administração"},{"id":"EAGS2019-C04-PT-010","s":"por","y":2019,"c":"04","n":10,"a":"B","an":false,"du":false,"l":"","e":"A palavra “porque” deveria ter sido grafada separadamente na alternativa:","o":{"A":"Dê-me ao menos um porquê para seu lamento.","B":"Estas são as reivindicações porque estamos lutando.","C":"Não se preocupe com o futuro, porque você tem energia para conquistar seus ideais.","D":"Sei que há alguma situação diferente, porque ninguém apareceu até o momento."},"t":"Ortografia e acentuação","tp":"Ortografia, grafia e hífen","src":"EAGS_2019_codigo_04_SAD.pdf · p. 4","esp":"Administração"},{"id":"EAGS2019-C04-PT-011","s":"por","y":2019,"c":"04","n":11,"a":"C","an":false,"du":false,"l":"","e":"Com relação aos tipos de predicado, assinale a alternativa que apresenta a sequência correta quanto à classificação dos predicados das orações abaixo.\n1 –  Os alunos foram informados da situação.\n2 –  Os candidatos saíram da sala confiantes.\n3 –  O professor parece despreocupado.","o":{"A":"Predicado Nominal – Predicado Verbo-Nominal – Predicado\nVerbal","B":"Predicado Verbal – Predicado Nominal – Predicado Verbo-\nNominal","C":"Predicado Verbal – Predicado Verbo-Nominal – Predicado\nNominal","D":"Predicado Verbo-Nominal – Predicado Verbal – Predicado\nNominal"},"t":"Sintaxe","tp":"Termos da oração: sujeito e predicado","src":"EAGS_2019_codigo_04_SAD.pdf · p. 4","esp":"Administração"},{"id":"EAGS2019-C04-PT-012","s":"por","y":2019,"c":"04","n":12,"a":"D","an":false,"du":false,"l":"","e":"Marque (V) para verdadeiro e (F) para falso, em seguida assinale a alternativa que apresenta a sequência correta em relação à explicação do que ocorre sintaticamente nas frases em destaque.\n(\n) “Os sujeitos são indeterminados quando não é possível identificá-los, com clareza, no período.” – pode-se afirmar que há presença de sujeito simples.\n(\n) “Sintaxe é a arte de compreensão de um texto em relação ao funcionamento das palavras na oração.” – pode-se afirmar que há presença de predicativo do sujeito.\n(\n) “Funções sintáticas são a base para o aprendizado de gramática escolar.” – pode-se afirmar que há presença de período composto por coordenação, uma vez que há mais de uma função sintática explícita no contexto.\n(\n) “O jogo de palavras existente numa relação sintática provoca o leitor a desvendar os mistérios do texto.”\n– pode-se afirmar que o sujeito é composto, tendo em vista a presença de plural explícito em sua composição.","o":{"A":"F – V – F – F","B":"V – F – F – V","C":"F – V – V – F","D":"V – V – F – F"},"t":"Sintaxe","tp":"Termos da oração: sujeito e predicado","src":"EAGS_2019_codigo_04_SAD.pdf · p. 4","esp":"Administração"},{"id":"EAGS2019-C04-PT-013","s":"por","y":2019,"c":"04","n":13,"a":"A","an":false,"du":false,"l":"","e":"Assinale a alternativa que apresenta a classificação incorreta da oração subordinada destacada.","o":{"A":"Suponho ser ele o homem de palavras sinceras. (Oração\nSubordinada Adverbial)","B":"Só depois disso percebi quão sinceras eram as palavras dele. (Oração Subordinada Substantiva)","C":"Só depois disso percebi a sinceridade que as palavras dele continham. (Oração Subordinada Adjetiva)","D":"Só depois que caí em mim, percebi a sinceridade das palavras dele. (Oração Subordinada Adverbial)"},"t":"Sintaxe","tp":"Período composto e orações","src":"EAGS_2019_codigo_04_SAD.pdf · p. 4","esp":"Administração"},{"id":"EAGS2019-C04-PT-014","s":"por","y":2019,"c":"04","n":14,"a":"C","an":false,"du":false,"l":"","e":"Classifique as orações reduzidas de acordo com o indicado.\nEm seguida, assinale a alternativa com a sequência correta.\n1 –  Oração Reduzida de Infinitivo\n2 –  Oração Reduzida de Gerúndio\n3 –  Oração Reduzida de Particípio\n(\n) Esta é a trágica notícia divulgada pela imprensa brasileira.\n(\n) Tendo perdido o dinheiro, o candidato viu-se obrigado à desistência.\n(\n) Custou-lhe muito concluir o curso técnico.","o":{"A":"1 – 2 – 3","B":"2 – 3 – 1","C":"3 – 2 – 1","D":"2 – 1 – 3"},"t":"Sintaxe","tp":"Período composto e orações","src":"EAGS_2019_codigo_04_SAD.pdf · p. 4","esp":"Administração"},{"id":"EAGS2019-C04-PT-015","s":"por","y":2019,"c":"04","n":15,"a":"A","an":false,"du":false,"l":"","e":"Leia:\n“Minha Vida, meu juízo, minha decência”\nAs regras que justificam, respectivamente, os acentos das palavras acima destacadas são as mesmas que justificam o acento em:","o":{"A":"país – ingênuo","B":"júri – cerimônia","C":"úteis – esplêndido","D":"cafeína – bônus"},"t":"Ortografia e acentuação","tp":"Acentuação gráfica e encontros vocálicos","src":"EAGS_2019_codigo_04_SAD.pdf · p. 4","esp":"Administração"},{"id":"EAGS2019-C04-PT-016","s":"por","y":2019,"c":"04","n":16,"a":"C","an":false,"du":false,"l":"","e":"Assinale a alternativa que não apresenta a correta classificação da oração subordinada.","o":{"A":"Peço que desistas.\n(Oração Subordinada Substantiva)","B":"O coração batia forte porque tinha medo.\n(Oração Subordinada Adverbial)","C":"Era esta a verdade que ninguém contestou.\n(Oração Subordinada Adverbial)","D":"Pessoa que mente não merece reconhecimento.\n(Oração Subordinada Adjetiva)"},"t":"Sintaxe","tp":"Período composto e orações","src":"EAGS_2019_codigo_04_SAD.pdf · p. 4","esp":"Administração"},{"id":"EAGS2019-C04-PT-017","s":"por","y":2019,"c":"04","n":17,"a":"D","an":false,"du":false,"l":"","e":"Com relação às regras de crase, marque a alternativa que completa, correta e respectivamente, as lacunas.\nDedico-me ____ sua lei, meu Deus! Cumpro suas regras.\nApresento-me ____ vós, sensível ____ minha fé.","o":{"A":"à – à – à","B":"a – à – a","C":"a – à – à","D":"a – a – a"},"t":"Crase","tp":"Emprego do acento indicativo de crase","src":"EAGS_2019_codigo_04_SAD.pdf · p. 4","esp":"Administração"},{"id":"EA
