040","s":"por","y":2023,"c":"36","n":40,"a":"D","an":false,"du":false,"l":"","e":"Leia:\nTu és o Poeta, o grande Assinalado / que povoas o mundo despovoado de belezas eternas, pouco a pouco. (Cruz e Sousa)\nO termo destacado, nos versos acima, exerce a função sintática de","o":{"A":"aposto.","B":"objeto indireto.","C":"adjunto adnominal.","D":"complemento nominal.\nAS QUESTÕES DE 41 A 100 REFEREM-SE\nÀ INFORMÁTICA"},"t":"Sintaxe","tp":"Termos da oração: complementos e adjuntos","src":"prova_eags 2023_todos_cod_.pdf · p. 244","vr":1},{"id":"EAGS2023-C36-INF-087","s":"inf","y":2023,"c":"36","n":87,"a":"B","an":false,"du":false,"l":"","e":"Servem para armazenar dados, os quais serão guardados na memória do computador durante a execução do programa. Esse conceito refere-se a","o":{"A":"funções","B":"variáveis","C":"expressões","D":"estruturas"},"t":"Linguagens de programação","tp":"PHP, Java e sintaxe de linguagens","src":"prova_eags 2023_todos_cod_.pdf · p. 252"},{"id":"EAGS2023-C36-INF-100","s":"inf","y":2023,"c":"36","n":100,"a":"B","an":false,"du":false,"l":"","e":"Thiago estava usando seu computador com vários programas em execução e percebeu uma pequena lentidão.\nSe o sistema de memória virtual de seu computador estivesse habilitado, a memória RAM seria dividida e o seu disco rígido criaria um arquivo chamado arquivo de trocas (swap file), o qual seria dividido em blocos de tamanhos iguais ao da memória RAM.\nEssa situação não é percebida por Thiago, mas é uma forma de o processador ter mais memória RAM do que realmente existe instalado.\nA esse sistema que permite o uso de “memória virtual” dá-se o nome de","o":{"A":"Block.","B":"Paginação.","C":"Capitulação.","D":"Virtualização.\nRascunho\nRascunho"},"t":"Sistemas operacionais","tp":"Linux, Unix, processos, arquivos e comandos","src":"prova_eags 2023_todos_cod_.pdf · p. 254"},{"id":"EAGS2023-C46-PT-040","s":"por","y":2023,"c":"46","n":40,"a":"C","an":false,"du":false,"l":"","e":"Assinale a frase que contém predicativo do objeto.","o":{"A":"Você é muito esperto para isso!","B":"Triste e sem vida prosseguia o rapaz.","C":"Consideramos equivocada sua decisão.","D":"Parece impossível uma beleza tão radiante!\nRascunho\nAS QUESTÕES DE 41 A 100 REFEREM-SE\nÀ INFORMÁTICA"},"t":"Sintaxe","tp":"Termos da oração: sujeito e predicado","src":"prova_eags 2023_todos_cod_.pdf · p. 264"},{"id":"EAGS2023-C46-INF-100","s":"inf","y":2023,"c":"46","n":100,"a":"A","an":false,"du":false,"l":"","e":"Relacione as colunas de acordo com as portas e os respectivos protocolos da camada de aplicação. Em seguida, assinale a alternativa com a sequência correta.\n1 – SMTP\n( ) 80\n2 – HTTP\n( ) 25\n3 – IMAP\n( ) 22\n4 – SSH\n( ) 143","o":{"A":"2 - 1 - 4 - 3","B":"1 - 2 - 3 - 4","C":"2 - 3 - 4 - 1","D":"1 - 2 - 4 - 3\nRascunho\nRascunho"},"t":"Redes de computadores","tp":"Protocolos, endereçamento e arquitetura de redes","src":"prova_eags 2023_todos_cod_.pdf · p. 273"},{"id":"EAGS2024-C41-PT-001","s":"por","y":2024,"c":"41","n":1,"a":"D","an":false,"du":false,"l":"","e":"Quanto às ideias presentes no primeiro parágrafo, pode- se depreender que","o":{"A":"a glória de um pavão tem relação somente com o fenômeno que acontece no arco-íris.","B":"as cores esplendorosas do pavão é algo inquestionável devido à beleza que ele proporciona.","C":"a relação estabelecida entre o pavão e o arco-íris tem como objetivo explicar que não existe o fenômeno da fragmentação da luz.","D":"o luxo imperial do pavão, na verdade, não existe, pois a ocorrência de cores de sua pena é similar ao fenômeno que acontece em um prisma."},"t":"Interpretação de texto","tp":"Compreensão, inferência e finalidade textual","src":"prova_eags_2024_cod_41_10 05 2023 08 19 06.pdf · p. 3","sp":7},{"id":"EAGS2024-C41-PT-002","s":"por","y":2024,"c":"41","n":2,"a":"A","an":false,"du":false,"l":"","e":"Avalie as informações abaixo acerca do texto.\nI- O texto tem como objetivo desconstruir o conceito já estabelecido sobre a pigmentação das penas do pavão.\nII- As metáforas construídas para o pavão encaminham o texto para as conclusões pessoais do autor sobre o sentimento amoroso.\nIII- O emprego da linguagem figurada, no primeiro parágrafo, objetiva reforçar a necessidade de se exaltar a simplicidade e a criatividade do grande artista.\nIV- O uso das expressões “máximo de matizes” e “mínimas bolhas” coloca em evidência o contraste entre a pequenez de quem ama e a grandiosidade da pessoa amada.\nEstá correto o que se afirma em","o":{"A":"II somente.","B":"IV somente.","C":"I, II e III.","D":"I, III e IV."},"t":"Interpretação de texto","tp":"Compreensão, inferência e finalidade textual","src":"prova_eags_2024_cod_41_10 05 2023 08 19 06.pdf · p. 3","vr":1,"sp":7},{"id":"EAGS2024-C41-PT-003","s":"por","y":2024,"c":"41","n":3,"a":"B","an":false,"du":false,"l":"","e":"Leia:\n“Eu considerei que este é o luxo do grande artista, atingir o máximo de matizes com um número mínimo de elementos”.\nSobre esse trecho, pode-se afirmar que","o":{"A":"o exímio artista carece de muitos e variados elementos para produzir uma arte luxuosa.","B":"o auge da combinação de cores alcançado pelo grande artista está na utilização que ele faz de um ínfimo de elementos.","C":"a maestria do grande artista está na sua capacidade de gerar cores perfeitas a partir de uma variação de elementos simples.","D":"para o autor, o luxo do grande artista se mostra somente na capacidade deste de atingir o auge da combinação de cores."},"t":"Interpretação de texto","tp":"Compreensão, inferência e finalidade textual","src":"prova_eags_2024_cod_41_10 05 2023 08 19 06.pdf · p. 3","sp":7},{"id":"EAGS2024-C41-PT-004","s":"por","y":2024,"c":"41","n":4,"a":"D","an":false,"du":false,"l":"","e":"Assinale a alternativa que contém os respectivos sinônimos para as formas verbais destacadas no trecho abaixo, considerando o texto.\n“... de tudo que ele suscita e esplende e estremece e delira em mim existem apenas meus olhos recebendo a luz do teu olhar.”","o":{"A":"estimula - cintila - treme - exala","B":"susta - expele - vibra - enlouquece","C":"instiga - brilha - esmorece - definha","D":"desperta - resplandece - abala - alucina"},"t":"Interpretação de texto","tp":"Compreensão, inferência e finalidade textual","src":"prova_eags_2024_cod_41_10 05 2023 08 19 06.pdf · p. 3","vr":1,"sp":7},{"id":"EAGS2024-C41-PT-005","s":"por","y":2024,"c":"41","n":5,"a":"B","an":false,"du":false,"l":"","e":"Leia:\nEnquanto a primavera mostrava todo o seu esplendor, as andorinhas sentiam o perigo que rondava seus irmãos.\nA oração subordinada adverbial presente no texto acima classifica-se como","o":{"A":"causal.","B":"temporal.","C":"concessiva.","D":"consecutiva."},"t":"Interpretação de texto","tp":"Compreensão, inferência e finalidade textual","src":"prova_eags_2024_cod_41_10 05 2023 08 19 06.pdf · p. 3","vr":1},{"id":"EAGS2024-C41-PT-006","s":"por","y":2024,"c":"41","n":6,"a":"B","an":false,"du":false,"l":"","e":"Assinale a alternativa com a sequência correta quanto ao que se diz sobre os adjetivos destacados.\nI- Meu primo assistiu ao jogo do time bogotano.\nII- O trabalho excessivo pode causar problemas cardíacos.\nIII- Sob os cabelos encaracolados daquela mulher, reluziam os brincos dourados.\nIV- As situações socioeconômicas atraem os candidatos em época de eleição.","o":{"A":"pátrio- simples - derivado - simples","B":"pátrio - derivado - derivado - composto","C":"derivado - simples - composto - derivado","D":"derivado - derivado - composto - composto"},"t":"Sintaxe","tp":"Revisão manual da classificação","src":"prova_eags_2024_cod_41_10 05 2023 08 19 06.pdf · p. 3"},{"id":"EAGS2024-C41-PT-007","s":"por","y":2024,"c":"41","n":7,"a":"D","an":false,"du":false,"l":"","e":"Assinale a alternativa em que não há vocativo.","o":{"A":"“Quando você for embora,\nMoça branca como a neve, me leve.” (F. Gullar)","B":"“Quando a teus pés um homem terno e curvo\nJurar amor, chorar pranto de sangue,\nNão creias não, mulher: ele te engana!” (M. A de Almeida)","C":"“Come chocolates, pequena,\nCome chocolates!\nOlha que não há mais metafísica no mundo senão chocolates.” (F. Pessoa)","D":"“Olha que coisa mais linda\nMais cheia de graça\nÉ ela, a menina\nQue vem e que passa...” (V. Moraes)"},"t":"Sintaxe","tp":"Termos da oração: complementos e adjuntos","src":"prova_eags_2024_cod_41_10 05 2023 08 19 06.pdf · p. 4"},{"id":"EAGS2024-C41-PT-008","s":"por","y":2024,"c":"41","n":8,"a":"C","an":false,"du":false,"l":"","e":"Assinale a alternativa que contém um predicativo do sujeito.","o":{"A":"Acho você elegante com esse vestido.","B":"Os estudantes acharam interessante a apresentação musical.","C":"Os professores retornaram animados das férias para o início das aulas.","D":"As alegres andorinhas fizeram ninhos primorosos na copa daquela árvore."},"t":"Sintaxe","tp":"Termos da oração: sujeito e predicado","src":"prova_eags_2024_cod_41_10 05 2023 08 19 06.pdf · p. 4"},{"id":"EAGS2024-C41-PT-009","s":"por","y":2024,"c":"41","n":9,"a":"D","an":false,"du":false,"l":"","e":"Assinale a alternativa em que há erro no emprego dos pronomes.","o":{"A":"Para mim, fazer amizades é essencial.","B":"Um diálogo entre mim e você é muito importante.","C":"O meu desejo é este: comprar uma casa confortável.","D":"Por favor, passe esta caneta que está aí perto de você."},"t":"Sintaxe","tp":"Revisão manual da classificação","src":"prova_eags_2024_cod_41_10 05 2023 08 19 06.pdf · p. 4"},{"id":"EAGS2024-C41-PT-010","s":"por","y":2024,"c":"41","n":10,"a":"B","an":false,"du":false,"l":"","e":"Avalie os verbos destacados nas frases abaixo.\nI- Não cabe o cinza nas tardes de outono.\nII- A pandemia foi a culpada por minha empresa falir.\nIII- Temos um objetivo: abolir do nosso dicionário amoroso a palavra briga.\nIV- Cuidado para não moer sua dignidade em nome do poder.\nClassificam-se como defectivos os verbos destacados em","o":{"A":"I e IV.","B":"II e III.","C":"I, III e IV.","D":"II, III e IV."},"t":"Sintaxe","tp":"Revisão manual da classificação","src":"prova_eags_2024_cod_41_10 05 2023 08 19 06.pdf · p. 4","vr":1},{"id":"EAGS2024-C41-PT-011","s":"por","y":2024,"c":"41","n":11,"a":"B","an":false,"du":false,"l":"","e":"Leia:\nVoltem logo para casa hoje, meninas, pois meus pais exigem que estejam presentes à cerimônia de formatura do meu irmão à noite, na faculdade. Vocês não podem faltar, ou eles ficarão aborrecidos.\nOs verbos destacados encontram-se conjugados, respectivamente, no","o":{"A":"presente do subjuntivo, imperativo afirmativo, presente do subjuntivo, presente do indicativo.","B":"imperativo afirmativo, presente do indicativo, presente do subjuntivo, presente do indicativo.","C":"presente do subjuntivo, imperativo afirmativo, presente do indicativo, imperativo afirmativo.","D":"imperativo afirmativo, presente do indicativo, presente do indicativo, imperativo afirmativo."},"t":"Sintaxe","tp":"Revisão manual da classificação","src":"prova_eags_2024_cod_41_10 05 2023 08 19 06.pdf · p. 4"},{"id":"EAGS2024-C41-PT-012","s":"por","y":2024,"c":"41","n":12,"a":"B","an":false,"du":false,"l":"","e":"Considerando a norma culta da língua, assinale a alternativa correta quanto à regência nominal dos termos destacados.","o":{"A":"As alunas por que tenho simpatia já estão aptas com o trabalho.","B":"As informações às quais tive acesso são relativas ao novo reitor.","C":"Estou convencido de que as alunas premiadas terão notas coerentes para com o seu desempenho.","D":"Os dois estudantes demonstravam desprezo às futilidades e ficavam alheios para os comentários maldosos."},"t":"Regência","tp":"Regência verbal e nominal","src":"prova_eags_2024_cod_41_10 05 2023 08 19 06.pdf · p. 4"},{"id":"EAGS2024-C41-PT-013","s":"por","y":2024,"c":"41","n":13,"a":"A","an":false,"du":false,"l":"","e":"Assinale a alternativa que contém um complemento nominal.","o":{"A":"Tenho confiança em você.","B":"A sua ausência atrapalhou a todos.","C":"Todas as pessoas aqui acreditam em sua liderança.","D":"A avaliação não foi validada por nenhuma professora."},"t":"Sintaxe","tp":"Termos da oração: complementos e adjuntos","src":"prova_eags_2024_cod_41_10 05 2023 08 19 06.pdf · p. 4"},{"id":"EAGS2024-C41-PT-014","s":"por","y":2024,"c":"41","n":14,"a":"A","an":false,"du":false,"l":"","e":"Assinale a alternativa que completa, respectivamente, as lacunas do texto abaixo, considerando a colocação pronominal, conforme a norma culta da língua.\n_________ a intromissão, criança! Eu não _________ a seguir pelo caminho que __________. É que __________ que ele jamais __________ à casa da vovó, e sim diretamente à toca do Lobo Mau.","o":{"A":"Desculpe-me - a aconselho - lhe indicaram - lhe omitiram - a levará","B":"Me desculpe - a aconselho - lhe indicaram - omitiram-lhe - a levará","C":"Me desculpe - aconselho-a - indicaram-lhe - omitiram-lhe - levá-la-á","D":"Desculpe-me - aconselho-a - indicaram-lhe - lhe omitiram - levá-la-á"},"t":"Interpretação de texto","tp":"Compreensão, inferência e finalidade textual","src":"prova_eags_2024_cod_41_10 05 2023 08 19 06.pdf · p. 4","vr":1},{"id":"EAGS2024-C41-PT-015","s":"por","y":2024,"c":"41","n":15,"a":"B","an":false,"du":false,"l":"","e":"Assinale a alternativa que apresenta oração sem sujeito.","o":{"A":"Já haviam feito o trabalho de casa.","B":"Naquela tarde, fazia um calor intenso.","C":"Ninguém trouxe o material para a aula de hoje.","D":"De qualquer modo, foi lamentável a morte do animal."},"t":"Sintaxe","tp":"Período composto e orações","src":"prova_eags_2024_cod_41_10 05 2023 08 19 06.pdf · p. 4"},{"id":"EAGS2024-C41-PT-016","s":"por","y":2024,"c":"41","n":16,"a":"D","an":false,"du":false,"l":"","e":"Leia:\nOs policiais agiram com rigor, como determina o regulamento.\nA conjunção subordinativa presente na frase acima exprime circunstância de","o":{"A":"causa.","B":"condição.","C":"consequência.","D":"conformidade."},"t":"Sintaxe","tp":"Período composto e orações","src":"prova_eags_2024_cod_41_10 05 2023 08 19 06.pdf · p. 5","vr":1},{"id":"EAGS2024-C41-PT-017","s":"por","y":2024,"c":"41","n":17,"a":"C","an":false,"du":false,"l":"","e":"Avalie as vozes verbais presentes nas frases abaixo.\nI- Com as flores e as fitas de cetim sobre a mesa a criança incomodou-se.\nII- Foram deixadas as flores e as fitas de cetim sobre a mesa.\nIII- Puseram-se as flores e as fitas de cetim sobre a mesa.\nIV- Com as flores e as fitas de cetim a criança enfeitou-se.\nPode-se dizer que há voz","o":{"A":"passiva em I, II e III; reflexiva em IV.","B":"passiva em I; ativa em II; reflexiva em III e IV.","C":"ativa em I; passiva em II e III; reflexiva em IV.","D":"reflexiva em I; passiva em II e III; ativa em IV."},"t":"Sintaxe","tp":"Revisão manual da classificação","src":"prova_eags_2024_cod_41_10 05 2023 08 19 06.pdf · p. 5","vr":1},{"id":"EAGS2024-C41-PT-018","s":"por","y":2024,"c":"41","n":18,"a":"B","an":false,"du":false,"l":"","e":"Em qual alternativa se encontra um agente da passiva?","o":{"A":"Viveu todos os seus dias pelas crianças daquele orfanato.","B":"Naquele ano, os condôminos foram difamados pela síndica.","C":"Durante o evento, moradores clamaram pela atenção do prefeito.","D":"Todas as quartas-feiras, você será responsável pela disciplina desta sala."},"t":"Sintaxe","tp":"Revisão manual da classificação","src":"prova_eags_2024_cod_41_10 05 2023 08 19 06.pdf · p. 5"},{"id":"EAGS2024-C41-PT-019","s":"por","y":2024,"c":"41","n":19,"a":"C","an":false,"du":false,"l":"","e":"Relacione as colunas quanto à classificação do predicado. Em seguida, assinale a alternativa com a sequência correta.\n1 – Predicado verbal\n( ) A aluna ficou fascinada pela aula de\nLíngua Portuguesa.\n2 – Predicado nominal\n( ) No parque aquático, há garantia de diversão para toda a família.\n3 – Predicado verbo-nominal\n( ) As atitudes de algumas mulheres públicas são inaceitáveis.\n( ) Os trabalhadores voltaram cansados e muito tarde para casa.","o":{"A":"2 - 2 - 3 - 1","B":"1 - 3 - 2 - 3","C":"2 - 1 - 2 - 3","D":"3 - 2 - 1 - 2"},"t":"Sintaxe","tp":"Termos da oração: sujeito e predicado","src":"prova_eags_2024_cod_41_10 05 2023 08 19 06.pdf · p. 5"},{"id":"EAGS2024-C41-PT-020","s":"por","y":2024,"c":"41","n":20,"a":"D","an":false,"du":false,"l":"","e":"Assinale a alternativa que aponta o correto processo de formação das duas palavras.","o":{"A":"indispor - jogador (derivação sufixal)","B":"desvalorização - amaciar (derivação prefixal)","C":"planalto - emudecer (derivação parassintética)","D":"passatempo - televisão (composição por justaposição)"},"t":"Formação de palavras","tp":"Estrutura e formação de palavras","src":"prova_eags_2024_cod_41_10 05 2023 08 19 06.pdf · p. 5"},{"id":"EAGS2024-C41-PT-021","s":"por","y":2024,"c":"41","n":21,"a":"B","an":false,"du":false,"l":"","e":"Em relação à regência dos verbos das frases, marque C para certo ou E para errado. Em seguida, assinale a alternativa com a sequência correta, considerando a norma culta da língua.\n( ) O diretor do clube chamou-o maluco durante a partida.\n( ) Os torcedores preferiam muito mais ficar no clube a ir para o estádio.\n( ) O diretor não visava a lucros, mas ao bem do clube.\n( ) Rogo-lhe que perdoe ao meu irmão.","o":{"A":"C - C - E - E","B":"C - E - C - C","C":"E - C - E - E","D":"E - E - C - C"},"t":"Regência","tp":"Regência verbal e nominal","src":"prova_eags_2024_cod_41_10 05 2023 08 19 06.pdf · p. 5"},{"id":"EAGS2024-C41-PT-022","s":"por","y":2024,"c":"41","n":22,"a":"B","an":false,"du":false,"l":"","e":"Quanto ao gênero dos substantivos, assinale a alternativa em que todos pertencem ao mesmo grupo.","o":{"A":"capivara - criatura - girafa - formiga (epicenos)","B":"sultana - sacerdotisa - baronesa - condessa (biformes)","C":"vítima - pessoa - testemunha - imigrante (sobrecomuns)","D":"indivíduo - jovem - estudante - cônjuge (comuns de dois gêneros)"},"t":"Sintaxe","tp":"Revisão manual da classificação","src":"prova_eags_2024_cod_41_10 05 2023 08 19 06.pdf · p. 5"},{"id":"EAGS2024-C41-PT-023","s":"por","y":2024,"c":"41","n":23,"a":"C","an":false,"du":false,"l":"","e":"Quanto aos termos destacados, marque 1 para predicativo do sujeito e 2 para predicativo do objeto. Em seguida, assinale a alternativa com a sequência correta.\n( ) A vítima bateu impaciente à porta do líder religioso durante a tempestade.\n( ) Os advogados julgaram indiscutíveis os argumentos da vítima.\n( ) A literatura aclamou Castro Alves o poeta dos escravos.\n( ) Inconformados com a prefeitura estavam os moradores de rua da praça central.","o":{"A":"1 - 1 - 2 - 2","B":"2 - 2 - 1 - 1","C":"1 - 2 - 2 - 1","D":"2 - 1 - 1 - 2"},"t":"Sintaxe","tp":"Termos da oração: sujeito e predicado","src":"prova_eags_2024_cod_41_10 05 2023 08 19 06.pdf · p. 5"},{"id":"EAGS2024-C41-PT-024","s":"por","y":2024,"c":"41","n":24,"a":"C","an":false,"du":false,"l":"","e":"Analise os adjuntos adverbiais destacados nas frases abaixo. Depois assinale a alternativa que contém a sequência correta quanto às circunstâncias que eles indicam.\nI- Apesar das dores, saímos.\nII- Quando era jovem, passeava de trem.\nIII- Com a tempestade, a cidade foi destruída.\nIV- Registrou com entusiasmo o acontecimento.","o":{"A":"modo - meio - modo - causa","B":"causa - modo - causa - causa","C":"concessão - meio - causa - modo","D":"concessão - modo - modo - modo"},"t":"Sintaxe","tp":"Revisão manual da classificação","src":"prova_eags_2024_cod_41_10 05 2023 08 19 06.pdf · p. 6","vr":1},{"id":"EAGS2024-C41-PT-025","s":"por","y":2024,"c":"41","n":25,"a":"A","an":false,"du":false,"l":"","e":"Assinale a alternativa que não possui uma oração subordinada adjetiva.","o":{"A":"O locutor disse que não pode realizar o programa.","B":"“Bebi o café que eu mesmo preparei.” (Manuel Bandeira)","C":"A apresentadora que fez o discurso não teve ética com o público.","D":"O país que não trata a educação como prioridade não pode ser considerado civilizado."},"t":"Sintaxe","tp":"Período composto e orações","src":"prova_eags_2024_cod_41_10 05 2023 08 19 06.pdf · p. 6"},{"id":"EAGS2024-C41-PT-026","s":"por","y":2024,"c":"41","n":26,"a":"A","an":false,"du":false,"l":"","e":"Assinale a alternativa em que todas as palavras devem ser completadas com a letra indicada entre parênteses.","o":{"A":"influ__; bas__lar; arr__amento; requ__sito (i)","B":"__iboia; man__ericão; vare__ista; trá__icas (j)","C":"encai__ar; en__ugar; capi__aba; apetre__os (x)","D":"exce__ão; interce__ão; absten__ão; expan__ão (ç)"},"t":"Sintaxe","tp":"Revisão manual da classificação","src":"prova_eags_2024_cod_41_10 05 2023 08 19 06.pdf · p. 6"},{"id":"EAGS2024-C41-PT-027","s":"por","y":2024,"c":"41","n":27,"a":"B","an":false,"du":false,"l":"","e":"Analise os termos destacados nas frases abaixo.\nI- Diante do ocorrido, nada me disse.\nII- A mim, não me ensinaram como chegar àquela cidade.\nIII- Uma menina, que nunca nos visitara, apareceu um dia para nos contar suas aventuras.\nIV- “A gente à crença antiga se acostuma.” (Alberto de\nOliveira)\nQuanto à classificação sintática dos termos destacados, é correto afirmar que","o":{"A":"I e III são objeto direto.","B":"II e IV são objeto indireto.","C":"I, II e IV são objeto direto.","D":"II, III e IV são objeto indireto."},"t":"Sintaxe","tp":"Termos da oração: complementos e adjuntos","src":"prova_eags_2024_cod_41_10 05 2023 08 19 06.pdf · p. 6","vr":1},{"id":"EAGS2024-C41-PT-028","s":"por","y":2024,"c":"41","n":28,"a":"C","an":false,"du":false,"l":"","e":"Leia:\nI- No jardim, viam-se as borboletas e os passarinhos.\nII- Não haviam muitas opções no cardápio daquele restaurante.\nIII- Mais de um professor se ofenderam com a manifestação feita pelos alunos.\nIV- Existe, no Brasil, inúmeros cientistas empenhados no estudo da COVID 19.\nHá erro de concordância verbal em","o":{"A":"I e II.","B":"I e III.","C":"II e IV.","D":"III e IV."},"t":"Concordância","tp":"Concordância verbal e nominal","src":"prova_eags_2024_cod_41_10 05 2023 08 19 06.pdf · p. 6"},{"id":"EAGS2024-C41-PT-029","s":"por","y":2024,"c":"41","n":29,"a":"A","an":false,"du":false,"l":"","e":"Leia:\nO sertanejo é antes de tudo um forte. Não tem o raquitismo exaustivo dos mestiços neurastênicos do litoral.\n[...] A sua aparência entretanto ao primeiro lance de vista revela o contrário. Falta-lhe a plástica impecável o desempeno a estrutura corretíssima das organizações atléticas. (Euclides da Cunha)\nDo texto acima foram retiradas todas as vírgulas.\nAssinale a alternativa que aponta quantas devem ser obrigatoriamente usadas.","o":{"A":"5","B":"6","C":"7","D":"8"},"t":"Interpretação de texto","tp":"Compreensão, inferência e finalidade textual","src":"prova_eags_2024_cod_41_10 05 2023 08 19 06.pdf · p. 6","vr":1},{"id":"EAGS2024-C41-PT-030","s":"por","y":2024,"c":"41","n":30,"a":"A","an":false,"du":false,"l":"","e":"Assinale a alternativa que classifica, correta e respectivamente, os termos destacados na frase abaixo.\nA filha de Maria tinha no rosto uma terrível expressão de dor.","o":{"A":"adjunto adnominal - adjunto adverbial - adjunto adnominal","B":"complemento nominal - adjunto adverbial - adjunto adnominal","C":"adjunto adnominal - adjunto adnominal - complemento nominal","D":"complemento nominal - adjunto adnominal - complemento nominal"},"t":"Sintaxe","tp":"Termos da oração: complementos e adjuntos","src":"prova_eags_2024_cod_41_10 05 2023 08 19 06.pdf · p. 6","vr":1},{"id":"EAGS2024-C41-PT-031","s":"por","y":2024,"c":"41","n":31,"a":"D","an":false,"du":false,"l":"","e":"Assinale a alternativa que contém a figura de linguagem presente no texto abaixo.\nOs oceanos poluídos pedem socorro as algas marinhas gemem inconformadas os peixes e os golfinhos se consolam\nE o céu só olha, e nada pode fazer.","o":{"A":"eufemismo","B":"hipérbole","C":"antítese","D":"prosopopeia"},"t":"Interpretação de texto","tp":"Compreensão, inferência e finalidade textual","src":"prova_eags_2024_cod_41_10 05 2023 08 19 06.pdf · p. 6","vr":1},{"id":"EAGS2024-C41-PT-032","s":"por","y":2024,"c":"41","n":32,"a":"C","an":false,"du":false,"l":"","e":"Assinale a alternativa em que todas as palavras estão corretamente acentuadas.","o":{"A":"idéia - anéis - rústico - propósito","B":"bênção - colméia - heróico - amável","C":"chapéus - sóis - vatapá - beneficiário","D":"históricos - extraordinário - víssemos - estréiam"},"t":"Interpretação de texto","tp":"Compreensão, inferência e finalidade textual","src":"prova_eags_2024_cod_41_10 05 2023 08 19 06.pdf · p. 6"},{"id":"EAGS2024-C41-PT-033","s":"por","y":2024,"c":"41","n":33,"a":"C","an":false,"du":false,"l":"","e":"Assinale a alternativa em que as duas palavras são proparoxítonas.\n(Obs.: Não foram usados propositadamente os acentos gráficos.)","o":{"A":"hieroglifo - rubrica","B":"filantropo - levedo","C":"interim - crisantemo","D":"juniores - prototipo"},"t":"Sintaxe","tp":"Revisão manual da classificação","src":"prova_eags_2024_cod_41_10 05 2023 08 19 06.pdf · p. 7"},{"id":"EAGS2024-C41-PT-034","s":"por","y":2024,"c":"41","n":34,"a":"A","an":false,"du":false,"l":"","e":"Em qual das alternativas abaixo encontra-se hipérbole?","o":{"A":"“Fugimos das salas, do mundo talvez\nInda era mais bela rendida ao cansaço\nMorrendo de amores em tal languidez!” (Casimiro de\nAbreu)","B":"“As plantas sofrem como nós sofremos.\nPor que não sofreriam\nSe esta é a chave da unidade do universo?” (Carlos D.\nAndrade)","C":"“Era a luz de um crepúsculo indeciso\nEntre os clarões de um sol que já vai longe\nE as sombras de uma noite que vem perto!” (Raimundo\nCorrea)","D":"“A Natureza é um templo onde vivos pilares\nDeixam sair às vezes palavras confusas:\nPor florestas de símbolos, lá o homem cruza\nObservado por olhos ali familiares.” (Charles Baudelaire)"},"t":"Sintaxe","tp":"Revisão manual da classificação","src":"prova_eags_2024_cod_41_10 05 2023 08 19 06.pdf · p. 7","vr":1},{"id":"EAGS2024-C41-PT-035","s":"por","y":2024,"c":"41","n":35,"a":"D","an":false,"du":false,"l":"","e":"Em relação à classificação das orações subordinadas substantivas reduzidas destacadas, avalie as afirmações abaixo e coloque V para verdadeiro ou F para falso. Em seguida, assinale a alternativa com a sequência correta.\n( ) Habituamo-nos a chamá-lo de filho. - objetiva indireta\n( ) Nosso sonho sempre foi adotar um cão labrador. - objetiva direta\n( ) Estávamos dispostos a levar o cãozinho para casa. - objetiva indireta\n( ) Não convém, no momento, reclamar do comportamento do cão. - subjetiva","o":{"A":"V - V - F - F","B":"F - V - V - V","C":"F - F - V - F","D":"V - F - F - V"},"t":"Sintaxe","tp":"Período composto e orações","src":"prova_eags_2024_cod_41_10 05 2023 08 19 06.pdf · p. 7","vr":1},{"id":"EAGS2024-C41-PT-036","s":"por","y":2024,"c":"41","n":36,"a":"A","an":false,"du":false,"l":"","e":"Assinale a alternativa que preenche, correta e respectivamente, o texto abaixo.\nApós o assalto na arquibancada, começou uma confusão generalizada. A Polícia _________ com firmeza na briga, pois muitos torcedores estavam munidos de faca. O policial\n_________ o chefe da torcida e __________ a carteira roubada.","o":{"A":"interveio - reteve - requereu","B":"interveio - reteu - requereu","C":"interviu - reteve - requis","D":"interviu - reteu - requis"},"t":"Interpretação de texto","tp":"Compreensão, inferência e finalidade textual","src":"prova_eags_2024_cod_41_10 05 2023 08 19 06.pdf · p. 7","vr":1},{"id":"EAGS2024-C41-PT-037","s":"por","y":2024,"c":"41","n":37,"a":"B","an":false,"du":false,"l":"","e":"Leia:\nNinguém vai esquecer o que aconteceu na noite chuvosa de sábado, quando nuvens negras quase engoliram o vilarejo e espalharam a morte pelo local. Tais ações desesperaram muitos munícipes e despertaram a comoção em todos.\nOs pronomes em destaque classificam-se, respectivamente, como","o":{"A":"indefinido, átono, indefinido, demonstrativo, indefinido.","B":"indefinido, demonstrativo, demonstrativo, indefinido, indefinido.","C":"demonstrativo, átono, demonstrativo, demonstrativo, demonstrativo.","D":"demonstrativo, demonstrativo, indefinido, indefinido, demonstrativo."},"t":"Sintaxe","tp":"Revisão manual da classificação","src":"prova_eags_2024_cod_41_10 05 2023 08 19 06.pdf · p. 7"},{"id":"EAGS2024-C41-PT-038","s":"por","y":2024,"c":"41","n":38,"a":"B","an":false,"du":false,"l":"","e":"Leia:\nInfelizmente, depois que meu pai fez 70 anos, ganhou um corpo de velho e passou a apresentar problemas no pescoço, nos quadris e no fígado.\nSubstitua as locuções adjetivas pelos adjetivos correspondentes, depois assinale a alternativa com a sequência correta.","o":{"A":"viril - ciáticos - cervicais - hepáticos","B":"senil - cervicais - ciáticos - hepáticos","C":"viril - cervicais - ciáticos - renais","D":"senil - ciáticos - cervicais - renais"},"t":"Sintaxe","tp":"Revisão manual da classificação","src":"prova_eags_2024_cod_41_10 05 2023 08 19 06.pdf · p. 7"},{"id":"EAGS2024-C41-PT-039","s":"por","y":2024,"c":"41","n":39,"a":"A","an":false,"du":false,"l":"","e":"Observe as orações no período abaixo:\nSua imaginação povoava o mundo de demônios, e esse mundo fantástico não só continuava como também se alargava em seus sonhos e meditações. (E. Veríssimo)\nCom relação às orações coordenadas sindéticas, é correto afirmar que existem","o":{"A":"2 aditivas.","B":"3 aditivas.","C":"1 aditiva e 1 adversativa.","D":"2 aditivas e 1 adversativa."},"t":"Sintaxe","tp":"Revisão manual da classificação","src":"prova_eags_2024_cod_41_10 05 2023 08 19 06.pdf · p. 7","vr":1},{"id":"EAGS2024-C41-PT-040","s":"por","y":2024,"c":"41","n":40,"a":"C","an":false,"du":false,"l":"","e":"Assinale a alternativa em que há erro quanto à flexão de número dos substantivos destacados.","o":{"A":"Os ladrões arrancaram os fios e provocaram vários curtos- circuitos no escritório da igreja.","B":"Os criminosos, além de levarem os computadores do escritório, quebraram os corrimãos da saída principal.","C":"Foi necessária a efetiva participação dos tenente-coronéis da Polícia na descoberta dos autores do crime.","D":"No final da investigação, chegou-se à conclusão de que os vilãos do crime eram antigos moradores do bairro.\nAS QUESTÕES DE 41 A 100 REFEREM-SE\nÀ INFORMÁTICA"},"t":"Sintaxe","tp":"Revisão manual da classificação","src":"prova_eags_2024_cod_41_10 05 2023 08 19 06.pdf · p. 7"},{"id":"EAGS2024-C41-INF-041","s":"inf","y":2024,"c":"41","n":41,"a":"B","an":false,"du":false,"l":"","e":"Analise a figura abaixo e assinale a alternativa que indique o tipo de relacionamento de objeto representado e reconhecido pela UML.","o":{"A":"Generalização","B":"Dependência","C":"Composição","D":"Associação"},"t":"Engenharia de software","tp":"Modelagem, qualidade, desenvolvimento e documentação","src":"prova_eags_2024_cod_41_10 05 2023 08 19 06.pdf · p. 8","vr":1},{"id":"EAGS2024-C41-INF-042","s":"inf","y":2024,"c":"41","n":42,"a":"C","an":false,"du":false,"l":"","e":"Heitor recebeu a tarefa de adicionar o campo “SITUACAO” do tipo VARCHAR (20) na tabela tbAluno criada no banco de dados EEAR. Para realizar essa tarefa no\nMySQL, por meio da ferramenta de linha de comando, qual deverá ser o comando utilizado por Heitor?","o":{"A":"ALTER TABLE EEAR ADD SITUACAO VARCHAR\n(20);","B":"ALTER\nTABLE\nEEAR\nADD\nVARCHAR\n(20)\nSITUACAO;","C":"ALTER TABLE tbAluno ADD SITUACAO VARCHAR\n(20);","D":"ALTER\nCAMPO tbAluno\nDROP\nSITUACAO\nVARCHAR (20);"},"t":"Banco de dados","tp":"SQL, SGBD, modelagem e administração de dados","src":"prova_eags_2024_cod_41_10 05 2023 08 19 06.pdf · p. 8","vr":1},{"id":"EAGS2024-C41-INF-043","s":"inf","y":2024,"c":"41","n":43,"a":"C","an":false,"du":false,"l":"","e":"O departamento pessoal e o setor de finanças de uma organização estão conectados à rede local por um mesmo switch. O administrador dessa rede precisa separar o tráfego de rede dos setores citados via software. Assinale a alternativa que contém um recurso possível de ser utilizado pelo administrador da rede.","o":{"A":"Gateway de aplicação","B":"Spanning Tree","C":"LAN virtual","D":"Broadcast"},"t":"Redes de computadores","tp":"Protocolos, endereçamento e arquitetura de redes","src":"prova_eags_2024_cod_41_10 05 2023 08 19 06.pdf · p. 8"},{"id":"EAGS2024-C41-INF-044","s":"inf","y":2024,"c":"41","n":44,"a":"D","an":false,"du":false,"l":"","e":"Assinale a alternativa que completa corretamente a lacuna da frase abaixo.\n______________ são conectores de vídeo que utilizam sinais digitais.","o":{"A":"VGA, DisplayPort e S-Vídeo","B":"VGA, DVI-A e S-Vídeo","C":"HDMI, DVI e VGA","D":"HDMI, DisplayPort e Thunderbolt"},"t":"Linguagens de programação","tp":"Revisão manual da classificação","src":"prova_eags_2024_cod_41_10 05 2023 08 19 06.pdf · p. 8","vr":1},{"id":"EAGS2024-C41-INF-045","s":"inf","y":2024,"c":"41","n":45,"a":"B","an":false,"du":false,"l":"","e":"Em UML, os limites inferior e superior da quantidade de objetos aos quais outro objeto pode ser associado são chamados de multiplicidades. Em relação às multiplicidades, analise a figura abaixo e assinale a alternativa correta.","o":{"A":"O objeto da classe Atendente está associado a um, e a somente um, objeto da classe Venda.","B":"O objeto da classe Venda está associado a um, e a somente um, objeto da classe Atendente.","C":"O objeto da classe Venda está associado a vários objetos da classe Atendente.","D":"O objeto da classe Atendente possui 10 associações."},"t":"Programação orientada a objetos","tp":"Classes, herança, encapsulamento e polimorfismo","src":"prova_eags_2024_cod_41_10 05 2023 08 19 06.pdf · p. 8","vr":1},{"id":"EAGS2024-C41-INF-046","s":"inf","y":2024,"c":"41","n":46,"a":"D","an":false,"du":false,"l":"","e":"Em relação ao protocolo UDP, marque V para verdadeiro ou F para falso nas sentenças abaixo. Em seguida, assinale a alternativa com a sequência correta.\n( ) Transmite segmentos com cabeçalhos de 8 bytes, seguido pela carga útil.\n( ) É um protocolo de transporte não orientado à conexão.\n( ) Não é muito útil nas solicitações cliente-servidor.\n( ) Realiza controle de fluxo e congestionamento.","o":{"A":"F - F - V - V","B":"F - F - V - F","C":"V - V - F - V","D":"V - V - F - F"},"t":"Redes de computadores","tp":"Protocolos, endereçamento e arquitetura de redes","src":"prova_eags_2024_cod_41_10 05 2023 08 19 06.pdf · p. 8","vr":1},{"id":"EAGS2024-C41-INF-047","s":"inf","y":2024,"c":"41","n":47,"a":"C","an":false,"du":false,"l":"","e":"Relacione as colunas referentes aos componentes internos de um computador. Em seguida, assinale a alternativa com a sequência correta.\n1 – Processador\n( ) Local onde são instalados os componentes internos e a maioria dos componentes externos do computador.\n2 – Placa-mãe\n( ) Local onde o processador busca instruções para serem processadas.\n3 – Memória RAM\n( ) Componente que realiza o processamento de dados.\n4 – Cooler do processador\n( ) Componente que serve para refrigerar o processador.","o":{"A":"2 - 4 - 1 - 3","B":"3 - 2 - 4 - 1","C":"2 - 3 - 1 - 4","D":"4 - 1 - 3 - 2"},"t":"Algoritmos e lógica","tp":"Fluxogramas, estruturas de controle e pseudocódigo","src":"prova_eags_2024_cod_41_10 05 2023 08 19 06.pdf · p. 8"},{"id":"EAGS2024-C41-INF-048","s":"inf","y":2024,"c":"41","n":48,"a":"A","an":false,"du":false,"l":"","e":"Em relação a tipos de dados em português estruturado, marque V para verdadeiro ou F para falso nas sentenças abaixo. Em seguida, assinale a alternativa com a sequência correta.\n( ) O operador relacional utilizado para representar que um\nvalor é diferente de outro é o “<>”.\n( ) Os operadores multiplicação e divisão, além de poderem ser representados por “*” e “/”, também podem ser representados por “mult” e “div”.\n( ) Uma variável contendo um número será do tipo caractere, mesmo se não indicada entre aspas (“”).\n( ) Os dados do tipo lógico ou booleano deverão ser delimitados pelo caractere ponto. Por exemplo: .Falso. e\n.Verdadeiro.","o":{"A":"V - F - F - V","B":"V - V - F - F","C":"F - F - V - V","D":"F - V - V - F"},"t":"Algoritmos e lógica","tp":"Fluxogramas, estruturas de controle e pseudocódigo","src":"prova_eags_2024_cod_41_10 05 2023 08 19 06.pdf · p. 9","vr":1},{"id":"EAGS2024-C41-INF-049","s":"inf","y":2024,"c":"41","n":49,"a":"C","an":false,"du":false,"l":"","e":"Para exibir as strings fornecidas no PHP, utiliza-se a função ____.","o":{"A":"cut","B":"split","C":"print","D":"dump"},"t":"Linguagens de programação","tp":"PHP, Java e sintaxe de linguagens","src":"prova_eags_2024_cod_41_10 05 2023 08 19 06.pdf · p. 9"},{"id":"EAGS2024-C41-INF-050","s":"inf","y":2024,"c":"41","n":50,"a":"B","an":false,"du":false,"l":"","e":"Assinale a alternativa que representa graficamente uma\nClasse Abstrata, segundo as notações da UML.","o":{"A":"","B":"","C":"","D":""},"t":"Programação orientada a objetos","tp":"Classes, herança, encapsulamento e polimorfismo","src":"prova_eags_2024_cod_41_10 05 2023 08 19 06.pdf · p. 9","vr":1},{"id":"EAGS2024-C41-INF-051","s":"inf","y":2024,"c":"41","n":51,"a":"D","an":false,"du":false,"l":"","e":"Relacione as colunas quanto ao que se refere à estrutura básica de diretórios do Sistema Operacional Linux. Em seguida, assinale a alternativa com a sequência correta.\n1 – /etc\n( ) Contém arquivos executáveis, acessados pelos usuários.\n2 – /bin\n( ) Contém arquivos dos usuários.\n3 – /home\n( ) Contém arquivos que controlam a inicialização do sistema.\n4 – /boot\n( ) Contém arquivos de configuração do Sistema Operacional.","o":{"A":"4 - 3 - 1 - 2","B":"2 - 1 - 3 - 4","C":"1 - 4 - 3 - 2","D":"2 - 3 - 4 - 1"},"t":"Algoritmos e lógica","tp":"Fluxogramas, estruturas de controle e pseudocódigo","src":"prova_eags_2024_cod_41_10 05 2023 08 19 06.pdf · p. 9"},{"id":"EAGS2024-C41-INF-052","s":"inf","y":2024,"c":"41","n":52,"a":"C","an":false,"du":false,"l":"","e":"Analise o algoritmo abaixo, escrito em PHP, e assinale a alternativa que contém a correta saída da variável $o.\nfor ($o= 2; $o < 9; $o++)\n{\nprint $o;\n}\n?>","o":{"A":"12345678910","B":"23456789","C":"2345678","D":"9"},"t":"Algoritmos e lógica","tp":"Fluxogramas, estruturas de controle e pseudocódigo","src":"prova_eags_2024_cod_41_10 05 2023 08 19 06.pdf · p. 9","vr":1},{"id":"EAGS2024-C41-INF-053","s":"inf","y":2024,"c":"41","n":53,"a":"C","an":false,"du":false,"l":"","e":"Em relação ao protocolo IP versão 4 (IPv4), marque V para verdadeiro ou F para falso nas sentenças abaixo. Em seguida, assinale a alternativa com a sequência correta.\n( ) O campo deslocamento de fragmento permite que o host de origem determine a qual pacote pertence o datagrama.\n( ) O campo tamanho total informa tudo o que há no datagrama - cabeçalho e dados.\n( ) O campo TTL é um contador utilizado para limitar a vida útil dos pacotes.\n( ) O campo identificação é onde vai o endereço IP de origem e destino.","o":{"A":"V - F - V - F","B":"F - V - F - V","C":"F - V - V - F","D":"V - F - F - V"},"t":"Redes de computadores","tp":"Protocolos, endereçamento e arquitetura de redes","src":"prova_eags_2024_cod_41_10 05 2023 08 19 06.pdf · p. 9","vr":1},{"id":"EAGS2024-C41-INF-054","s":"inf","y":2024,"c":"41","n":54,"a":"A","an":false,"du":false,"l":"","e":"Considerando a variável X=2, Y=5, Z=“EEAR”\nassinale a alternativa que corresponde à saída do seguinte código em português estruturado:\nprograma LÓGICA var\nX: inteiro\nY: inteiro\nZ: caractere início leia X leia Y leia Z\nse X<1 .ou. (Z = “FAB”) então\nescreva “Bem-vindo à EEAR” senão\nse Y<7 .e. (Z=“EEAR”) então\nescreva “Bem-vindo à Escola de Especialistas da\nAeronáutica” senão escreva Z fim_se fim","o":{"A":"Bem-vindo à Escola de Especialistas da Aeronáutica","B":"Bem-vindo à EEAR","C":"EEAR","D":"FAB"},"t":"Algoritmos e lógica","tp":"Fluxogramas, estruturas de controle e pseudocódigo","src":"prova_eags_2024_cod_41_10 05 2023 08 19 06.pdf · p. 10"},{"id":"EAGS2024-C41-INF-055","s":"inf","y":2024,"c":"41","n":55,"a":"C","an":false,"du":false,"l":"","e":"Assinale a alternativa que preenche corretamente a lacuna do texto abaixo, a respeito de Lógica de Programação.\nPara se evitar que um mesmo trecho de código se repita várias vezes em um mesmo programa e se torne um algoritmo complexo, é possível dividir o código em partes menores, utilizando-se de ____________, o que pode gerar um programa menor e mais fácil de ser alterado futuramente.","o":{"A":"matrizes","B":"parâmetros","C":"sub-rotinas","D":"métodos de pesquisa"},"t":"Algoritmos e lógica","tp":"Fluxogramas, estruturas de controle e pseudocódigo","src":"prova_eags_2024_cod_41_10 05 2023 08 19 06.pdf · p. 10","vr":1},{"id":"EAGS2024-C41-INF-056","s":"inf","y":2024,"c":"41","n":56,"a":"C","an":false,"du":false,"l":"","e":"Em relação às formas normais, marque V para verdadeiro ou F para falso. Em seguida, assinale a alternativa com a sequência correta.\n( ) Atributos compostos, multivalorados ou grupo repetidos de dados são permitidos na tabela que está na 1FN.\n( ) A 2FN só é aplicável para tabelas que possuam uma chave primária composta e que, além disso, tenham outros atributos que não façam parte da chave primária.\n( ) A tabela que está na 3FN possui dependências transitivas.\n( ) Toda tabela está na 1FN se os seus atributos forem atômicos.\n( ) A dependência transitiva é eliminada criando-se uma nova tabela que conterá o atributo que depende mais o atributo do qual ele é dependente.","o":{"A":"F - F - V - F - V","B":"V - V - F - V - F","C":"F - V - F - V - V","D":"V - F - V - F - V"},"t":"Banco de dados","tp":"SQL, SGBD, modelagem e administração de dados","src":"prova_eags_2024_cod_41_10 05 2023 08 19 06.pdf · p. 10","vr":1},{"id":"EAGS2024-C41-INF-057","s":"inf","y":2024,"c":"41","n":57,"a":"D","an":false,"du":false,"l":"","e":"Na linguagem SQL ocorre a subdivisão de comandos de acordo com as funções que desempenham. As duas principais subdivisões são DDL (Data Definition Language) e DML\n(Data Manipulation Language). Assinale a alternativa que apresenta somente comandos SQL DML utilizados no SGBD\nMySQL.","o":{"A":"INSERT - ALTER DATABASE - DROP DATABASE","B":"DROP DATABASE - UPDATE - MERGE","C":"UPDATE - CONSTRAINT - MERGE","D":"INSERT - UPDATE - DELETE"},"t":"Banco de dados","tp":"SQL, SGBD, modelagem e administração de dados","src":"prova_eags_2024_cod_41_10 05 2023 08 19 06.pdf · p. 10"},{"id":"EAGS2024-C41-INF-058","s":"inf","y":2024,"c":"41","n":58,"a":"B","an":false,"du":false,"l":"","e":"Assinale a alternativa que indica qual deve ser a primeira função a ser chamada, antes de qualquer saída produzida pelo browser, ao se utilizar o método de cookies para armazenar o identificador da sessão no PHP.","o":{"A":"session.id","B":"session_start","C":"session_register","D":"session.use_cookies"},"t":"Linguagens de programação","tp":"PHP, Java e sintaxe de linguagens","src":"prova_eags_2024_cod_41_10 05 2023 08 19 06.pdf · p. 10"},{"id":"EAGS2024-C41-INF-059","s":"inf","y":2024,"c":"41","n":59,"a":"D","an":false,"du":false,"l":"","e":"Durante o desenvolvimento de software podem ocorrer muitas alterações nas partes do sistema. Para garantir que uma alteração não introduza um erro capaz de danificar o sistema inteiro é fundamental testar novamente, tanto a parte que foi alterada como as partes dependentes. Para isso executam-se novamente os testes de unidade, integração e sistema.\nAssinale a alternativa que apresenta o nome do teste realizado com essas ações.","o":{"A":"Caixa branca","B":"Caixa preta","C":"Estrutura","D":"Regressão"},"t":"Engenharia de software","tp":"Modelagem, qualidade, desenvolvimento e documentação","src":"prova_eags_2024_cod_41_10 05 2023 08 19 06.pdf · p. 10"},{"id":"EAGS2024-C41-INF-060","s":"inf","y":2024,"c":"41","n":60,"a":"D","an":false,"du":false,"l":"","e":"Avalie as sentenças abaixo, considerando o modelo de referência OSI e marque V para verdadeiro ou F para falso.\nEm seguida, assinale a alternativa com a sequência correta.\n( ) A camada de enlace de dados transmite bits.\n( ) A camada de rede faz controle de congestionamento de pacotes.\n( ) A camada de apresentação está ligada à sintaxe e à semântica nas transmissões de informações.\n( ) A camada de transporte é responsável por determinar o tipo de serviço a ser fornecido à camada de enlace.","o":{"A":"V - F - F - V","B":"F - V - F - V","C":"V - F - V - F","D":"F - V - V - F"},"t":"Redes de computadores","tp":"Protocolos, endereçamento e arquitetura de redes","src":"prova_eags_2024_cod_41_10 05 2023 08 19 06.pdf · p. 10","vr":1},{"id":"EAGS2024-C41-INF-061","s":"inf","y":2024,"c":"41","n":61,"a":"A","an":false,"du":false,"l":"","e":"Em relação à Linguagem JAVA, marque V para verdadeiro ou F para falso nas sentenças abaixo. Em seguida, assinale a alternativa com a sequência correta.\n( ) O polimorfismo permite que uma nova classe herde atributos e comportamentos de outra classe.\n( ) Os três pilares da programação orientada a objetos são:\nclasses, atributos e métodos.\n( ) O encapsulamento permite dividir o código em partes menores.\n( ) A herança permite redefinir métodos e atributos previamente existentes.","o":{"A":"F - F - V - V","B":"V - F - F - V","C":"F - F - V - F","D":"F - V - V - F"},"t":"Programação orientada a objetos","tp":"Classes, herança, encapsulamento e polimorfismo","src":"prova_eags_2024_cod_41_10 05 2023 08 19 06.pdf · p. 11","vr":1},{"id":"EAGS2024-C41-INF-062","s":"inf","y":2024,"c":"41","n":62,"a":"C","an":false,"du":false,"l":"","e":"Relacione as colunas quanto à linguagem de programação PHP. Em seguida, assinale a alternativa com a sequência correta.\n1 – Coerção de tipo\n( ) Adjetivo que se refere à lógica verdadeiro ou falso.\n2 – Booleano\n( ) Expressão de linguagem de programação que explicitamente requisita a conversão de um valor de um tipo de dados para outro.\n3 – Depurador\n( ) Processo automatizado de tradução de um programa de arquivo de texto em um programa executável.\n4 – Compilação\n( ) Software que auxilia programadores a localizar bugs no código.","o":{"A":"2 - 3 - 4 - 1","B":"1 - 4 - 3 - 2","C":"2 - 1 - 4 - 3","D":"1 - 2 - 3 - 4"},"t":"Algoritmos e lógica","tp":"Fluxogramas, estruturas de controle e pseudocódigo","src":"prova_eags_2024_cod_41_10 05 2023 08 19 06.pdf · p. 11"},{"id":"EAGS2024-C41-INF-063","s":"inf","y":2024,"c":"41","n":63,"a":"D","an":false,"du":false,"l":"","e":"Herança é um dos conceitos fundamentais da\nProgramação Orientada a Objetos. Analise as afirmativas abaixo sobre esse importante pilar da POO.\nI- As classes inferiores da hierarquia não herdam automaticamente todas as propriedades e os métodos das classes superiores.\nII- A herança permite basear uma nova classe na definição de uma classe previamente existente.\nIII- A classe filha é conhecida como superclasse e a classe progenitora como subclasse.\nIV- A herança permite o agrupamento de classes relacionadas.\nEstá correto o que se afirma em","o":{"A":"I e II.","B":"I e IV.","C":"II e III.","D":"II e IV."},"t":"Programação orientada a objetos","tp":"Classes, herança, encapsulamento e polimorfismo","src":"prova_eags_2024_cod_41_10 05 2023 08 19 06.pdf · p. 11","vr":1},{"id":"EAGS2024-C41-INF-064","s":"inf","y":2024,"c":"41","n":64,"a":"C","an":false,"du":false,"l":"","e":"Assinale a alternativa que completa corretamente a lacuna do texto abaixo.\n________ são módulos de memória de fácil identificação, pois se diferenciam dos demais módulos por serem os únicos a conter dois chanfrados delimitadores.","o":{"A":"DDR1-DIMM","B":"SIMM-30","C":"DIMM","D":"SIPP"},"t":"Linguagens de programação","tp":"Revisão manual da classificação","src":"prova_eags_2024_cod_41_10 05 2023 08 19 06.pdf · p. 11","vr":1},{"id":"EAGS2024-C41-INF-065","s":"inf","y":2024,"c":"41","n":65,"a":"C","an":false,"du":false,"l":"","e":"Helena precisa modificar a NOTA dos alunos da\nESPECIALIDADE de\nSIN do banco de dados\nESCOLA_ESPECIALISTA.\nTodos os alunos dessa especialidade obtiveram nota 10. Qual comando Helena deverá digitar no terminal de linha de comando do SGBD\nMySQL para realizar essa modificação? Considerar a tabela abaixo para responder esta questão.","o":{"A":"UPDATE ESCOLA_ESPECIALISTA SET NOTA=10;","B":"NEW NOTA SET VALOR=10 WHERE NOME=“SIN”;","C":"UPDATE\nALUNOS\nSET\nNOTA=10\nWHERE\nESPECIALIDADE=“SIN”;","D":"MODIFICA\nNOTA\nSET\nVALOR=10\nWHEN\nESPECIALIDADE=“SIN”;"},"t":"Banco de dados","tp":"SQL, SGBD, modelagem e administração de dados","src":"prova_eags_2024_cod_41_10 05 2023 08 19 06.pdf · p. 11","vr":1},{"id":"EAGS2024-C41-INF-066","s":"inf","y":2024,"c":"41","n":66,"a":"D","an":false,"du":false,"l":"","e":"A UML (Unified Modeling Language) é uma linguagem de modelagem padrão que oferece um rico conjunto de notações para modelar classes. Na UML, a imagem abaixo representa uma classe, na qual a caixa superior contém o nome da classe e a inferior contém as operações. Assinale a alternativa que indique o estereótipo que a caixa central pode conter.","o":{"A":"<<Relacionamentos>>","B":"<<Métodos>>","C":"<<Interfaces>>","D":"<<Atributos>>"},"t":"Programação orientada a objetos","tp":"Classes, herança, encapsulamento e polimorfismo","src":"prova_eags_2024_cod_41_10 05 2023 08 19 06.pdf · p. 11","vr":1},{"id":"EAGS2024-C41-INF-067","s":"inf","y":2024,"c":"41","n":67,"a":"A","an":false,"du":false,"l":"","e":"Marque a alternativa com o tipo de fibra óptica mais caro e muito utilizado em longas distâncias.","o":{"A":"Monomodo","B":"Multimodo","C":"Coaxial","D":"FTTH"},"t":"Linguagens de programação","tp":"Revisão manual da classificação","src":"prova_eags_2024_cod_41_10 05 2023 08 19 06.pdf · p. 11"},{"id":"EAGS2024-C41-INF-068","s":"inf","y":2024,"c":"41","n":68,"a":"C","an":false,"du":false,"l":"","e":"Os computadores são capazes de realizar várias tarefas ao mesmo tempo, sendo aparente para o usuário os processos em primeiro plano. Como são chamados os processos realizados em segundo plano, com a finalidade de tratar alguma atividade, como por exemplo páginas web e impressão?","o":{"A":"Gerenciadores.","B":"Registradores.","C":"Daemons.","D":"System."},"t":"Sistemas operacionais","tp":"Linux, Unix, processos, arquivos e comandos","src":"prova_eags_2024_cod_41_10 05 2023 08 19 06.pdf · p. 12"},{"id":"EAGS2024-C41-INF-069","s":"inf","y":2024,"c":"41","n":69,"a":"C","an":false,"du":false,"l":"","e":"Para se obter uma área de trabalho maior é possível trabalhar com mais de um monitor conectado ao computador.\nA quantidade de monitores de vídeo suportada dependerá de qual componente?","o":{"A":"Hub.","B":"Placa-mãe.","C":"Placa de vídeo.","D":"Processador gráfico."},"t":"Hardware e arquitetura","tp":"Componentes, memória, processamento e sistemas digitais","src":"prova_eags_2024_cod_41_10 05 2023 08 19 06.pdf · p. 12","vr":1},{"id":"EAGS2024-C41-INF-070","s":"inf","y":2024,"c":"41","n":70,"a":"A","an":false,"du":false,"l":"","e":"Maria e Alice foram escaladas para a Comissão de\nRecebimento de Material da seção de Licitações. Cada uma recebeu um arquivo contendo uma lista com os materiais. Ao iniciar a tarefa, elas quiseram verificar a diferença de conteúdo nos dois arquivos de texto. Para efetuar essa operação no Sistema Operacional Linux, devem utilizar o seguinte comando:","o":{"A":"diff","B":"du","C":"df","D":"tail"},"t":"Sistemas operacionais","tp":"Linux, Unix, processos, arquivos e comandos","src":"prova_eags_2024_cod_41_10 05 2023 08 19 06.pdf · p. 12"},{"id":"EAGS2024-C41-INF-071","s":"inf","y":2024,"c":"41","n":71,"a":"D","an":false,"du":false,"l":"","e":"Relacione as colunas, considerando o assunto Lógica de\nProgramação, e, a seguir, assinale a alternativa com a sequência correta.\n1 – Diagrama de\nChapin\n( ) Permite descrever o método e a sequência do processo dos planos num computador.\n2 – Diagrama de Bloco ( ) Permite apresentar uma visão hierárquica e estruturada da lógica do programa.\n3 – Formas de\nRepresentação\nGráfica\n( ) Permite apresentar os dados sobre uma superfície plana, de maneira simples e concisa, facilitando a visualização completa e imediata dos dados ou fenômenos tabulados.","o":{"A":"1 - 2 - 3","B":"1 - 3 - 2","C":"2 - 3 - 1","D":"2 - 1 - 3"},"t":"Algoritmos e lógica","tp":"Fluxogramas, estruturas de controle e pseudocódigo","src":"prova_eags_2024_cod_41_10 05 2023 08 19 06.pdf · p. 12","vr":1},{"id":"EAGS2024-C41-INF-072","s":"inf","y":2024,"c":"41","n":72,"a":"D","an":false,"du":false,"l":"","e":"Assinale a alternativa que apresenta a saída do trecho de\nprograma em português estruturado. Considere A=8, B=2,\nC=4 e D=9.\nse (C>=1) .ou. (D<=7) então\nX ← (A + C)*(10 / B) senão\nX ← (D-1)/2 fim_se escreva X","o":{"A":"3","B":"4","C":"45","D":"60"},"t":"Algoritmos e lógica","tp":"Fluxogramas, estruturas de controle e pseudocódigo","src":"prova_eags_2024_cod_41_10 05 2023 08 19 06.pdf · p. 12"},{"id":"EAGS2024-C41-INF-073","s":"inf","y":2024,"c":"41","n":73,"a":"A","an":false,"du":false,"l":"","e":"Entre as alternativas, assinale a que apresenta o modo\nRAID que se utiliza da técnica de divisão de dados e grava informações de paridade.","o":{"A":"RAID 5","B":"RAID 1","C":"RAID 10","D":"RAID 0+1"},"t":"Linguagens de programação","tp":"Revisão manual da classificação","src":"prova_eags_2024_cod_41_10 05 2023 08 19 06.pdf · p. 12"},{"id":"EAGS2024-C41-INF-074","s":"inf","y":2024,"c":"41","n":74,"a":"B","an":false,"du":false,"l":"","e":"Em relação à forma com que os dados são transmitidos, marque V para verdadeiro ou F para falso. Em seguida, assinale a alternativa com a sequência correta.\n( ) Os bits são transmitidos simultaneamente na transmissão paralela.\n( ) A transmissão em série pode ser assíncrona ou síncrona.\n( ) A maior desvantagem da transmissão em série é a alta susceptibilidade a ruídos, devido à quantidade de fios.\n( ) A transmissão paralela, por transmitir por vários fios simultaneamente, sempre será mais rápida que a transmissão em série.","o":{"A":"V - F - V - F","B":"V - V - F - F","C":"F - F - V - V","D":"F - V - F - F"},"t":"Algoritmos e lógica","tp":"Fluxogramas, estruturas de controle e pseudocódigo","src":"prova_eags_2024_cod_41_10 05 2023 08 19 06.pdf · p. 12"},{"id":"EAGS2024-C41-INF-075","s":"inf","y":2024,"c":"41","n":75,"a":"","an":true,"du":false,"l":"","e":"Assinale a alternativa correspondente à função que permite incluir um determinado arquivo uma única vez pelo script do PHP no HTML.","o":{"A":"include","B":"require","C":"requireonce","D":"include_once"},"t":"Linguagens de programação","tp":"PHP, Java e sintaxe de linguagens","src":"prova_eags_2024_cod_41_10 05 2023 08 19 06.pdf · p. 12"},{"id":"EAGS2024-C41-INF-076","s":"inf","y":2024,"c":"41","n":76,"a":"A","an":false,"du":false,"l":"","e":"Visando auxiliar muitos projetistas e programadores, a comunidade de Orientação a Objetos listou padrões de projetos contendo identificação, nomeação e descrição dos conceitos de projetos recorrentes. Referente a esse assunto, assinale a alternativa que apresenta somente padrões de projeto.","o":{"A":"Iterator - Proxy - Adapter","B":"Adapter - Iterator - Unidade","C":"Adapter - Integração - Proxy","D":"Proxy - Integração - Unidade"},"t":"Linguagens de programação","tp":"Revisão manual da classificação","src":"prova_eags_2024_cod_41_10 05 2023 08 19 06.pdf · p. 13"},{"id":"EAGS2024-C41-INF-077","s":"inf","y":2024,"c":"41","n":77,"a":"A","an":false,"du":false,"l":"","e":"Avalie as informações abaixo sobre algoritmos de chave pública e simétrica.\nI- Algoritmos de chaves simétricas utilizam a mesma chave para codificação e decodificação.\nII- DES, em sua forma original, é um exemplo de algoritmo de chave simétrica.\nIII- RSA foi o primeiro algoritmo de chave simétrica criado.\nIV- A criptografia de chave pública exige que cada usuário tenha apenas uma única chave.\nEstá correto o que se afirma em","o":{"A":"I e II.","B":"I e III.","C":"II e IV.","D":"III e IV."},"t":"Segurança da informação","tp":"Autenticação, controle de acesso e proteção","src":"prova_eags_2024_cod_41_10 05 2023 08 19 06.pdf · p. 13","vr":1},{"id":"EAGS2024-C41-INF-078","s":"inf","y":2024,"c":"41","n":78,"a":"A","an":false,"du":false,"l":"","e":"Assinale a alternativa que completa correta e respectivamente as lacunas das sentenças abaixo, referentes a\nSistemas Operacionais.\nO gerenciamento de arquivos é realizado pelo Sistema\nOperacional, sendo estes protegidos, implementados, estruturados e nomeados. Desse modo, a parte do Sistema\nOperacional que trata dos arquivos é conhecida como\n_________________.\nUma das funções do Sistema Operacional é interceptar interrupções e tratar os erros, emitindo comandos para os dispositivos. Sabendo-se disso, uma das principais funções do\nSistema Operacional é _____________ todos os dispositivos\n_________________ de um computador.\nO Sistema Operacional, com a função de ser um gerenciador de recursos do sistema, é o primeiro programa a ser executado ao se ligar um computador, em um processo chamado de _________________.","o":{"A":"Sistema de Arquivos - controlar - de E/S (Entrada/ Saída) -\nBootstrapping","B":"Sistema de Início - controlar - de Entrada - Bootstrapping","C":"Sistema de Arquivos - separar - de Saída - Init","D":"Bootstrapping - separar - de Hardware - Init"},"t":"Sistemas operacionais","tp":"Linux, Unix, processos, arquivos e comandos","src":"prova_eags_2024_cod_41_10 05 2023 08 19 06.pdf · p. 13","vr":1},{"id":"EAGS2024-C41-INF-079","s":"inf","y":2024,"c":"41","n":79,"a":"A","an":false,"du":false,"l":"","e":"Avalie as informações abaixo sobre o IPsec.\nI- É orientado a conexões.\nII- Pode ser usado nos modos transporte e tunelamento.\nIII- Possui três partes principais: cabeçalho, corpo e mensagem.\nIV- Possui dados de protocolo chamados de associação de conexão remota.\nEstá correto o que se afirma em","o":{"A":"I e II.","B":"I e IV.","C":"II e III.","D":"III e IV."},"t":"Redes de computadores","tp":"Protocolos, endereçamento e arquitetura de redes","src":"prova_eags_2024_cod_41_10 05 2023 08 19 06.pdf · p. 13","vr":1},{"id":"EAGS2024-C41-INF-080","s":"inf","y":2024,"c":"41","n":80,"a":"A","an":false,"du":false,"l":"","e":"Em relação aos métodos do PHP, marque V para verdadeiro ou F para falso. Em seguida, assinale a alternativa com a sequência correta.\n( ) O método POST no PHP é o método padrão para envio de dados.\n( ) O método POST envia os dados do formulário por meio do corpo da mensagem encaminhada ao servidor.\n( ) Os métodos apenas declarados, mas sem implementação fornecida, chamam-se métodos neutros.\n( ) Um método construtor é aquele que será chamado toda vez em que for criado um objeto da classe onde ele foi declarado.","o":{"A":"F - V - F - V","B":"V - F - F - V","C":"F - V - V - F","D":"V - F - V - F"},"t":"Programação orientada a objetos","tp":"Classes, herança, encapsulamento e polimorfismo","src":"prova_eags_2024_cod_41_10 05 2023 08 19 06.pdf · p. 13"},{"id":"EAGS2024-C41-INF-081","s":"inf","y":2024,"c":"41","n":81,"a":"D","an":false,"du":false,"l":"","e":"Avalie as informações abaixo sobre segurança da comunicação.\nI- As VPNs (Virtual Private Networks) podem ser construídas diretamente sobre a internet.\nII- O DoS (Denial of Service) caracteriza-se por um ataque\ncujo objetivo é desativar o destino e não roubar os dados;\né chamado de ataque de negação de serviço.\nIII- O firewall inspeciona os pacotes que entram e saem da rede, funciona como um filtro de pacotes.\nIV- A DMZ (DeMilitarized Zone) é a parte da rede que cuida da segurança física do perímetro interno.\nEstá correto o que se afirma em","o":{"A":"I, II, III e IV.","B":"II, III e IV.","C":"I somente.","D":"I, II e III."},"t":"Redes de computadores","tp":"Protocolos, endereçamento e arquitetura de redes","src":"prova_eags_2024_cod_41_10 05 2023 08 19 06.pdf · p. 13","vr":1},{"id":"EAGS2024-C41-INF-082","s":"inf","y":2024,"c":"41","n":82,"a":"C","an":false,"du":false,"l":"","e":"Relacione as colunas quanto aos protocolos e suas respectivas camadas no modelo de referência TCP/IP. Em seguida, assinale a alternativa com a sequência correta. Obs.:\nOs números podem ser usados mais de uma vez.\n1 – Transporte\n( ) HTTP\n2 – Aplicação\n( ) SMTP\n3 – Enlace\n( ) UDP\n( ) TCP\n( ) DSL","o":{"A":"3 - 2 - 1 - 3 - 2","B":"2 - 3 - 3 - 1 - 1","C":"2 - 2 - 1 - 1 - 3","D":"3 - 1 - 2 - 2 - 3"},"t":"Redes de computadores","tp":"Protocolos, endereçamento e arquitetura de redes","src":"prova_eags_2024_cod_41_10 05 2023 08 19 06.pdf · p. 14"},{"id":"EAGS2024-C41-INF-083","s":"inf","y":2024,"c":"41","n":83,"a":"B","an":false,"du":false,"l":"","e":"Relacione as colunas quanto aos comandos utilizados para gerenciamento de redes no Sistema Operacional Linux.\nEm seguida, assinale a alternativa com a sequência correta.\n1 – ping\n( ) Pode ser utilizado informando- se o IP ou nome do host, revelando a sequencia de gateways até alcançar o IP de destino.\n2 – netstat\n( ) Analisa pacotes, fazendo o registro daqueles que atendem o critério especificado pelo usuário.\n3 – tcpdump\n( ) Serve para testar segmentos de rede e o estado dos hosts.\n4 – traceroute\n( ) Apresenta informações sobre a configuração e o estado das interfaces de rede do host, incluindo o estado das portas\nTCP e UDP ativas.","o":{"A":"1 - 2 - 3 - 4","B":"4 - 3 - 1 - 2","C":"2 - 4 - 1 - 3","D":"4 - 3 - 2 - 1"},"t":"Redes de computadores","tp":"Protocolos, endereçamento e arquitetura de redes","src":"prova_eags_2024_cod_41_10 05 2023 08 19 06.pdf · p. 14"},{"id":"EAGS2024-C41-INF-084","s":"inf","y":2024,"c":"41","n":84,"a":"B","an":false,"du":false,"l":"","e":"Em relação aos processos periódicos do Sistema\nOperacional Linux, marque V para verdadeiro ou F para falso nas sentenças abaixo. Em seguida, assinale a alternativa com a sequência correta.\n( ) A execução de tarefas periódicas é tratada pelo daemon cron e permanece em execução até realizar 3 ciclos.\n( ) Crontab é o nome dado ao arquivo de configuração do cron.\n( ) As atividades realizadas pelo cron são registradas em logs por meio do systemlog.\n( ) O cron, ao ser iniciado, lê todos seus arquivos de configuração, armazena-os na memória e entra em estado de repouso.","o":{"A":"V - V - F - F","B":"F - V - F - V","C":"F - F - V - V","D":"V - F - V - F"},"t":"Algoritmos e lógica","tp":"Fluxogramas, estruturas de controle e pseudocódigo","src":"prova_eags_2024_cod_41_10 05 2023 08 19 06.pdf · p. 14","vr":1},{"id":"EAGS2024-C41-INF-085","s":"inf","y":2024,"c":"41","n":85,"a":"","an":true,"du":false,"l":"","e":"O cabo de par trançado é muito utilizado em diferentes padrões de LAN. Assinale a alternativa que indica corretamente quantos pares são utilizados na Ethernet de\n100 Mbps.","o":{"A":"5","B":"4","C":"3","D":"2"},"t":"Redes de computadores","tp":"Protocolos, endereçamento e arquitetura de redes","src":"prova_eags_2024_cod_41_10 05 2023 08 19 06.pdf · p. 14"},{"id":"EAGS2024-C41-INF-086","s":"inf","y":2024,"c":"41","n":86,"a":"C","an":false,"du":false,"l":"","e":"Em relação à máscara de rede 255.255.255.192, assinale a alternativa que apresenta a correta notação binária.","o":{"A":"11111111.11111111.11111111.00000000","B":"11111111.11111111.11111111.10000000","C":"11111111.11111111.11111111.11000000","D":"11111111.11111111.11111111.11100000"},"t":"Redes de computadores","tp":"Protocolos, endereçamento e arquitetura de redes","src":"prova_eags_2024_cod_41_10 05 2023 08 19 06.pdf · p. 14"},{"id":"EAGS2024-C41-INF-087","s":"inf","y":2024,"c":"41","n":87,"a":"A","an":false,"du":false,"l":"","e":"Relacione as colunas quanto ao padrão Ethernet. Em seguida, assinale a alternativa com a sequência correta. Obs.:\nOs números podem ser usados mais de uma vez.\n1 – Hub\n( ) Caracterizam-se por estações no mesmo domínio de colisão.\n2 – Switch\n( ) Melhora o isolamento do tráfego, evitando que ele escape com facilidade.\n( ) Necessita do algoritmo de\nCSMA/CD para programar suas transmissões.\n( ) Encaminham o tráfego somente para as portas às quais eles foram destinados.\n( ) Cada porta é seu próprio domínio de colisão.","o":{"A":"1 - 2 - 1 - 2 - 2","B":"2 - 1 - 2 - 2 - 1","C":"1 - 2 - 2 - 1 - 1","D":"2 - 1 - 1 - 1 - 2"},"t":"Redes de computadores","tp":"Protocolos, endereçamento e arquitetura de redes","src":"prova_eags_2024_cod_41_10 05 2023 08 19 06.pdf · p. 14"},{"id":"EAGS2024-C41-INF-088","s":"inf","y":2024,"c":"41","n":88,"a":"B","an":false,"du":false,"l":"","e":"O tipo de lógica que tem como característica dividir um problema proposto em vários subproblemas a fim de facilitar a análise de cada rotina separadamente, é chamado de","o":{"A":"lógica linear.","B":"lógica modular.","C":"lógica hierárquica.","D":"lógica estruturada."},"t":"Linguagens de programação","tp":"Revisão manual da classificação","src":"prova_eags_2024_cod_41_10 05 2023 08 19 06.pdf · p. 14"},{"id":"EAGS2024-C41-INF-089","s":"inf","y":2024,"c":"41","n":89,"a":"D","an":false,"du":false,"l":"","e":"Em relação às topologias de rede, marque V para verdadeiro ou F para falso nas sentenças abaixo. Em seguida, assinale a alternativa com a sequência correta.\n( ) Barramento - Contém apenas um cabo backbone terminado em suas extremidades ao qual os hosts são todos conectados.\n( ) Anel - Liga um host ao outro; e o último, a um ponto\ncentral.\n( ) Estrela - Liga os hosts a um ponto central.\n( ) Malha - Liga cada host a todos os outros hosts.\n( ) Hierárquica - Une hosts ligados em malha a um ponto central.","o":{"A":"V - F - V - F - F","B":"F - V - F - V - V","C":"F - V - F - F - V","D":"V - F - V - V - F"},"t":"Redes de computadores","tp":"Protocolos, endereçamento e arquitetura de redes","src":"prova_eags_2024_cod_41_10 05 2023 08 19 06.pdf · p. 15","vr":1},{"id":"EAGS2024-C41-INF-090","s":"inf","y":2024,"c":"41","n":90,"a":"B","an":false,"du":false,"l":"","e":"Com o crescimento da internet, os endereços IPv4 se tornaram escassos. O endereçamento IPv6 seria a solução para o problema, mas a transição total de endereços ainda irá demorar um tempo. Para que não faltassem endereços IP foi necessária uma correção. Assinale a alternativa que indique a tecnologia usada para essa correção.","o":{"A":"CIDR","B":"NAT","C":"UDP","D":"FTP"},"t":"Redes de computadores","tp":"Protocolos, endereçamento e arquitetura de redes","src":"prova_eags_2024_cod_41_10 05 2023 08 19 06.pdf · p. 15"},{"id":"EAGS2024-C41-INF-091","s":"inf","y":2024,"c":"41","n":91,"a":"B","an":false,"du":false,"l":"","e":"Relacione as colunas quanto aos conceitos de POO. Em seguida, assinale a alternativa com a sequência correta.\n1 – Classe\n( ) É uma estrutura dinâmica que encapsula estado e comportamento.\n2 – Objeto\n( ) É executado automaticamente quando um objeto é instanciado utilizando o operador “new”.\n3 – Construtor\n( ) Trata-se de modelo ou template que permite a criação de idênticas estruturas dinâmicas.","o":{"A":"1 - 2 - 3","B":"2 - 3 - 1","C":"3 - 1 - 2","D":"3 - 2 - 1"},"t":"Programação orientada a objetos","tp":"Classes, herança, encapsulamento e polimorfismo","src":"prova_eags_2024_cod_41_10 05 2023 08 19 06.pdf · p. 15"},{"id":"EAGS2024-C41-INF-092","s":"inf","y":2024,"c":"41","n":92,"a":"A","an":false,"du":false,"l":"","e":"Assinale a alternativa que completa corretamente as lacunas abaixo.\nA______________ é a maior placa de circuito impresso dentro do computador. Nela são encontradas várias portas de comunicação para conexão de dispositivos internos e externos ao computador. Para conexão de dispositivos externos ao computador, são utilizadas portas do tipo __________.","o":{"A":"Placa-mãe - eSATA","B":"Placa de vídeo - SATA","C":"Placa de rede - PATA","D":"Placa USB - RATA"},"t":"Redes de computadores","tp":"Protocolos, endereçamento e arquitetura de redes","src":"prova_eags_2024_cod_41_10 05 2023 08 19 06.pdf · p. 15","vr":1},{"id":"EAGS2024-C41-INF-093","s":"inf","y":2024,"c":"41","n":93,"a":"C","an":false,"du":false,"l":"","e":"Assinale a alternativa que completa a lacuna do texto abaixo.\nA POO oferece um tipo especial de classe que não pode ser instanciada. Trata-se da classe ____________.","o":{"A":"empacotada","B":"concreta","C":"abstrata","D":"oculta"},"t":"Programação orientada a objetos","tp":"Classes, herança, encapsulamento e polimorfismo","src":"prova_eags_2024_cod_41_10 05 2023 08 19 06.pdf · p. 15","vr":1},{"id":"EAGS2024-C41-INF-094","s":"inf","y":2024,"c":"41","n":94,"a":"C","an":false,"du":false,"l":"","e":"Assinale a alternativa que indica um Sistema\nGerenciador de Banco de Dados (SGBD) não compatível com o PHP.","o":{"A":"SQLite","B":"MySQL","C":"TableQSL","D":"PostgreSQL"},"t":"Banco de dados","tp":"SQL, SGBD, modelagem e administração de dados","src":"prova_eags_2024_cod_41_10 05 2023 08 19 06.pdf · p. 15"},{"id":"EAGS2024-C41-INF-095","s":"inf","y":2024,"c":"41","n":95,"a":"B","an":false,"du":false,"l":"","e":"Assinale a alternativa que corresponde a um comando condicional no PHP.","o":{"A":"while","B":"switch","C":"foreach","D":"do...while"},"t":"Linguagens de programação","tp":"PHP, Java e sintaxe de linguagens","src":"prova_eags_2024_cod_41_10 05 2023 08 19 06.pdf · p. 15"},{"id":"EAGS2024-C41-INF-096","s":"inf","y":2024,"c":"41","n":96,"a":"C","an":false,"du":false,"l":"","e":"Wallace deseja alterar as permissões de um arquivo criado por ele para que seus amigos de turma possam realizar alterações. Qual comando ele deverá usar para que os membros do grupo informática possam realizar alterações no arquivo chamado Simulado que se encontra dentro do diretório /home ?\n- rwx r-- r-- 1 wallace informática 848 2022-05-05 13:01 Simulado","o":{"A":"chmod -R 744 /home/Simulado","B":"chmod 751 /home/Simulado","C":"chmod 760 /home/Simulado","D":"chmod 444 /home/Simulado"},"t":"Linguagens de programação","tp":"Revisão manual da classificação","src":"prova_eags_2024_cod_41_10 05 2023 08 19 06.pdf · p. 15"},{"id":"EAGS2024-C41-INF-097","s":"inf","y":2024,"c":"41","n":97,"a":"D","an":false,"du":false,"l":"","e":"Relacione as colunas quanto a conceitos e tipos de polimorfismo. Em seguida, assinale a alternativa com a sequência correta.\n1 – Sobreposição\n( ) Pode também receber o nome de polimorfismo ad-hoc.\n2 – Polimorfismo\n( ) Permite que o método seja declarado com o mesmo nome, mesmo tipo de retorno e mesma lista de parâmetros da sua progenitora.\n3 – Sobrecarga\n( ) Permite o uso do mesmo nome de método para muitos métodos diferentes.\nCada método difere apenas no número e no tipo de seus parâmetros.\n( ) Permite, em POO, que classes derivadas de uma mesma superclasse tenham métodos iguais, mas comportamentos diferentes, redefinidos em cada uma das classes filhas.","o":{"A":"3 - 2 - 2 - 1","B":"2 - 1 - 3 - 1","C":"2 - 2 - 1 - 3","D":"3 - 1 - 3 - 2"},"t":"Programação orientada a objetos","tp":"Classes, herança, encapsulamento e polimorfismo","src":"prova_eags_2024_cod_41_10 05 2023 08 19 06.pdf · p. 16"},{"id":"EAGS2024-C41-INF-098","s":"inf","y":2024,"c":"41","n":98,"a":"C","an":false,"du":false,"l":"","e":"Em relação aos modelos de Banco de Dados, assinale, entre as alternativas abaixo, o atributo da entidade que identifica apenas um objeto dessa unidade, cujo valor não se repete e não poderá receber valor nulo.","o":{"A":"Tupla","B":"Código","C":"Chave primária","D":"Valor secundário"},"t":"Banco de dados","tp":"SQL, SGBD, modelagem e administração de dados","src":"prova_eags_2024_cod_41_10 05 2023 08 19 06.pdf · p. 16","vr":1},{"id":"EAGS2024-C41-INF-099","s":"inf","y":2024,"c":"41","n":99,"a":"B","an":false,"du":false,"l":"","e":"Avalie as informações abaixo quanto à memória RAM.\nI- A quantidade de soquetes de memória presentes na placa- mãe determinará o limite de memória do computador.\nII- A instalação de mais memória RAM sempre deixará o computador com processamento mais rápido.\nIII- Memórias ECC são usadas em servidores por possuírem um algoritimo que identifica e corrige erros (Código de\nCorreção de Erros).\nIV- A memória do computador não precisa ser compatível com o barramento de dados do processador.\nEstá correto o que se afirma em","o":{"A":"I e IV.","B":"I e III.","C":"III e II.","D":"II e IV."},"t":"Hardware e arquitetura","tp":"Componentes, memória, processamento e sistemas digitais","src":"prova_eags_2024_cod_41_10 05 2023 08 19 06.pdf · p. 16","vr":1},{"id":"EAGS2024-C41-INF-100","s":"inf","y":2024,"c":"41","n":100,"a":"A","an":false,"du":false,"l":"","e":"Em relação ao protocolo Domain Name System\n(DNS), marque V para verdadeiro ou F para falso nas sentenças abaixo. Em seguida, assinale a alternativa com a sequência correta.\n( ) A essência do DNS é a criação de um sistema distribuído de atribuição de IPs.\n( ) Os tipos de domínios de nível superior são divididos em dois: genéricos e de países.\n( ) O DNS é utilizado somente para publicar endereços IP em servidores através de um banco de dados local.\n( ) Uma organização chamada ICANN (Internet Corporation for Assigned Names and Numbers) controla o topo da hierarquia de nomes para a internet.","o":{"A":"F - V - F - V","B":"V - F - F - V","C":"V - F - V - F","D":"F - V - V - F\nRascunho"},"t":"Banco de dados","tp":"SQL, SGBD, modelagem e administração de dados","src":"prova_eags_2024_cod_41_10 05 2023 08 19 06.pdf · p. 16","vr":1},{"id":"EAGS2025-C52-PT-001","s":"por","y":2025,"c":"52","n":1,"a":"C","an":false,"du":false,"l":"","e":"Qual a principal mensagem transmitida pelo conto O espelho?","o":{"A":"Deve-se sempre confiar na própria imagem e não nos espelhos.","B":"O espelho representa, na verdade, um obstáculo para a aceitação de si mesmo.","C":"A reflexão e a introspecção são fundamentais para a compreensão da própria identidade.","D":"O espelho pode ser um objeto mágico que concede capacidade de transformação aos seres humanos."},"t":"Interpretação de texto","tp":"Compreensão, inferência e finalidade textual","src":"prova_eags_2025_cod_52_09 05 2024 14 59 33.pdf · p. 3","vr":1,"sp":8},{"id":"EAGS2025-C52-PT-002","s":"por","y":2025,"c":"52","n":2,"a":"D","an":false,"du":false,"l":"","e":"Leia as afirmativas a seguir que tratam das ideias do conto, adaptado, de Guimarães Rosa.\nI- A identidade é um conceito fixo e imutável.\nII- A construção da identidade se dá exclusivamente por meio da interação social.\nIII- O conto discorre sobre a necessidade de se buscar uma identidade única independente de influências externas.\nIV- A constituição da identidade, em essência, é uma tarefa solitária e individual, que depende apenas da vontade do sujeito.\nEstá correto o que se afirma em","o":{"A":"I e II.","B":"I e III.","C":"II e IV.","D":"III e IV."},"t":"Interpretação de texto","tp":"Compreensão, inferência e finalidade textual","src":"prova_eags_2025_cod_52_09 05 2024 14 59 33.pdf · p. 3","sp":8},{"id":"EAGS2025-C52-PT-003","s":"por","y":2025,"c":"52","n":3,"a":"D","an":false,"du":false,"l":"","e":"Em relação ao texto, é correto afirmar que","o":{"A":"a personagem do conto é uma figura alegórica, ou seja, representa também um elemento fora dela mesma.","B":"o autor narra uma história fantástica com o objetivo de propiciar reflexão quanto à presunção humana de entender a própria imagem.","C":"o autor se vale de analogia com elementos concretos\n(espelho e onça) para pensar sobre alterações fisionômicas e ímpetos instintivos do ser humano.","D":"o espelho (a reflexão/ a não reflexão da imagem) constitui um símbolo, que insere perspectiva e profundidade à experiência humana do conhecer a si mesmo."},"t":"Interpretação de texto","tp":"Compreensão, inferência e finalidade textual","src":"prova_eags_2025_cod_52_09 05 2024 14 59 33.pdf · p. 3","vr":1,"sp":8},{"id":"EAGS2025-C52-PT-004","s":"por","y":2025,"c":"52","n":4,"a":"A","an":false,"du":false,"l":"","e":"Assinale, entre as citações abaixo, a que ratifica o tema central do texto.","o":{"A":"“Somos seres de reflexão e reflexo.” (Clara Dias)","B":"“Profundo mesmo é o espelho, que vive fazendo reflexões.” (Crow Spike)","C":"“Muitas pessoas iriam se assustar se elas vissem no espelho não o reflexo do seu rosto, mas do seu caráter.”\n(Rodrigo Leal)","D":"“De frente pro espelho/ “eu e meus eus”,/ meus olhos e eu/ observando/ os reflexos ampliados/ das marcas do tempo,/ no corpo e na alma. (Rosa Berg)"},"t":"Interpretação de texto","tp":"Compreensão, inferência e finalidade textual","src":"prova_eags_2025_cod_52_09 05 2024 14 59 33.pdf · p. 3","vr":1,"sp":8},{"id":"EAGS2025-C52-PT-005","s":"por","y":2025,"c":"52","n":5,"a":"D","an":false,"du":false,"l":"","e":"Assinale a alternativa que apresenta outra forma de se fazer a oração de voz passiva contida no período que segue, sem se alterar os termos sintáticos nela presentes: A civilização pós-moderna culminou em um progresso inegável, que não foi percebido antecipadamente, em sua inteireza.","o":{"A":"Antecipadamente, em sua inteireza, a culminância de um progresso inegável não foi percebida pela civilização pós- moderna.","B":"A civilização pós-moderna não percebeu antecipadamente, em sua inteireza, um progresso inegável em que culminou.","C":"Não se percebeu antecipadamente, em sua inteireza, a culminância de um progresso inegável da civilização pós- moderna.","D":"Não se percebeu antecipadamente, em sua inteireza, um progresso inegável em que culminou a civilização pós- moderna."},"t":"Sintaxe","tp":"Período composto e orações","src":"prova_eags_2025_cod_52_09 05 2024 14 59 33.pdf · p. 3"},{"id":"EAGS2025-C52-PT-006","s":"por","y":2025,"c":"52","n":6,"a":"D","an":false,"du":false,"l":"","e":"Assinale a alternativa em que tanto a próclise quanto a ênclise dos pronomes podem ser admitidas, considerando-se as normas gramaticais.","o":{"A":"“Um raio/ Fulgura/ No espaço/ De luz;/ E trêmulo,/ E\npuro,/ Se aviva,/ S’esquiva,/ Rutila,/ Seduz.” (Gonçalves\nDias)","B":"“Quando me acontecer alguma penúria, passante de um milhão de cruzeiros, compro uma ilha.” (Carlos D. de\nAndrade)","C":"“Não se demoravam lá dentro e vinham ainda amarrando as calças ou saias.” (Aluísio Azevedo)","D":"“E ah! que desejo de a tomar nos braços...” (Olavo Bilac)"},"t":"Pronomes","tp":"Emprego e classificação dos pronomes","src":"prova_eags_2025_cod_52_09 05 2024 14 59 33.pdf · p. 4"},{"id":"EAGS2025-C52-PT-007","s":"por","y":2025,"c":"52","n":7,"a":"A","an":false,"du":false,"l":"","e":"Considerando a sequência de orações subordinadas adverbiais a seguir, assinale a alternativa que possui a classificação correta.\nHouvesse chegado uma hora antes, teria embarcado.\nPor mais que não trabalhassem, recebiam ajuda.\nComo não havia mais o que fazer, decidimos ir embora.","o":{"A":"condicional - concessiva - causal","B":"conclusiva - concessiva - temporal","C":"concessiva - explicativa - temporal","D":"condicional - conformativa - explicativa"},"t":"Sintaxe","tp":"Período composto e orações","src":"prova_eags_2025_cod_52_09 05 2024 14 59 33.pdf · p. 4"},{"id":"EAGS2025-C52-PT-008","s":"por","y":2025,"c":"52","n":8,"a":"C","an":false,"du":false,"l":"","e":"Leia:\nI- “Ele tem ao pé da porta/ Uma rasgada janela,/ É da sala aonde assiste/ A minha Marília bela” (Tomás Antônio\nGonzaga)\nII- “É a vaidade, Fábio, nesta vida,/ Rosa que da manhã lisonjeada/ (...)/ Airosa rompe, arrasta presumida”\n(Gregório de Matos)\nIII- “Vem, ó Marília, vem lograr comigo/ Destes alegres campos a beleza,/ Destas copadas árvores o abrigo.”\n(Bocage)\nIV- “Eis Bocage, em quem luz algum talento/ saíram dele mesmo estas verdades/ num dia em que se achou mais pachorrento.” (Bocage)\nHá predicado verbo-nominal em","o":{"A":"I, III e IV.","B":"I, II e III.","C":"II e IV.","D":"II e III."},"t":"Sintaxe","tp":"Termos da oração: sujeito e predicado","src":"prova_eags_2025_cod_52_09 05 2024 14 59 33.pdf · p. 4"},{"id":"EAGS2025-C52-PT-009","s":"por","y":2025,"c":"52","n":9,"a":"B","an":false,"du":false,"l":"","e":"No período “O professor exigia que todos comparecessem à palestra.”, a oração em destaque adquire valor sintático de","o":{"A":"sujeito.","B":"objeto direto.","C":"predicativo do sujeito.","D":"complemento nominal."},"t":"Sintaxe","tp":"Período composto e orações","src":"prova_eags_2025_cod_52_09 05 2024 14 59 33.pdf · p. 4"},{"id":"EAGS2025-C52-PT-010","s":"por","y":2025,"c":"52","n":10,"a":"C","an":false,"du":false,"l":"","e":"Relacione as colunas quanto aos termos em destaque nas orações. Em seguida, assinale a alternativa com a sequência correta.\n1 – Aposto\n( ) Manteve uma vontade saudosa, por dias e dias, de sua presença.\n2 – Objeto direto\n( ) Amigos ou parentes, ninguém soube dele.\n3 – Objeto indireto\n( ) D
