ros podem ser usados mais de uma vez.\n(    ) É útil quando se utiliza um\n1 – Padrão Adapter objeto que tem uma\n2 – Padrão Proxy interface incompatível.\n(    ) Controla o acesso entre seus objetos de forma\n3 – Padrão Interator transparente.\n(    ) Descreve um mecanismo para fazer laços pelos elementos de uma coleção.\n(    ) Fornece um modo padronizado para percorrer coleções e para ocultar do usuário a implementação da coleção.\n(    ) Apresenta uma solução alternativa, funciona empacotando o objeto incompatível dentro de um objeto adaptador compatível.","o":{"A":"1 - 2 - 3 - 3 - 1","B":"3 - 2 - 2 - 3 - 3","C":"1 - 1 - 2 - 3 - 3","D":"2 - 1 - 3 - 1 - 3"},"t":"Algoritmos e lógica","tp":"Fluxogramas, estruturas de controle e pseudocódigo","src":"EAGS_2022_codigo_27_SIN.pdf · p. 12"},{"id":"EAGS2022-C27-INF-083","s":"inf","y":2022,"c":"27","n":83,"a":"B","an":false,"du":false,"l":"","e":"Qual o nome da unidade básica da tecnologia Bluetooth, que consiste em um nó mestre e até sete nós escravos ativos numa distância de 10 metros?","o":{"A":"slimnet","B":"piconet","C":"nanonet","D":"micronet"},"t":"Redes de computadores","tp":"Bluetooth: topologia piconet e comunicação sem fio","src":"EAGS_2022_codigo_27_SIN.pdf · p. 12"},{"id":"EAGS2022-C27-INF-084","s":"inf","y":2022,"c":"27","n":84,"a":"B","an":false,"du":false,"l":"","e":"No contexto de segurança da informação, há um termo específico para um golpe na internet que compromete serviços\nDNS. Assinale a alternativa que apresenta corretamente o termo utilizado.","o":{"A":"hoax","B":"pharming","C":"e-mail spoofing","D":"internet banking"},"t":"Redes de computadores","tp":"Protocolos, endereçamento e arquitetura de redes","src":"EAGS_2022_codigo_27_SIN.pdf · p. 12"},{"id":"EAGS2022-C27-INF-085","s":"inf","y":2022,"c":"27","n":85,"a":"","an":true,"du":false,"l":"","e":"Assinale a alternativa que apresenta o tipo de variável que tem por característica seu dimensionamento com tamanho fixo.","o":{"A":"real","B":"inteiro","C":"constante","D":"matriz unidimensional"},"t":"Algoritmos e lógica","tp":"Fluxogramas, estruturas de controle e pseudocódigo","src":"EAGS_2022_codigo_27_SIN.pdf · p. 12"},{"id":"EAGS2022-C27-INF-086","s":"inf","y":2022,"c":"27","n":86,"a":"C","an":false,"du":false,"l":"","e":"Em relação aos principais conceitos e práticas da\nProgramação Orientada a Objetos, marque V para verdadeiro e F para falso. Em seguida, assinale a alternativa com a sequência correta.\n(    ) O processo de desenvolvimento OO é interativo.\n(    ) Através do processo de POO, é possível pegar o modelo de domínio e construir o modelo de objeto de sua solução.\n(    ) Dois passos importantes são o desenvolvimento dos pontos de interação e o detalhamento dos relacionamentos entre os objetos.\n(    ) O modelo de objetos descreve os aspectos arquitetonicamente significativos de seu sistema, como a estrutura e os relacionamentos dos objetos.","o":{"A":"F - V - F - F","B":"V - F - V - F","C":"V - V - V - V","D":"F - F - F - V"},"t":"Programação orientada a objetos","tp":"Classes, herança, encapsulamento e polimorfismo","src":"EAGS_2022_codigo_27_SIN.pdf · p. 12"},{"id":"EAGS2022-C27-INF-087","s":"inf","y":2022,"c":"27","n":87,"a":"C","an":false,"du":false,"l":"","e":"Relacione as colunas quanto à estrutura de arquivos. Em seguida, assinale a alternativa com a sequência correta.\n1 – file.bak\n(    ) arquivo-objeto\n2 – file.o\n(    ) arquivo de textos\n3 – file.tex\n(    ) arquivo de cópia de segurança\n4 – file.txt\n(    ) entrada para o programa de formatação TEX","o":{"A":"1 - 2 - 3 - 4","B":"2 - 3 - 1 - 4","C":"2 - 4 - 1 - 3","D":"1 - 2 - 4 - 3"},"t":"Segurança da informação","tp":"Autenticação, controle de acesso e proteção","src":"EAGS_2022_codigo_27_SIN.pdf · p. 12"},{"id":"EAGS2022-C27-INF-088","s":"inf","y":2022,"c":"27","n":88,"a":"B","an":false,"du":false,"l":"","e":"A expressão “O cérebro de um computador” trata de um componente de um computador. Assinale a alternativa que define essa expressão.","o":{"A":"placa mãe","B":"processador","C":"memória RAM","D":"placa de vídeo"},"t":"Hardware e arquitetura","tp":"Componentes, memória, processamento e sistemas digitais","src":"EAGS_2022_codigo_27_SIN.pdf · p. 13"},{"id":"EAGS2022-C27-INF-089","s":"inf","y":2022,"c":"27","n":89,"a":"","an":true,"du":false,"l":"","e":"Para a execução de um banco de dados, utiliza-se o\n#psqlbd#. Assinale a alternativa que representa esse comando.","o":{"A":"Excluirá o banco de dados.","B":"Criará um novo banco de dados.","C":"Renomeará um banco de dados.","D":"Mostrará uma tela para gerenciamento do banco de dados."},"t":"Banco de dados","tp":"SQL, SGBD, modelagem e administração de dados","src":"EAGS_2022_codigo_27_SIN.pdf · p. 13"},{"id":"EAGS2022-C27-INF-090","s":"inf","y":2022,"c":"27","n":90,"a":"A","an":false,"du":false,"l":"","e":"Complete a frase a seguir utilizando os modos de transmissão de dados e depois assinale com a alternativa correta.\nEsse tipo de transmissão de dados, é _________ mas, por compartilharem um mesmo canal de comunicação, não é possível transmitir e receber dados ao mesmo tempo.","o":{"A":"bidirecional","B":"unidirecional","C":"multifuncional","D":"multidimensional"},"t":"Redes de computadores","tp":"Modos de transmissão: comunicação half-duplex","src":"EAGS_2022_codigo_27_SIN.pdf · p. 13"},{"id":"EAGS2022-C27-INF-091","s":"inf","y":2022,"c":"27","n":91,"a":"D","an":false,"du":false,"l":"","e":"Sabendo-se que o CRON é um sistema, implementado pelo daemon crond, que permite o agendamento de tarefas no\nGNU/Linux, relacione as colunas quanto aos comandos de configuração e de operação, respectivamente, para cada sintaxe.\nEm seguida, assinale a alternativa com a sequência correta.\n(    ) Edita o crontab do usuário\n1 – crontab –l atual.\n2 – crontab –r\n(    ) Mostra o crontab do usuário atual.\n3 – crontab -e\n(    ) Remove todo o crontab do usuário atual.","o":{"A":"1 - 2 - 3","B":"2 - 1 - 3","C":"3 - 2 - 1","D":"3 - 1 - 2"},"t":"Sistemas operacionais","tp":"Linux, Unix, processos, arquivos e comandos","src":"EAGS_2022_codigo_27_SIN.pdf · p. 13","vr":1},{"id":"EAGS2022-C27-INF-092","s":"inf","y":2022,"c":"27","n":92,"a":"D","an":false,"du":false,"l":"","e":"O administrador de um banco de dados precisa modelar um projeto e possui restrições quanto à capacidade de armazenamento de dados. Para isso, carece de um tipo de dado em SQL que armazene sequência de caracteres de tamanho variável que estejam limitadas a 255 caracteres de comprimento. Assinale a alternativa que represente tal tipo de dado.","o":{"A":"char","B":"double","C":"integer","D":"varchar"},"t":"Banco de dados","tp":"SQL, SGBD, modelagem e administração de dados","src":"EAGS_2022_codigo_27_SIN.pdf · p. 13"},{"id":"EAGS2022-C27-INF-093","s":"inf","y":2022,"c":"27","n":93,"a":"D","an":false,"du":false,"l":"","e":"O comando chmod permite alterar as permissões de escrita, execução e leitura em ambiente Linux. Assinale a alternativa correta que descreve o resultado da sintaxe abaixo.\n# chmod 545 /etc/candidato","o":{"A":"Dá permissão de wxr ao dono, r ao grupo e wxr aos outros usuários, tudo em relação ao arquivo /etc/candidato.","B":"Dá permissão de xw ao dono, wr ao grupo e xw aos outros usuários, tudo em relação ao arquivo /etc/candidato.","C":"Dá permissão de wx ao dono, xr ao grupo e wx aos outros usuários, tudo em relação ao arquivo /etc/candidato.","D":"Dá permissão de xr ao dono, r ao grupo e xr aos outros usuários, tudo em relação ao arquivo /etc/candidato."},"t":"Sistemas operacionais","tp":"Linux, Unix, processos, arquivos e comandos","src":"EAGS_2022_codigo_27_SIN.pdf · p. 13"},{"id":"EAGS2022-C27-INF-094","s":"inf","y":2022,"c":"27","n":94,"a":"B","an":false,"du":false,"l":"","e":"Em relação ao conceito de criação de identificadores em\nJAVA, marque V para verdadeiro e F para falso. Em seguida, assinale a alternativa com a sequência correta.\n(    ) 5nome\n(    ) nome completo\n(    ) $tempo\n(   ) nome5","o":{"A":"F -V - F - F","B":"F - F - V - V","C":"V - V - F - V","D":"V - F - V - F"},"t":"Linguagens de programação","tp":"PHP, Java e sintaxe de linguagens","src":"EAGS_2022_codigo_27_SIN.pdf · p. 13"},{"id":"EAGS2022-C27-INF-095","s":"inf","y":2022,"c":"27","n":95,"a":"B","an":false,"du":false,"l":"","e":"Sobre criptografia, existe um tipo de registro eletrônico que faz distinção entre entidades e lhes atribui uma chave pública e é formado por um conjunto de dados. Assinale a alternativa que apresenta o termo relacionado a essas características.","o":{"A":"dicionário de dados","B":"certificado digital","C":"senha","D":"filtro"},"t":"Segurança da informação","tp":"Autenticação, controle de acesso e proteção","src":"EAGS_2022_codigo_27_SIN.pdf · p. 13"},{"id":"EAGS2022-C27-INF-096","s":"inf","y":2022,"c":"27","n":96,"a":"D","an":false,"du":false,"l":"","e":"Assinale a alternativa que se refere à sintaxe correta do comando de reinicialização de serviço de rede.","o":{"A":"/etc/init.d/networking stop","B":"/etc/init.d/networking down","C":"/etc/init.d/networking static","D":"/etc/init.d/networking restart"},"t":"Sistemas operacionais","tp":"Linux, Unix, processos, arquivos e comandos","src":"EAGS_2022_codigo_27_SIN.pdf · p. 13"},{"id":"EAGS2022-C27-INF-097","s":"inf","y":2022,"c":"27","n":97,"a":"D","an":false,"du":false,"l":"","e":"Em POO, quando uma classe herda de outra, ela herda implementação, comportamentos e atributos.\nUma classe construída através de herança pode ter três tipos importantes de métodos e atributos. Assinale a alternativa que contém os referidos tipos.","o":{"A":"raiz, folha, recursivo","B":"múltipla, raiz, sobreposto","C":"múltipla, novo, sobreposto","D":"sobreposto, novo, recursivo"},"t":"Programação orientada a objetos","tp":"Classes, herança, encapsulamento e polimorfismo","src":"EAGS_2022_codigo_27_SIN.pdf · p. 13"},{"id":"EAGS2022-C27-INF-098","s":"inf","y":2022,"c":"27","n":98,"a":"D","an":false,"du":false,"l":"","e":"Relacione as colunas de acordo com o resultado que será realizado após cada comando. Em seguida, assinale a alternativa com a sequência correta.\n(    ) Cria diretórios,\n1 – mkdir candidato respectivamente,\n2 – mkdir /candidato um dentro do\n3 – mkdir /tmp/candidato outro e todos\n4 – mkdir -p /tmp/candidato1/candidato2 dentro de /tmp.\n(    ) Cria diretório candidato na raiz do sistema.\n(    ) Cria o diretório candidato dentro do diretório\n/tmp.\n(    ) Cria diretório candidato dentro do diretório atual.","o":{"A":"1 - 2 - 4 - 3","B":"3 - 1 - 4 - 2","C":"3 - 4 - 1 - 2","D":"4 - 2 - 3 - 1"},"t":"Sistemas operacionais","tp":"Linux, Unix, processos, arquivos e comandos","src":"EAGS_2022_codigo_27_SIN.pdf · p. 14"},{"id":"EAGS2022-C27-INF-099","s":"inf","y":2022,"c":"27","n":99,"a":"B","an":false,"du":false,"l":"","e":"Um desenvolvedor PHP deseja que o conteúdo de uma dada string seja convertido para maiúsculo. Qual função PHP atende a tal necessidade?","o":{"A":"strup()","B":"strtoupper()","C":"strmaiusc()","D":"strhighbox()"},"t":"Linguagens de programação","tp":"PHP, Java e sintaxe de linguagens","src":"EAGS_2022_codigo_27_SIN.pdf · p. 14"},{"id":"EAGS2022-C27-INF-100","s":"inf","y":2022,"c":"27","n":100,"a":"A","an":false,"du":false,"l":"","e":"Considerando o contexto de segurança da informação, proteção de dados, recuperação de versões e arquivamento são possibilidades de um determinado recurso. Assinale a alternativa que apresenta esse recurso.","o":{"A":"backup","B":"firewall","C":"detecção","D":"incidente\nRascunho"},"t":"Segurança da informação","tp":"Autenticação, controle de acesso e proteção","src":"EAGS_2022_codigo_27_SIN.pdf · p. 14"},{"id":"EAGS2023-C26-PT-001","s":"por","y":2023,"c":"26","n":1,"a":"A","an":false,"du":false,"l":"","e":"A frase Não sabemos quando, nem onde, nem por que o homem resolveu pedir emancipação leva à seguinte conclusão a respeito da relação homem e Natureza:","o":{"A":"Há uma misteriosa causa para a percepção de que a existência humana pode prescindir de sua dependência para com a Natureza.","B":"O ser humano emancipou-se da Natureza; o tempo, o lugar\ne a explicação para essa sua atitude ainda hão de ser descobertos.","C":"A espécie humana sofrerá consequências inimagináveis por não ter buscado as verdadeiras causas de suas más ações.","D":"O homem resolveu clamar por liberdade, pois considera a\nNatureza inferior a ele."},"t":"Interpretação de texto","tp":"Compreensão, inferência e finalidade textual","src":"prova_eags 2023_todos_cod_.pdf · p. 219","sp":6},{"id":"EAGS2023-C26-PT-002","s":"por","y":2023,"c":"26","n":2,"a":"B","an":false,"du":false,"l":"","e":"Animais, vegetais e minerais, segundo o autor, conhecem, memorizam, elaboram e comunicam. Essa constatação indica que","o":{"A":"a Natureza é mais inteligente que o homem.","B":"a inteligência pode ser entendida como processo inerente aos reinos naturais.","C":"a inteligência é uma faculdade menor, se comum a homens e a animais, vegetais e minerais.","D":"a inteligência dos demais elementos dos reinos naturais é destituída da capacidade de sentir, o que torna o homem superior à Natureza."},"t":"Interpretação de texto","tp":"Compreensão, inferência e finalidade textual","src":"prova_eags 2023_todos_cod_.pdf · p. 219","sp":6},{"id":"EAGS2023-C26-PT-003","s":"por","y":2023,"c":"26","n":3,"a":"C","an":false,"du":false,"l":"","e":"Em relação à ideia de que o homem deveria olhar mais para a Natureza e sobretudo tratá-la de forma mais adequada, o autor","o":{"A":"retira dela seu apreço, constatando que, de fato, quem olha pelo homem é a Natureza.","B":"revela a contradição nela contida porque o fato de o homem olhar para a Natureza mostra que dela faz parte.","C":"aponta-a como uma frase pouco inteligente, apesar de amplamente encarecida e crível como senso comum.","D":"considera-a digna de enaltecimento, ou de ser encarecida, por focar o cuidado e a diligência do homem para com a natureza."},"t":"Interpretação de texto","tp":"Compreensão, inferência e finalidade textual","src":"prova_eags 2023_todos_cod_.pdf · p. 219","sp":6},{"id":"EAGS2023-C26-PT-004","s":"por","y":2023,"c":"26","n":4,"a":"A","an":false,"du":false,"l":"","e":"A visão inteligente da Natureza a respeito do homem evidencia-se no trecho:","o":{"A":"“Talvez a Natureza olhe para ele com mais inteligência e paciência, pois, se não o fizesse, já o teria aniquilado.”","B":"“...deveria integrar-se com inteligência nos processos e no equilíbrio perfeitos...”","C":"“Animais, vegetais e minerais conhecem, porque vivem em\ncontato com o meio ambiente;...”","D":"“É a faculdade de conhecer as ideias e as relações que existem entre elas.”"},"t":"Interpretação de texto","tp":"Compreensão, inferência e finalidade textual","src":"prova_eags 2023_todos_cod_.pdf · p. 219","sp":6},{"id":"EAGS2023-C26-PT-005","s":"por","y":2023,"c":"26","n":5,"a":"A","an":false,"du":false,"l":"","e":"Assinale a alternativa em que as orações em destaque classificam-se, respectivamente, em subordinada substantiva e subordinada adjetiva.","o":{"A":"“Que importa a mim que a bicharia roa/ Todo o meu coração, depois da morte?/ (...) Fique batendo nas perpétuas grades/ Do último verso que eu fizer no mundo!” (Augusto dos Anjos)","B":"“A cidadezinha, onde moro, lembra soldado que fraqueasse na marcha e, não podendo acompanhar o batalhão, à beira do caminho se deixasse ficar.”\n(Monteiro Lobato)","C":"“... não há nada mais fácil de compreender que a história do mundo, que muita gente teima em afirmar ser complicada para o entendimento rude do povo.” (José\nSaramago)","D":"“Canudos (...) caiu no dia 5, ao entardecer, quando caíram os seus defensores, que todos morreram.”\n(Euclides da Cunha)"},"t":"Sintaxe","tp":"Período composto e orações","src":"prova_eags 2023_todos_cod_.pdf · p. 219"},{"id":"EAGS2023-C26-PT-006","s":"por","y":2023,"c":"26","n":6,"a":"B","an":false,"du":false,"l":"","e":"Leia:\nNo dia seguinte fez-se o enterro, que foi um dos mais concorridos que ainda viram os moradores do Andaraí.\nCerca de duzentas pessoas acompanharam o finado até a morada última, achando-se representadas entre elas as primeiras classes da sociedade. (Machado de Assis)\nOs sujeitos presentes no trecho acima classificam-se em","o":{"A":"ocultos.","B":"simples.","C":"compostos.","D":"indeterminados."},"t":"Interpretação de texto","tp":"Compreensão, inferência e finalidade textual","src":"prova_eags 2023_todos_cod_.pdf · p. 220","vr":1},{"id":"EAGS2023-C26-PT-007","s":"por","y":2023,"c":"26","n":7,"a":"D","an":false,"du":false,"l":"","e":"Considere as afirmações seguintes sobre os encontros vocálicos em palavras do trecho: Quando eu passei a porta ela acordou. O primeiro som que lhe saiu da boca foi um grito de medo... (Álvares de Azevedo)\nI- Sete palavras contêm ditongo.\nII- Em saiu existem hiato e ditongo.\nIII- Não há ditongo oral crescente.\nIV- Em quando e primeiro há ditongo nasal.\nEstá correto o que se afirma em","o":{"A":"I, II III e IV.","B":"I e II apenas.","C":"II, III e IV.","D":"I, II e III."},"t":"Interpretação de texto","tp":"Compreensão, inferência e finalidade textual","src":"prova_eags 2023_todos_cod_.pdf · p. 220"},{"id":"EAGS2023-C26-PT-008","s":"por","y":2023,"c":"26","n":8,"a":"C","an":false,"du":false,"l":"","e":"Leia:\nMamãe vestida de rendas/ Tocava piano no caos/ Uma noite abriu as asas/ cansada de tanto som,/ Equilibrou-se no azul,/ De tonta não mais olhou/ Para mim, para ninguém!/\nCai no álbum de retratos. (Murilo Mendes)\nToda a linguagem poética dos versos acima retrata um fato posto em relevo pela seguinte figura de linguagem:","o":{"A":"antítese.","B":"hipérbole.","C":"eufemismo.","D":"prosopopeia."},"t":"Semântica e estilística","tp":"Sentido, relações semânticas e figuras de linguagem","src":"prova_eags 2023_todos_cod_.pdf · p. 220","vr":1},{"id":"EAGS2023-C26-PT-009","s":"por","y":2023,"c":"26","n":9,"a":"D","an":false,"du":false,"l":"","e":"Marque a alternativa correta quanto à regência nominal em destaque.","o":{"A":"Era farmacêutico e residente à rua mais movimentada do lugar.","B":"A senhora era devota com todos os santos e rezava incessantemente.","C":"No bairro contíguo do outro, o futebol de fim de semana era sagrado.","D":"Seu jeito indulgente para com os mais necessitados atraía-lhe muito mais afeto."},"t":"Regência","tp":"Regência verbal e nominal","src":"prova_eags 2023_todos_cod_.pdf · p. 220"},{"id":"EAGS2023-C26-PT-010","s":"por","y":2023,"c":"26","n":10,"a":"D","an":false,"du":false,"l":"","e":"Leia:\nTu és o Poeta, o grande Assinalado / que povoas o mundo despovoado de belezas eternas, pouco a pouco. (Cruz e Sousa)\nO termo destacado, nos versos acima, exerce a função sintática de","o":{"A":"aposto.","B":"objeto indireto.","C":"adjunto adnominal.","D":"complemento nominal."},"t":"Sintaxe","tp":"Termos da oração: complementos e adjuntos","src":"prova_eags 2023_todos_cod_.pdf · p. 220","vr":1},{"id":"EAGS2023-C26-PT-011","s":"por","y":2023,"c":"26","n":11,"a":"A","an":false,"du":false,"l":"","e":"Leia:\nO Pai, pequeno sitiante, lidava com vacas e arroz; a\nMãe, urucuiana, nunca tirava o têrço da mão, mesmo quando matando galinha ou passando descompostura em alguém.\n(Guimarães Rosa)\nReescrevendo-se o texto acima sem se alterar o seu sentido original, considera-se que a pontuação segue a norma padrão em qual alternativa?","o":{"A":"Pequeno sitiante, o pai lidava com vacas e arroz; a mãe\nurucuiana, mesmo quando matando galinha, ou passando descompostura em alguém, nunca tirava o terço da mão.","B":"Pequeno sitiante o pai, com vacas e arroz lidava. Mesmo a mãe, quando matando galinha ou passando descompostura em alguém, urucuiana, nunca tirava o terço da mão.","C":"Lidava o pai, pequeno sitiante, com vacas e arroz.\nUrucuiana, a mãe nunca tirava o terço da mão; mesmo\nquando matando galinha ou passando descompostura em alguém.","D":"Com vacas e arroz, lidava o pequeno sitiante, o pai; a mãe\nmesmo, quando matando galinha ou passando descompostura em alguém, nunca tirava o terço da mão, a urucuiana."},"t":"Interpretação de texto","tp":"Compreensão, inferência e finalidade textual","src":"prova_eags 2023_todos_cod_.pdf · p. 220","vr":1},{"id":"EAGS2023-C26-PT-012","s":"por","y":2023,"c":"26","n":12,"a":"D","an":false,"du":false,"l":"","e":"Nas alternativas abaixo, estão transcritos versos retirados do poema Sentimento do mundo, de Carlos\nDrummond de Andrade. Marque aquela que não apresenta adjunto adnominal.","o":{"A":"“Tenho apenas duas mãos / e o sentimento do mundo,...”","B":"“...e o corpo transige / na confluência do amor.”","C":"“...minhas lembranças escorrem...”","D":"“...mas estou cheio de escravos,...”"},"t":"Sintaxe","tp":"Termos da oração: complementos e adjuntos","src":"prova_eags 2023_todos_cod_.pdf · p. 220","vr":1},{"id":"EAGS2023-C26-PT-013","s":"por","y":2023,"c":"26","n":13,"a":"","an":true,"du":false,"l":"","e":"Leia:\nI- Eu lhe chamo estado de espírito. (Carlos D. de Andrade)\nII- Excelente senhora, a patroa. (Monteiro Lobato)\nIII- Um silêncio imenso dormia à beira do rio Uraricoera.\n(Mário de Andrade)\nIV- Só e triste vivia o pobre marceneiro José dos Andrajos.\n(Millôr Fernandes)\nAssinale a alternativa que traz a correta e respectiva classificação dos predicados das sentenças acima.","o":{"A":"predicado nominal, predicado verbal, predicado verbal, predicado nominal.","B":"predicado verbal, predicado verbo-nominal, predicado nominal, predicado verbal","C":"predicado verbo-nominal, predicado nominal, predicado verbal, predicado verbal","D":"predicado verbo-nominal, predicado nominal, predicado verbo-nominal, predicado verbal"},"t":"Sintaxe","tp":"Termos da oração: sujeito e predicado","src":"prova_eags 2023_todos_cod_.pdf · p. 221","vr":1},{"id":"EAGS2023-C26-PT-014","s":"por","y":2023,"c":"26","n":14,"a":"A","an":false,"du":false,"l":"","e":"Assinale a alternativa que apresenta discurso indireto.","o":{"A":"“O homem perguntou aos vizinhos, aos conhecidos, se sabiam de tal cidade. Ninguém sabia. (...) Por fim, perguntou ao seu coração, e seu coração lhe respondeu que, quando se quer o que ninguém conhece, melhor é ir procurar pessoalmente.” (Marina Colasanti)","B":"“O rumor crescia, condensando-se; o zum-zum de todos os\ndias acentuava-se, já se não destacavam vozes dispersas, mas sim um só ruído compacto que enchia todo o cortiço.”\n(Aluísio Azevedo)","C":"“Quando Estêvão a saudou, como quem a conhecia de\nlongo tempo, ela mal pôde retribuir-lhe o cumprimento; em\ntodo o resto da noite não lhe deu palavra.” (Machado de\nAssis)","D":"“A resposta de Félix foi um sorriso ambíguo, que podia ser benevolente ou malévolo, mas que pareceu não produzir impressão no hóspede.” (Machado de Assis)"},"t":"Sintaxe","tp":"Revisão manual da classificação","src":"prova_eags 2023_todos_cod_.pdf · p. 221"},{"id":"EAGS2023-C26-PT-015","s":"por","y":2023,"c":"26","n":15,"a":"C","an":false,"du":false,"l":"","e":"Marque a alternativa incorreta, considerando a conversão da voz ativa em passiva na frase: Desta vez, o pequeno abriria a vidraça da janela vagarosamente.","o":{"A":"A vidraça da janela seria vagarosamente aberta pelo pequeno desta vez.","B":"Seria aberta a vidraça da janela pelo pequeno vagarosamente desta vez.","C":"Vagarosamente, a vidraça da janela o pequeno abriria desta vez.","D":"Desta vez, abrir-se-ia a vidraça da janela vagarosamente."},"t":"Verbos","tp":"Tempos, modos e formas verbais","src":"prova_eags 2023_todos_cod_.pdf · p. 221"},{"id":"EAGS2023-C26-PT-016","s":"por","y":2023,"c":"26","n":16,"a":"D","an":false,"du":false,"l":"","e":"Assinale a alternativa cuja frase não contém verbo auxiliar.","o":{"A":"“Toda gente tinha achado estranha a maneira como o Cap.\nRodrigo Cambará entrara na vida de Santa Fé.”(Érico\nVeríssimo)","B":"“Nos primeiros dias cada família que chegava queria contar o que havia sofrido na viagem,...” (Jorge Amado)","C":"“— (...) Qual, ou nós estamos caducando ou o mundo está perdido...”(Monteiro Lobato)","D":"“A sina dele era correr mundo, andar para cima e para baixo, à toa,...”(Graciliano Ramos)"},"t":"Verbos","tp":"Tempos, modos e formas verbais","src":"prova_eags 2023_todos_cod_.pdf · p. 221"},{"id":"EAGS2023-C26-PT-017","s":"por","y":2023,"c":"26","n":17,"a":"C","an":false,"du":false,"l":"","e":"Leia:\nO palácio da Ventura (Antero de Quental)\nSonho que sou um cavaleiro andante.\nPor desertos, por sóis, por noite escura,\nPaladino do Amor, busco anelante\nO palácio encantado da Ventura!\nMas já desmaio, exausto e vacilante,\nQuebrada a espada já, rota a armadura...\nE eis que súbito o avisto, fulgurante\nNa sua pompa e aérea formosura!\nCom grandes golpes bato à porta e brado:\nEu sou o Vagabundo, o Deserdado...\nAbri-vos, portas de ouro, ante meus ais!\nAbrem-se as portas de ouro, com fragor...\nMas dentro encontro só, cheio de dor,\nSilêncio e escuridão — e nada mais!\nNo soneto, classificam-se, respectivamente, em aposto e vocativo","o":{"A":"fulgurante e cheio de dor (versos 7 e 13).","B":"exausto e vacilante e o Deserdado (versos 5 e 10).","C":"Paladino do Amor e portas de ouro (versos 3 e 11).","D":"nada mais e Silêncio e escuridão (verso 14)."},"t":"Sintaxe","tp":"Termos da oração: complementos e adjuntos","src":"prova_eags 2023_todos_cod_.pdf · p. 221"},{"id":"EAGS2023-C26-PT-018","s":"por","y":2023,"c":"26","n":18,"a":"C","an":false,"du":false,"l":"","e":"Assinale a frase que contém predicativo do objeto.","o":{"A":"Você é muito esperto para isso!","B":"Triste e sem vida prosseguia o rapaz.","C":"Consideramos equivocada sua decisão.","D":"Parece impossível uma beleza tão radiante!"},"t":"Sintaxe","tp":"Termos da oração: sujeito e predicado","src":"prova_eags 2023_todos_cod_.pdf · p. 221"},{"id":"EAGS2023-C26-PT-019","s":"por","y":2023,"c":"26","n":19,"a":"C","an":false,"du":false,"l":"","e":"Assinale a alternativa correta quanto à flexão de tempo e de modo entre parênteses do verbo em destaque na frase.","o":{"A":"“— Se precisardes de uma testemunha, estou pronto.”\n(pretérito imperfeito do subjuntivo)","B":"“As chamas azuis subiram num círculo fechado.”\n(pretérito imperfeito do indicativo)","C":"“Assim permaneceria dali em diante.” (futuro do pretérito do indicativo)","D":"“O sol deixara a varanda.” (futuro do presente do indicativo)"},"t":"Verbos","tp":"Tempos, modos e formas verbais","src":"prova_eags 2023_todos_cod_.pdf · p. 221"},{"id":"EAGS2023-C26-PT-020","s":"por","y":2023,"c":"26","n":20,"a":"B","an":false,"du":false,"l":"","e":"Assinale a alternativa em que a colocação do pronome oblíquo está incorreta.","o":{"A":"Parece-me que já lhe comuniquei a decisão.","B":"Pelo menos por enquanto, me poupe de suas chateações.","C":"Aquelas pessoas, eu não as convidei em momento algum.","D":"Correto ele estaria se se apresentasse no horário marcado."},"t":"Pronomes","tp":"Emprego e classificação dos pronomes","src":"prova_eags 2023_todos_cod_.pdf · p. 222"},{"id":"EAGS2023-C26-PT-021","s":"por","y":2023,"c":"26","n":21,"a":"C","an":false,"du":false,"l":"","e":"Leia:\nPoesia não é o que o autor nomeia,/ é o que o leitor incendeia.\n(...) não é o que o autor dá na ceia,/ mas o que o leitor banqueteia.\n(Affonso Romano de Sant’Anna)\nAs orações subordinadas presentes aos versos acima classificam-se em","o":{"A":"substantivas predicativas.","B":"substantivas apositivas.","C":"adjetivas restritivas.","D":"adverbiais causais."},"t":"Interpretação de texto","tp":"Compreensão, inferência e finalidade textual","src":"prova_eags 2023_todos_cod_.pdf · p. 222","vr":1},{"id":"EAGS2023-C26-PT-022","s":"por","y":2023,"c":"26","n":22,"a":"C","an":false,"du":false,"l":"","e":"Assinale a alternativa em que o erro de grafia ali existente não pode ser explicado a partir do modo como a palavra é pronunciada.","o":{"A":"Estava triste; jamais acharia uma mantegueira como a que\nhavia se quebrado para repor seu belo jogo de porcelana.","B":"Os olhos de todos os jovens fãs acompanhavam a aterrizagem do avião que trazia, pela primeira vez, o grande astro musical ao país.","C":"A emocionante campanha pela arrecadação de alimentos para as famílias desabrigadas pelas incessantes chuvas obteve grande hêsito.","D":"Os telejornais fizeram ampla cobertura das reinvindicações dos profissionais de saúde para que pudessem trabalhar com segurança durante a pandemia."},"t":"Ortografia e acentuação","tp":"Ortografia, grafia e hífen","src":"prova_eags 2023_todos_cod_.pdf · p. 222"},{"id":"EAGS2023-C26-PT-023","s":"por","y":2023,"c":"26","n":23,"a":"A","an":false,"du":false,"l":"","e":"Relacione as colunas quanto ao processo de formação das palavras. Em seguida, assinale a alternativa com a sequência correta.\n1 – progresso\n( ) derivação regressiva\n2 – monarquia\n( ) derivação prefixal\n3 – resgate\n( ) composição por justaposição\n4 – bem-aventurança ( ) composição por aglutinação","o":{"A":"3 - 1 - 4 - 2","B":"1 - 2 - 4 - 3","C":"3 - 1 - 2 - 4","D":"1 - 4 - 3 - 2"},"t":"Formação de palavras","tp":"Estrutura e formação de palavras","src":"prova_eags 2023_todos_cod_.pdf · p. 222"},{"id":"EAGS2023-C26-PT-024","s":"por","y":2023,"c":"26","n":24,"a":"B","an":false,"du":false,"l":"","e":"Marque a alternativa correta considerando a concordância verbal.","o":{"A":"Poços de Caldas recebem diariamente recém-casados em lua de mel.","B":"A maior parte destas casas não possuem documentação regularizada.","C":"Tu por um lado e eu por outro o protegerás das opiniões alheias.","D":"Naquela região inóspita não haviam amigos."},"t":"Concordância","tp":"Concordância verbal e nominal","src":"prova_eags 2023_todos_cod_.pdf · p. 222"},{"id":"EAGS2023-C26-PT-025","s":"por","y":2023,"c":"26","n":25,"a":"D","an":false,"du":false,"l":"","e":"No trecho O homem do Censo entrará pelos bangalôs, pelas pensões, pelas casas de barro e de cimento armado, pelo sobrado e pelo apartamento, pelo cortiço e pelo hotel\n(...). (Rubem Braga), os termos acima destacados classificam- se como","o":{"A":"complemento nominal.","B":"agente da passiva.","C":"adjunto adverbial.","D":"objeto indireto."},"t":"Interpretação de texto","tp":"Compreensão, inferência e finalidade textual","src":"prova_eags 2023_todos_cod_.pdf · p. 222","vr":1},{"id":"EAGS2023-C26-PT-026","s":"por","y":2023,"c":"26","n":26,"a":"A","an":false,"du":false,"l":"","e":"Leia:\nApós anos esperando os resultados, trabalhando exaustivamente e buscando novas alternativas, cientistas anunciam que descobriram a partícula responsável por explicar como se comportam todos os componentes e forças existentes na natureza.\n(texto adaptado - www.folhauol.com.br - 23.07.2012)\nHá no texto acima quantas orações reduzidas?","o":{"A":"4","B":"3","C":"2","D":"1"},"t":"Interpretação de texto","tp":"Compreensão, inferência e finalidade textual","src":"prova_eags 2023_todos_cod_.pdf · p. 222","vr":1},{"id":"EAGS2023-C26-PT-027","s":"por","y":2023,"c":"26","n":27,"a":"D","an":false,"du":false,"l":"","e":"As frases das alternativas abaixo são todas retiradas do conto Gaetaninho, de Alcântara Machado. Assinale aquela em que não há objeto direto.","o":{"A":"“— Sabe o Gaetaninho?”","B":"“Grito materno sim: até filho surdo escuta.”","C":"“O Beppino naquela tarde atravessara de carro a cidade.”","D":"“Às dezessete horas do dia seguinte saiu um enterro da\nRua do Oriente (...)”."},"t":"Sintaxe","tp":"Termos da oração: complementos e adjuntos","src":"prova_eags 2023_todos_cod_.pdf · p. 222","vr":1},{"id":"EAGS2023-C26-PT-028","s":"por","y":2023,"c":"26","n":28,"a":"A","an":false,"du":false,"l":"","e":"Assinale a alternativa que contém a mesma figura de linguagem que se faz presente em: ... sábado era seu, mas ele queria que sua mulher e seu filho estivessem em casa enquanto ele tomava o seu sábado. (Clarice Lispector)","o":{"A":"“a fazenda dormia num silêncio recluso, a casa estava de luto...” (Raduan Nassar)","B":"“Parecia feita de canto e dança, de sol e luar, era de cravo e canela.” (Jorge Amado)","C":"“A palavra e a forma serão a tábua onde boiarei sobre vagalhões de mudez.” (Clarice Lispector)","D":"“Nunca sei ao certo/ Se sou um menino de dúvidas/ Ou um homem de fé/ Certezas o vento leva/ Só dúvidas permanecem de pé” (Paulo Leminski)"},"t":"Sintaxe","tp":"Revisão manual da classificação","src":"prova_eags 2023_todos_cod_.pdf · p. 223","vr":1},{"id":"EAGS2023-C26-PT-029","s":"por","y":2023,"c":"26","n":29,"a":"C","an":false,"du":false,"l":"","e":"Assinale a alternativa correta quanto à classificação das conjunções em destaque nas estrofes seguintes.\nMotivo (Cecília Meireles)\nEu canto porque o instante existe (1) e a minha vida está completa. (2)\nNão sou alegre nem triste:\nsou poeta.\n(...)\nSe desmorono ou se edifico, (3) se permaneço ou me desfaço,\n— não sei, não sei. Não sei se fico (4) ou passo. (5)\n(...)","o":{"A":"1 e 2 são coordenativas, explicativa e aditiva.","B":"5 é subordinativa proporcional.","C":"4 é subordinativa integrante.","D":"3 é subordinativa causal."},"t":"Sintaxe","tp":"Revisão manual da classificação","src":"prova_eags 2023_todos_cod_.pdf · p. 223"},{"id":"EAGS2023-C26-PT-030","s":"por","y":2023,"c":"26","n":30,"a":"C","an":false,"du":false,"l":"","e":"Assinale a alternativa em que há erro no emprego do pronome em destaque.","o":{"A":"Como desconhecia a origem do pacote que lhe fora entregue, passou o problema para o novo morador da casa.","B":"A chuva fria e forte deu-lhe na pele uma certa pancada dolorosa.","C":"Ele lhe amava e não compreendia aquela súbita desconfiança.","D":"Chegou-lhe a notícia de um modo ríspido, inesperado."},"t":"Pronomes","tp":"Emprego e classificação dos pronomes","src":"prova_eags 2023_todos_cod_.pdf · p. 223"},{"id":"EAGS2023-C26-PT-031","s":"por","y":2023,"c":"26","n":31,"a":"C","an":false,"du":false,"l":"","e":"Assinale a alternativa em que o agente da passiva não está explícito.","o":{"A":"Indelicadamente, despediram o funcionário por meio de uma rede social.","B":"Sumiram-se os rapazes pelos infindáveis corredores do colégio.","C":"As reformas fundamentais foram aprovadas por unanimidade.","D":"A canção é composta de belas metáforas."},"t":"Sintaxe","tp":"Revisão manual da classificação","src":"prova_eags 2023_todos_cod_.pdf · p. 223"},{"id":"EAGS2023-C26-PT-032","s":"por","y":2023,"c":"26","n":32,"a":"A","an":false,"du":false,"l":"","e":"Assinale a alternativa em que a flexão de gênero e de número dos substantivos em destaque está correta.","o":{"A":"O oficial colheu o depoimento do aldeão.\nA oficiala colheu os depoimentos dos aldeões.","B":"O maestro compôs uma verdadeira obra-prima!\nA maestrina compôs verdadeiras obra-primas!","C":"Em suas viagens, o frei nunca esquecia o guarda-chuva.\nEm suas viagens, a freira nunca esquecia os guardas-\n-chuvas.","D":"Naquele poema, as angústias do poeta evidenciam-se no refrão.\nNaquele poema, as angústias da poeta evidenciam-se nos refrãos."},"t":"Sintaxe","tp":"Revisão manual da classificação","src":"prova_eags 2023_todos_cod_.pdf · p. 223"},{"id":"EAGS2023-C26-PT-033","s":"por","y":2023,"c":"26","n":33,"a":"B","an":false,"du":false,"l":"","e":"Leia:\n“Mantenho o outrossim.”, “Retira o deveras.” e “Aliás é ótimo.”\nAs palavras destacadas nas frases acima, retiradas da crônica De Domingo, de Luís Fernando Veríssimo, assumem, no texto, natureza substantiva, embora, originalmente recebam a seguinte classificação morfológica:","o":{"A":"adjetivo.","B":"advérbio.","C":"conjunção.","D":"palavra denotativa de realce."},"t":"Interpretação de texto","tp":"Compreensão, inferência e finalidade textual","src":"prova_eags 2023_todos_cod_.pdf · p. 223","vr":1},{"id":"EAGS2023-C26-PT-034","s":"por","y":2023,"c":"26","n":34,"a":"D","an":false,"du":false,"l":"","e":"Assinale a alternativa em que o adjetivo destacado, quanto ao gênero, classifica-se como uniforme.","o":{"A":"O campeonato europeu daquele ano revelou grandes estrelas para a Copa do Mundo.","B":"O gesto encantador da pequena garota oferecendo seu cuidado ao pobre andarilho comoveu as redes sociais.","C":"Pesquisou tudo quanto pôde a respeito do povo pigmeu a fim de compor um ótimo trabalho escolar.","D":"A menina, nas roupas e nos gestos, esforçava-se por parecer mais madura diante dos garotos, mas seu olhar pueril a traía sempre."},"t":"Classes de palavras","tp":"Substantivo, adjetivo, advérbio e demais classes","src":"prova_eags 2023_todos_cod_.pdf · p. 223"},{"id":"EAGS2023-C26-PT-035","s":"por","y":2023,"c":"26","n":35,"a":"C","an":false,"du":false,"l":"","e":"Relacione as colunas quanto à classificação da oração subordinada adverbial. Em seguida, assinale a alternativa com a sequência correta.\n1 – temporal\n( ) “Se culpado há, é D. Inácia.”\n(Nélida Piñon)\n2 – concessiva ( ) “Quando os índios iam precipitar-se sobre o cavaleiro, Peri saltou no meio deles, (...)” (José de Alencar)\n3 – condicional\n( ) “Por mais que o compadre a questionasse, apenas murmurou algumas frases ininteligíveis (...)”\n(Manuel Antônio de Almeida)","o":{"A":"1 - 2 - 3","B":"2 - 3 - 1","C":"3 - 1 - 2","D":"3 - 2 - 1"},"t":"Sintaxe","tp":"Período composto e orações","src":"prova_eags 2023_todos_cod_.pdf · p. 224"},{"id":"EAGS2023-C26-PT-036","s":"por","y":2023,"c":"26","n":36,"a":"B","an":false,"du":false,"l":"","e":"Assinale a alternativa em que há duas possibilidades de leitura da frase, sendo para uma delas necessário o acento indicativo de crase. Obs.: podem ter sido retirados acentos indicativos de crase nas demais alternativas.","o":{"A":"Embarcou emocionado rumo a Roma das fecundas conquistas de seus antepassados.","B":"E a própria mágoa revelou o tortuoso caminho do perdão, e a dor lancinante que afogava o peito... passou.","C":"O coração não fazia objeções a distância que deveria percorrer para conseguir, ainda que fosse, um breve olhar...","D":"Escapando furiosa do bico da caneta, escondeu a escura tinta as lembranças que, no fundo, desejava esquecer."},"t":"Crase","tp":"Emprego do acento indicativo de crase","src":"prova_eags 2023_todos_cod_.pdf · p. 224"},{"id":"EAGS2023-C26-PT-037","s":"por","y":2023,"c":"26","n":37,"a":"A","an":false,"du":false,"l":"","e":"Relacione as colunas quanto à classificação do período composto. Em seguida, assinale a alternativa com a sequência correta.\n1 – coordenação ( ) “Vim para sofrer as influências do tempo / E para afirmar o princípio eterno de onde vim.”\n(Murilo Mendes)\n2 – subordinação ( ) “Anda o sol pelas campinas/e passeia a mão dourada / pelas águas, pelas folhas...” (Cecília\nMeireles)\n3 – coordenação e subordinação\n( ) “A mão que afaga é a mesma que apedreja.” (Augusto dos\nAnjos)","o":{"A":"3 - 1 - 2","B":"1 - 2 - 3","C":"2 - 3 - 1","D":"3 - 2 - 1"},"t":"Sintaxe","tp":"Revisão manual da classificação","src":"prova_eags 2023_todos_cod_.pdf · p. 224"},{"id":"EAGS2023-C26-PT-038","s":"por","y":2023,"c":"26","n":38,"a":"B","an":false,"du":false,"l":"","e":"Assinale a alternativa que contém uma palavra na qual deve haver colocação de acento agudo, decorrente das normas de acentuação.","o":{"A":"Era desalentador olhar para um jovem tão belo, mas de olhos tão avaros.","B":"A paisagem trazia à mente o som das citaras e os romances arcadianos.","C":"Emocionou-se diante do condor, com suas asas que pareciam abraçar o mundo.","D":"Era, para a maioria, um homem austero, e somente para poucos oferecia seu sorriso e sua alma."},"t":"Ortografia e acentuação","tp":"Ortografia, grafia e hífen","src":"prova_eags 2023_todos_cod_.pdf · p. 224"},{"id":"EAGS2023-C26-PT-039","s":"por","y":2023,"c":"26","n":39,"a":"C","an":false,"du":false,"l":"","e":"Leia:\n— Quantos são aqui?(...)\nE o outro:\n— Dois, cidadão, somos dois. Naturalmente, o senhor não a vê. Mas ela está aqui, está, está! A sua saudade jamais sairá do meu quarto e do meu peito! (Rubem Braga)\nNo texto acima, há a presença de quantos tipos de pronome?","o":{"A":"6","B":"5","C":"4","D":"3"},"t":"Interpretação de texto","tp":"Compreensão, inferência e finalidade textual","src":"prova_eags 2023_todos_cod_.pdf · p. 224","vr":1},{"id":"EAGS2023-C26-PT-040","s":"por","y":2023,"c":"26","n":40,"a":"D","an":false,"du":false,"l":"","e":"Em relação à conjugação dos verbos destacados nas frases abaixo, marque V para verdadeiro e F para falso. Em seguida, assinale a alternativa com a sequência correta.\n( ) Insististes para que fôssemos ter com o juiz da cidade. —\n2.ª pessoa do plural do pretérito perfeito do indicativo.\n( ) Pergunta pela minha tristeza, mas digo que dela não sei. — 2.ª pessoa do singular do imperativo afirmativo.\n( ) Quando disseres a verdade, todos hão de compreender o que houve. — 2.ª pessoa do singular do futuro do presente do indicativo.\n( ) A notícia do petróleo chegou, e, infelizmente vendêreis as terras para mãos estranhas à família. — 2.ª pessoa do plural do pretérito mais que perfeito do indicativo.","o":{"A":"F - V - V - F","B":"V - F - F - F","C":"F - V - V - V","D":"V - F - F - V\nAS QUESTÕES DE 41 A 100 REFEREM-SE\nÀ INFORMÁTICA"},"t":"Sintaxe","tp":"Revisão manual da classificação","src":"prova_eags 2023_todos_cod_.pdf · p. 224","vr":1},{"id":"EAGS2023-C26-INF-041","s":"inf","y":2023,"c":"26","n":41,"a":"A","an":false,"du":false,"l":"","e":"Qual forma de virtualização modifica o código-fonte do sistema operacional hóspede, de modo que, ao invés de executar instruções sensíveis, execute hiperchamadas?","o":{"A":"Paravirtualização.","B":"Hipervirtualização.","C":"Virtualização completa.","D":"Virtualização processual."},"t":"Sistemas operacionais","tp":"Linux, Unix, processos, arquivos e comandos","src":"prova_eags 2023_todos_cod_.pdf · p. 225"},{"id":"EAGS2023-C26-INF-042","s":"inf","y":2023,"c":"26","n":42,"a":"B","an":false,"du":false,"l":"","e":"Fabiana criou, na ferramenta de linha de comando do\nMySQL, o banco de dados chamado prova e, após ter ingressado no EAGS, deseja remover esse banco de dados completamente utilizando a linguagem SQL. Qual instrução ela deve utilizar?","o":{"A":"USE DATABASE prova;","B":"DROP DATABASE prova;","C":"SHOW EAGS;","D":"DEL prova;"},"t":"Banco de dados","tp":"SQL, SGBD, modelagem e administração de dados","src":"prova_eags 2023_todos_cod_.pdf · p. 225"},{"id":"EAGS2023-C26-INF-043","s":"inf","y":2023,"c":"26","n":43,"a":"C","an":false,"du":false,"l":"","e":"Com o advento da pandemia da COVID-19, muitas empresas aderiram ao teletrabalho devido à necessidade do isolamento social. Qual tecnologia deve ser utilizada para que seja possível o acesso às redes privadas pelos funcionários que trabalham por esse meio, de modo a garantir a confidencialidade dos dados a serem transmitidos?","o":{"A":"ARP","B":"URL","C":"VPN","D":"VLAN"},"t":"Redes de computadores","tp":"Protocolos, endereçamento e arquitetura de redes","src":"prova_eags 2023_todos_cod_.pdf · p. 225"},{"id":"EAGS2023-C26-INF-044","s":"inf","y":2023,"c":"26","n":44,"a":"A","an":false,"du":false,"l":"","e":"No contexto da segurança da informação, qual a diferença entre worm e vírus?","o":{"A":"O worm é capaz de se autopropagar pelas redes, enviando suas cópias de host para host, e o vírus não.","B":"O worm embute cópias de si mesmo em outros programas e necessita ser executado para se propagar, e o vírus não.","C":"O vírus explora automaticamente os erros de configuração na rede, para se copiar em locais acessíveis, e o worm não.","D":"O vírus insere cópias, tornando-se parte de outros programas de forma autônoma, sem precisar ser executado, e o worm não."},"t":"Redes de computadores","tp":"Protocolos, endereçamento e arquitetura de redes","src":"prova_eags 2023_todos_cod_.pdf · p. 225"},{"id":"EAGS2023-C26-INF-045","s":"inf","y":2023,"c":"26","n":45,"a":"B","an":false,"du":false,"l":"","e":"Analise a tabela seguinte:\nCURSO\nNOME\nVAGAS\nCPCAR\n100\nEPCAR\n200\nEAGS\n300\nAssinale a alternativa que contém os registros armazenados na tabela acima, após a execução da instrução SQL abaixo.\nUPDATE CURSO SET VAGAS = 350 WHERE NOME\n= ‘EAGS’;","o":{"A":"CURSO\nNOME\nVAGAS\nCPCAR\n100\nEPCAR\n200\nCURSO\n350","B":"CURSO\nNOME\nVAGAS\nCPCAR\n100\nEPCAR\n200\nEAGS\n350","C":"CURSO\nNOME\nVAGAS\nCPCAR\n100\nEPCAR\n200\nCURSO\n300","D":"CURSO\nNOME\nVAGAS\nCPCAR\n100\nEPCAR\n200\nCURSO\nEAGS"},"t":"Banco de dados","tp":"SQL, SGBD, modelagem e administração de dados","src":"prova_eags 2023_todos_cod_.pdf · p. 225","vr":1},{"id":"EAGS2023-C26-INF-046","s":"inf","y":2023,"c":"26","n":46,"a":"C","an":false,"du":false,"l":"","e":"Na Programação Orientada a Objetos, para se instanciar um objeto de uma classe, utiliza-se qual operador?","o":{"A":"get","B":"set","C":"new","D":"novo"},"t":"Programação orientada a objetos","tp":"Classes, herança, encapsulamento e polimorfismo","src":"prova_eags 2023_todos_cod_.pdf · p. 226"},{"id":"EAGS2023-C26-INF-047","s":"inf","y":2023,"c":"26","n":47,"a":"B","an":false,"du":false,"l":"","e":"Em relação às frases abaixo, coloque V para verdadeiro e F para falso. Em seguida, assinale a alternativa com a sequência correta.\n( ) O nome que se dá à tecnologia em que é possível criar várias máquinas virtuais “completas” usando sistemas operacionais em paralelo é Virtualização.\n( ) Sistemas Operacionais sendo executados nas máquinas virtuais também são chamados de “programas secundários”.\n( ) A virtualização é considerada uma tecnologia nova, sendo efetuada a partir dos anos 2000.\n( ) Na multitarefa existem um único sistema operacional e vários programas trabalhando em paralelo, enquanto na virtualização cada sistema operacional roda em uma “máquina virtual”, acreditando que está em um computador diferente.","o":{"A":"F - V - F - V","B":"V - F - F - V","C":"V - F - V - F","D":"F - V - F - F"},"t":"Algoritmos e lógica","tp":"Fluxogramas, estruturas de controle e pseudocódigo","src":"prova_eags 2023_todos_cod_.pdf · p. 226","vr":1},{"id":"EAGS2023-C26-INF-048","s":"inf","y":2023,"c":"26","n":48,"a":"A","an":false,"du":false,"l":"","e":"Em relação à Linguagem de Programação JAVA, coloque V para verdadeiro e F para falso. Em seguida, assinale a alternativa com a sequência correta.\n( ) A linguagem JAVA distingue letras maiúsculas de letras minúsculas na criação da variável.\n( ) A linguagem JAVA possui algumas palavras reservadas que não podem ser utilizadas, por exemplo: super e import.\n( ) As variáveis precisam ter o símbolo $ (cifrão) na frente.\n( ) Nas classes internas, assim como nas classes normais, para acessar os atributos da classe interna, utiliza-se a palavra-chave this.","o":{"A":"V - V - F - V","B":"F - V - V - F","C":"F - F - F - V","D":"V - V - F - F"},"t":"Programação orientada a objetos","tp":"Classes, herança, encapsulamento e polimorfismo","src":"prova_eags 2023_todos_cod_.pdf · p. 226"},{"id":"EAGS2023-C26-INF-049","s":"inf","y":2023,"c":"26","n":49,"a":"","an":true,"du":false,"l":"","e":"Observe a sintaxe do comando utilizado e assinale a alternativa que indica qual será o resultado obtido com a execução do programa.","o":{"A":"Siga em frente","B":"Siga em paz","C":"Siga em $frente","D":"Siga em"},"t":"Linguagens de programação","tp":"PHP, Java e sintaxe de linguagens","src":"prova_eags 2023_todos_cod_.pdf · p. 226","vr":1},{"id":"EAGS2023-C26-INF-050","s":"inf","y":2023,"c":"26","n":50,"a":"C","an":false,"du":false,"l":"","e":"O Bacula é uma solução de backup que gerencia backups, restauração e verificação de arquivos na rede. Para implantá-lo, é importante conhecer seus componentes.\nAssinale a alternativa que não contém um componente do\nBacula.","o":{"A":"Console","B":"Catálogo","C":"Terminal","D":"Daemon diretor"},"t":"Redes de computadores","tp":"Protocolos, endereçamento e arquitetura de redes","src":"prova_eags 2023_todos_cod_.pdf · p. 226"},{"id":"EAGS2023-C26-INF-051","s":"inf","y":2023,"c":"26","n":51,"a":"C","an":false,"du":false,"l":"","e":"Determine o resultado lógico das expressões abaixo e coloque V para verdadeiro ou F para falso. Em seguida, assinale a alternativa com a sequência correta. Considere para\nas variáveis os seguintes valores: A=10, B=7 e C=3.\n( ) (A >= B) .e. .não. (B > A)\n( ) .não. (C > B) .ou. (B <= C)\n( ) .não. (A > C) .ou. (C >= B)\n( ) (C < 0) .e. (B >= 7)","o":{"A":"V - F - F - V","B":"F - V - V - F","C":"V - V - F - F","D":"F - F - V - V"},"t":"Algoritmos e lógica","tp":"Fluxogramas, estruturas de controle e pseudocódigo","src":"prova_eags 2023_todos_cod_.pdf · p. 226","vr":1},{"id":"EAGS2023-C26-INF-052","s":"inf","y":2023,"c":"26","n":52,"a":"C","an":false,"du":false,"l":"","e":"Considere um banco de dados relacional chamado\nEEAR, que possui uma tabela chamada EAGS. A tabela\nEAGS possui os campos NOME, ESPECIALIDADE e\nIDADE.\nEscolha a alternativa que contém a sintaxe correta do comando SQL que resultará na apresentação da listagem de todos os registros da tabela EAGS ordenados por ordem alfabética do campo NOME.","o":{"A":"SELECT todos FROM EEAR;","B":"SELECT * FROM EAGS ORDER BY IDADE;","C":"SELECT * FROM EAGS ORDER BY NOME;","D":"SELECT * FROM EEAR ORDER BY NOME;"},"t":"Banco de dados","tp":"SQL, SGBD, modelagem e administração de dados","src":"prova_eags 2023_todos_cod_.pdf · p. 226","vr":1},{"id":"EAGS2023-C26-INF-053","s":"inf","y":2023,"c":"26","n":53,"a":"D","an":false,"du":false,"l":"","e":"O processador muitas vezes acaba ficando ocioso, aguardando a memória lhe entregar um dado. Para melhorar o desempenho no acesso a essa memória, é possível usar uma outra memória como intermediária entre a unidade de busca do processador e a memória RAM.\nDiante do exposto acima, qual memória é mais lenta que o processador a ponto de deixá-lo ocioso e qual memória efetua papel de intermediária, sendo considerada uma memória de alta velocidade?","o":{"A":"ROM e Cache.","B":"RAM e DRR.","C":"ROM e RAM.","D":"RAM e Cache."},"t":"Hardware e arquitetura","tp":"Componentes, memória, processamento e sistemas digitais","src":"prova_eags 2023_todos_cod_.pdf · p. 227","vr":1},{"id":"EAGS2023-C26-INF-054","s":"inf","y":2023,"c":"26","n":54,"a":"C","an":false,"du":false,"l":"","e":"Maia é uma candidata muito aplicada aos estudos.\nEscreveu um programa em português estruturado para orientar os colegas e verificar quem seria “APROVADO” e quem seria “REPROVADO” de acordo com a média das notas obtidas. Considerando que a variável E é a quantidade de acertos na matéria específica, P é a quantidade de acertos em português e M a média das notas, analise o código abaixo e assinale a alternativa correta.","o":{"A":"O resultado do programa seria “APROVADO” se Maia acertasse 31 questões de português e 49 questões específicas.","B":"O resultado do programa seria “REPROVADO” se Maia acertasse 25 questões de português e 55 questões específicas.","C":"O resultado do programa seria “APROVADO” se Maia acertasse 40 questões de português e 51 questões específicas.","D":"O resultado do programa seria “REPROVADO” se Maia acertasse 29 questões de português e 52 questões específicas."},"t":"Algoritmos e lógica","tp":"Fluxogramas, estruturas de controle e pseudocódigo","src":"prova_eags 2023_todos_cod_.pdf · p. 227","vr":1},{"id":"EAGS2023-C26-INF-055","s":"inf","y":2023,"c":"26","n":55,"a":"A","an":false,"du":false,"l":"","e":"Qual endereço do IPv6 entrega um pacote a todas as interfaces que fazem parte de um grupo específico ao mesmo tempo?","o":{"A":"Multicast.","B":"Broadcast.","C":"Unicast.","D":"Anycast."},"t":"Redes de computadores","tp":"Protocolos, endereçamento e arquitetura de redes","src":"prova_eags 2023_todos_cod_.pdf · p. 227"},{"id":"EAGS2023-C26-INF-056","s":"inf","y":2023,"c":"26","n":56,"a":"D","an":false,"du":false,"l":"","e":"Assinale a alternativa que contém somente modelos de arquitetura de serviços de nuvem.","o":{"A":"CLD, IAAS, X86","B":"GCC, CLD, PAAS","C":"X86, SAAS, GCC","D":"IAAS, PAAS, SAAS"},"t":"Linguagens de programação","tp":"Revisão manual da classificação","src":"prova_eags 2023_todos_cod_.pdf · p. 227"},{"id":"EAGS2023-C26-INF-057","s":"inf","y":2023,"c":"26","n":57,"a":"A","an":false,"du":false,"l":"","e":"O modo de gerenciamento do sistema, também conhecido como SMM (System Management Mode), é utilizado quando o processador recebe um pedido de interrupção. Quando esse pedido ocorre, o processador","o":{"A":"salva o conteúdo de todos os seus registradores, entra no modo de gerenciamento do sistema, executa o pedido de interrupção, restaura o conteúdo dos registradores e volta a executar o programa que havia sido interrompido.","B":"salva o conteúdo de todos os seus registradores, entra no modo de gerenciamento do sistema, executa o pedido de interrupção, restaura o conteúdo dos registradores e reinicia o computador automaticamente.","C":"não salva o conteúdo, entra no modo de gerenciamento do sistema, executa o pedido de interrupção e volta a executar o programa que havia sido interrompido.","D":"salva o conteúdo de todos os seus registradores, volta a executar o programa que havia sido interrompido e reinicia automaticamente."},"t":"Hardware e arquitetura","tp":"Componentes, memória, processamento e sistemas digitais","src":"prova_eags 2023_todos_cod_.pdf · p. 227"},{"id":"EAGS2023-C26-INF-058","s":"inf","y":2023,"c":"26","n":58,"a":"A","an":false,"du":false,"l":"","e":"A figura abaixo é parte de um arquivo de configuração do sistema operacional Linux. Assinale a alternativa que descreve a finalidade da nona linha desse arquivo.","o":{"A":"Indicar um comentário no arquivo de configuração.","B":"Indicar o servidor eear.eags.gov como DNS padrão.","C":"Realizar a conversão dos endereços IP em endereços de nome.","D":"Determinar que a opção domain-name-servers seja executada como root."},"t":"Redes de computadores","tp":"Protocolos, endereçamento e arquitetura de redes","src":"prova_eags 2023_todos_cod_.pdf · p. 227","vr":1},{"id":"EAGS2023-C26-INF-059","s":"inf","y":2023,"c":"26","n":59,"a":"A","an":false,"du":false,"l":"","e":"Assinale a alternativa que descreve o método lógico demonstrado na figura abaixo.","o":{"A":"Linear","B":"Modular","C":"Estruturada","D":"Diagrama de Chapin"},"t":"Linguagens de programação","tp":"Revisão manual da classificação","src":"prova_eags 2023_todos_cod_.pdf · p. 228","vr":1},{"id":"EAGS2023-C26-INF-060","s":"inf","y":2023,"c":"26","n":60,"a":"D","an":false,"du":false,"l":"","e":"Os processadores mais antigos não eram capazes de executar instruções matemáticas complexas e, para realizar esses cálculos, o compilador tinha que converter um comando contendo um cálculo complexo em várias outras instruções para chegar ao mesmo resultado.\nPara acelerar a execução de programas e aumentar o desempenho do coprocessador matemático, este passou a estar embutido no processador. Como se chama esse coprocessador?","o":{"A":"Unidade Central de Cálculo.","B":"Unidade de Ponto Estático.","C":"Unidade de Lógica Flutuante.","D":"Unidade de Ponto Flutuante."},"t":"Hardware e arquitetura","tp":"Componentes, memória, processamento e sistemas digitais","src":"prova_eags 2023_todos_cod_.pdf · p. 228"},{"id":"EAGS2023-C26-INF-061","s":"inf","y":2023,"c":"26","n":61,"a":"A","an":false,"du":false,"l":"","e":"As notações gráficas a seguir, no contexto da UML, representam respectivamente, os seguintes tipos de relacionamentos entre classes:","o":{"A":"dependência - associação - agregação - composição","B":"composição - dependência - agregação - associação","C":"associação - dependência - composição - agregação","D":"dependência - associação - composição - agregação"},"t":"Engenharia de software","tp":"Modelagem, qualidade, desenvolvimento e documentação","src":"prova_eags 2023_todos_cod_.pdf · p. 228"},{"id":"EAGS2023-C26-INF-062","s":"inf","y":2023,"c":"26","n":62,"a":"C","an":false,"du":false,"l":"","e":"Considerando os Conceitos de Programação Orientada a Objetos, assinale a alternativa que completa correta e respectivamente as lacunas das frases seguintes.\nI- _________________ é uma instância de uma classe.\nII- _________________ define os atributos e comportamentos comuns compartilhados por um tipo de objeto.\nIII- ________________ é a característica de uma classe visível externamente.\nIV- _________________ é uma ação executada por um objeto quando passa uma mensagem ou resposta a uma mudança de estado.","o":{"A":"Atributo - Classe - Objeto - Comportamento","B":"Comportamento - Classe - Objeto - Atributo","C":"Objeto - Classe - Atributo - Comportamento","D":"Objeto - Classe - Comportamento - Atributo"},"t":"Programação orientada a objetos","tp":"Classes, herança, encapsulamento e polimorfismo","src":"prova_eags 2023_todos_cod_.pdf · p. 228"},{"id":"EAGS2023-C26-INF-063","s":"inf","y":2023,"c":"26","n":63,"a":"C","an":false,"du":false,"l":"","e":"Qual a sintaxe do comando de criação de um banco de dados, utilizando a linguagem SQL?","o":{"A":"CREATE <nome>;","B":"NEW DATABASE <nome>;","C":"CREATE DATABASE <nome>;","D":"CREATE TABLE <nome>;"},"t":"Banco de dados","tp":"SQL, SGBD, modelagem e administração de dados","src":"prova_eags 2023_todos_cod_.pdf · p. 228"},{"id":"EAGS2023-C26-INF-064","s":"inf","y":2023,"c":"26","n":64,"a":"B","an":false,"du":false,"l":"","e":"Avalie as informações abaixo sobre hash.\nI - O hash é gerado de forma que é possível fazer o processamento inverso para se obter a informação original, sendo que qualquer alteração na informação original sempre produzirá o mesmo hash.\nII - O hash pode verificar a integridade de um arquivo salvo em computador ou em backups.\nIII - O hash pode ser utilizado para verificar a integridade de um arquivo obtido da Internet.\nIV - O hash pode gerar assinaturas digitais.\nEstá correto o que se afirma em","o":{"A":"I, II e IV.","B":"II, III e IV.","C":"I e III somente.","D":"II e IV somente."},"t":"Linguagens de programação","tp":"Revisão manual da classificação","src":"prova_eags 2023_todos_cod_.pdf · p. 228","vr":1},{"id":"EAGS2023-C26-INF-065","s":"inf","y":2023,"c":"26","n":65,"a":"D","an":false,"du":false,"l":"","e":"Relacione as colunas quanto às Estruturas de Controle do PHP. Em seguida, assinale a alternativa com a sequência correta.\n1 – Executa um conjunto de\ninstruções; baseado em\num contador.\n( ) IF\n2 – Avalia a condição e, se for verdadeira, continua executando.\n( ) FOR\n3 – Realiza uma avaliação, desvio condicional.\n( ) WHILE","o":{"A":"2 - 1 - 3","B":"1 - 2 - 3","C":"3 - 2 - 1","D":"3 - 1 - 2"},"t":"Linguagens de programação","tp":"PHP, Java e sintaxe de linguagens","src":"prova_eags 2023_todos_cod_.pdf · p. 229"},{"id":"EAGS2023-C26-INF-066","s":"inf","y":2023,"c":"26","n":66,"a":"B","an":false,"du":false,"l":"","e":"Qual o comando básico para iniciar uma conexão de\nMySQL?","o":{"A":"mysql_create_bdsql","B":"mysql_connect","C":"mysql_query","D":"mysql_result"},"t":"Banco de dados","tp":"SQL, SGBD, modelagem e administração de dados","src":"prova_eags 2023_todos_cod_.pdf · p. 229"},{"id":"EAGS2023-C26-INF-067","s":"inf","y":2023,"c":"26","n":67,"a":"","an":true,"du":false,"l":"","e":"Assinale a alternativa que contém somente protocolos de controle do IPv4 usados na camada de rede do modelo de referência OSI.","o":{"A":"ICMP, ARP e DHCP.","B":"ICMP, NDP e DHCP.","C":"NDP, HTTP e ICMP.","D":"HTTP, ARP e ICMP."},"t":"Redes de computadores","tp":"Protocolos, endereçamento e arquitetura de redes","src":"prova_eags 2023_todos_cod_.pdf · p. 229"},{"id":"EAGS2023-C26-INF-068","s":"inf","y":2023,"c":"26","n":68,"a":"A","an":false,"du":false,"l":"","e":"Relacione as colunas quanto ao gerenciamento de processos no Linux. Em seguida, assinale a alternativa com a sequência correta.\n1 – ps\n( ) Envia um sinal para um processo em execução.\n2 – kill\n( ) Exibe os processos que estão sendo executados.\n3 – renice\n( ) Altera a prioridade de execução de um processo durante essa execução.","o":{"A":"2 - 1 - 3","B":"1 - 2 - 3","C":"3 - 1 - 2","D":"2 - 3 - 1"},"t":"Algoritmos e lógica","tp":"Fluxogramas, estruturas de controle e pseudocódigo","src":"prova_eags 2023_todos_cod_.pdf · p. 229"},{"id":"EAGS2023-C26-INF-069","s":"inf","y":2023,"c":"26","n":69,"a":"B","an":false,"du":false,"l":"","e":"A respeito de Programação Orientada a Objetos, coloque V para verdadeiro e F para falso. Em seguida, assinale a alternativa com a sequência correta.\n( ) Encapsulamento é a característica da OO de ocultar partes independentes da implementação.\n( ) Classe final pode ser uma superclasse, ou seja, pode ser a base em uma estrutura de herança.\n( ) Polimorfismo permite que um único nome de classe ou nome de método represente um código diferente.\n( ) Somente classes abstratas podem ter métodos abstratos.","o":{"A":"V - V - F - F","B":"V - F - V - V","C":"F - F - V - F","D":"F - V - F – V"},"t":"Programação orientada a objetos","tp":"Classes, herança, encapsulamento e polimorfismo","src":"prova_eags 2023_todos_cod_.pdf · p. 229"},{"id":"EAGS2023-C26-INF-070","s":"inf","y":2023,"c":"26","n":70,"a":"C","an":false,"du":false,"l":"","e":"Relacione as colunas considerando a classe dos endereços IPs privados. Em seguida, assinale a alternativa com a sequência correta.\n1 – Classe A\n( ) 10.140.56.2\n2 – Classe B\n( ) 192.168.5.3\n3 – Classe C\n( ) 172.20.0.7\n( ) 10.128.44.5\n( ) 172.31.0.2","o":{"A":"1 - 2 - 2 - 3 - 2","B":"2 - 3 - 3 - 2 - 3","C":"1 - 3 - 2 - 1 - 2","D":"2 - 2 - 3 - 1 - 1"},"t":"Programação orientada a objetos","tp":"Classes, herança, encapsulamento e polimorfismo","src":"prova_eags 2023_todos_cod_.pdf · p. 229"},{"id":"EAGS2023-C26-INF-071","s":"inf","y":2023,"c":"26","n":71,"a":"C","an":false,"du":false,"l":"","e":"Analise abaixo as variáveis declaradas nos dois exemplos em português estruturado e assinale a alternativa correta.","o":{"A":"A variável C é global nos dois exemplos.","B":"As variáveis B e C são locais nos dois exemplos.","C":"As variáveis A e B são globais nos dois exemplos.","D":"A variável A é global e a variável C é local nos dois exemplos."},"t":"Algoritmos e lógica","tp":"Fluxogramas, estruturas de controle e pseudocódigo","src":"prova_eags 2023_todos_cod_.pdf · p. 229","vr":1},{"id":"EAGS2023-C26-INF-072","s":"inf","y":2023,"c":"26","n":72,"a":"C","an":false,"du":false,"l":"","e":"No paradigma de programação orientada a objetos, o conceito que permite o uso do mesmo nome de método para muitos métodos diferentes é o(a)","o":{"A":"ligação.","B":"modelo.","C":"sobrecarga.","D":"destruição."},"t":"Programação orientada a objetos","tp":"Classes, herança, encapsulamento e polimorfismo","src":"prova_eags 2023_todos_cod_.pdf · p. 230"},{"id":"EAGS2023-C26-INF-073","s":"inf","y":2023,"c":"26","n":73,"a":"D","an":false,"du":false,"l":"","e":"No que diz respeito aos tipos de testes de software, relacione as colunas e, em seguida, assinale a alternativa com a sequência correta.\n1 – Teste de\nUnidade\n( ) Dada uma entrada específica, testa se a saída ou o comportamento correto, visível externamente, resulta conforme definido pela especificação da classe ou do sistema.\n2 – Teste de\nIntegração\n( ) Examina as alterações nas partes do sistema que já foram validadas.\n3 – Teste de\nSistema\n( ) Examina o sistema inteiro e verifica se o sistema funciona conforme mencionado nos casos de uso.\n4 – Teste de\nRegressão\n( ) Verifica se dois ou mais objetos funcionam em conjunto corretamente.\n5 – Teste de\nCaixa preta\n( ) É o dispositivo de teste de nível mais baixo. Envia uma mensagem para um objeto e depois verifica se ele recebe o resultado esperado do objeto. Verifica apenas um recurso por vez.","o":{"A":"3 - 5 - 1 - 2 - 4","B":"1 - 2 - 5 - 4 - 3","C":"3 - 1 - 2 - 4 - 5","D":"5 - 4 - 3 - 2 - 1"},"t":"Programação orientada a objetos","tp":"Classes, herança, encapsulamento e polimorfismo","src":"prova_eags 2023_todos_cod_.pdf · p. 230"},{"id":"EAGS2023-C26-INF-074","s":"inf","y":2023,"c":"26","n":74,"a":"B","an":false,"du":false,"l":"","e":"A camada de aplicação do modelo TCP/IP possui os protocolos de níveis mais altos. Qual é o protocolo que resolve o nome de um host em seu respectivo endereço IP?","o":{"A":"RTP","B":"DNS","C":"HTTP","D":"SMTP"},"t":"Redes de computadores","tp":"Protocolos, endereçamento e arquitetura de redes","src":"prova_eags 2023_todos_cod_.pdf · p. 230"},{"id":"EAGS2023-C26-INF-075","s":"inf","y":2023,"c":"26","n":75,"a":"D","an":false,"du":false,"l":"","e":"O setor de TI da EEAR está trabalhando para estabelecer uma política de segurança da informação eficiente. Quais os princípios fundamentais da segurança que devem ser observados na definição dessa política?","o":{"A":"Criptografia, sigilo e deslisura.","B":"Difusão, probidade e autenticação.","C":"Conscientização, tecnologia e flexibilidade.","D":"Confidencialidade, integridade e disponibilidade."},"t":"Segurança da informação","tp":"Autenticação, controle de acesso e proteção","src":"prova_eags 2023_todos_cod_.pdf · p. 230"},{"id":"EAGS2023-C26-INF-076","s":"inf","y":2023,"c":"26","n":76,"a":"A","an":false,"du":false,"l":"","e":"A equipe de redes da EEAR foi acionada para fazer o cabeamento estruturado entre dois galpões. A única exigência para o serviço era que a conexão fosse de alta velocidade, mesmo que os custos fossem altos para a instalação e a manutenção. Qual o cabeamento adequado a ser utilizado nessa situação?","o":{"A":"Fibra óptica.","B":"Cabo coaxial.","C":"Cabo cross-over.","D":"Cabo par trançado."},"t":"Redes de computadores","tp":"Protocolos, endereçamento e arquitetura de redes","src":"prova_eags 2023_todos_cod_.pdf · p. 230"},{"id":"EAGS2023-C26-INF-077","s":"inf","y":2023,"c":"26","n":77,"a":"B","an":false,"du":false,"l":"","e":"Considerando o editor de texto VI do Linux, qual o comando utilizado para salvar e retornar para o shell, quando dentro do editor e fora do modo edição?","o":{"A":":q!","B":":wq","C":"Ctrl o","D":"Ctrl x"},"t":"Sistemas operacionais","tp":"Linux, Unix, processos, arquivos e comandos","src":"prova_eags 2023_todos_cod_.pdf · p. 230"},{"id":"EAGS2023-C26-INF-078","s":"inf","y":2023,"c":"26","n":78,"a":"D","an":false,"du":false,"l":"","e":"Fabiano recebeu os requisitos para criar uma tabela chamada Militar em um banco de dados relacional chamado\nEfetivoMilitar, já existente no Sistema de Gerenciamento de\nBanco de Dados.\nA tabela deverá atender aos seguintes requisitos:\n o campo SARAM com tipo INTEGER e não nulo;\n o campo NOME com o tipo VARCHAR (40) e não\nnulo;\n o campo FUNCAO com o tipo CHAR (20);\n não deverá ser possível cadastrar dois militares com o mesmo SARAM.\nQual sequência de instruções da linguagem SQL Fabiano deverá usar para criar a tabela de forma que atenda aos requisitos solicitados?","o":{"A":"CREATE TABLE EfetivoMilitar(\nSARAM INTEGER NOT NULL PRIMARY KEY,\nNOME VARCHAR(40) NOT NULL,\nFUNCAO CHAR(20),\n);","B":"CREATE TABLE Militar(\nSARAM INTEGER PRIMARY KEY,\nNOME VARCHAR(40),\nFUNCAO CHAR(20),\n);","C":"CREATE DATABASE Militar(\nSARAM INTEGER NOT NULL,\nNOME VARCHAR(40) PRIMARY KEY,\nFUNCAO CHAR(20),\n);","D":"CREATE TABLE Militar(\nSARAM INTEGER NOT NULL PRIMARY KEY,\nNOME VARCHAR(40) NOT NULL,\nFUNCAO CHAR(20),\n);"},"t":"Banco de dados","tp":"SQL, SGBD, modelagem e administração de dados","src":"prova_eags 2023_todos_cod_.pdf · p. 230","vr":1},{"id":"EAGS2023-C26-INF-079","s":"inf","y":2023,"c":"26","n":79,"a":"B","an":false,"du":false,"l":"","e":"Considerando as notações gráficas, assinale a alternativa correta quanto aos tipos de relacionamento entre as classes abaixo.","o":{"A":"Generalização entre a Classe B e a Classe C.","B":"Generalização entre a Classe A e a Classe C.","C":"Composição entre a Classe B e a Classe C.","D":"Agregação entre a Classe C e a Classe D."},"t":"Programação orientada a objetos","tp":"Classes, herança, encapsulamento e polimorfismo","src":"prova_eags 2023_todos_cod_.pdf · p. 231","vr":1},{"id":"EAGS2023-C26-INF-080","s":"inf","y":2023,"c":"26","n":80,"a":"C","an":false,"du":false,"l":"","e":"Assinale a alternativa que descreve a principal finalidade do Rootkit.","o":{"A":"Redirecionar a navegação do usuário para sites específicos.","B":"Capturar e armazenar as teclas digitadas pelo usuário no teclado do computador.","C":"Manter o acesso privilegiado em um computador previamente comprometido.","D":"Induzir uma pessoa a fornecer informações confidenciais por meio de falsa promessa de receber algum benefício."},"t":"Linguagens de programação","tp":"Revisão manual da classificação","src":"prova_eags 2023_todos_cod_.pdf · p. 231"},{"id":"EAGS2023-C26-INF-081","s":"inf","y":2023,"c":"26","n":81,"a":"B","an":false,"du":false,"l":"","e":"Pablo quis surpreender sua amiga apresentando uma mensagem quando ela ligasse o computador. Para isso utilizou-se da linguagem PHP da seguinte maneira:\nQual o tipo de dado Pablo fez uso para efetuar tal ação?","o":{"A":"Array","B":"Objeto","C":"Booleano","D":"Array e String"},"t":"Linguagens de programação","tp":"PHP, Java e sintaxe de linguagens","src":"prova_eags 2023_todos_cod_.pdf · p. 231"},{"id":"EAGS2023-C26-INF-082","s":"inf","y":2023,"c":"26","n":82,"a":"B","an":false,"du":false,"l":"","e":"Thiago estava usando seu computador com vários programas em execução e percebeu uma pequena lentidão.\nSe o sistema de memória virtual de seu computador estivesse habilitado, a memória RAM seria dividida e o seu disco rígido criaria um arquivo chamado arquivo de trocas (swap file), o qual seria dividido em blocos de tamanhos iguais ao da memória RAM.\nEssa situação não é percebida por Thiago, mas é uma forma de o processador ter mais memória RAM do que realmente existe instalado.\nA esse sistema que permite o uso de “memória virtual” dá-se o nome de","o":{"A":"Block.","B":"Paginação.","C":"Capitulação.","D":"Virtualização."},"t":"Sistemas operacionais","tp":"Linux, Unix, processos, arquivos e comandos","src":"prova_eags 2023_todos_cod_.pdf · p. 231"},{"id":"EAGS2023-C26-INF-083","s":"inf","y":2023,"c":"26","n":83,"a":"B","an":false,"du":false,"l":"","e":"Qual protocolo da camada de transporte estabelece conexão através do procedimento chamado handshake?","o":{"A":"IP","B":"TCP","C":"UDP","D":"ICMP"},"t":"Redes de computadores","tp":"Protocolos, endereçamento e arquitetura de redes","src":"prova_eags 2023_todos_cod_.pdf · p. 231"},{"id":"EAGS2023-C26-INF-084","s":"inf","y":2023,"c":"26","n":84,"a":"C","an":false,"du":false,"l":"","e":"Chamam-se interrupções os pedidos enviados ao processador para que ele pare a execução de algum programa e vá atender quem efetuou o pedido. As interrupções podem ser","o":{"A":"de 4 tipos: hardware mascarável, hardware não mascarável, de software mascarável e software não mascarável.","B":"de 2 tipos: hardware mascarável e hardware não mascarável.","C":"de 3 tipos: hardware mascarável, hardware não mascarável e de software.","D":"de 2 tipos: software mascarável e software não mascarável."},"t":"Hardware e arquitetura","tp":"Componentes, memória, processamento e sistemas digitais","src":"prova_eags 2023_todos_cod_.pdf · p. 231"},{"id":"EAGS2023-C26-INF-085","s":"inf","y":2023,"c":"26","n":85,"a":"A","an":false,"du":false,"l":"","e":"Aline precisa imprimir seu comprovante de inscrição do concurso da EEAR, que se encontra em seu computador pessoal. Para isso, Aline utilizou uma impressora Bluetooth de sua casa. De acordo com a área de abrangência da comunicação entre os dispositivos, podemos classificar a rede como","o":{"A":"PAN.","B":"LAN.","C":"WAN.","D":"VLAN."},"t":"Redes de computadores","tp":"Protocolos, endereçamento e arquitetura de redes","src":"prova_eags 2023_todos_cod_.pdf · p. 231"},{"id":"EAGS2023-C26-INF-086","s":"inf","y":2023,"c":"26","n":86,"a":"B","an":false,"du":false,"l":"","e":"Avalie as afirmações abaixo sobre tipos de dados e coloque V para verdadeiro ou F para falso. Em seguida, assinale a alternativa com a sequência correta.\n( ) Os valores 0 e 1 são exemplos de dados do tipo lógico.\n( ) O valor -56 é um exemplo de dado do tipo real.\n( ) O valor 185.2 é exemplo de dado do tipo inteiro.\n( ) O valor “25EAGS” é exemplo de dado do tipo caractere.","o":{"A":"V - F - V - F","B":"F - V - F - V","C":"V - V - F - F","D":"F - F - V - V"},"t":"Algoritmos e lógica","tp":"Fluxogramas, estruturas de controle e pseudocódigo","src":"prova_eags 2023_todos_cod_.pdf · p. 232","vr":1},{"id":"EAGS2023-C26-INF-087","s":"inf","y":2023,"c":"26","n":87,"a":"A","an":false,"du":false,"l":"","e":"Assinale a alternativa que contém somente agentes de transporte de correio (mail transport agent - MTA) do sistema de e-mail do Linux.","o":{"A":"Sendmail, Exim e Postfix.","B":"Postfix, Outlook e Procmail.","C":"Thunderbird, Exim e Outlook.","D":"Procmail, Thunderbird e Sendmail."},"t":"Sistemas operacionais","tp":"Linux, Unix, processos, arquivos e comandos","src":"prova_eags 2023_todos_cod_.pdf · p. 232"},{"id":"EAGS2023-C26-INF-088","s":"inf","y":2023,"c":"26","n":88,"a":"A","an":false,"du":false,"l":"","e":"“Para atingir o encapsulamento, uma das formas é definindo a visibilidade das propriedades e dos métodos de um objeto”\nUtilizando os conceitos de Programação Orientada a Objetos e UML, analise a classe Candidato acima e assinale a alternativa correta.","o":{"A":"O atributo nome poderá ser acessado livremente a partir da própria classe em que foi declarado.","B":"O atributo cpf somente poderá ser acessado a partir de classes descendentes.","C":"O atributo tel não poderá ser acessado dentro da própria classe em que foi declarado.","D":"O atributo dtNasc não poderá ser acessado a partir de classes descendentes."},"t":"Programação orientada a objetos","tp":"Classes, herança, encapsulamento e polimorfismo","src":"prova_eags 2023_todos_cod_.pdf · p. 232","vr":1},{"id":"EAGS2023-C26-INF-089","s":"inf","y":2023,"c":"26","n":89,"a":"B","an":false,"du":false,"l":"","e":"Coloque V para verdadeiro e F para falso, em relação aos tipos de dados utilizados na linguagem PHP. Em seguida, assinale a alternativa com a sequência correta.\n( ) Algumas variáveis na linguagem PHP vêm com um sinal de cifrão na frente.\n( ) Na linguagem PHP, os arrays são associativos, pois têm seus valores armazenados em associação com chaves ou índices únicos.\n( ) Uma variável pode ser global, modal e local.\n( ) Os dados do tipo booleano apresentam apenas 3 valores:\nVerdadeiro, Falso e Null.","o":{"A":"V - F - F - V","B":"F - V - F - F","C":"F - F - V - V","D":"V - V - F - V"},"t":"Algoritmos e lógica","tp":"Fluxogramas, estruturas de controle e pseudocódigo","src":"prova_eags 2023_todos_cod_.pdf · p. 232"},{"id":"EAGS2023-C26-INF-090","s":"inf","y":2023,"c":"26","n":90,"a":"D","an":false,"du":false,"l":"","e":"Considerando o texto seguinte, relacione as colunas e, em seguida, assinale a alternativa com a sequência correta.\nQuando é preciso aumentar o desempenho e a confiabilidade dos dados gravados em discos rígidos ou SSDs, utiliza-se o chamado RAID (Redundant Array of Independent Disks).\n1 – RAID 0\n( ) Método que efetua o espelhamento dos dados, uma unidade será a cópia da outra.\n2 – RAID 1 ( ) Método que grava informações de paridade aumentando a confiabilidade. É um modo RAID 0 com paridade.\n3 – RAID 5\n( ) Método que efetua a divisão dos dados, aumentando o desempenho.","o":{"A":"1 - 3 - 2","B":"3 - 2 - 1","C":"1 - 2 - 3","D":"2 - 3 - 1"},"t":"Algoritmos e lógica","tp":"Fluxogramas, estruturas de controle e pseudocódigo","src":"prova_eags 2023_todos_cod_.pdf · p. 232"},{"id":"EAGS2023-C26-INF-091","s":"inf","y":2023,"c":"26","n":91,"a":"D","an":false,"du":false,"l":"","e":"Qual o comando SQL indica que o banco de dados criado será aberto para que se possa criar as tabelas e os demais elementos de trabalho?","o":{"A":"ROOT <nome>;","B":"DROP <nome>;","C":"HELP <nome>;","D":"USE <nome>;"},"t":"Banco de dados","tp":"SQL, SGBD, modelagem e administração de dados","src":"prova_eags 2023_todos_cod_.pdf · p. 232"},{"id":"EAGS2023-C26-INF-092","s":"inf","y":2023,"c":"26","n":92,"a":"B","an":false,"du":false,"l":"","e":"Sobre a camada de rede do modelo OSI, avalie as informações abaixo.\nI- O IPv6 usa endereços de 196 bits.\nII- O IPv4 usa endereços de 32 bits.\nIII- O endereço de rede 10.140.46.0 tem sua máscara\n255.255.0.0, a qual pode ser escrita com o prefixo “/8”.\nIV- O protocolo IPv6 não utiliza o endereço de broadcast.\nEstá correto o que se afirma em","o":{"A":"I e III.","B":"II e IV.","C":"III e IV.","D":"I e II."},"t":"Redes de computadores","tp":"Protocolos, endereçamento e arquitetura de redes","src":"prova_eags 2023_todos_cod_.pdf · p. 232","vr":1},{"id":"EAGS2023-C26-INF-093","s":"inf","y":2023,"c":"26","n":93,"a":"A","an":false,"du":false,"l":"","e":"Relacione as colunas de acordo com as portas e os respectivos protocolos da camada de aplicação. Em seguida, assinale a alternativa com a sequência correta.\n1 – SMTP\n( ) 80\n2 – HTTP\n( ) 25\n3 – IMAP\n( ) 22\n4 – SSH\n( ) 143","o":{"A":"2 - 1 - 4 - 3","B":"1 - 2 - 3 - 4","C":"2 - 3 - 4 - 1","D":"1 - 2 - 4 - 3"},"t":"Redes de computadores","tp":"Protocolos, endereçamento e arquitetura de redes","src":"prova_eags 2023_todos_cod_.pdf · p. 233"},{"id":"EAGS2023-C26-INF-094","s":"inf","y":2023,"c":"26","n":94,"a":"A","an":false,"du":false,"l":"","e":"Luiza precisa criar um volume lógico chamado “documentos” com tamanho de 20GB, dentro do grupo de volume “eags” já criado. Assinale a alternativa com a sintaxe correta do comando no Linux para que seja possível realizar esse procedimento.","o":{"A":"lvcreate -L 20G -n documentos eags","B":"lvcreate -T 20G -n documentos eags","C":"lvcreate -L 20G -n eags documentos","D":"lvcreate -T 20G -n eags documentos"},"t":"Sistemas operacionais","tp":"Linux, Unix, processos, arquivos e comandos","src":"prova_eags 2023_todos_cod_.pdf · p. 233"},{"id":"EAGS2023-C26-INF-095","s":"inf","y":2023,"c":"26","n":95,"a":"C","an":false,"du":false,"l":"","e":"Analise as alternativas abaixo e assinale a que contém somente exemplos de variáveis válidas, utilizando o conceito de português estruturado.","o":{"A":"EAGS1X, TESTE_EAGS, 1 EAGS","B":"TESTEX, 2023EAGS, NOMEUSUARIO","C":"NOMEUSUARIO, TESTE_EAGS, DELTA4","D":"DELTA4, EAGS SIN, TESTEX"},"t":"Algoritmos e lógica","tp":"Fluxogramas, estruturas de controle e pseudocódigo","src":"prova_eags 2023_todos_cod_.pdf · p. 233","vr":1},{"id":"EAGS2023-C26-INF-096","s":"inf","y":2023,"c":"26","n":96,"a":"D","an":false,"du":false,"l":"","e":"Utilizando-se o cenário de um banco de dados relacional, deseja-se realizar uma consulta que apresente todos os registros da tabela CANDIDATOS em que as médias sejam maiores que 7 e que seja ordenada por nome de forma alfabética descendente.\nUtilize a tabela seguinte e assinale a alternativa que apresente a sintaxe correta da instrução para a consulta, utilizando a linguagem SQL.\nCANDIDATOS\nNOME\nMEDIA\nCURSO","o":{"A":"SELECT * FROM CANDIDATOS WHERE MEDIA=7\nORDER BY NOME ASC;","B":"SELECT * FROM CANDIDATOS WHERE MEDIA>7\nORDER BY NOME ASC;","C":"SELECT * FROM CANDIDATOS WHERE MEDIA=7\nORDER BY NOME DESC;","D":"SELECT * FROM CANDIDATOS WHERE MEDIA>7\nORDER BY NOME DESC;"},"t":"Banco de dados","tp":"SQL, SGBD, modelagem e administração de dados","src":"prova_eags 2023_todos_cod_.pdf · p. 233","vr":1},{"id":"EAGS2023-C26-INF-097","s":"inf","y":2023,"c":"26","n":97,"a":"B","an":false,"du":false,"l":"","e":"O sargento Oliveira utiliza criptografia assimétrica com chave privada para codificar uma informação. Feito isso, ele envia as informações ao destinatário. Qual tipo de chave deve ser usada para decodificar essa informação?","o":{"A":"Chave privada do remetente.","B":"Chave pública do remetente.","C":"Chave privada do destinatário.","D":"Chave pública do destinatário."},"t":"Segurança da informação","tp":"Autenticação, controle de acesso e proteção","src":"prova_eags 2023_todos_cod_.pdf · p. 233"},{"id":"EAGS2023-C26-INF-098","s":"inf","y":2023,"c":"26","n":98,"a":"C","an":false,"du":false,"l":"","e":"Assinale a alternativa que completa as lacunas com a sequência correta.\nOs processadores são programados através de\n_______________. Essa “linguagem” entendida por ele é chamada de linguagem de ___________ ou de___________.\nAs instruções são ___________ que o processador consegue processar, conforme suas particularidades, variando de acordo com a linha do processador.","o":{"A":"comandos - nível - matemática - números","B":"inversões - baixo nível - máquina – strings","C":"instruções - baixo nível - máquina - números","D":"instruções - alto nível - processador - somas
