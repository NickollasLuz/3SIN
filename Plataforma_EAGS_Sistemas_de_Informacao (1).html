<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Plataforma EAGS · Sistemas de Informação</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Figtree:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F2F6FC;--card:#fff;--ink:#0D2142;--mut:#5A6E8F;--line:#D6E2F4;--blue:#1650C9;--blue2:#E4ECFC;--green:#12803F;--green2:#E0F3E7;--bad:#C13A3A;--bad2:#FBE6E6;--nav:#0F2F7C;--onac:#fff;--ac:var(--blue);--ac2:var(--blue2);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#09132A;--card:#10203D;--ink:#E6EEFB;--mut:#92A5C8;--line:#233A60;--blue:#6C9CFF;--blue2:#17294D;--green:#4FC283;--green2:#123428;--bad:#FF7E7E;--bad2:#3A1A22;--nav:#0A1C45;--onac:#07142E;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#09132A;--card:#10203D;--ink:#E6EEFB;--mut:#92A5C8;--line:#233A60;--blue:#6C9CFF;--blue2:#17294D;--green:#4FC283;--green2:#123428;--bad:#FF7E7E;--bad2:#3A1A22;--nav:#0A1C45;--onac:#07142E;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.55 Figtree,system-ui,sans-serif}
h1,h2,h3,.brand{font-family:"Bricolage Grotesque",system-ui,sans-serif;margin:0;letter-spacing:-.01em}
.s-inf{--ac:var(--blue);--ac2:var(--blue2)}.s-por{--ac:var(--green);--ac2:var(--green2)}
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
nav{background:var(--nav);color:#fff;padding:22px 14px;position:sticky;top:env(safe-area-inset-top,0px);align-self:start;height:100vh;display:flex;flex-direction:column;gap:4px}
.brand{font-size:22px;font-weight:700;padding:0 10px}.brand small{display:block;font:400 12px Figtree;opacity:.75;margin:2px 0 18px}
nav button{all:unset;cursor:pointer;padding:10px 12px;border-radius:10px;color:#fff;opacity:.85;font-weight:500}
nav button:hover{background:#ffffff1f}nav button.on{background:#fff;color:#0F2F7C;opacity:1}
nav .foot{margin-top:auto;font-size:12px;opacity:.65;padding:0 10px}
main{padding:28px clamp(16px,3vw,40px) 60px;max-width:1100px;width:100%}
h1{font-size:30px;margin-bottom:4px}h2{font-size:20px}.mut{color:var(--mut)}.sub{margin:0 0 22px;color:var(--mut)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}.gap{display:flex;flex-direction:column;gap:14px}
.row{display:flex;justify-content:space-between;gap:10px;margin:12px 0 5px;font-size:14px}
.meter{height:8px;border-radius:9px;background:var(--line);overflow:hidden}.meter b{display:block;height:100%;background:var(--ac);border-radius:9px}
.btn{cursor:pointer;font:500 14px Figtree;border:1.5px solid var(--ac);background:var(--ac);color:var(--onac);border-radius:10px;padding:8px 14px}
.btn.ghost{background:transparent;color:var(--ac)}.btn.sm{padding:4px 10px;font-size:13px}.btn:disabled{opacity:.4;cursor:default}
input,select,textarea{font:inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;max-width:100%}
textarea{width:100%;min-height:120px;resize:vertical}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.chip{display:inline-block;padding:1px 10px;border-radius:99px;font-size:12px;font-weight:500;background:var(--ac2);color:var(--ac);white-space:nowrap}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin-bottom:14px}.bar label{display:flex;flex-direction:column;font-size:12px;color:var(--mut);gap:3px}.bar label.ck{flex-direction:row;align-items:center;gap:6px;font-size:14px;color:var(--ink)}
.qr{display:grid;grid-template-columns:auto 110px 100px 1fr 120px auto auto;gap:10px;align-items:center;padding:9px 12px;border-bottom:1px solid var(--line);font-size:14px}
.qr:last-child{border:0}.tm{color:var(--mut)}.st.ok{color:var(--green)}.st.bad{color:var(--bad)}.st.new{color:var(--mut)}
.x{all:unset;cursor:pointer;color:var(--mut);padding:0 6px;font-size:18px}.x:hover{color:var(--bad)}
.tree summary{display:flex;justify-content:space-between;align-items:center;cursor:pointer;margin-bottom:8px}
.mod{border-top:1px solid var(--line);padding:10px 0}.mh{display:flex;justify-content:space-between;color:var(--ac);font-weight:700}
.tp{display:flex;align-items:center}.tp .nm{all:unset;cursor:pointer;flex:1;padding:5px 8px;border-radius:8px;display:flex;gap:9px;align-items:center}
.tp.on .nm{background:var(--ac2);color:var(--ac);font-weight:500}.tp .nm:hover{background:var(--ac2)}
.dot{flex:none;width:12px;height:12px;border-radius:50%;border:2px solid var(--ac)}.dot.d1{background:linear-gradient(90deg,var(--ac) 50%,transparent 50%)}.dot.d2{background:var(--ac)}
.add{display:flex;gap:8px;margin-top:8px}.add input{flex:1;padding:5px 9px;font-size:13px}
.ws{display:grid;grid-template-columns:minmax(260px,340px) 1fr;gap:16px;align-items:start}
.seg{display:flex;gap:6px;margin:12px 0}.seg .btn{flex:1}
iframe,video{width:100%;aspect-ratio:16/9;border:0;border-radius:10px;background:#000;margin-top:8px}
.item{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:10px}.item .h{display:flex;gap:8px;align-items:center;justify-content:space-between}
.qcard{max-width:760px}.qh{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.enun{white-space:pre-wrap;margin:0 0 16px;font-size:16px;line-height:1.65}
.bub{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:8px;cursor:pointer;color:inherit;font:inherit}
.bub i{flex:none;width:34px;height:34px;border-radius:50%;border:2px solid var(--ac);display:grid;place-items:center;font:700 15px "Bricolage Grotesque",sans-serif;font-style:normal;color:var(--ac)}
.bub span{padding-top:5px}.bub:hover:enabled{background:var(--ac2)}.bub:disabled{cursor:default}
.bub.ok{border-color:var(--green);background:var(--green2)}.bub.ok i{background:var(--green);border-color:var(--green);color:var(--onac)}
.bub.bad{border-color:var(--bad);background:var(--bad2)}.bub.bad i{background:var(--bad);border-color:var(--bad);color:var(--onac)}
.sheet{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.sq{width:32px;height:32px;border-radius:8px;border:1.5px solid var(--line);background:var(--card);display:grid;place-items:center;font-size:12px;cursor:pointer;color:var(--ink);padding:0}
.sq.ok{background:var(--green);border-color:var(--green);color:var(--onac)}.sq.bad{background:var(--bad);border-color:var(--bad);color:var(--onac)}.sq.cur{outline:2px solid var(--ac);outline-offset:2px}
.note{border-left:4px solid var(--blue);background:var(--blue2);padding:10px 14px;border-radius:0 10px 10px 0;margin-bottom:16px;font-size:14px}
.wk.now{border-color:var(--blue);border-width:2px}.wk .tp{padding:3px 0}
dialog{border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--ink);width:min(640px,94vw);padding:20px}dialog::backdrop{background:#0009}
dialog label{display:flex;flex-direction:column;font-size:13px;color:var(--mut);gap:3px;margin-top:10px}dialog input,dialog select{width:100%}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;display:none;z-index:9}
.empty{text-align:center;color:var(--mut);padding:36px}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}.step{margin-top:18px}.step h3{font-size:14px;margin-bottom:8px}
.cp{cursor:pointer;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:5px 13px;font:500 14px Figtree,sans-serif}.cp:hover{background:var(--ac2)}.cp.on{background:var(--ac);border-color:var(--ac);color:var(--onac)}
.cnt{font:700 30px 'Bricolage Grotesque',sans-serif;margin-right:8px;color:var(--blue)}.ph{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:20px}
dialog{max-height:90vh;overflow:auto}
@media(max-width:820px){
.app{grid-template-columns:1fr}
nav{position:fixed;inset:auto 0 0 0;top:auto;bottom:0;height:auto;flex-direction:row;justify-content:space-around;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{padding:8px 6px;font-size:12px;text-align:center;flex:1}.brand,nav .foot{display:none}
main{padding-bottom:100px}.grid2,.ws{grid-template-columns:1fr}
.qr{grid-template-columns:auto 1fr auto;font-size:13px}.qr .tm,.qr .st{grid-column:2/4}
}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}

.how{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 16px}.how span{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:5px 14px 5px 6px;font-size:14px}.how b{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--blue);color:var(--onac);font-size:13px}
.qr{grid-template-columns:auto 1fr auto;grid-template-areas:"k m a" "k s a";align-items:start;row-gap:3px}
.qr>input{grid-area:k;margin-top:4px}.qr .qm{grid-area:m;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}.qr .snip{grid-area:s;color:var(--mut);font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.qr .acts{grid-area:a;display:flex;gap:6px}.qr.sel{background:var(--ac2)}
.sab{position:sticky;bottom:calc(12px + env(safe-area-inset-bottom,0px));margin-top:14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--card);border:1.5px solid var(--blue);border-radius:14px;padding:10px 14px;box-shadow:0 6px 24px #0003;z-index:4}
.sup{border-left:4px solid var(--green);background:var(--green2);border-radius:0 10px 10px 0;padding:8px 14px;margin-bottom:14px}.sup summary{cursor:pointer;font-weight:700}
@media(max-width:820px){.qr{grid-template-columns:auto 1fr;grid-template-areas:"k m" "k s" "k a"}.sab{bottom:calc(64px + env(safe-area-inset-bottom,0px))}}
#pa{display:none}
@page{margin:16mm 15mm}
@media print{html,body{background:#fff!important}body>.app,dialog,#toast{display:none!important}#pa{display:block;color:#000;background:#fff;font:11pt/1.5 Georgia,'Times New Roman',serif}#pa h1{font:700 18pt Georgia,serif;margin:0 0 2pt}#pa .pm{color:#444;font-size:9.5pt;margin:0 0 14pt;border-bottom:1px solid #999;padding-bottom:6pt}#pa .pq{break-inside:avoid;margin:0 0 13pt}#pa .pq h4{margin:0 0 2pt;font:700 11pt Georgia,serif}#pa .pq small{display:block;color:#555;font-size:8.5pt}#pa .pt{white-space:pre-wrap;margin:3pt 0 5pt}#pa .po{margin:2pt 0 2pt 14pt;text-indent:-14pt;white-space:pre-wrap}#pa .ps{border:1px solid #888;padding:6pt 9pt;margin:0 0 10pt;font-size:10pt;white-space:pre-wrap}#pa .gb{break-before:page}#pa .gb div{columns:4;font-size:10.5pt}#pa .gb p{margin:0 0 3pt;break-inside:avoid}}
</style>
</head>

const QB=[{"id":"EAGS2015-C17-PT-001","s":"por","y":2015,"c":"17","n":1,"a":"D","an":false,"du":false,"l":"","e":"Assinale a afirmação incorreta quanto às ideias contidas no texto.","o":{"A":"Nem sempre o otimismo é benéfico.","B":"A vida sem uma dose de otimismo nos enlouqueceria.","C":"O pessimismo é próprio da condição humana devido à consciência da morte.","D":"A famosa frase “Se a vida lhe deu um limão, faça uma limonada” aplica-se bem aos pessimistas."},"t":"Interpretação de texto","tp":"Compreensão, inferência e finalidade textual","src":"EAGS_2015_codigo_17_SIN.pdf · p. 3","sp":0},{"id":"EAGS2015-C17-PT-002","s":"por","y":2015,"c":"17","n":2,"a":"A","an":false,"du":false,"l":"","e":"Indique qual das palavras abaixo não resume a ideia contida no trecho em destaque:\nUma ou duas taças por dia fazem um bem enorme. Duas garrafas arruínam a pessoa.","o":{"A":"Excesso","B":"Equilíbrio","C":"Prudência","D":"Moderação"},"t":"Semântica e estilística","tp":"Sentido, relações semânticas e figuras de linguagem","src":"EAGS_2015_codigo_17_SIN.pdf · p. 3","sp":0},{"id":"EAGS2015-C17-PT-003","s":"por","y":2015,"c":"17","n":3,"a":"D","an":false,"du":false,"l":"","e":"O pessimista só tem boas surpresas porque ele","o":{"A":"é irracional, por isso nunca sonha.","B":"nunca se surpreende com as boas notícias.","C":"só sonha com aquilo que pode ser realizado.","D":"não tem o hábito de alimentar boas expectativas."},"t":"Ortografia e acentuação","tp":"Ortografia, grafia e hífen","src":"EAGS_2015_codigo_17_SIN.pdf · p. 3","sp":0},{"id":"EAGS2015-C17-PT-004","s":"por","y":2015,"c":"17","n":4,"a":"B","an":false,"du":false,"l":"","e":"Leia:\nAs pessoas mais interessantes são os otimistas com os pés bem plantados no chão.\nConsiderando o texto acima, pode-se afirmar que","o":{"A":"não é possível ser otimista e racional ao mesmo tempo.","B":"as pessoas otimistas racionais são mais interessantes.","C":"todas as pessoas otimistas são irracionais.","D":"todas as pessoas otimistas são racionais."},"t":"Interpretação de texto","tp":"Compreensão, inferência e finalidade textual","src":"EAGS_2015_codigo_17_SIN.pdf · p. 3","sp":0},{"id":"EAGS2015-C17-PT-005","s":"por","y":2015,"c":"17","n":5,"a":"A","an":false,"du":false,"l":"","e":"Complete as lacunas abaixo com os verbos nos tempos e modos indicados entre parênteses, depois assinale a alternativa com a sequência correta.\nI-\nQuando você __________ ao Brasil, traga-me uma bandeira do seu país. (vir – futuro do subjuntivo)\nII- No dia em que você __________ turistas eufóricos diante da\nEstátua da Liberdade, saberá que são brasileiros. (ver – futuro do subjuntivo)\nIII- Muitos turistas italianos _________ ao Brasil na Copa do\nMundo. (vir – presente do indicativo)","o":{"A":"vier – vir – vêm","B":"vir –  vir –  vêm","C":"vir –  ver – vem","D":"vier – ver – vem"},"t":"Verbos","tp":"Tempos, modos e formas verbais","src":"EAGS_2015_codigo_17_SIN.pdf · p. 3"},{"id":"EAGS2015-C17-PT-006","s":"por","y":2015,"c":"17","n":6,"a":"C","an":false,"du":false,"l":"","e":"Leia:\nAndam nascendo os perfumes\nNa seda crespa dos cravos\nNos versos acima, o termo em destaque exerce função sintática de","o":{"A":"aposto.","B":"vocativo.","C":"adjunto adverbial.","D":"adjunto adnominal."},"t":"Sintaxe","tp":"Termos da oração: complementos e adjuntos","src":"EAGS_2015_codigo_17_SIN.pdf · p. 3"},{"id":"EAGS2015-C17-PT-007","s":"por","y":2015,"c":"17","n":7,"a":"C","an":false,"du":false,"l":"","e":"Todas as palavras contêm hiato em qual alternativa?\n(Obs.: Os acentos gráficos foram retirados propositadamente.)","o":{"A":"gratuito, fluido, Camboriu","B":"distraido, atribuir, peixada","C":"egoismo, jesuita, saude","D":"ruivo, jamais, circuito"},"t":"Ortografia e acentuação","tp":"Acentuação gráfica e encontros vocálicos","src":"EAGS_2015_codigo_17_SIN.pdf · p. 3","vr":1},{"id":"EAGS2015-C17-PT-008","s":"por","y":2015,"c":"17","n":8,"a":"A","an":false,"du":false,"l":"","e":"Assinale a alternativa correta quanto à crase.","o":{"A":"À noite todos os gatos são pardos.","B":"Organize à sua bagagem para seguirmos viagem.","C":"Tudo foi feito à fim de evitar o falatório do povo.","D":"A postagem à que você se refere já foi retirada do ar."},"t":"Crase","tp":"Emprego do acento indicativo de crase","src":"EAGS_2015_codigo_17_SIN.pdf · p. 3"},{"id":"EAGS2015-C17-PT-009","s":"por","y":2015,"c":"17","n":9,"a":"B","an":false,"du":false,"l":"","e":"Em qual alternativa o verbo não possui mais de uma forma para o particípio?","o":{"A":"tingir","B":"chegar","C":"matar","D":"suspender"},"t":"Verbos","tp":"Tempos, modos e formas verbais","src":"EAGS_2015_codigo_17_SIN.pdf · p. 3"},{"id":"EAGS2015-C17-PT-010","s":"por","y":2015,"c":"17","n":10,"a":"B","an":false,"du":false,"l":"","e":"Assinale a alternativa que completa, correta e respectivamente, os espaços da seguinte frase:\nA manhã seguia calma naquela loja quando _______ começou um _______ na _______ de roupas. O gerente _______ em chamar a polícia, para resguardar o nome da loja.","o":{"A":"derrepente – reboliço – sessão – hesitou","B":"de repente – rebuliço – seção – hesitou","C":"de repente – rebuliço – sessão – exitou","D":"derrepente – reboliço – seção – exitou"},"t":"Ortografia e acentuação","tp":"Grafia e emprego de palavras: sessão/seção, rebuliço e de repente","src":"EAGS_2015_codigo_17_SIN.pdf · p. 4"},{"id":"EAGS2015-C17-PT-011","s":"por","y":2015,"c":"17","n":11,"a":"A","an":false,"du":false,"l":"","e":"Em relação à circunstância expressa pela conjunção subordinativa como, coloque C para correto e E para errado, considerando a classificação feita entre parênteses. Em seguida, assinale a alternativa com a sequência correta.\nI-\n(   ) A audiência será realizada como a lei determina.\n(comparação)\nII- (   ) O tsunami no Japão ocorreu como os cientistas haviam previsto. (causa)\nIII- (   ) Como o aluno havia estudado, obteve bom resultado no concurso. (causa)\nIV- (   ) Como a maioria dos alunos não havia entendido o conteúdo, o professor explicou-o novamente. (conformidade)","o":{"A":"E – E – C – E","B":"C – E – E – C","C":"E – C – E – C","D":"C – C – C – E"},"t":"Sintaxe","tp":"Período composto e orações","src":"EAGS_2015_codigo_17_SIN.pdf · p. 4"},{"id":"EAGS2015-C17-PT-012","s":"por","y":2015,"c":"17","n":12,"a":"D","an":false,"du":false,"l":"","e":"Assinale a alternativa em que a frase não condiz com o tipo de voz verbal mencionado.","o":{"A":"Ativa: Eles tinham chegado a tempo.","B":"Reflexiva: Clemente banhou-se naquele rio.","C":"Passiva analítica: Foi tudo devidamente esclarecido.","D":"Passiva pronominal:\nVida e morte digladiam-se constantemente."},"t":"Verbos","tp":"Tempos, modos e formas verbais","src":"EAGS_2015_codigo_17_SIN.pdf · p. 4"},{"id":"EAGS2015-C17-PT-013","s":"por","y":2015,"c":"17","n":13,"a":"A","an":false,"du":false,"l":"","e":"Está incorreta a concordância verbal da seguinte frase:","o":{"A":"Se todos ajudassem, poderiam haver mais investimentos.","B":"Sempre se buscam explicações para atitudes como essa.","C":"As pesquisas mostram que houve mais contratações.","D":"Algum de nós precisava dar o depoimento."},"t":"Concordância","tp":"Concordância verbal e nominal","src":"EAGS_2015_codigo_17_SIN.pdf · p. 4"},{"id":"EAGS2015-C17-PT-014","s":"por","y":2015,"c":"17","n":14,"a":"B","an":false,"du":false,"l":"","e":"As frases das alternativas abaixo compõem um trecho de um poema de Drummond. Assinale a única que contém pronome.","o":{"A":"Penetra  surdamente  no  reino  das  palavras.","B":"Lá estão os poemas que esperam ser escritos.","C":"Estão paralisados, mas não há desespero.","D":"Há calma e frescura na superfície intata."},"t":"Pronomes","tp":"Emprego e classificação dos pronomes","src":"EAGS_2015_codigo_17_SIN.pdf · p. 4"},{"id":"EAGS2015-C17-PT-015","s":"por","y":2015,"c":"17","n":15,"a":"A","an":false,"du":false,"l":"","e":"Em qual alternativa as conjunções preenchem, correta e respectivamente, as lacunas dos períodos abaixo?\nI-\nNão observou a sinalização, ________ foi multado por estacionar em local proibido.\nII- Ele é um bom motorista, ________ não respeita os limites de velocidade.\nIII- Não beba antes de dirigir ________ não dirija.\nIV- Use sempre o cinto de segurança, ________ ele é fundamental para a sua proteção.","o":{"A":"portanto – no entanto – ou – pois","B":"pois – portanto – no entanto – ou","C":"ou – no entanto – pois – portanto","D":"no entanto – portanto – pois – ou"},"t":"Sintaxe","tp":"Período composto e orações","src":"EAGS_2015_codigo_17_SIN.pdf · p. 4"},{"id":"EAGS2015-C17-PT-016","s":"por","y":2015,"c":"17","n":16,"a":"D","an":false,"du":false,"l":"","e":"Leia:\nA primeira montanha-russa invertida do Brasil está deixando muita gente de cabelo em pé. Na viagem de apenas um minuto e meio, a 100 quilômetros por hora, os passageiros permanecem com as pernas suspensas, já que o trilho fica sobre a cabeça.\nAssinale a alternativa em que os termos classificam-se, respectivamente, como locução adverbial de modo e locução adverbial de lugar.","o":{"A":"na viagem de apenas um minuto e meio – de cabelo em pé","B":"a primeira montanha russa – sobre a cabeça","C":"os passageiros – com as pernas suspensas","D":"de cabelo em pé – sobre a cabeça"},"t":"Classes de palavras","tp":"Substantivo, adjetivo, advérbio e demais classes","src":"EAGS_2015_codigo_17_SIN.pdf · p. 4"},{"id":"EAGS2015-C17-PT-017","s":"por","y":2015,"c":"17","n":17,"a":"D","an":false,"du":false,"l":"","e":"Assinale a alternativa na qual a flexão de grau do adjetivo superlativo sintético está incorreta.","o":{"A":"Amaríssimas foram as lágrimas do poeta apaixonado.","B":"Meus móveis estão antiquíssimos, pois datam dos anos 40.","C":"Nesta época do ano, o morango e a melancia estão dulcíssimos.","D":"A nova diretora é eficazíssima, resolve todos os problemas em muito pouco tempo."},"t":"Classes de palavras","tp":"Substantivo, adjetivo, advérbio e demais classes","src":"EAGS_2015_codigo_17_SIN.pdf · p. 4"},{"id":"EAGS2015-C17-PT-018","s":"por","y":2015,"c":"17","n":18,"a":"C","an":false,"du":false,"l":"","e":"Leia:\nA verdade é que o rapaz tem medo de que as pessoas descubram que ele não sabe ler.\nNo trecho destacado, há três orações subordinadas substantivas, que são, respectivamente,","o":{"A":"subjetiva, objetiva indireta e apositiva.","B":"objetiva direta, predicativa, completiva nominal.","C":"predicativa, completiva nominal, objetiva direta.","D":"completiva nominal, objetiva direta, objetiva indireta."},"t":"Sintaxe","tp":"Período composto e orações","src":"EAGS_2015_codigo_17_SIN.pdf · p. 4"},{"id":"EAGS2015-C17-PT-019","s":"por","y":2015,"c":"17","n":19,"a":"D","an":false,"du":false,"l":"","e":"Leia:\nQuando for dia de festa\nVocê veste o seu vestido de algodão\nQuebro meu chapéu na testa\nPara arrematar as coisas no leilão\nAssinale a alternativa em que as duas expressões são locuções adjetivas.","o":{"A":"de festa – no leilão","B":"na testa – no leilão","C":"de algodão – na testa","D":"de festa – de algodão"},"t":"Classes de palavras","tp":"Locuções adjetivas","src":"EAGS_2015_codigo_17_SIN.pdf · p. 4"},{"id":"EAGS2015-C17-PT-020","s":"por","y":2015,"c":"17","n":20,"a":"C","an":false,"du":false,"l":"","e":"Assinale a alternativa em que a palavra é formada pelo processo de composição por aglutinação.","o":{"A":"finalmente","B":"semicírculo","C":"vinagre","D":"girassol"},"t":"Formação de palavras","tp":"Estrutura e formação de palavras","src":"EAGS_2015_codigo_17_SIN.pdf · p. 5"},{"id":"EAGS2015-C17-PT-021","s":"por","y":2015,"c":"17","n":21,"a":"B","an":false,"du":false,"l":"","e":"Assinale a alternativa em que o termo destacado é predicativo do sujeito.","o":{"A":"Os médicos julgaram inevitável a cirurgia.","B":"Com o calor, aquela estrada parecia sem fim.","C":"O eleitor considerou desonesto aquele candidato a deputado.","D":"A população de São Paulo achou impróprio o momento da paralisação."},"t":"Sintaxe","tp":"Termos da oração: sujeito e predicado","src":"EAGS_2015_codigo_17_SIN.pdf · p. 5"},{"id":"EAGS2015-C17-PT-022","s":"por","y":2015,"c":"17","n":22,"a":"D","an":false,"du":false,"l":"","e":"Assinale a alternativa em que a regência verbal não está de acordo com a norma culta.","o":{"A":"Esqueci-me completamente do nome de sua esposa.","B":"Lembrei-me de você na semana passada.","C":"Lembrei que tudo na vida é passageiro.","D":"Esqueci do dia da sua formatura."},"t":"Regência","tp":"Regência verbal e nominal","src":"EAGS_2015_codigo_17_SIN.pdf · p. 5"},{"id":"EAGS2015-C17-PT-023","s":"por","y":2015,"c":"17","n":23,"a":"B","an":false,"du":false,"l":"","e":"Em qual alternativa o termo destacado exerce função sintática de agente da passiva?","o":{"A":"Durante os protestos, a violência foi deixando suas marcas pelo caminho.","B":"Pouco a pouco, aquele vilarejo foi tomado pela escuridão.","C":"Seremos eternamente gratos por toda essa gentileza.","D":"Alugam-se apartamentos por preço baixo."},"t":"Sintaxe","tp":"Termos da oração: complementos e adjuntos","src":"EAGS_2015_codigo_17_SIN.pdf · p. 5"},{"id":"EAGS2015-C17-PT-024","s":"por","y":2015,"c":"17","n":24,"a":"A","an":false,"du":false,"l":"","e":"Leia:\nNada como a indiferença do tempo, esse rolo compressor que esmaga todos os nossos momentos e os transforma em lembranças. Ele nos leva o futuro e nos deixa o passado.\nNo texto acima, há duas figuras de linguagem. São elas","o":{"A":"metáfora e antítese.","B":"eufemismo e antítese.","C":"metáfora e metonímia.","D":"prosopopeia e metonímia."},"t":"Semântica e estilística","tp":"Sentido, relações semânticas e figuras de linguagem","src":"EAGS_2015_codigo_17_SIN.pdf · p. 5","vr":1},{"id":"EAGS2015-C17-PT-025","s":"por","y":2015,"c":"17","n":25,"a":"C","an":false,"du":false,"l":"","e":"Assinale a alternativa que contém, na sequência, o pronome oblíquo átono devidamente colocado junto à forma verbal, conforme rege a norma culta da língua.\nQuanto aos políticos corruptos, não _________ meu voto, pois sempre __________ de ter colocado no poder um governante que _________ inocente quando há inúmeras provas contra ele.","o":{"A":"dou-lhes – arrepender-me-ei – se diz","B":"dou-lhes – arrependerei-me – diz-se","C":"lhes dou – me arrependerei –  se diz","D":"lhes dou – arrepender-me-ei – diz-se"},"t":"Pronomes","tp":"Emprego e classificação dos pronomes","src":"EAGS_2015_codigo_17_SIN.pdf · p. 5"},{"id":"EAGS2015-C17-PT-026","s":"por","y":2015,"c":"17","n":26,"a":"C","an":false,"du":false,"l":"","e":"Leia:\nNessas terras onde andei, o clima é hostil o ano todo. Por um tempo, abriguei-me numa casa cujas paredes eram feitas de madeira. Essa casa, que já servira de abrigo a viajantes em outros tempos, tinha um quê de mistério no ar.\nQuantas orações subordinadas adjetivas há no texto acima?","o":{"A":"1","B":"2","C":"3","D":"4"},"t":"Sintaxe","tp":"Período composto e orações","src":"EAGS_2015_codigo_17_SIN.pdf · p. 5"},{"id":"EAGS2015-C17-PT-027","s":"por","y":2015,"c":"17","n":27,"a":"B","an":false,"du":false,"l":"","e":"Em relação ao gênero dos substantivos em destaque, assinale a alternativa incorreta considerando o padrão culto da língua.","o":{"A":"O coma daquele atleta durou três meses.","B":"Nossa viagem foi adiada devido ao pane do avião.","C":"Apenas alguns gramas de manteiga são suficientes para untar as formas.","D":"Durante a Idade Média, alguns cabeças de rebeliões eram decapitados e outros, queimados em praça pública."},"t":"Classes de palavras","tp":"Substantivo, adjetivo, advérbio e demais classes","src":"EAGS_2015_codigo_17_SIN.pdf · p. 5"},{"id":"EAGS2015-C17-PT-028","s":"por","y":2015,"c":"17","n":28,"a":"A","an":false,"du":false,"l":"","e":"Assinale a alternativa que completa, correta e respectivamente, o texto abaixo.\nTodas as __________, ocorrem __________ na casa daqueles __________ sempre pelo mesmo motivo: a má influência dos amigos.","o":{"A":"sextas-feiras – bate-bocas – casaizinhos","B":"sexta-feira – bates-bocas – casaizinhos","C":"sextas-feiras – bate-boca – casalzinhos","D":"sexta-feira – bate-boca – casalzinhos"},"t":"Ortografia e acentuação","tp":"Plural e flexão de palavras compostas","src":"EAGS_2015_codigo_17_SIN.pdf · p. 5"},{"id":"EAGS2015-C17-PT-029","s":"por","y":2015,"c":"17","n":29,"a":"C","an":false,"du":false,"l":"","e":"Leia:\nOs irlandeses não só admiram a música mas também apreciam a literatura brasileira.\nA oração coordenada em destaque classifica-se como","o":{"A":"sindética conclusiva.","B":"sindética adversativa.","C":"sindética aditiva.","D":"assindética."},"t":"Sintaxe","tp":"Período composto e orações","src":"EAGS_2015_codigo_17_SIN.pdf · p. 5"},{"id":"EAGS2015-C17-PT-030","s":"por","y":2015,"c":"17","n":30,"a":"C","an":false,"du":false,"l":"","e":"Assinale a alternativa em que todas as palavras recebem acento gráfico devido ao mesmo princípio.","o":{"A":"vídeo, freguês, exótico","B":"planície, anzóis, papéis","C":"sábio, nódoa, espontâneo","D":"pêssego, possível, privilégio"},"t":"Ortografia e acentuação","tp":"Acentuação gráfica e encontros vocálicos","src":"EAGS_2015_codigo_17_SIN.pdf · p. 5","vr":1},{"id":"EAGS2015-C17-PT-031","s":"por","y":2015,"c":"17","n":31,"a":"D","an":false,"du":false,"l":"","e":"Assinale a alternativa em que o termo destacado é objeto indireto.","o":{"A":"“Quem faz um poema abre uma janela.” (Mário Quintana)","B":"“Toda gente que eu conheço e que fala comigo / Nunca teve um ato ridículo / Nunca sofreu enxovalho (...)” (Fernando\nPessoa)","C":"“Quando Ismália enlouqueceu / Pôs-se na torre a sonhar /\nViu uma lua no céu, / Viu uma lua no mar.” (Alphonsus de\nGuimarães)","D":"“Mas, quando responderam a Nhô Augusto: ‘– É a jagunçada de seu Joãozinho Bem-Bem, que está descendo para a Bahia.’ – ele, de alegre, não se pôde conter.”\n(Guimarães Rosa)"},"t":"Sintaxe","tp":"Termos da oração: complementos e adjuntos","src":"EAGS_2015_codigo_17_SIN.pdf · p. 6"},{"id":"EAGS2015-C17-PT-032","s":"por","y":2015,"c":"17","n":32,"a":"D","an":false,"du":false,"l":"","e":"Leia:\nHoje, estima-se que o Brasil seja o quarto país responsável pelas mudanças climáticas por causa das queimadas.\nO termo destacado no texto acima é um","o":{"A":"objeto direto.","B":"objeto indireto.","C":"agente da passiva.","D":"complemento nominal."},"t":"Sintaxe","tp":"Termos da oração: complementos e adjuntos","src":"EAGS_2015_codigo_17_SIN.pdf · p. 6"},{"id":"EAGS2015-C17-PT-033","s":"por","y":2015,"c":"17","n":33,"a":"C","an":false,"du":false,"l":"","e":"Em relação à classificação do predicado, coloque (C) para certo e (E) para errado. Em seguida, assinale a alternativa com a sequência correta.\nI-\n(   ) Encontramos enferrujadas as ferramentas. (predicado verbo-nominal)\nII- (   ) O professor considerou Amadeu inteligente. (predicado verbo-nominal)\nIII- (   ) Antigamente as avós contavam muitas histórias belas para os netos. (predicado nominal)\nIV- (   ) Os convidados julgaram o dia da confraternização inoportuno. (predicado verbal)","o":{"A":"C – C – C – C","B":"C – E – E – E","C":"C – C – E – E","D":"E – E – E – E"},"t":"Sintaxe","tp":"Termos da oração: sujeito e predicado","src":"EAGS_2015_codigo_17_SIN.pdf · p. 6"},{"id":"EAGS2015-C17-PT-034","s":"por","y":2015,"c":"17","n":34,"a":"B","an":false,"du":false,"l":"","e":"Em relação à regência das palavras destacadas, assinale a alternativa incorreta.","o":{"A":"O prejuízo causado pelos incêndios desse ano foi análogo ao do ano passado.","B":"Estávamos ansiosos a emoções novas que fizessem estremecer o coração.","C":"O médico foi atencioso para com o paciente.","D":"O professor era solidário com os alunos."},"t":"Regência","tp":"Regência verbal e nominal","src":"EAGS_2015_codigo_17_SIN.pdf · p. 6"},{"id":"EAGS2015-C17-PT-035","s":"por","y":2015,"c":"17","n":35,"a":"D","an":false,"du":false,"l":"","e":"Atente para o emprego dos pronomes nas frases abaixo.\nI-\nEu sempre quis agradecê-lo a amizade sincera.\nII - Filho, nós lhe amamos imensamente.\nIII- As pessoas querem preveni-la do perigo.\nO pronome está corretamente empregado em","o":{"A":"I e II.","B":"II e III.","C":"I, somente.","D":"III, somente."},"t":"Pronomes","tp":"Emprego e classificação dos pronomes","src":"EAGS_2015_codigo_17_SIN.pdf · p. 6"},{"id":"EAGS2015-C17-PT-036","s":"por","y":2015,"c":"17","n":36,"a":"B","an":false,"du":false,"l":"","e":"Em qual alternativa o sujeito é indeterminado?","o":{"A":"São muitos os problemas das grandes cidades.","B":"Vive-se muito bem em alguns países europeus.","C":"Há pessoas muito contraditórias no atual cenário político.","D":"Vamos votar com responsabilidade nas próximas eleições."},"t":"Sintaxe","tp":"Termos da oração: sujeito e predicado","src":"EAGS_2015_codigo_17_SIN.pdf · p. 6"},{"id":"EAGS2015-C17-PT-037","s":"por","y":2015,"c":"17","n":37,"a":"A","an":false,"du":false,"l":"","e":"Assinale a alternativa que completa, correta e respectivamente, as lacunas abaixo.\nOs dias estão ______ quentes.\nJean está ____ com o serviço militar.\nEssa pimenta não é ______ para temperar peixe.\nDepois de cair da escada, a mulher ficou _____ tonta.","o":{"A":"bastante – quite – boa – meio","B":"bastante – quite – bom – meia","C":"bastantes – quites – boa – meio","D":"bastantes – quites – bom – meia"},"t":"Classes de palavras","tp":"Concordância e emprego de bastante, quite, bom/boa e meio/meia","src":"EAGS_2015_codigo_17_SIN.pdf · p. 6"},{"id":"EAGS2015-C17-PT-038","s":"por","y":2015,"c":"17","n":38,"a":"A","an":false,"du":false,"l":"","e":"Assinale a alternativa em que há uma oração subordinada adverbial consecutiva.","o":{"A":"O cidadão ficou tão revoltado que denunciou a situação precária do hospital.","B":"O cidadão denunciou o hospital porque ficou revoltado com a situação precária daquele local.","C":"Como ficou revoltado com a situação precária do hospital, o cidadão resolveu denunciar aquele local.","D":"O cidadão resolveu denunciar o hospital já que ficou indignado com o que presenciou naquele local."},"t":"Sintaxe","tp":"Período composto e orações","src":"EAGS_2015_codigo_17_SIN.pdf · p. 6"},{"id":"EAGS2015-C17-PT-039","s":"por","y":2015,"c":"17","n":39,"a":"B","an":false,"du":false,"l":"","e":"Leia:\nVenha depressa, minha filha! A médica, uma mulher muito prestativa, vai atendê-la agora.\nQual termo do texto acima exerce função de vocativo?","o":{"A":"uma mulher muito prestativa","B":"minha filha","C":"a médica","D":"agora"},"t":"Sintaxe","tp":"Termos da oração: complementos e adjuntos","src":"EAGS_2015_codigo_17_SIN.pdf · p. 6"},{"id":"EAGS2015-C17-PT-040","s":"por","y":2015,"c":"17","n":40,"a":"B","an":false,"du":false,"l":"","e":"Do texto abaixo, foram retiradas todas as vírgulas.\nAssinale a alternativa que indica quantas e onde as vírgulas consideradas obrigatórias deveriam ser colocadas.\n“Na cidade mineira de Contagem uma mulher tentou abortar na 37ª semana de gravidez. Ao perceber que a criança nasceu viva jogou-a pela janela do seu barraco. O bebê caiu num córrego e foi resgatado com vida mas morreu na noite seguinte.”","o":{"A":"2 vírgulas: 1 depois do verbo abortar; 1 antes da conjunção\ne.","B":"3 vírgulas: 1 após o termo Contagem; 1 após o termo viva; 1\nantes da conjunção mas.","C":"4 vírgulas: 1 após o termo mulher;  1 depois da forma\nverbal caiu; 1 após a conjunção mas; 1 após a forma verbal\nmorreu.","D":"5 vírgulas: 1 antes e 1 depois de uma mulher; 1 antes do\ntermo viva; 1 depois da conjunção mas; 1 após a forma\nverbal morreu."},"t":"Sintaxe","tp":"Período composto e orações","src":"EAGS_2015_codigo_17_SIN.pdf · p. 6"},{"id":"EAGS2015-C17-INF-041","s":"inf","y":2015,"c":"17","n":41,"a":"B","an":false,"du":false,"l":"","e":"Os termos que se seguem dizem respeito à Internet.\nRelacione a coluna da esquerda com a da direita e, em seguida, assinale a alternativa que contém a sequência correta.\n1 – WWW\n(   ) É o protocolo que informa ao navegador como conversar com o servidor que possui o recurso desejado, por exemplo, uma página específica.\n2 – HTTP\n(   ) É o principal serviço da Internet, a parte multimídia da rede.\n3 – navegador\n(   ) Refere-se ao nome do servidor em que está localizada determinada caixa postal.\n4 – parte do ende-\n(   ) Sua função é requisitar um arquivo reço de e-mail que para um servidor e, se a informação vem após o sinal @ estiver armazenada naquele servidor, o pedido será enviado de volta e mostrado na tela do navegador, após ter sido interpretado.","o":{"A":"1 – 2 – 4 – 3","B":"2 – 1 – 4 – 3","C":"3 – 1 – 2 – 4","D":"2 – 3 – 4 – 1"},"t":"Redes de computadores","tp":"Protocolos, endereçamento e arquitetura de redes","src":"EAGS_2015_codigo_17_SIN.pdf · p. 7"},{"id":"EAGS2015-C17-INF-042","s":"inf","y":2015,"c":"17","n":42,"a":"C","an":false,"du":false,"l":"","e":"Assinale a alternativa com o resultado correto da aplicação da fórmula a seguir, no BrOffice.org. Calc:\n=4+5+3*2","o":{"A":"24","B":"20","C":"15","D":"16"},"t":"Aplicativos e ferramentas","tp":"Suítes de escritório, planilhas e apresentações","src":"EAGS_2015_codigo_17_SIN.pdf · p. 7"},{"id":"EAGS2015-C17-INF-043","s":"inf","y":2015,"c":"17","n":43,"a":"C","an":false,"du":false,"l":"","e":"Considere que é preciso acessar uma determinada página na Internet, cujo endereço é:\nhttp://www.empresaxyz.com.br:80/cursos/rede.html\nSobre esse endereço, é possível afirmar que","o":{"A":"ele está localizado em um servidor de FTP.","B":"ele é relativo a uma instituição educacional e está localizado no Brasil.","C":"esse endereço representa a URL da página que se pretende acessar.","D":"O recurso a ser acessado por esse endereço é do tipo .gif."},"t":"Redes de computadores","tp":"Protocolos, endereçamento e arquitetura de redes","src":"EAGS_2015_codigo_17_SIN.pdf · p. 7"},{"id":"EAGS2015-C17-INF-044","s":"inf","y":2015,"c":"17","n":44,"a":"A","an":false,"du":false,"l":"","e":"Na linguagem\nPHP, são considerados comandos condicionais:","o":{"A":"if e switch","B":"and e while","C":"if, for e switch","D":"if, and e while"},"t":"Sistemas operacionais","tp":"Linux, Unix, processos, arquivos e comandos","src":"EAGS_2015_codigo_17_SIN.pdf · p. 7"},{"id":"EAGS2015-C17-INF-045","s":"inf","y":2015,"c":"17","n":45,"a":"D","an":false,"du":false,"l":"","e":"Considerando o uso de hiperlinks numa apresentação elaborada no BrOffice.org Impress 2.4, assinale a afirmativa correta.","o":{"A":"para que um hiperlink deixe de exibir o endereço de seu conteúdo durante a apresentação de slides e passe a exibir uma palavra-chave, é necessário criar um novo hyperlink.","B":"as configurações de hiperlink são editadas na caixa de diálogo Internet.","C":"não é permitido criar um hiperlink para um documento.","D":"é possível criar um hiperlink para um e-mail."},"t":"Aplicativos e ferramentas","tp":"Suítes de escritório, planilhas e apresentações","src":"EAGS_2015_codigo_17_SIN.pdf · p. 7","vr":1},{"id":"EAGS2015-C17-INF-046","s":"inf","y":2015,"c":"17","n":46,"a":"B","an":false,"du":false,"l":"","e":"Considere que está sendo utilizada a função SE do\nBrOffice.org. Calc. Marque a alternativa que apresenta o valor da função que será exibido se o resultado do teste for falso.\n=SE(G4>1;“ruim”; “bom”)","o":{"A":"ruim","B":"bom","C":"“ruim”","D":"“bom”"},"t":"Linguagens de programação","tp":"PHP, Java e sintaxe de linguagens","src":"EAGS_2015_codigo_17_SIN.pdf · p. 7"},{"id":"EAGS2015-C17-INF-047","s":"inf","y":2015,"c":"17","n":47,"a":"A","an":false,"du":false,"l":"","e":"No BrOffice.org Impress 2.4, utilizam-se slides em apresentações. Relacione a coluna da esquerda com a da direita e, em seguida, assinale a alternativa que contém a sequência correta.\n1 – Slide mestre\n(   ) É a área que serve como suporte para todos os demais elementos que constituem um slide.\n2 – Layout\n(   ) Permite ao usuário criar um novo slide contendo uma lista de marcadores constituída pelos títulos dos slides seguintes ao slide selecionado.\n3 – Plano de fundo\n(   ) É a forma como os elementos são do slide dispostos dentro de um slide.\n4 – Slide de resumo\n(   ) Pode ser empregado a uma apresentação quando desejamos aplicar uma formatação a um elemento de modo que em todos os slides da apresentação recebam as mesmas características.","o":{"A":"3 – 4 – 2 – 1","B":"3 – 2 – 4 – 1","C":"2 – 4 – 1 – 3","D":"4 – 1 – 2 – 3"},"t":"Aplicativos e ferramentas","tp":"Suítes de escritório, planilhas e apresentações","src":"EAGS_2015_codigo_17_SIN.pdf · p. 7"},{"id":"EAGS2015-C17-INF-048","s":"inf","y":2015,"c":"17","n":48,"a":"C","an":false,"du":false,"l":"","e":"Uma forma de reutilizar códigos é declarar funções em um arquivo, que será chamado nos programas que farão uso de tais funções. Para chamar o arquivo que contém a definição das funções em PHP, pode-se utilizar o comando:","o":{"A":"fopen","B":"insert","C":"include","D":"function"},"t":"Banco de dados","tp":"SQL, SGBD, modelagem e administração de dados","src":"EAGS_2015_codigo_17_SIN.pdf · p. 7"},{"id":"EAGS2015-C17-INF-049","s":"inf","y":2015,"c":"17","n":49,"a":"A","an":false,"du":false,"l":"","e":"Marque a alternativa que apresenta o sistema que só é utilizado para compartilhar arquivos entre máquinas LINUX e\nUNIX.","o":{"A":"NFS","B":"CIFS","C":"NTFS","D":"FAT32"},"t":"Sistemas operacionais","tp":"Linux, Unix, processos, arquivos e comandos","src":"EAGS_2015_codigo_17_SIN.pdf · p. 8"},{"id":"EAGS2015-C17-INF-050","s":"inf","y":2015,"c":"17","n":50,"a":"A","an":false,"du":false,"l":"","e":"Assinale a alternativa que completa correta e respectivamente as lacunas da assertiva a seguir.\nEntre as vantagens de um banco de dados, destacam-se:\n_______ de criação de novas aplicações; ______ de dados;\ncontrole de ______ de dados e controle automático de ______ entre registros.","o":{"A":"facilidade – segurança – redundância – relacionamento","B":"segurança – facilidade – relacionamento – redundância","C":"segurança – redundância – relacionamento – facilidade","D":"relacionamento – facilidade – segurança – redundância"},"t":"Banco de dados","tp":"SQL, SGBD, modelagem e administração de dados","src":"EAGS_2015_codigo_17_SIN.pdf · p. 8"},{"id":"EAGS2015-C17-INF-051","s":"inf","y":2015,"c":"17","n":51,"a":"B","an":false,"du":false,"l":"","e":"Assinale a alternativa correta, considerando o trabalho com fórmulas no BrOffice.org.Calc.","o":{"A":"No Calc somente é possível trabalhar com os seguintes tipos de operadores de cálculo: aritméticos, de comparação e de referência.","B":"O operador % é um operador do tipo aritmético do Calc.","C":"Os operadores de referência retornam como resultado os valores Verdadeiro ou Falso.","D":"O operador : (dois pontos) é um operador do tipo aritmético do Calc."},"t":"Aplicativos e ferramentas","tp":"Suítes de escritório, planilhas e apresentações","src":"EAGS_2015_codigo_17_SIN.pdf · p. 8"},{"id":"EAGS2015-C17-INF-052","s":"inf","y":2015,"c":"17","n":52,"a":"D","an":false,"du":false,"l":"","e":"Assinale a alternativa que apresenta o que o programa\nSOMATÓRIO retornará na variável “TOTAL”:\nPrograma SOMATÓRIO\nVar\nTOTAL, CONTADOR : inteiro\nInicio\nTOTAL Å 0 para CONTADOR de 1 até 50 passo 1 faça\nTOTAL Å TOTAL + CONTADOR\nFim-para\nEscreva TOTAL\nFim","o":{"A":"Será retornado o valor 50.","B":"Será retornada a média aritmética dos primeiros 50 números inteiros.","C":"Não há como prever qual valor será retornado, pelo valor tender ao infinito.","D":"Será retornada a soma dos 50 primeiros números inteiros\n(1+2+3+4+ ... +47+48+49+50)."},"t":"Algoritmos e lógica","tp":"Fluxogramas, estruturas de controle e pseudocódigo","src":"EAGS_2015_codigo_17_SIN.pdf · p. 8"},{"id":"EAGS2015-C17-INF-053","s":"inf","y":2015,"c":"17","n":53,"a":"D","an":false,"du":false,"l":"","e":"Qual o significado do operador relacional, cujo\nsímbolo é < >?","o":{"A":"Infinito","B":"Não maior","C":"Impossível","D":"Diferente de"},"t":"Algoritmos e lógica","tp":"Fluxogramas, estruturas de controle e pseudocódigo","src":"EAGS_2015_codigo_17_SIN.pdf · p. 8","vr":1},{"id":"EAGS2015-C17-INF-054","s":"inf","y":2015,"c":"17","n":54,"a":"C","an":false,"du":false,"l":"","e":"Analise os comandos abaixo, utilizados na linguagem\nSQL, e que podem ser usados, por exemplo, no SGBD MySQL.\nA seguir, relacione as colunas e assinale a alternativa que contém a sequência correta.\n1- desc <nome_tabela>;\n2- DROP TABLE <nome_tabela1>[ , <nome_tabela2>, ...];\n3- show tables;\n4- UPDATE <nome_tabela> SET campo1=valor1\n[, campo2=valor2, ..., campon=valorn]\n[WHERE <condições>];\n(   ) Realiza alterações nos valores dos registros de determinada tabela.\n(   ) Utilizado para visualizar a estrutura de determinada tabela.\n(   ) Comando utilizado para excluir tabelas do banco de dados.\n(   ) Mostra o nome das tabelas criadas.","o":{"A":"2 – 1 – 4 – 3","B":"1 – 3 – 2 – 4","C":"4 – 1 – 2 – 3","D":"4 – 1 – 3 – 2"},"t":"Banco de dados","tp":"SQL, SGBD, modelagem e administração de dados","src":"EAGS_2015_codigo_17_SIN.pdf · p. 8"},{"id":"EAGS2015-C17-INF-055","s":"inf","y":2015,"c":"17","n":55,"a":"C","an":false,"du":false,"l":"","e":"Assinale a alternativa que corresponde à simbologia abaixo, utilizada na área de tecnologia da informação.","o":{"A":"Controlador","B":"Intercalação","C":"Módulo de subrotina","D":"Checagen de operação auxiliar"},"t":"Algoritmos e lógica","tp":"Fluxogramas, estruturas de controle e pseudocódigo","src":"EAGS_2015_codigo_17_SIN.pdf · p. 8","vr":1},{"id":"EAGS2015-C17-INF-056","s":"inf","y":2015,"c":"17","n":56,"a":"D","an":false,"du":false,"l":"","e":"Analise o algoritmo abaixo e, em seguida, assinale a  alternativa correta.\nInicio\nN1,N2,N3,N4\nMD  ←  (N1+N2+N3+N4)/4\nN\nS\nMD >=5\n“Aluno Reprovado “Aluno Aprovado com média”, MD com média”, M D\nFim","o":{"A":"programa MÉDIA var\nN1,N2,N3,N4 : real\nInicio\nLeia N1,N2,N3,N4\nMD Å  (N1 + N2 + N3 + N4) / 4\nSe (MD >= 5) então\nEscreva “Aluno aprovado com média:”, MD\nSenão\nEscreva “Aluno reprovado com média:”, MD\nFim-se\nFim","B":"programa MÉDIA var\nMD, N1,N2,N3,N4 : real\nInicio\nMD Å  (N1 + N2 + N3 + N4) / 4\nSe (MD >= 5) então\nEscreva “Aluno aprovado com média:”, MD\nSenão\nEscreva “Aluno reprovado com média:”, M D\nFim-se\nFim","C":"programa MÉDIA var\nMD, N1,N2,N3,N4 : real\nInicio\nLeia N1,N2,N3,N4\nMD Å  (MD + N1 + N2 + N3 + N4) / 4\nSe (MD >= 5) então\nEscreva “Aluno aprovado com média:”, MD\nSenão\nEscreva “Aluno reprovado com média:”, MD\nFim-se\nFim","D":"programa MÉDIA var\nMD, N1,N2,N3,N4 : real\nInicio\nLeia N1,N2,N3,N4\nMD Å  (N1 + N2 + N3 + N4) / 4\nSe (MD >= 5) então\nEscreva “Aluno aprovado com média:”, MD\nSenão\nEscreva “Aluno reprovado com média:”, MD\nFim-se\nFim"},"t":"Algoritmos e lógica","tp":"Fluxogramas, estruturas de controle e pseudocódigo","src":"EAGS_2015_codigo_17_SIN.pdf · p. 9"},{"id":"EAGS2015-C17-INF-057","s":"inf","y":2015,"c":"17","n":57,"a":"C","an":false,"du":false,"l":"","e":"Analise a figura a seguir e assinale a alternativa correta.\nInicio\nLeia N1,N2,N3,N4\nSoma              N1+N2+N3+N4\nMedia           Soma/4\nMedia >= 7\nN                                            S\nResultado               Resultado “Reprovado”          “Aprovado”\nEscreva N1,N2,N3,N4\nEscreva Soma\nEscreva Media\nEscreva Resultado\nFim\nEssa figura é um exemplo de","o":{"A":"Portugol.","B":"Pseudocódigo.","C":"Diagrama de Chapin.","D":"Português estruturado."},"t":"Algoritmos e lógica","tp":"Fluxogramas, estruturas de controle e pseudocódigo","src":"EAGS_2015_codigo_17_SIN.pdf · p. 9","vr":1},{"id":"EAGS2015-C17-INF-058","s":"inf","y":2015,"c":"17","n":58,"a":"B","an":false,"du":false,"l":"","e":"Considerando A=8, B=5 e C=5, de acordo com o programa\ntriângulo abaixo, marque a alternativa correta.\nPrograma TRIÂNGULO\nVar\nA, B, C : real\nInício\nLeia A, B, C\nSe (A < B + C) .e. (B < A + C) .e. (C < A + B) então\nSe (A = B) .e. (B = C) então\nEscreva “Triângulo Equilátero”\nSenão\nSe (A = B) .ou. (A = C) .ou. (C = B)  então\nEscreva “Triângulo Isósceles”\nSenão\nEscreva “Triângulo Escaleno”\nFim-se\nFim-se\nSenão\nEscreva “As medidas não formam um triângulo”\nFim-se\nFim","o":{"A":"As medidas formam um triângulo equilátero.","B":"As medidas formam um triângulo isósceles.","C":"As medidas formam um triângulo escaleno.","D":"As medidas não formam um triângulo."},"t":"Algoritmos e lógica","tp":"Estruturas condicionais e operadores lógicos em pseudocódigo","src":"EAGS_2015_codigo_17_SIN.pdf · p. 9"},{"id":"EAGS2015-C17-INF-059","s":"inf","y":2015,"c":"17","n":59,"a":"C","an":false,"du":false,"l":"","e":"Em um programa escrito em PHP, toda variável passada como parâmetro para uma função não tem seu valor alterado fora do escopo desta. Qual é a sintaxe utilizada para forçar a variável passada como parâmetro a ser atualizada fora do escopo da função, durante a execução desta?","o":{"A":"function funcao(#variavel)","B":"function funcao(&variavel)","C":"function funcao(&$variavel)","D":"function funcao(#$variavel)"},"t":"Algoritmos e lógica","tp":"Fluxogramas, estruturas de controle e pseudocódigo","src":"EAGS_2015_codigo_17_SIN.pdf · p. 10"},{"id":"EAGS2015-C17-INF-060","s":"inf","y":2015,"c":"17","n":60,"a":"A","an":false,"du":false,"l":"","e":"Na análise do código de um programa escrito em PHP, encontrou-se a seguinte linha:\n$codigo_do_produto = $_GET[“codigo”];\nPode-se afirmar que o conteúdo de $_GET[“codigo”]","o":{"A":"ficará visível na URL.","B":"pode ter tamanho ilimitado.","C":"é enviado no corpo da mensagem emitida ao servidor.","D":"pode ser um arquivo do tipo imagem."},"t":"Redes de computadores","tp":"Protocolos, endereçamento e arquitetura de redes","src":"EAGS_2015_codigo_17_SIN.pdf · p. 10","vr":1},{"id":"EAGS2015-C17-INF-061","s":"inf","y":2015,"c":"17","n":61,"a":"A","an":false,"du":false,"l":"","e":"Assinale a alternativa que completa a lacuna corretamente.\nApós um programa PHP executar comandos de inserção, exclusão ou atualização em um banco de dados MySQL, o comando _______________ é capaz de retornar a quantidade de linhas afetadas por uma operação.","o":{"A":"mysql_affected_rows","B":"mysql_num_fields","C":"mysql_num_rows","D":"mysql_result"},"t":"Banco de dados","tp":"SQL, SGBD, modelagem e administração de dados","src":"EAGS_2015_codigo_17_SIN.pdf · p. 10"},{"id":"EAGS2015-C17-INF-062","s":"inf","y":2015,"c":"17","n":62,"a":"D","an":false,"du":false,"l":"","e":"Analise a linha de código PHP abaixo, desconsiderando o zero como valor a ser atribuído às variáveis $a e $b, assinale a opção incorreta.\n$c = ( $a % $b ) ? (“não”) : (“sim”);","o":{"A":"Se $a for igual a 84 e $b for igual a 3, então $c receberá “sim”.","B":"Se $b for igual a 1 e $a qualquer valor inteiro, $c receberá “sim”.","C":"Se $a for qualquer número par e $b igual a 2, então $c sempre receberá “sim”.","D":"Se $a for igual a 2 e $b qualquer número par, então $c sempre receberá “sim”."},"t":"Linguagens de programação","tp":"PHP, Java e sintaxe de linguagens","src":"EAGS_2015_codigo_17_SIN.pdf · p. 10"},{"id":"EAGS2015-C17-INF-063","s":"inf","y":2015,"c":"17","n":63,"a":"C","an":false,"du":false,"l":"","e":"O desenvolvimento de um sistema é dividido em fases distintas. Marque a alternativa que apresenta a fase em que são confeccionados os algoritmos referentes aos diversos programas que serão elaborados.","o":{"A":"análise","B":"execução","C":"programação","D":"definição do problema"},"t":"Algoritmos e lógica","tp":"Fluxogramas, estruturas de controle e pseudocódigo","src":"EAGS_2015_codigo_17_SIN.pdf · p. 10"},{"id":"EAGS2015-C17-INF-064","s":"inf","y":2015,"c":"17","n":64,"a":"B","an":false,"du":false,"l":"","e":"Existem vários tipos de lógicas usadas no processamento automático de dados. O profissional de processamento de dados deve decidir qual tipo de lógica deverá ser utilizada para a solução de um determinado problema. Dentre as alternativas abaixo, assinale a que corresponde à lógica modular.","o":{"A":"Rotina 01\nRotina 02\nRotina 03\nRotina N","B":"Rotina 01\nRotina 02\nBloco Principal\nRotina 03\nRotina 04","C":"Rotina 01\nRotina 02\nRotina 03\nFim 03\nFim 02\nFim 01\nRotina 01","D":"Rotina 02\nRotina 04\nRotina 05\nRotina 03\nRotina 06\nRotina 07\nFim 07\nFim 06\nFim 03\nFim 05\nFim 02\nFim 04\nFim 01"},"t":"Algoritmos e lógica","tp":"Lógica modular e decomposição de rotinas","src":"EAGS_2015_codigo_17_SIN.pdf · p. 10"},{"id":"EAGS2015-C17-INF-065","s":"inf","y":2015,"c":"17","n":65,"a":"D","an":false,"du":false,"l":"","e":"Assinale a alternativa que retrata corretamente a utilização estrutura da estrutura de looping na figura abaixo, para...de...até...passo...faça...fim_para:\nInicio\n2,5,1 cont\n← x\nX ⊗ 3\nR\nR\nFim","o":{"A":"A variável cont se inicia com 1.","B":"O incremento da variável cont é 5.","C":"A estrutura de repetição será executada 5 vezes.","D":"A estrutura de repetição pode ser usada quando houver necessidade de se repetir trechos finitos, em que os valores “inicial” e “final” são conhecidos."},"t":"Algoritmos e lógica","tp":"Fluxogramas, estruturas de controle e pseudocódigo","src":"EAGS_2015_codigo_17_SIN.pdf · p. 11","vr":1},{"id":"EAGS2015-C17-INF-066","s":"inf","y":2015,"c":"17","n":66,"a":"D","an":false,"du":false,"l":"","e":"Assinale a alternativa correta em relação à definição de variáveis globais e locais.","o":{"A":"Uma variável global não pode ser visível a todas as sub- rotinas hierarquicamente subordinadas à rotina principal.","B":"As variáveis definidas como globais e locais precisam ser declaradas repetidas vezes dentro de cada sub-rotina.","C":"Uma variável local pode ser considerada global quando declarada no cabeçalho de uma sub-rotina, porém só é válida dentro da rotina à qual está declarada.","D":"Uma variável global é declarada no início do algoritmo principal de um programa, pode ser utilizada por qualquer sub-rotina subordinada ao algoritmo principal."},"t":"Algoritmos e lógica","tp":"Fluxogramas, estruturas de controle e pseudocódigo","src":"EAGS_2015_codigo_17_SIN.pdf · p. 11"},{"id":"EAGS2015-C17-INF-067","s":"inf","y":2015,"c":"17","n":67,"a":"A","an":false,"du":false,"l":"","e":"Ao visualizar o arquivo /etc/crontab, o administrador de um sistema LINUX se deparou com as seguintes linhas:\n0        8        7         9        *        backup.sh\n0        10      30       *        0        apt-get upgrade\n12      1        15       5        *        init 6\nApós analisar o conteúdo, o administrador fez a seguintes afirmativas:\nI - Todo dia 7 de setembro às 8 horas em ponto, o arquivo backup.sh será executado.\nII - O comando apt-get upgrade só será executado nos meses em que o dia 30 coincidir com o domingo.\nIII - No dia primeiro de dezembro às 15h e 5 min, o comando init 6 será executado.\nEstão corretas?","o":{"A":"I e II","B":"I e III","C":"II e III","D":"I, II e III"},"t":"Sistemas operacionais","tp":"Linux, Unix, processos, arquivos e comandos","src":"EAGS_2015_codigo_17_SIN.pdf · p. 11"},{"id":"EAGS2015-C17-INF-068","s":"inf","y":2015,"c":"17","n":68,"a":"B","an":false,"du":false,"l":"","e":"Assinale a alternativa que completa correta e respectivamente as lacunas do texto a seguir.\nUm banco de dados pode ser criado sobre um dos seguintes enfoques: ____________, em rede e ________. No modelo _________, a informação é organizada em níveis, em que um registro em nível superior pode ter um ou mais de um, ou ainda, não ter, _______, no nível imediatamente inferior. Em um dos modelos estabelece-se a ligação entre relações por meio de\n_______.","o":{"A":"relacional, hierárquico, relacional, ponteiros e filhos.","B":"hierárquico, relacional, hierárquico, filhos e ponteiros.","C":"hierárquico, relacional, hierárquico, ponteiros e filhos.","D":"relacional, hierárquico, relacional, filhos e ponteiros."},"t":"Banco de dados","tp":"SQL, SGBD, modelagem e administração de dados","src":"EAGS_2015_codigo_17_SIN.pdf · p. 11"},{"id":"EAGS2015-C17-INF-069","s":"inf","y":2015,"c":"17","n":69,"a":"C","an":false,"du":false,"l":"","e":"Assinale a alternativa que preenche corretamente a  lacuna da afirmativa a seguir.\nO APT é um sistema de _____________ e se originou no\nDebian.","o":{"A":"compartilhamento de arquivos","B":"compilação de códigos fontes","C":"gerenciamento de pacotes","D":"arquivos de redes"},"t":"Sistemas operacionais","tp":"Linux, Unix, processos, arquivos e comandos","src":"EAGS_2015_codigo_17_SIN.pdf · p. 11"},{"id":"EAGS2015-C17-INF-070","s":"inf","y":2015,"c":"17","n":70,"a":"B","an":false,"du":false,"l":"","e":"Os sistemas LINUX utilizam 7 níveis de execução que definem quais serviços estarão sendo executados em determinado momento. O sistema é desligado ou reinicializado, como efeito colateral, se entrar nos níveis de","o":{"A":"0 e 1.","B":"0 e 6.","C":"1 e 5.","D":"5 e 6."},"t":"Sistemas operacionais","tp":"Linux, Unix, processos, arquivos e comandos","src":"EAGS_2015_codigo_17_SIN.pdf · p. 11"},{"id":"EAGS2015-C17-INF-071","s":"inf","y":2015,"c":"17","n":71,"a":"D","an":false,"du":false,"l":"","e":"Considere que, no banco de dados, existe a tabela “itens”, descrita a seguir:\nColuna\nTipo codigo_item smallint not null nome_item\nCharacter varying(80) preco_item double precision not null cod_categoria\nCharacter varying(4) not null\nConsidere ainda que será utilizado o comando INSERT\nINTO abaixo, na linguagem SQL, que irá fazer a inserção de um produto na referida tabela:\nINSERT INTO itens\n(codigo_item, nome_item, preco_item, cod_categoria)\nVALUES (05, ‘camiseta branca’, 49.90)\nEm relação ao resultado produzido pelo comando citado na tabela, assinale a alternativa correta.","o":{"A":"Os valores do campo cod_categoria não podem ser declarados entre aspas simples, pois isso causará um erro na execução do comando.","B":"Os valores constantes dos campos declarados no comando acima ocuparão os campos, independente da ordem em que aparecem no comando.","C":"O campo código_item receberá o valor NULL.","D":"Ocorrerá um erro na execução do comando INSERT ao ser executado esse comando."},"t":"Banco de dados","tp":"SQL, SGBD, modelagem e administração de dados","src":"EAGS_2015_codigo_17_SIN.pdf · p. 12"},{"id":"EAGS2015-C17-INF-072","s":"inf","y":2015,"c":"17","n":72,"a":"C","an":false,"du":false,"l":"","e":"O protocolo que possibilita a um servidor distribuir parâmetros de rede como IP máscara e gateway a clientes na rede é chamado de","o":{"A":"FTP.","B":"VPN.","C":"DHCP.","D":"TCP/IP."},"t":"Redes de computadores","tp":"Protocolos, endereçamento e arquitetura de redes","src":"EAGS_2015_codigo_17_SIN.pdf · p. 12"},{"id":"EAGS2015-C17-INF-073","s":"inf","y":2015,"c":"17","n":73,"a":"B","an":false,"du":false,"l":"","e":"O Debian, por padrão, permite que qualquer usuário agende tarefas com o uso do comando crontab. Para proibir determinado usuário de executar agendamentos, deve-se","o":{"A":"excluí-lo do grupo de administradores do sistema.","B":"inserir seu nome no arquivo /etc/cron.deny e excluir o arquivo /etc/cron.allow.","C":"usar o comando chmod –x.","D":"retirar a permissão de execução do crontab."},"t":"Sistemas operacionais","tp":"Linux, Unix, processos, arquivos e comandos","src":"EAGS_2015_codigo_17_SIN.pdf · p. 12"},{"id":"EAGS2015-C17-INF-074","s":"inf","y":2015,"c":"17","n":74,"a":"A","an":false,"du":false,"l":"","e":"O clock externo do processador é o sinal de clock usado no barramento local do micro. Esse sinal é medido em","o":{"A":"Hz.","B":"Ohm.","C":"Volts.","D":"Ampère."},"t":"Hardware e arquitetura","tp":"Componentes, memória, processamento e sistemas digitais","src":"EAGS_2015_codigo_17_SIN.pdf · p. 12"},{"id":"EAGS2015-C17-INF-075","s":"inf","y":2015,"c":"17","n":75,"a":"C","an":false,"du":false,"l":"","e":"Considere que os seguintes registros estão gravados na tabela abaixo, denominada “itens”:\ncodigo_item nome_item preco_item cod_categoria bola\n10.20\nAABB\nDVD\n2.00\nBBZZ camisa listrada  30.50\nCCAA\nAssinale a alternativa que traz o resultado correto da pesquisa realizada na tabela “itens” pelo seguinte comando:\nSELECT codigo_item, nome_item, preco_item FROM itens\nWHERE preco_item>10.20;","o":{"A":"nome_item preco_item cod_categoria bola\n10.20\nAABB camisa listrada  30.50\nCCAA","B":"codigo_item nome_item preco_item bola\n10.20 camisa listrada  30.50","C":"codigo_item nome_item preco_item camisa listrada  30.50","D":"nome_item preco_item cod_categoria camisa listrada  30.50\nCCAA"},"t":"Banco de dados","tp":"SQL, SGBD, modelagem e administração de dados","src":"EAGS_2015_codigo_17_SIN.pdf · p. 12","vr":1},{"id":"EAGS2015-C17-INF-076","s":"inf","y":2015,"c":"17","n":76,"a":"D","an":false,"du":false,"l":"","e":"Considerando o comando a seguir, que utiliza a linguagem\nSQL, assinale a alternativa correta.\nObs.: os valores do campo “preco” são considerados em reais e todos os campos da tabela são de preenchimento obrigatório.\nSELECT\n(codigo_produto, nome_produto, preco, cod_categoria FROM produtos)\nWHERE cod_categoria=3 AND preco<50.00;","o":{"A":"O campo codigo_produto contém um valor “NULL”.","B":"Os valores já existentes na tabela serão substituídos pelos valores declarados na cláusula WHERE, conforme a ordem definida.","C":"O comando retornará somente o valor constante do campo nome de todos os produtos cujo cod_categoria é “3” e que custam menos de R$50.00.","D":"O comando retornará o valor constante dos campos:\ncodigo_produto, nome_produto, preco, cod_categoria de todos os produtos cujo cod_categoria é “3” e que custam menos de R$50.00."},"t":"Banco de dados","tp":"SQL, SGBD, modelagem e administração de dados","src":"EAGS_2015_codigo_17_SIN.pdf · p. 12"},{"id":"EAGS2015-C17-INF-077","s":"inf","y":2015,"c":"17","n":77,"a":"A","an":false,"du":false,"l":"","e":"Assinale a alternativa que completa correta e respectivamente as lacunas do texto a seguir.\nEm Programação Orientada a Objetos, pode-se afirmar que a herança é um mecanismo que permite basear uma nova classe na definição de uma outra previamente existente. Quando isso ocorre, a nova classe herda automaticamente todos os\n___________ , ___________ e ____________ presentes na classe previamente existente.","o":{"A":"atributos - comportamentos - implementações","B":"códigos - instâncias - implementações","C":"comportamentos - instâncias - códigos","D":"termos - atributos - instâncias"},"t":"Programação orientada a objetos","tp":"Classes, herança, encapsulamento e polimorfismo","src":"EAGS_2015_codigo_17_SIN.pdf · p. 12"},{"id":"EAGS2015-C17-INF-078","s":"inf","y":2015,"c":"17","n":78,"a":"C","an":false,"du":false,"l":"","e":"A seguir está um comando na linguagem SQL, que pode ser usado, por exemplo, no SGBD MySQL. Assinale a alternativa que contém a afirmativa correta.\nALTER TABLE loja ADD empresa varchar(50);","o":{"A":"Essa sintaxe do comando ALTER TABLE é usada para incluir ou excluir campos de uma tabela.","B":"O comando acima permite adicionar o campo loja à tabela empresa.","C":"O campo incluído na tabela pelo comando acima será incluído como o último campo da tabela.","D":"É possível afirmar que todos os registros da tabela referenciada no comando acima são do tipo varchar(50)."},"t":"Banco de dados","tp":"SQL, SGBD, modelagem e administração de dados","src":"EAGS_2015_codigo_17_SIN.pdf · p. 13"},{"id":"EAGS2015-C17-INF-079","s":"inf","y":2015,"c":"17","n":79,"a":"B","an":false,"du":false,"l":"","e":"“_____________ é o bloco de memória de alta velocidade onde estão memorizados dados e instruções acessadas pela RAM, possibilitando aumento de desempenho do processador”.\nAssinale a alternativa que completa corretamente a lacuna acima.","o":{"A":"USB","B":"Cache","C":"Socket","D":"Barramento do Sistema"},"t":"Hardware e arquitetura","tp":"Componentes, memória, processamento e sistemas digitais","src":"EAGS_2015_codigo_17_SIN.pdf · p. 13"},{"id":"EAGS2015-C17-INF-080","s":"inf","y":2015,"c":"17","n":80,"a":"D","an":false,"du":false,"l":"","e":"Na coluna da esquerda constam alguns termos relacionados à HERANÇA, um dos pilares da Programação Orientada a\nObjetos (POO). Considerando isso, relacione as colunas e, em seguida, assinale a alternativa que apresenta a sequência correta.\n(1) - Especialização\n(   ) Descreve o relacionamento em que uma classe é considerada do mesmo tipo de outra.\n(2) - “É um”\n(   ) É o processo de uma classe “filha” ser projetada em termos de como ela é diferente de sua progenitora.\n(3) - Classe filha\n(   ) Pode adicionar novos comportamentos e atributos a si mesma.\n(4) - Classe Folha\n(   ) É a classe superior da hierarquia de herança.\n(5) - Classe Raiz\n(   ) É uma classe sem filhas.","o":{"A":"4 – 1 – 3 – 2 – 5","B":"3 – 1 – 5 – 2 – 4","C":"2 – 3 – 1 – 5 – 4","D":"2 – 1 – 3– 5 – 4"},"t":"Programação orientada a objetos","tp":"Classes, herança, encapsulamento e polimorfismo","src":"EAGS_2015_codigo_17_SIN.pdf · p. 13"},{"id":"EAGS2015-C17-INF-081","s":"inf","y":2015,"c":"17","n":81,"a":"C","an":false,"du":false,"l":"","e":"As trilhas de um HD (Hard Disk) são divididas em","o":{"A":"cilindros.","B":"clusters.","C":"setores.","D":"pack."},"t":"Hardware e arquitetura","tp":"Componentes, memória, processamento e sistemas digitais","src":"EAGS_2015_codigo_17_SIN.pdf · p. 13"},{"id":"EAGS2015-C17-INF-082","s":"inf","y":2015,"c":"17","n":82,"a":"A","an":false,"du":false,"l":"","e":"Considerando o “Encapsulamento” em Programação\nOrientada a Objetos (POO), relacione a coluna da esquerda com a da direita e, em seguida, assinale a alternativa que contém a sequência correta.\n(1) - Abstração\n(   ) É o processo de simplificar um problema difícil.\n(2) - Interface\n(   ) Define como um componente realmente fornece um serviço.\n(3) - Implementação\n(   ) Lista os serviços fornecidos por um componente.\n(4) - Encapsulamento\n(   ) Permite que se construam partes ocultas da implementação do software, que atinjam uma funcionalidade e ocultam os detalhes de implementação do mundo exterior.","o":{"A":"1 – 3 – 2 – 4","B":"1 – 4 – 2 – 3","C":"2 – 3 – 1 – 4","D":"3 – 1 – 4 – 2"},"t":"Programação orientada a objetos","tp":"Classes, herança, encapsulamento e polimorfismo","src":"EAGS_2015_codigo_17_SIN.pdf · p. 13"},{"id":"EAGS2015-C17-INF-083","s":"inf","y":2015,"c":"17","n":83,"a":"B","an":false,"du":false,"l":"","e":"Assinale a alternativa correta.\nA Programação Orientada a Objetos (POO) se esmera em produzir software que tenha as seguintes características:","o":{"A":"natural, mensurável, manutenível, instantâneo, acessível e confiável.","B":"natural, confiável, reutilizável, manutenível, extensível e oportuno.","C":"confiável, reutilizável, extensível, mensurável, acessível e fácil de usar.","D":"extensível, natural, mensurável, reutilizável, instantâneo e simples."},"t":"Programação orientada a objetos","tp":"Classes, herança, encapsulamento e polimorfismo","src":"EAGS_2015_codigo_17_SIN.pdf · p. 13"},{"id":"EAGS2015-C17-INF-084","s":"inf","y":2015,"c":"17","n":84,"a":"A","an":false,"du":false,"l":"","e":"Considerando a Programação Orientada a Objetos (POO), relacione a coluna da esquerda com a da direita e, em seguida, assinale a alternativa que contém a sequência correta.\n(1) - Atributos\n(   ) São métodos usados para inicializar objetos durante sua instanciação.\n(2) - Domínio\n(   ) É o espaço onde um problema reside.\n(3) - Construtores\n(   ) São as características de uma classe visíveis externamente.\n(4) - Classe\n(   ) Define os atributos e comportamentos comuns compartilhados por um tipo de objeto.","o":{"A":"3 – 2 – 1 – 4","B":"3 – 2 – 4 – 1","C":"2 – 3 – 1 – 4","D":"1 – 2 – 3 – 4"},"t":"Programação orientada a objetos","tp":"Classes, herança, encapsulamento e polimorfismo","src":"EAGS_2015_codigo_17_SIN.pdf · p. 13"},{"id":"EAGS2015-C17-INF-085","s":"inf","y":2015,"c":"17","n":85,"a":"B","an":false,"du":false,"l":"","e":"Considerando os conceitos relacionados à Programação\nOrientada a Objetos, observe a figura abaixo e assinale a afirmativa correta a respeito das classes representadas.\nClasse XYZ\nClasse ABC\nClasse KWV\nClasse HGJ","o":{"A":"A classe KWV não é uma classe folha.","B":"A classe HGJ é uma classe descendente da classe XYZ.","C":"Considerando a hierarquia inteira representada pela figura, a classe ABC é uma classe raiz.","D":"Considerando a hierarquia inteira representada pela figura, a classe XYZ é uma classe ancestral da classe ABC."},"t":"Programação orientada a objetos","tp":"Classes, herança, encapsulamento e polimorfismo","src":"EAGS_2015_codigo_17_SIN.pdf · p. 14","vr":1},{"id":"EAGS2015-C17-INF-086","s":"inf","y":2015,"c":"17","n":86,"a":"D","an":false,"du":false,"l":"","e":"Quando uma informação é gravada na memória RAM ela fica suscetível a erros em que a simples inversão de um bit 0 para 1, ou vice-versa, pode atrapalhar a execução de um programa. O primeiro e mais simples método de detecção desse tipo de erro foi chamado de paridade, em que para cada byte armazenado também existe um bit referente a ele, possibilitando que o sistema apresente uma mensagem de erro caso encontre uma inversão de bit. Assinale a alternativa que apresenta um erro de acordo com o byte armazenado e o bit de paridade correspondente.","o":{"A":"10010010; 1","B":"01100010; 1","C":"10100011; 0","D":"10100110; 1"},"t":"Hardware e arquitetura","tp":"Componentes, memória, processamento e sistemas digitais","src":"EAGS_2015_codigo_17_SIN.pdf · p. 14"},{"id":"EAGS2015-C17-INF-087","s":"inf","y":2015,"c":"17","n":87,"a":"B","an":false,"du":false,"l":"","e":"A Unidade Central de Processamento, onde são executadas as instruções, divide-se em duas seções. Essas seções são chamadas de","o":{"A":"clock e de barramento.","B":"controle e de aritmética e lógica.","C":"memória principal e de memória virtual.","D":"tempo de  acesso e de  ciclo de memória."},"t":"Hardware e arquitetura","tp":"Componentes, memória, processamento e sistemas digitais","src":"EAGS_2015_codigo_17_SIN.pdf · p. 14"},{"id":"EAGS2015-C17-INF-088","s":"inf","y":2015,"c":"17","n":88,"a":"D","an":false,"du":false,"l":"","e":"As portas TCP, nas quais o servidor Apache recebe conexões HTTP e HTTPS, são, respectivamente,","o":{"A":"22 e 25.","B":"25 e 80.","C":"22 e 443.","D":"80 e 443."},"t":"Redes de computadores","tp":"Protocolos, endereçamento e arquitetura de redes","src":"EAGS_2015_codigo_17_SIN.pdf · p. 14"},{"id":"EAGS2015-C17-INF-089","s":"inf","y":2015,"c":"17","n":89,"a":"C","an":false,"du":false,"l":"","e":"O principal objetivo do modelo de referência OSI foi oferecer uma padronização para permitir que os fabricantes pudessem criar protocolos e componentes a partir desse modelo.\nAssinale a alternativa que apresenta corretamente as camadas do modelo de referência OSI.","o":{"A":"Aplicação, transporte, internet e rede.","B":"Aplicação, transporte, inter-rede e rede.","C":"Aplicação, apresentação, sessão, transporte, rede, enlace e física.","D":"Aplicação, apresentação, sessão, transporte, internet, enlace e física."},"t":"Redes de computadores","tp":"Protocolos, endereçamento e arquitetura de redes","src":"EAGS_2015_codigo_17_SIN.pdf · p. 14"},{"id":"EAGS2015-C17-INF-090","s":"inf","y":2015,"c":"17","n":90,"a":"A","an":false,"du":false,"l":"","e":"Relacione as colunas e assinale a alternativa que apresenta a sequência correta.\n(1) – Transmissão de dados paralela\n(2) – Transmissão de dados em série\n(3) – Barramento\n(4) – Chipset\n(   ) Caminho de comunicação entre dois ou mais circuitos.\n(   ) Conjunto de circuitos presentes na placa-mãe.\n(   ) O transmissor envia vários bits simultaneamente ao receptor.\n(   ) O transmissor envia somente um bit por  vez  ao  receptor.","o":{"A":"3, 4, 1, 2","B":"3, 4, 2, 1","C":"2, 3, 1, 4","D":"1, 4, 3, 2"},"t":"Hardware e arquitetura","tp":"Componentes, memória, processamento e sistemas digitais","src":"EAGS_2015_codigo_17_SIN.pdf · p. 14","vr":1},{"id":"EAGS2015-C17-INF-091","s":"inf","y":2015,"c":"17","n":91,"a":"B","an":false,"du":false,"l":"","e":"Os endereços considerados reservados pela IANA\n(Internet Assigned Numbers Authority) diminuíram ainda mais a quantidade de combinações possíveis e disponíveis dos números\nIP em 32 bits.\nAssinale a alternativa que mostra, corretamente, um endereço IP de loopback address ou endereço de retorno, isto é, todas as vezes em que um computador emitir uma requisição a esse endereço, a resposta será dada pelo próprio emitente.","o":{"A":"0.0.0.0","B":"127.0.0.1","C":"192.168.0.0","D":"255.255.255.255"},"t":"Redes de computadores","tp":"Protocolos, endereçamento e arquitetura de redes","src":"EAGS_2015_codigo_17_SIN.pdf · p. 14"},{"id":"EAGS2015-C17-INF-092","s":"inf","y":2015,"c":"17","n":92,"a":"A","an":false,"du":false,"l":"","e":"Os protocolos da camada de aplicação do modelo de referência TCP/IP possuem dois componentes conhecidos por cliente e servidor. O cliente é quem inicia o contato com o servidor, enquanto que o servidor responde as requisições do cliente.\nAssinale a alternativa que apresenta corretamente o protocolo que tem como objetivo a transferência de programas e arquivos de todos os tipos por meio de redes TCP/IP, sendo essa transferência confiável e eficiente.","o":{"A":"FTP","B":"DHCP","C":"SMTP","D":"TELNET"},"t":"Redes de computadores","tp":"Protocolos, endereçamento e arquitetura de redes","src":"EAGS_2015_codigo_17_SIN.pdf · p. 14"},{"id":"EAGS2015-C17-INF-093","s":"inf","y":2015,"c":"17","n":93,"a":"C","an":false,"du":false,"l":"","e":"Assinale a alternativa que descreve corretamente uma vantagem oferecida pelo protocolo IPv6 em relação ao protocolo\nIPv4.","o":{"A":"A diminuição dos endereços IPs, aumentando assim a segurança na internet.","B":"A diminuição dos endereços IPs, com sua respectiva diminuição na segurança na internet.","C":"A expansão dos endereços IPs, considerados escassos para o acesso à internet. Em poucos anos não teremos mais endereços IP livre.","D":"A expansão dos endereços IPs, pois hoje o protocolo IP disponível é de 32 bits, e o protocolo IPv6 disponibilizará o endereço IP com 64 bits, ou seja, duas vezes maior."},"t":"Redes de computadores","tp":"Protocolos, endereçamento e arquitetura de redes","src":"EAGS_2015_codigo_17_SIN.pdf · p. 14"},{"id":"EAGS2015-C17-INF-094","s":"inf","y":2015,"c":"17","n":94,"a":"A","an":false,"du":false,"l":"","e":"Qual é o protocolo utilizado para que uma máquina encontre o endereço físico de um host que se encontra na mesma rede Ethernet?","o":{"A":"ARP","B":"DNS","C":"PING","D":"DHCP"},"t":"Redes de computadores","tp":"Protocolos, endereçamento e arquitetura de redes","src":"EAGS_2015_codigo_17_SIN.pdf · p. 15"},{"id":"EAGS2015-C17-INF-095","s":"inf","y":2015,"c":"17","n":95,"a":"D","an":false,"du":false,"l":"","e":"Analise o texto e assinale a alternativa correta.\nÉ um tipo de firewall que gerencia a conexão em função do aplicativo que a solicitou, liberando ou não o acesso à internet.","o":{"A":"Proxy","B":"furtivo","C":"Filtro de pacotes","D":"Gateway de aplicações"},"t":"Redes de computadores","tp":"Protocolos, endereçamento e arquitetura de redes","src":"EAGS_2015_codigo_17_SIN.pdf · p. 15"},{"id":"EAGS2015-C17-INF-096","s":"inf","y":2015,"c":"17","n":96,"a":"B","an":false,"du":false,"l":"","e":"Um administrador responsável por uma rede classe C identificada pelo IP 192.168.10.0 decidiu dividi-la em 4 sub-redes utilizando a máscara 255.255.255.192. Sabendo-se que não existe roteamento entre as sub-redes, pode-se afirmar que:\nI   - 192.168.10.15 e 192.168.10.62 podem se comunicar.\nII  - 192.168.10.100 e 192.168.10.193 podem se comunicar.\nIII - 192.168.10.130 e 192.168.10.125 não podem se comunicar.\nEstão corretas as assertivas","o":{"A":"I e II apenas.","B":"I e III apenas.","C":"II e III apenas.","D":"I, II e III."},"t":"Redes de computadores","tp":"Protocolos, endereçamento e arquitetura de redes","src":"EAGS_2015_codigo_17_SIN.pdf · p. 15"},{"id":"EAGS2015-C17-INF-097","s":"inf","y":2015,"c":"17","n":97,"a":"C","an":false,"du":false,"l":"","e":"Leia as afirmativas a seguir, a respeito do equipamento gateway.\nI   - É uma caixa metálica onde se instalam todos os componentes do computador.\nII  - É um equipamento que se utiliza quando se objetiva que computadores de uma rede local possam acessar computadores de uma outra rede, inclusive a internet.\nIII - É um equipamento cuja função é permitir que as comunicações internas da rede local fiquem confinadas a essa rede local, possibilitando o tráfego entre computadores locais e uma rede externa, quando esta existir.\nEstão corretas","o":{"A":"I e II apenas.","B":"I e III apenas.","C":"II e III apenas.","D":"I, II e III."},"t":"Redes de computadores","tp":"Protocolos, endereçamento e arquitetura de redes","src":"EAGS_2015_codigo_17_SIN.pdf · p. 15"},{"id":"EAGS2015-C17-INF-098","s":"inf","y":2015,"c":"17","n":98,"a":"A","an":false,"du":false,"l":"","e":"A principal ferramenta do administrador de sistemas para monitorar processos no LINUX é o","o":{"A":"ps","B":"ssh","C":"init","D":"/proc"},"t":"Sistemas operacionais","tp":"Linux, Unix, processos, arquivos e comandos","src":"EAGS_2015_codigo_17_SIN.pdf · p. 15"},{"id":"EAGS2015-C17-INF-099","s":"inf","y":2015,"c":"17","n":99,"a":"D","an":false,"du":false,"l":"","e":"Assinale a alternativa que apresenta a função utilizada para a leitura de uma linha de um arquivo, na linguagem PHP.","o":{"A":"fopen","B":"fwrite","C":"feof","D":"fgets"},"t":"Linguagens de programação","tp":"PHP, Java e sintaxe de linguagens","src":"EAGS_2015_codigo_17_SIN.pdf · p. 15"},{"id":"EAGS2015-C17-INF-100","s":"inf","y":2015,"c":"17","n":100,"a":"A","an":false,"du":false,"l":"","e":"Considerando os tipos de dados a serem tratados por um computador, relacione as colunas e, a seguir, assinale a alternativa com a sequência correta.\n(1) – Real\n(   ) 678\n(2) – Caractere\n(   ) .Falso.\n(3) – Lógico\n(   ) “Cinco”\n(4) – Inteiro\n(   ) 99.8","o":{"A":"4, 3, 2, 1","B":"4, 2, 3, 1","C":"1, 2, 3, 4","D":"1, 3, 2, 4"},"t":"Algoritmos e lógica","tp":"Fluxogramas, estruturas de controle e pseudocódigo","src":"EAGS_2015_codigo_17_SIN.pdf · p. 15"},{"id":"EAGS2018-C73-PT-001","s":"por","y":2018,"c":"73","n":1,"a":"C","an":false,"du":false,"l":"","e":"Se compararmos as estrelas com os planetas, podemos, segundo o texto, afirmar que as estrelas","o":{"A":"têm a posição inalterada.","B":"somente mudam de posição no período noturno.","C":"alteram seu posicionamento em longos períodos de tempo.","D":"são iguais aos planetas em relação à mudança de posicionamento."},"t":"Interpretação de texto","tp":"Compreensão de texto informativo: comparação entre astros","src":"EAGS_2018_codigo_73_SIN.pdf · p. 3","sp":1},{"id":"EAGS2018-C73-PT-002","s":"por","y":2018,"c":"73","n":2,"a":"C","an":false,"du":false,"l":"","e":"Segundo o texto, comparando-se planetas e estrelas, pode-se dizer que","o":{"A":"ambos têm luz própria e brilham intensamente.","B":"a luz dos planetas, por ser própria, pisca levemente.","C":"tanto as estrelas quanto os planetas possuem luminosidade, mas cada um à sua maneira.","D":"a luz própria dos planetas é mais irradiante do que a das estrelas, por eles se movimentarem no céu."},"t":"Interpretação de texto","tp":"Compreensão de texto informativo: características de planetas e estrelas","src":"EAGS_2018_codigo_73_SIN.pdf · p. 3","sp":1},{"id":"EAGS2018-C73-PT-003","s":"por","y":2018,"c":"73","n":3,"a":"B","an":false,"du":false,"l":"","e":"Quanto ao telescópio, é possível afirmar que","o":{"A":"foi essencial para os gregos desvendarem os planetas.","B":"ajudou a descobrir  planetas mais distantes de nosso planeta.","C":"foi descoberto por uma astrônoma em 1781, cujo nome é\nDaniela Lazzaro.","D":"ajudou os povos da Antiguidade a estabelecerem diferenças e semelhanças entre planetas e estrelas."},"t":"Interpretação de texto","tp":"Localização de informação explícita no texto","src":"EAGS_2018_codigo_73_SIN.pdf · p. 3","sp":1},{"id":"EAGS2018-C73-PT-004","s":"por","y":2018,"c":"73","n":4,"a":"A","an":false,"du":false,"l":"","e":"Conforme o texto, a\nAstronomia, em algumas circunstâncias, pode prescindir de","o":{"A":"instrumentos.","B":"astrônomos.","C":"planetas.","D":"estrelas."},"t":"Interpretação de texto","tp":"Compreensão, inferência e finalidade textual","src":"EAGS_2018_codigo_73_SIN.pdf · p. 3","sp":1},{"id":"EAGS2018-C73-PT-005","s":"por","y":2018,"c":"73","n":5,"a":"A","an":false,"du":false,"l":"",
