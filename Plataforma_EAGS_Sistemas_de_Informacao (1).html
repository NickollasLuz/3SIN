GS2019-C04-PT-018","s":"por","y":2019,"c":"04","n":18,"a":"C","an":false,"du":false,"l":"","e":"Leia:\nOs ipês floresceram no período esperado. Eles ofereceram um quadro aos românticos. Na tão esperada estação do ano, todos assistem à cena apaixonados pela vida.\nQuanto à predicação dos verbos destacados, pode-se dizer que:","o":{"A":"florescer e oferecer são verbos transitivos indiretos.","B":"oferecer e assistir são verbos transitivos diretos e indiretos.","C":"florescer é verbo intransitivo; oferecer, verbo transitivo direto\ne indireto.","D":"florescer e oferecer são verbos intransitivos; assistir é verbo\ntransitivo indireto."},"t":"Verbos","tp":"Tempos, modos e formas verbais","src":"EAGS_2019_codigo_04_SAD.pdf · p. 5","esp":"Administração"},{"id":"EAGS2019-C04-PT-019","s":"por","y":2019,"c":"04","n":19,"a":"C","an":false,"du":false,"l":"","e":"Em relação aos termos sintáticos e a pontuação, leia as frases abaixo e, em seguida, assinale a alternativa em que as frases foram pontuadas adequadamente.\n1 – Foram feitas várias manifestações, contra a política atual.\n2 – Os Deputados, na madrugada de ontem, decidiram aceitar o projeto do Presidente.\n3 – Decepcionado, o enfastiado Juiz afastou-se lentamente.\n4 – Eu trabalho com a verdade, você com a mentira.","o":{"A":"1 e 2","B":"3 e 4","C":"2 e 3","D":"1 e 4"},"t":"Pontuação","tp":"Sinais de pontuação","src":"EAGS_2019_codigo_04_SAD.pdf · p. 5","esp":"Administração"},{"id":"EAGS2019-C04-PT-020","s":"por","y":2019,"c":"04","n":20,"a":"B","an":false,"du":false,"l":"","e":"Em “Transportamos então nós dois, privilegiadas criaturas, as preciosidades de uma vida humana”, a função sintática do termo sublinhado é","o":{"A":"sujeito.","B":"aposto.","C":"vocativo.","D":"objeto direto."},"t":"Sintaxe","tp":"Termos da oração: sujeito e predicado","src":"EAGS_2019_codigo_04_SAD.pdf · p. 5","esp":"Administração"},{"id":"EAGS2019-C04-PT-021","s":"por","y":2019,"c":"04","n":21,"a":"A","an":false,"du":false,"l":"","e":"Observe os períodos abaixo, diferentes à pontuação:\nAdormeci logo, repousei em seus braços.\nAdormeci, logo repousei em seus braços.\nA observação atenta desses períodos permite dizer que:","o":{"A":"No primeiro, as orações estão coordenadas sem a presença de\nconjunção; na segunda, com a presença de conjunção\nconclusiva.","B":"No primeiro, as orações estão coordenadas com a presença de\nconjunção; na segunda, com conjunção explicativa.","C":"No primeiro, logo é advérbio de tempo; no segundo, uma\nconjunção causal.","D":"No primeiro, logo indica\nalternância;\nno segundo, consequência."},"t":"Sintaxe","tp":"Período composto e orações","src":"EAGS_2019_codigo_04_SAD.pdf · p. 5","esp":"Administração"},{"id":"EAGS2019-C04-PT-022","s":"por","y":2019,"c":"04","n":22,"a":"A","an":false,"du":false,"l":"","e":"Assinale a alternativa que completa corretamente a frase, de acordo com a norma padrão.\n_____________ os documentos que encaminharemos à Escola de\nEspecialistas da Aeronáutica.","o":{"A":"Devem-se formalizar","B":"Deverá ser formalizados","C":"Deverão ser formalizado","D":"Deverão serem formalizados"},"t":"Concordância","tp":"Concordância verbal em construção passiva sintética","src":"EAGS_2019_codigo_04_SAD.pdf · p. 5","esp":"Administração"},{"id":"EAGS2019-C04-PT-023","s":"por","y":2019,"c":"04","n":23,"a":"A","an":false,"du":false,"l":"","e":"O pronome relativo “que” pode desempenhar várias funções sintáticas. Quanto à análise desse pronome nas frases abaixo, assinale a alternativa incorreta.","o":{"A":"A paixão por que foi seduzido é puro delírio.\n(Objeto Direto)","B":"A cidade em que nasci fica no Estado de São Paulo.\n(Adjunto adverbial)","C":"As promessas a que me mantenho fiel são polêmicas.\n(Complemento Nominal)","D":"“Pais e filhos” é uma das músicas de que mais gosto.\n(Objeto Indireto)"},"t":"Sintaxe","tp":"Termos da oração: complementos e adjuntos","src":"EAGS_2019_codigo_04_SAD.pdf · p. 5","esp":"Administração"},{"id":"EAGS2019-C04-PT-024","s":"por","y":2019,"c":"04","n":24,"a":"C","an":false,"du":false,"l":"","e":"Complete as lacunas de acordo com as normas de regência:\n“Ansioso _______ emoções desusadas.” (Camilo Castelo Branco) “Ansiava ______ novo dia que vinha nascendo.” (Fernando Sabino)\nA sequência correta é:","o":{"A":"a – o","B":"a – por","C":"de – pelo","D":"para com – para o"},"t":"Regência","tp":"Regência verbal e nominal","src":"EAGS_2019_codigo_04_SAD.pdf · p. 5","esp":"Administração"},{"id":"EAGS2019-C04-PT-025","s":"por","y":2019,"c":"04","n":25,"a":"C","an":false,"du":false,"l":"","e":"Escreva (V) para as afirmativas verdadeiras e (F) para as falsas, e, em seguida, assinale a alternativa com a sequência correta.\n) Verbos auxiliares são os que se juntam a uma forma nominal\n( de outro verbo para constituir a voz passiva, os tempos compostos e as locuções verbais.\n(\n) “Não fiquem aqui, sejam prudentes”, os verbos estão, respectivamente, nos modos imperativo e indicativo.\n) Na frase: “Os pais contemplam-se nos filhos”, o verbo está\n( na voz passiva.\n(\n) Em “Organizou-se o campeonato”, tem-se voz reflexiva.","o":{"A":"F – V – V – V","B":"V – V – F – F","C":"V – F – F – F","D":"F – F – V – V"},"t":"Verbos","tp":"Tempos, modos e formas verbais","src":"EAGS_2019_codigo_04_SAD.pdf · p. 5","esp":"Administração"},{"id":"EAGS2019-C04-PT-026","s":"por","y":2019,"c":"04","n":26,"a":"B","an":false,"du":false,"l":"","e":"Assinale a alternativa que apresenta a incorreta classificação de figura de linguagem.","o":{"A":"“Lá fora, a noite é um pulmão ofegante.” (Fernando Namora)\n– Metáfora","B":"“Quando a bola saía, entravam os comentários dos torcedores.” (Carlos Eduardo Novaes) – Eufemismo","C":"“A areia, alva, está agora preta, de pés que a pisam.” (Jorge\nAmado) – Antítese","D":"“A geada é um eterno pesadelo.” (Monteiro Lobato)–\nHipérbole."},"t":"Semântica e estilística","tp":"Sentido, relações semânticas e figuras de linguagem","src":"EAGS_2019_codigo_04_SAD.pdf · p. 5","vr":1,"esp":"Administração"},{"id":"EAGS2019-C04-PT-027","s":"por","y":2019,"c":"04","n":27,"a":"C","an":false,"du":false,"l":"","e":"Observe os verbos destacados.\n“Denuncie. Se você recebeu uma proposta sem referência para melhorar de vida, desconfie. Nunca entregue seu caráter a ninguém.”\nOs verbos destacados apresentam-se em qual modo?","o":{"A":"No indicativo, pois exprimem um fato certo de se realizar.","B":"No subjuntivo, porque são formas verbais que enunciam um fato hipotético.","C":"No imperativo, pois os verbos destacados estão exprimindo ordem, conselho e pedido.","D":"No indicativo, porque as formas verbais enunciam um fato possível de acontecer."},"t":"Verbos","tp":"Tempos, modos e formas verbais","src":"EAGS_2019_codigo_04_SAD.pdf · p. 6","esp":"Administração"},{"id":"EAGS2019-C04-PT-028","s":"por","y":2019,"c":"04","n":28,"a":"D","an":false,"du":false,"l":"","e":"Leia:\nHomem é acusado de matar e ocultar o cadáver de sua esposa.\nMarque a alternativa que apresenta solução gramatical que minimiza o problema de sentido, percebido na frase, mantendo as principais informações transmitidas.","o":{"A":"Acrescentar ao enunciado o objeto direto “sua esposa” para o verbo “matar” e ocultar o termo “e ocultar o cadáver de sua esposa”.","B":"Acrescentar o objeto direto “o corpo” para o verbo “matar”, substituir a palavra “cadáver” por “corpo”, trocar o adjunto adnominal “de sua esposa” por “dela”.","C":"Acrescentar ao enunciado o objeto indireto “de sua esposa” para o verbo “matar”, acrescentar o adjunto adnominal “seu” à palavra “cadáver” e apagar o adjunto adnominal “de sua esposa”.","D":"Acrescentar ao enunciado o objeto direto “sua esposa” para o verbo “matar”, acrescentar o adjunto adnominal “seu” à palavra “cadáver” e apagar o adjunto adnominal “de sua esposa”."},"t":"Sintaxe","tp":"Termos da oração: complementos e adjuntos","src":"EAGS_2019_codigo_04_SAD.pdf · p. 6","esp":"Administração"},{"id":"EAGS2019-C04-PT-029","s":"por","y":2019,"c":"04","n":29,"a":"A","an":false,"du":false,"l":"","e":"Leia:\n“Pensativo, caminhava pela estrada da vida, que é pedregosa e a cada instante se recria”.\nCom relação à oração adjetiva destacada, assinale a alternativa correta.","o":{"A":"Esta oração é adjetiva explicativa e, neste caso, apresenta-se coordenada.","B":"Esta oração é adjetiva restritiva e está precedida de pronome relativo [que].","C":"A oração destacada é explicativa, limita a significação do termo antecedente [estrada da vida].","D":"É uma oração adjetiva restritiva, sendo indispensável ao sentido da frase [caminhava pela estrada da vida]."},"t":"Sintaxe","tp":"Período composto e orações","src":"EAGS_2019_codigo_04_SAD.pdf · p. 6","esp":"Administração"},{"id":"EAGS2019-C04-PT-030","s":"por","y":2019,"c":"04","n":30,"a":"","an":true,"du":false,"l":"","e":"Leia:\nA N U L A D A “Cada novo aluno que ingressa na Força Aérea aspira galgar posição mais brilhante na carreira militar.”\nNo trecho, o verbo aspirar tem significado de","o":{"A":"inalar – sorver algo","B":"almejar – criar algo","C":"pretender – indicar algo","D":"desejar – pretender algo"},"t":"Verbos","tp":"Tempos, modos e formas verbais","src":"EAGS_2019_codigo_04_SAD.pdf · p. 6","esp":"Administração"},{"id":"EAGS2019-C04-PT-031","s":"por","y":2019,"c":"04","n":31,"a":"B","an":false,"du":false,"l":"","e":"Leia:\nAo chegar tarde em casa, o recém-casado moço, em busca de carinho e atenção de sua esposa que, àquelas horas, já dormia, entra no quarto, se aproxima da cama e sussurra para a mulher:\n— Querida, quero amá-la!\nCom sono, sem entender bem o que ouvia, a mulher disse:\n— Está dentro do armário.\nInsistente, o marido tenta de novo:\n— Não é nada disso, meu bem. Agora, vou amar-te!\nAborrecida, a jovem respondeu:\n— Você pode ir para qualquer planeta que quiser, com ou sem mala! Quero dormir!\nMarque a opção que apresenta explicação gramatical correta sobre a conversa apresentada","o":{"A":"As dificuldades de entender as reais intenções do marido são decorrentes de usos de pronomes proclíticos.","B":"As dificuldades de entender as reais intenções do marido são decorrentes de usos de pronomes enclíticos.","C":"As dificuldades de entender as reais intenções do marido são decorrentes de usos de mesóclises nas formas verbais do verbo “amar”.","D":"As dificuldades de entender as reais intenções do marido são decorrentes de usos de pronomes oblíquos átonos em posições inadmissíveis na Língua Portuguesa em relação ao verbo."},"t":"Verbos","tp":"Tempos, modos e formas verbais","src":"EAGS_2019_codigo_04_SAD.pdf · p. 6","esp":"Administração"},{"id":"EAGS2019-C04-PT-032","s":"por","y":2019,"c":"04","n":32,"a":"A","an":false,"du":false,"l":"","e":"Assinale a alternativa em que a vírgula foi emprega adequadamente, em função do que se apresenta entre parênteses.","o":{"A":"Vens, pois, anunciar-me uma alegria. (Conjunção pospositiva)","B":"A alegria, diz a menina é o impulso da vida. (Oração intercalada)","C":"Uns dizem que se alegrou, outros que se entristeceu. (Vírgula vicária)","D":"A alegria, isto é a sensação que todos buscam, tem sua origem na satisfação de desejos. (Expressão explicativa)\nLeia o texto abaixo e, em seguida, responda às questões 33, 34,\n35 e 36.\nVou tirar você do dicionário\nVou tirar do dicionário\nA palavra você\nVou trocá-la em miúdos\nMudar meu vocabulário\nE no seu lugar\nVou colocar outro absurdo\nEu vou tirar suas impressões digitais da minha pele\nEu vou tirar você de letra\nNem que tenha que inventar outra gramática\nEu vou tirar você de mim\nAssim que descobrir\nCom quantos nãos se faz um sim.\nItamar Assumpção & Alice Ruiz. In: DUNCAN, Zélia. Intimidade - texto adaptado."},"t":"Sintaxe","tp":"Período composto e orações","src":"EAGS_2019_codigo_04_SAD.pdf · p. 6","esp":"Administração"},{"id":"EAGS2019-C04-PT-033","s":"por","y":2019,"c":"04","n":33,"a":"D","an":false,"du":false,"l":"","e":"Em relação ao pronome destacado do fragmento “E no seu lugar vou colocar outro absurdo”, assinale a alternativa\nINCORRETA:","o":{"A":"O pronome destacado “seu” se refere à palavra “você”.","B":"“seu” se refere à palavra do vocabulário que será trocada em miúdos.","C":"No contexto, “seu” é um pronome possessivo que faz referência semântica a um pronome de tratamento.","D":"“seu” concorda é um pronome possessivo que gramaticalmente com a segunda pessoa do singular."},"t":"Pronomes","tp":"Emprego e classificação dos pronomes","src":"EAGS_2019_codigo_04_SAD.pdf · p. 6","esp":"Administração"},{"id":"EAGS2019-C04-PT-034","s":"por","y":2019,"c":"04","n":34,"a":"B","an":false,"du":false,"l":"","e":"Com base no texto adaptado “Vou tirar você do dicionário”, leia o fragmento textual que segue e assinale a alternativa correta.\n“Eu vou tirar você de mim”","o":{"A":"“Você” é um pronome de tratamento familiar, o pronome “mim” é oblíquo átono.","B":"A forma “você” foi usada no papel de pronome pessoal do caso oblíquo atuando como complemento verbal.","C":"“Você” e “mim” são pronomes pessoais oblíquos átonos que indicam diretamente as pessoas do discurso.","D":"Os pronomes “eu” e “mim” são, respectivamente, classificados como pronomes pessoais do caso reto e oblíquo átono."},"t":"Pronomes","tp":"Emprego e classificação dos pronomes","src":"EAGS_2019_codigo_04_SAD.pdf · p. 7","esp":"Administração"},{"id":"EAGS2019-C04-PT-035","s":"por","y":2019,"c":"04","n":35,"a":"A","an":false,"du":false,"l":"","e":"De acordo com o uso da palavra “nãos” no texto “Vou tirar você do dicionário”, marque a alternativa correta.","o":{"A":"Trata-se de um substantivo, pois sofre flexões morfológicas próprias de um substantivo e aceita ser antecedida pelo artigo “os” em outros contextos de uso.","B":"Trata-se de um advérbio de negação. Embora flexionado, a ideia negativa se contrapõe ao advérbio “sim” presente no mesmo verso.","C":"Trata-se de um recurso linguístico aceitável numa língua, em que se exemplifica a troca de advérbios por pronomes indefinidos.","D":"Trata-se de uma flexão indevida de palavra “gramaticalizada” por dicionários, recurso esse impossível de ser utilizado numa língua."},"t":"Pronomes","tp":"Emprego e classificação dos pronomes","src":"EAGS_2019_codigo_04_SAD.pdf · p. 7","esp":"Administração"},{"id":"EAGS2019-C04-PT-036","s":"por","y":2019,"c":"04","n":36,"a":"A","an":false,"du":false,"l":"","e":"De acordo com o texto “Vou tirar você do dicionário”, sobre uma possível conclusão advinda de sua leitura, marque a alternativa correta.","o":{"A":"O eu-lírico do texto deixa clara a ideia de ter dificuldade em esquecer e rechaçar a pessoa designada pela palavra “você”.","B":"Pode-se afirmar que a troca de pronomes no texto é fruto do incômodo que a gramática provoca no autor.","C":"A intenção do eu-lírico é inventar uma nova gramática e um novo dicionário, reflexo de suas inquietações com as normas de escrita vigentes.","D":"Pode-se concluir que o eu-lírico deseja rememorar a pessoa “você”, conforme elucidado no verso “Eu vou tirar você de mim”."},"t":"Pronomes","tp":"Emprego e classificação dos pronomes","src":"EAGS_2019_codigo_04_SAD.pdf · p. 7","esp":"Administração"},{"id":"EAGS2019-C04-PT-037","s":"por","y":2019,"c":"04","n":37,"a":"B","an":false,"du":false,"l":"","e":"Com relação aos termos destacados, coloque (V) para verdadeiro e (F) para falso. Em seguida, assinale a alternativa que apresenta a sequência correta.\n) É imprescindível que o governante do país adote duas\n( diretrizes: distribuição de renda e melhoria do ensino público. (Aposto)\n(\n) Sua inteligência deixou perplexos seus amigos. (Adjunto\nAdnominal)\n(\n) Audaciosos, os dois culpados denunciaram os envolvidos no crime. (Aposto)\n(\n) Ouvidos atentos, aproximei-me da porta. (Adjunto\nAdverbial)","o":{"A":"F – V – V – F","B":"V – F – F – V","C":"V – F – V – V","D":"F – V – F – V"},"t":"Sintaxe","tp":"Termos da oração: complementos e adjuntos","src":"EAGS_2019_codigo_04_SAD.pdf · p. 7","esp":"Administração"},{"id":"EAGS2019-C04-PT-038","s":"por","y":2019,"c":"04","n":38,"a":"B","an":false,"du":false,"l":"","e":"Identifique o sujeito dos verbos destacados e, em seguida, assinale a alternativa correta.\n1 – Trata-se de casos emblemáticos.\n2 – Faltou-me compaixão naquele instante.\n3 – Deve fazer alguns meses que não conversamos.\n4 – Sinto muito a ausência de perdão.\n(\n) Sujeito indeterminado\n(\n) Sujeito simples\n(\n) Oração sem sujeito\n(\n) Sujeito elíptico","o":{"A":"4 – 2 – 3 – 1","B":"1 – 2 – 3 – 4","C":"2 – 1 – 3 – 4","D":"3 – 4 – 1 – 2"},"t":"Sintaxe","tp":"Termos da oração: sujeito e predicado","src":"EAGS_2019_codigo_04_SAD.pdf · p. 7","esp":"Administração"},{"id":"EAGS2019-C04-PT-039","s":"por","y":2019,"c":"04","n":39,"a":"C","an":false,"du":false,"l":"","e":"A partir da leitura da tirinha da Mafalda, personagem ilustrada nos dois primeiros e no último quadrinho, é possível concluir que ela http://www.universodosleitores.com/2016/04/mafalda-em-10-tirinhas- realistas-e.html, acesso em JUL 2017.","o":{"A":"se apresenta em estado de júbilo pela sua nação. Esse fato, indubitavelmente, está ligado à sua sujeição voluntária às datas cívicas.","B":"questiona valores morais e cívicos e faz questão de se colocar à parte da sociedade quando resolve subverter valores de amor à sua própria pátria.","C":"apresenta, indiretamente, uma crítica às pessoas que são condicionadas às regras impostas pela sociedade, manifestando assim sua liberdade de expressão, não vinculada às datas programadas dos calendários.","D":"se surpreende com a fala da personagem no quarto quadrinho, seu interlocutor, que, surpreso pelas atitudes ufanistas da menina, mostra-se livre de sistemas de controle social, como calendários e datas cívicas."},"t":"Interpretação de texto","tp":"Inferência a partir de tirinha e linguagem multimodal","src":"EAGS_2019_codigo_04_SAD.pdf · p. 7","esp":"Administração"},{"id":"EAGS2019-C04-PT-040","s":"por","y":2019,"c":"04","n":40,"a":"B","an":false,"du":false,"l":"","e":"Leia:\nOs investimentos da iniciativa privada em saúde deveriam ser proporcionais aos lucros de cada empresa.\nOs termos destacados classificam-se, respectivamente, em:","o":{"A":"complemento nominal – adjunto adnominal","B":"adjunto adnominal – complemento nominal","C":"adjunto adnominal – predicativo","D":"predicativo – adjunto adnominal"},"t":"Sintaxe","tp":"Termos da oração: complementos e adjuntos","src":"EAGS_2019_codigo_04_SAD.pdf · p. 7","esp":"Administração"},{"id":"EAGS2020-C43-PT-001","s":"por","y":2020,"c":"43","n":1,"a":"B","an":false,"du":false,"l":"","e":"Quanto ao primeiro parágrafo do texto, é correto afirmar que","o":{"A":"não se pode escrever sem um ambiente adequado.","B":"o autor criou as próprias condições para exercer seu ofício.","C":"o silêncio e a solidão são imprescindíveis para se escrever.","D":"o autor não quer perder vinte anos de sua vida escrevendo um livro."},"t":"Interpretação de texto","tp":"Compreensão de crônica: informações e recursos do primeiro parágrafo","src":"EAGS_2020_codigo_43_SIN.pdf · p. 3","sp":3},{"id":"EAGS2020-C43-PT-002","s":"por","y":2020,"c":"43","n":2,"a":"D","an":false,"du":false,"l":"","e":"O autor sentiu ódio de si mesmo por ter publicado seu primeiro livro somente aos 56 anos porque ele","o":{"A":"queria contar histórias que nunca haviam sido contadas.","B":"queria escrever melhor que os grandes escritores já falecidos.","C":"queria ser comparado a escritores consagrados como\nMachado de Assis e Dante Alighieri.","D":"sentiu prazer em contar as histórias e lamentou ter demorado mais de cinquenta anos para se tornar escritor."},"t":"Ortografia e acentuação","tp":"Ortografia, grafia e hífen","src":"EAGS_2020_codigo_43_SIN.pdf · p. 3","sp":3},{"id":"EAGS2020-C43-PT-003","s":"por","y":2020,"c":"43","n":3,"a":"B","an":false,"du":false,"l":"","e":"“Às cotoveladas, a literatura abriu espaço em minha agenda.”\nConsiderando esse trecho, pode-se afirmar que","o":{"A":"o autor precisou lutar contra a timidez, a insegurança e a autocrítica para se tornar um escritor.","B":"o autor possui muitos compromissos, mas sempre consegue tempo para escrever.","C":"escrever é uma atividade que só lhe traz alegrias.","D":"escrever é uma tarefa difícil e cansativa."},"t":"Interpretação de texto","tp":"Compreensão, inferência e finalidade textual","src":"EAGS_2020_codigo_43_SIN.pdf · p. 3","sp":3},{"id":"EAGS2020-C43-PT-004","s":"por","y":2020,"c":"43","n":4,"a":"A","an":false,"du":false,"l":"","e":"Dentre as características que o autor revela de si mesmo diante do ofício de escrever, assinale a que não está presente no texto.","o":{"A":"Angústia","B":"Modéstia","C":"Segurança","D":"Adaptação"},"t":"Interpretação de texto","tp":"Compreensão, inferência e finalidade textual","src":"EAGS_2020_codigo_43_SIN.pdf · p. 3","sp":3},{"id":"EAGS2020-C43-PT-005","s":"por","y":2020,"c":"43","n":5,"a":"C","an":false,"du":false,"l":"","e":"Considere a classificação dos termos destacados:\nI-\nObjeto indireto: “O rico não distingue o supérfluo do essencial: é essencial o que lhe garante o lucro.” (Murilo\nMendes)\nII- Objeto indireto: “Os ventos brandamente respiravam, /\nDas naus as velas côncavas inchando.” (Camões)\nIII- Objeto direto: “Eu não sei evitar numa reminiscência longínqua a saudade violeta de certa criaturinha indecisa que nunca tive.” (Mário de Sá Carneiro)\nA classificação está correta","o":{"A":"nos três casos.","B":"em II e III.","C":"em I e III.","D":"em I e II."},"t":"Sintaxe","tp":"Termos da oração: complementos e adjuntos","src":"EAGS_2020_codigo_43_SIN.pdf · p. 3"},{"id":"EAGS2020-C43-PT-006","s":"por","y":2020,"c":"43","n":6,"a":"A","an":false,"du":false,"l":"","e":"Assinale a alternativa cuja frase não contém advérbio ou locução adverbial de modo.","o":{"A":"“Em mim se apoiava, / Em mim se firmava, / Em mim descansava, / que filho lhe sou.” (Gonçalves Dias)","B":"“As seculares eram abeatadas, umas pobretonas, falavam muito baixinho, à surdina.” (C. Castelo Branco)","C":"“Caminhando às surdas pelo corredor, abriu o armário sutilmente, depôs a carta e desapareceu.” (C. Castelo Branco)","D":"“Subitamente um formidável brado suplantou o barulho das ondas.” (Xavier Marques)"},"t":"Classes de palavras","tp":"Substantivo, adjetivo, advérbio e demais classes","src":"EAGS_2020_codigo_43_SIN.pdf · p. 3"},{"id":"EAGS2020-C43-PT-007","s":"por","y":2020,"c":"43","n":7,"a":"C","an":false,"du":false,"l":"","e":"Assinale a alternativa em que todos os verbos são formados por derivação parassintética.","o":{"A":"desvalorizar, empalidecer, redistribuir.","B":"desorientar, endurecer, esclarecer.","C":"amanhecer, engordar, enfileirar.","D":"rever, endireitar, desconsiderar."},"t":"Verbos","tp":"Tempos, modos e formas verbais","src":"EAGS_2020_codigo_43_SIN.pdf · p. 3"},{"id":"EAGS2020-C43-PT-008","s":"por","y":2020,"c":"43","n":8,"a":"D","an":false,"du":false,"l":"","e":"Leia:\nI-\nO atleta ficou emocionado com o carinho dos torcedores.\nII- Houve uma pequena queda no desemprego no primeiro semestre.\nIII- Os turistas consideraram as paisagens da África lindas.\nOs predicados das orações classificam-se, respectivamente, como","o":{"A":"nominal, verbo-nominal e verbal.","B":"verbo-nominal, verbal e nominal.","C":"verbal, verbo-nominal e nominal.","D":"nominal, verbal e verbo-nominal."},"t":"Verbos","tp":"Tempos, modos e formas verbais","src":"EAGS_2020_codigo_43_SIN.pdf · p. 4"},{"id":"EAGS2020-C43-PT-009","s":"por","y":2020,"c":"43","n":9,"a":"A","an":false,"du":false,"l":"","e":"Assinale a frase em que o grau do adjetivo em destaque está incorretamente mencionado.","o":{"A":"Superlativo relativo: “Ele é um ótimo profissional.”","B":"Superlativo absoluto sintético: “Suas alegações estão corretíssimas!”","C":"Superlativo relativo de superioridade: “Esta casa é a melhor de todas.”","D":"Comparativo de superioridade: “Este caminho é pior que o outro.”"},"t":"Classes de palavras","tp":"Substantivo, adjetivo, advérbio e demais classes","src":"EAGS_2020_codigo_43_SIN.pdf · p. 4"},{"id":"EAGS2020-C43-PT-010","s":"por","y":2020,"c":"43","n":10,"a":"B","an":false,"du":false,"l":"","e":"Leia os versos do Hino à Bandeira reproduzidos abaixo.\n“Em teu seio formoso retratas\nEste céu de puríssimo azul,\nA verdura sem par destas matas\nE o esplendor do Cruzeiro do Sul.” (Olavo Bilac)\nNesses versos, é incorreto afirmar que o substantivo","o":{"A":"céu é concreto.","B":"mata é derivado.","C":"verdura é abstrato.","D":"Cruzeiro do Sul é próprio."},"t":"Classes de palavras","tp":"Substantivo, adjetivo, advérbio e demais classes","src":"EAGS_2020_codigo_43_SIN.pdf · p. 4"},{"id":"EAGS2020-C43-PT-011","s":"por","y":2020,"c":"43","n":11,"a":"B","an":false,"du":false,"l":"","e":"Assinale a alternativa que completa corretamente as lacunas do texto abaixo.\nPara __________ a nossa política, é preciso ________ o mandato dos parlamentares corruptos. Temos de ______ preparados para cobrar deles o efetivo ______________ do dever e impedir coisas que não têm nada _______ com o bem da população.","o":{"A":"retificar – caçar – está – cumprimento – haver","B":"retificar – cassar – estar – cumprimento – a ver","C":"ratificar – cassar – está – comprimento – háver","D":"ratificar – caçar – estar – comprimento – a ver"},"t":"Ortografia e acentuação","tp":"Emprego de parônimos e formas vocabulares","src":"EAGS_2020_codigo_43_SIN.pdf · p. 4"},{"id":"EAGS2020-C43-PT-012","s":"por","y":2020,"c":"43","n":12,"a":"C","an":false,"du":false,"l":"","e":"Se transpusermos para a voz passiva a oração “As vizinhas a invejavam por sua estonteante beleza”, qual forma verbal obteremos?","o":{"A":"Eram invejadas.","B":"Fora invejada.","C":"Era invejada.","D":"Foi invejada."},"t":"Sintaxe","tp":"Período composto e orações","src":"EAGS_2020_codigo_43_SIN.pdf · p. 4"},{"id":"EAGS2020-C43-PT-013","s":"por","y":2020,"c":"43","n":13,"a":"B","an":false,"du":false,"l":"","e":"Assinale a alternativa em que o termo destacado não é complemento nominal.","o":{"A":"Sua opinião é favorável à minha permanência.","B":"Ela é capaz de tudo para conseguir seus objetivos.","C":"Este é um tema relacionado com o assunto da aula.","D":"É preciso manter-se obediente aos preceitos de boa conduta."},"t":"Sintaxe","tp":"Termos da oração: complementos e adjuntos","src":"EAGS_2020_codigo_43_SIN.pdf · p. 4"},{"id":"EAGS2020-C43-PT-014","s":"por","y":2020,"c":"43","n":14,"a":"D","an":false,"du":false,"l":"","e":"Leia:\nA inocência sempre brincou nas peraltices dos cães, mas, em cada animal, ela se funde com um temperamento individual.\nQuando chego à minha casa, Vilma salta e rodopia, querendo ser a primeira a receber atenção. Ciça, embora seja mais discreta, não dispensa a sua cota de carinho. Rose, serelepe e incansável, pula tanto que fica esbaforida. Por último, Ruth, pura meiguice, achega-se na periferia do bando e aguarda o momento dos afagos.\nNo texto acima, não há oração subordinada adverbial na frase referente a","o":{"A":"Vilma.","B":"Ciça.","C":"Rose.","D":"Ruth."},"t":"Sintaxe","tp":"Período composto e orações","src":"EAGS_2020_codigo_43_SIN.pdf · p. 4"},{"id":"EAGS2020-C43-PT-015","s":"por","y":2020,"c":"43","n":15,"a":"B","an":false,"du":false,"l":"","e":"Em qual alternativa o emprego da regência verbal está incorreto?","o":{"A":"Lembro-me das pessoas que me ajudaram nos momentos difíceis.","B":"Esqueceu de ir ao banco pagar a conta de telefone.","C":"Eu sempre esqueço o nome dos meus alunos.","D":"Depois do acidente, não lembrava nada."},"t":"Regência","tp":"Regência verbal e nominal","src":"EAGS_2020_codigo_43_SIN.pdf · p. 4"},{"id":"EAGS2020-C43-PT-016","s":"por","y":2020,"c":"43","n":16,"a":"A","an":false,"du":false,"l":"","e":"Em qual alternativa a conjunção pois é coordenativa conclusiva?","o":{"A":"Nossa pesquisa demandou muito tempo e muitos gastos;\nobtivemos, pois, êxito nos resultados.","B":"Viva intensamente a sua juventude, pois o tempo é fugaz e inexorável.","C":"Ele deveria ter confiado em mim, pois sabe que sou honesto.","D":"Ela chorou em público, pois a decepção foi muito forte."},"t":"Sintaxe","tp":"Período composto e orações","src":"EAGS_2020_codigo_43_SIN.pdf · p. 4"},{"id":"EAGS2020-C43-PT-017","s":"por","y":2020,"c":"43","n":17,"a":"A","an":false,"du":false,"l":"","e":"Assinale a alternativa em que o sujeito está corretamente destacado.","o":{"A":"“O trovão ribombava de instante a instante.” (C. Soromenho)","B":"“Nem o pranto os teus olhos umedece\nNem te comove a dor da despedida.” (Olavo Bilac)","C":"“Aqui e além, recantos e arvoredos sugestionavam trágicos segredos.” (Conde de Monsaraz)","D":"“Doiravam-lhe o cabelo claros lumes\nDo sacrossanto esplendor antigo.” (Cruz e Sousa)"},"t":"Sintaxe","tp":"Termos da oração: sujeito e predicado","src":"EAGS_2020_codigo_43_SIN.pdf · p. 4"},{"id":"EAGS2020-C43-PT-018","s":"por","y":2020,"c":"43","n":18,"a":"C","an":false,"du":false,"l":"","e":"Assinale a alternativa em que há uma oração coordenada sindética adversativa.","o":{"A":"O professor expulsou-a da sala, e ela saiu em silêncio.","B":"De repente, o sol apareceu, e a praia foi tomada pelos turistas.","C":"Queria matar a saudade do filho e não tinha dinheiro para a viagem.","D":"O delegado interrogou o suspeito e conseguiu as informações necessárias."},"t":"Sintaxe","tp":"Período composto e orações","src":"EAGS_2020_codigo_43_SIN.pdf · p. 5"},{"id":"EAGS2020-C43-PT-019","s":"por","y":2020,"c":"43","n":19,"a":"D","an":false,"du":false,"l":"","e":"Assinale a alternativa incorreta sobre os adjuntos presentes nos versos abaixo.\n“Em usinas escuras / homens de vida amarga / e dura / produzem este açúcar / branco e puro / com que adoço meu café / esta manhã em Ipanema.” (João Cabral de Melo Neto)","o":{"A":"Em usinas escuras: adjunto adverbial de lugar.","B":"Esta manhã: adjunto adverbial de tempo.","C":"Amarga, dura: adjuntos adnominais.","D":"Em Ipanema: adjunto adnominal."},"t":"Sintaxe","tp":"Termos da oração: complementos e adjuntos","src":"EAGS_2020_codigo_43_SIN.pdf · p. 5"},{"id":"EAGS2020-C43-PT-020","s":"por","y":2020,"c":"43","n":20,"a":"A","an":false,"du":false,"l":"","e":"Observe:\nI-\nNão sei onde está o meu protetor de orelha.\nII- A casa do bispo é uma construção do século XIX.\nIII- O olho da fera é assustador.\nAssinale a alternativa em que os adjetivos correspondem, correta e respectivamente, às locuções adjetivas em destaque.","o":{"A":"Auricular, episcopal, ferino.","B":"Ovino, episcopal, ferino.","C":"Auditivo, bispal, felino.","D":"Ótico, bispal, felídeo."},"t":"Classes de palavras","tp":"Substantivo, adjetivo, advérbio e demais classes","src":"EAGS_2020_codigo_43_SIN.pdf · p. 5"},{"id":"EAGS2020-C43-PT-021","s":"por","y":2020,"c":"43","n":21,"a":"B","an":false,"du":false,"l":"","e":"Assinale a alternativa em que o texto está corretamente acentuado.","o":{"A":"Naquele período do ano, o quintal ficava lindo. As jibóias se alastravam, e os crisantemos floresciam. As melancias e os abacaxís eram as frutas mais cobiçadas naquele cenario que parecia um paraíso.","B":"Naquele período do ano, o quintal ficava lindo. As jiboias se alastravam, e os crisântemos floresciam. As melancias e os abacaxis eram as frutas mais cobiçadas naquele cenário que parecia um paraíso.","C":"Naquele periodo do ano, o quintal ficava lindo. As jiboias se alastravam, e os crisântemos floresciam. As melâncias e os abacaxis eram as frutas mais cobiçadas naquele cenário que parecia um paraiso.","D":"Naquele periodo do ano, o quintal ficava lindo. As jibóias se alastravam, e os crisântemos floresciam. As melâncias e os abacaxis eram as frutas mais cobiçadas naquele cenario que parecia um paraíso."},"t":"Ortografia e acentuação","tp":"Acentuação gráfica","src":"EAGS_2020_codigo_43_SIN.pdf · p. 5"},{"id":"EAGS2020-C43-PT-022","s":"por","y":2020,"c":"43","n":22,"a":"A","an":false,"du":false,"l":"","e":"Os versos abaixo são composições de Rita Lee. Assinale a alternativa em que todos os verbos em destaque são regulares.","o":{"A":"“Um belo dia resolvi mudar\nE fazer tudo que eu queria fazer\nMe libertei daquela vida vulgar\nQue eu levava estando junto a você”","B":"“Meu bem você me dá\nÁgua na boca\nVestindo fantasias\nTirando a roupa”","C":"“Ando meio desligado\nQue eu nem sinto meus pés no chão\nOlho e não vejo nada”","D":"“Me cansei de escutar opiniões\nDe como ter um mundo melhor”"},"t":"Verbos","tp":"Tempos, modos e formas verbais","src":"EAGS_2020_codigo_43_SIN.pdf · p. 5"},{"id":"EAGS2020-C43-PT-023","s":"por","y":2020,"c":"43","n":23,"a":"D","an":false,"du":false,"l":"","e":"Assinale a alternativa em que a omissão das vírgulas altera o sentido do período.","o":{"A":"É necessário, portanto, rever o planejamento do primeiro semestre.","B":"As novelas estão abordando, ultimamente, temas muito polêmicos.","C":"O investimento em educação básica, no Brasil, deveria ser prioridade.","D":"Os funcionários, que não optaram pelas férias coletivas, foram demitidos da empresa."},"t":"Pontuação","tp":"Sinais de pontuação","src":"EAGS_2020_codigo_43_SIN.pdf · p. 5"},{"id":"EAGS2020-C43-PT-024","s":"por","y":2020,"c":"43","n":24,"a":"D","an":false,"du":false,"l":"","e":"Quanto ao gênero dos substantivos, assinale a alternativa incorreta.","o":{"A":"Aquele gol, no início do segundo tempo, levantou o moral do time.","B":"Enviamos a guia para que o caixa do banco efetuasse o pagamento.","C":"A guarda do Palácio de Buckingham é uma atração turística em Londres.","D":"O idoso tropeçou no banheiro, fraturou a perna e a rádio e ficou com o braço imobilizado."},"t":"Classes de palavras","tp":"Substantivo, adjetivo, advérbio e demais classes","src":"EAGS_2020_codigo_43_SIN.pdf · p. 5"},{"id":"EAGS2020-C43-PT-025","s":"por","y":2020,"c":"43","n":25,"a":"A","an":false,"du":false,"l":"","e":"Assinale a alternativa que classifica corretamente os pronomes dos versos abaixo.\n“Eu sei de certos senhores\nQue desdenham, sérios, graves,\nO doce aroma das flores\nE o terno canto das aves.” (Ricardo Gonçalves)","o":{"A":"Caso reto, indefinido e relativo.","B":"Caso reto, possessivo e indefinido.","C":"Caso oblíquo, indefinido e indefinido.","D":"Caso oblíquo, demonstrativo e relativo."},"t":"Pronomes","tp":"Emprego e classificação dos pronomes","src":"EAGS_2020_codigo_43_SIN.pdf · p. 5"},{"id":"EAGS2020-C43-PT-026","s":"por","y":2020,"c":"43","n":26,"a":"C","an":false,"du":false,"l":"","e":"Considerando os apostos e os vocativos, assinale a alternativa em que o emprego da vírgula está incorreto.","o":{"A":"Estuda, meu filho! João, o filho do vizinho, não aprendeu uma profissão e até hoje é sustentado pelos pais.","B":"Meu filho, estuda! João, o filho do vizinho não aprendeu uma profissão e até hoje é sustentado pelos pais.","C":"Meu filho estuda! João o filho do vizinho, não aprendeu uma profissão e até hoje é sustentado pelos pais.","D":"Meu filho estuda! O filho do vizinho, João, não aprendeu uma profissão e até hoje é sustentado pelos pais."},"t":"Sintaxe","tp":"Termos da oração: complementos e adjuntos","src":"EAGS_2020_codigo_43_SIN.pdf · p. 6"},{"id":"EAGS2020-C43-PT-027","s":"por","y":2020,"c":"43","n":27,"a":"","an":true,"du":false,"l":"","e":"Assinale a afirmação incorreta quanto às seguintes\nA N U L A D A palavras: Necessidade – Carandiru – Poesia – Queixar – Gratuito.","o":{"A":"Três delas contêm dígrafo.","B":"Duas contêm ditongo.","C":"Uma contém tritongo.","D":"Uma contém hiato."},"t":"Ortografia e acentuação","tp":"Acentuação gráfica e encontros vocálicos","src":"EAGS_2020_codigo_43_SIN.pdf · p. 6"},{"id":"EAGS2020-C43-PT-028","s":"por","y":2020,"c":"43","n":28,"a":"C","an":false,"du":false,"l":"","e":"Assinale a alternativa incorreta quanto às orações adjetivas das seguintes frases:\nI-  O trabalho é uma atividade que nos dá dignidade, que nos traz sustento e que promove o progresso da nação.\nII-  A solidariedade, que é o mais nobre dos sentimentos, nos conecta diretamente com Deus.\nIII-  Esta é uma planta, disse o homem, que serve para a cura de diversos males.","o":{"A":"Em III, a oração adjetiva é restritiva.","B":"Em II, a oração adjetiva é explicativa.","C":"Em I, a oração “que nos traz sustento” é adjetiva explicativa.","D":"Em I, as orações “que nos dá dignidade” e “que promove o progresso da nação” são adjetivas restritivas."},"t":"Sintaxe","tp":"Período composto e orações","src":"EAGS_2020_codigo_43_SIN.pdf · p. 6"},{"id":"EAGS2020-C43-PT-029","s":"por","y":2020,"c":"43","n":29,"a":"D","an":false,"du":false,"l":"","e":"Em qual alternativa o predicativo está mal empregado, permitindo que o texto tenha dupla interpretação?","o":{"A":"O sucesso tornou a cantora antipática.","B":"Os candidatos consideraram fácil a prova.","C":"Os colegas de classe o consideram inteligente.","D":"A embarcação retornou para a aldeia destruída."},"t":"Sintaxe","tp":"Termos da oração: complementos e adjuntos","src":"EAGS_2020_codigo_43_SIN.pdf · p. 6"},{"id":"EAGS2020-C43-PT-030","s":"por","y":2020,"c":"43","n":30,"a":"D","an":false,"du":false,"l":"","e":"Leia:\n“A praia estava deserta. Não havia ninguém ao longo da enseada e nem nas matas que a cercavam. A areia, porém, se encontrava repleta de pegadas, num claro sinal de que a terra era habitada.\nTal evidência não impediu que os marujos recém- desembarcados gravassem seus nomes e de seus navios nas árvores e nas rochas costeiras...” (Eduardo Bueno)\nNo texto acima, há duas orações substantivas, que se classificam, respectivamente, como","o":{"A":"apositiva e subjetiva","B":"objetiva indireta e objetiva direta.","C":"predicativa e completiva nominal.","D":"completiva nominal e objetiva direta."},"t":"Interpretação de texto","tp":"Compreensão, inferência e finalidade textual","src":"EAGS_2020_codigo_43_SIN.pdf · p. 6"},{"id":"EAGS2020-C43-PT-031","s":"por","y":2020,"c":"43","n":31,"a":"A","an":false,"du":false,"l":"","e":"Leia:\nTerminada a reunião, ficou definido que as novas medidas entrarão em vigor no início do próximo ano letivo. Considerando a realidade dos alunos, as determinações são eficazes. A direção e a coordenação do colégio acreditam estar tomando decisões justas para toda a comunidade.\nAs orações subordinadas reduzidas no texto acima classificam-se, respectivamente, como","o":{"A":"adverbial temporal, adverbial condicional, substantiva objetiva direta.","B":"adverbial concessiva, adverbial condicional, adjetiva restritiva.","C":"adverbial condicional, adverbial causal, substantiva objetiva direta.","D":"adverbial temporal, adverbial temporal, substantiva subjetiva."},"t":"Sintaxe","tp":"Período composto e orações","src":"EAGS_2020_codigo_43_SIN.pdf · p. 6"},{"id":"EAGS2020-C43-PT-032","s":"por","y":2020,"c":"43","n":32,"a":"B","an":false,"du":false,"l":"","e":"Observe as frases abaixo:\nI-\nO proprietário daquelas terras é um italiano.\nII- Aquelas terras foram invadidas pelos posseiros.\nIII- Os posseiros querem cultivar as terras.\nTransformando-se esses três períodos simples em um período composto e considerando o emprego dos pronomes relativos, assinale a alternativa correta.","o":{"A":"O proprietário daquelas terras é um italiano que foram invadidas pelos posseiros cujas terras querem cultivá-las.","B":"Aquelas terras, cujo dono é um italiano, foram invadidas pelos posseiros, que querem cultivá-las.","C":"Aquelas terras, que o dono é um italiano, foram invadidas pelos posseiros, que querem cultivá-las.","D":"Aquelas terras, onde o dono é um italiano, foram invadidas pelos posseiros, que querem cultivá-las."},"t":"Sintaxe","tp":"Período composto e orações","src":"EAGS_2020_codigo_43_SIN.pdf · p. 6"},{"id":"EAGS2020-C43-PT-033","s":"por","y":2020,"c":"43","n":33,"a":"A","an":false,"du":false,"l":"","e":"Assinale a alternativa que completa corretamente os espaços do texto abaixo, na ordem em que aparecem.\nÉ sempre dolorido o fim de um relacionamento, mas eu precisava abrir o jogo com Ana Maria. Durante ____ conversa, tudo foi dito ____ claras. Confessei ____ ela que não podíamos mais continuar juntos pelos motivos que aleguei e, ____ medida que eu falava, comecei ____ estranhar sua reação impassível, considerando ____ sua característica emocional tão explosiva.","o":{"A":"a – às – a – à – a – a","B":"à – as – a – à – à – a","C":"à – às – à – a – à – à","D":"a – as – à – a – a – à"},"t":"Crase","tp":"Emprego do acento indicativo de crase em locuções e regência","src":"EAGS_2020_codigo_43_SIN.pdf · p. 6"},{"id":"EAGS2020-C43-PT-034","s":"por","y":2020,"c":"43","n":34,"a":"C","an":false,"du":false,"l":"","e":"Com relação ao sentido expresso pelo presente do indicativo nas frases abaixo, coloque I para validade permanente,\nII para verdade científica, III para ação habitual e IV para indicação de futuro. Em seguida, assinale a sequência correta.\n(    ) Eu sempre choro ao ver uma cena triste.\n(    ) A soma dos ângulos internos do triângulo é igual a 180°.\n(    ) Se Deus quiser, no ano que vem eu me formo.\n(    ) Na natureza, os animais nascem livres.","o":{"A":"II – IV – I – III","B":"IV – I – III – II","C":"III – II – IV – I","D":"I – III – II – IV"},"t":"Verbos","tp":"Tempos, modos e formas verbais","src":"EAGS_2020_codigo_43_SIN.pdf · p. 6"},{"id":"EAGS2020-C43-PT-035","s":"por","y":2020,"c":"43","n":35,"a":"B","an":false,"du":false,"l":"","e":"Considere as seguintes frases:\nI-  Paulo é tão corajoso quanto um leão.\nII-  Paulo é tão corajoso que não se esquiva de nada.\nIII-  Desde que o insultaram, Sílvio ficou de mau humor.\nIV-  Desde que não o provoquem, Sílvio não revida.\nAs conjunções/locuções subordinativas adverbiais das frases acima classificam-se, respectivamente, como","o":{"A":"comparativa, concessiva, condicional e condicional","B":"comparativa, consecutiva, temporal e condicional.","C":"consecutiva, comparativa, concessiva e temporal.","D":"condicional, consecutiva, temporal e concessiva."},"t":"Sintaxe","tp":"Período composto e orações","src":"EAGS_2020_codigo_43_SIN.pdf · p. 7"},{"id":"EAGS2020-C43-PT-036","s":"por","y":2020,"c":"43","n":36,"a":"C","an":false,"du":false,"l":"","e":"Considerando a norma culta da língua, assinale a alternativa em que não há erro de colocação pronominal.","o":{"A":"Nunca esqueceu-se de mim. Sempre me enviava um presente no meu aniversário. Esqueceu-se uma vez de enviá-lo e jamais se perdoou por isso.","B":"Nunca se esqueceu de mim. Sempre enviava-me um presente no meu aniversário. Esqueceu-se uma vez de enviá-lo e jamais perdoou-se por isso.","C":"Nunca se esqueceu de mim. Sempre me enviava um presente no meu aniversário. Esqueceu-se uma vez de enviá-lo e jamais se perdoou por isso.","D":"Nunca se esqueceu de mim. Sempre me enviava um presente no meu aniversário. Se esqueceu uma vez de enviá-lo e jamais se perdoou por isso."},"t":"Pronomes","tp":"Emprego e classificação dos pronomes","src":"EAGS_2020_codigo_43_SIN.pdf · p. 7"},{"id":"EAGS2020-C43-PT-037","s":"por","y":2020,"c":"43","n":37,"a":"A","an":false,"du":false,"l":"","e":"Seguem abaixo dois haicais (poema de origem japonesa, formado por três versos). Leia-os e assinale a alternativa que menciona as figuras de linguagem presentes neles, na ordem em que aparecem.\n“A vida é uma cereja\nA morte um caroço\nO amor uma cerejeira.” (Jacques Prévert) “Probleminhas terrenos:\nQuem vive mais\nMorre menos?” (Millôr Fernandes)","o":{"A":"Metáfora e antítese.","B":"Metáfora e eufemismo.","C":"Hipérbole e prosopopeia.","D":"Metonímia e prosopopeia."},"t":"Semântica e estilística","tp":"Sentido, relações semânticas e figuras de linguagem","src":"EAGS_2020_codigo_43_SIN.pdf · p. 7","vr":1},{"id":"EAGS2020-C43-PT-038","s":"por","y":2020,"c":"43","n":38,"a":"B","an":false,"du":false,"l":"","e":"Assinale a frase correta quanto à concordância verbal.","o":{"A":"Ficou muito claro as suas boas intenções.","B":"O conceito dos alunos sobre essas questões resultou em equívocos.","C":"As marcas daquela tragédia evitável continuou registrada de forma inapagável.","D":"Os personagens de uma cena marcante permanecerá em nossa mente para sempre."},"t":"Concordância","tp":"Concordância verbal e nominal","src":"EAGS_2020_codigo_43_SIN.pdf · p. 7"},{"id":"EAGS2020-C43-PT-039","s":"por","y":2020,"c":"43","n":39,"a":"C","an":false,"du":false,"l":"","e":"Considerando as palavras em destaque, assinale a alternativa em que a concordância nominal está correta.","o":{"A":"A ausência de culpa e a frieza são típicos do psicopata.","B":"O número de adolescentes grávidas diminuiu na região, graças aos preservativos distribuído pela Secretaria de\nSaúde.","C":"A expansão da telefonia móvel, ocorrida nos últimos anos, permitiu que as pessoas se comunicassem com mais facilidade.","D":"A proliferação das doenças tropicais, ocorrido nos últimos anos, obrigou o Ministério da Saúde a fornecer mais vacinas para a população."},"t":"Concordância","tp":"Concordância verbal e nominal","src":"EAGS_2020_codigo_43_SIN.pdf · p. 7"},{"id":"EAGS2020-C43-PT-040","s":"por","y":2020,"c":"43","n":40,"a":"D","an":false,"du":false,"l":"","e":"Assinale a alternativa em que todas as palavras estão corretas quanto à grafia, considerando também o contexto.","o":{"A":"Ele queria vê todo mundo na festa.","B":"Tudo aconteceu a exatamente um mês.","C":"Não será possível fazer-mos isso a tempo.","D":"Não sei por que você decidiu fazer a viagem às pressas."},"t":"Ortografia e acentuação","tp":"Ortografia, grafia e hífen","src":"EAGS_2020_codigo_43_SIN.pdf · p. 7"},{"id":"EAGS2020-C43-INF-041","s":"inf","y":2020,"c":"43","n":41,"a":"B","an":false,"du":false,"l":"","e":"Uma oportunidade foi aberta em uma empresa a fim de selecionar funcionários para fazer um curso no exterior. Porém alguns critérios para a ocupação das vagas foram estabelecidos.\nSabendo que todos os critérios abaixo precisam ser atendidos, assinale a alternativa que atende a condição necessária em pseudocódigo.\nConsidere que a sintaxe está correta e que o tempo na empresa, representado pela variável “tempo”, e a idade, representada pela variável “idade”, são medidos em anos, enquanto o grau de inglês, representado pela variável “ingles”, será representado de forma literal pelas letras M ou A.\nCRITÉRIOS:\n• Grau de inglês: médio(M) ou avançado(A).\n• Tempo na empresa: no mínimo 5 anos.\n• Idade: de 18 (inclusive) até 40 (inclusive) anos.","o":{"A":"se (ingles = “M” .ou. ingles = “A”) .e. (tempo >= 5) .e.\n.não.(idade >= 18 .e. idade <= 40)","B":"se (ingles = “M” .ou. ingles = “A”) .e. (tempo >= 5) .e.\n(idade>= 18 .e. idade <=40)","C":"se (ingles = “M” .e. ingles = “A”) .e. (tempo >= 5) .e.\n(idade >= 18 .ou. idade < 40)","D":"se (ingles = “M” .e. “A”) .e. tempo >= 5 .e. (idade >= 18 .ou.\nidade <= 40)"},"t":"Algoritmos e lógica","tp":"Fluxogramas, estruturas de controle e pseudocódigo","src":"EAGS_2020_codigo_43_SIN.pdf · p. 8"},{"id":"EAGS2020-C43-INF-042","s":"inf","y":2020,"c":"43","n":42,"a":"D","an":false,"du":false,"l":"","e":"Com relação a configuração, exibição, controle e apresentação remotamente no LibreOffice Impress, analise as assertivas abaixo, colocando V para verdadeiro ou F para falso, e, em seguida, assinale a alternativa com a sequência correta.\n(    ) O LibreOffice Impress Remote é o aplicativo que deve ser instalado no smartphone ou tablet para controlar a apresentação dos slides, e pode ser baixado na loja de aplicativos da Google, a Play Store.\n(    ) É necessário estabelecer uma conexão bluetooth ou Wi-Fi entre o computador em que se encontra a apresentação e o dispositivo móvel que será utilizado para controle remoto\n(smartphone ou tablet).\n(    ) É possível controlar uma apresentação do Impress por meio de um dispositivo com sistema operacional Android.\n(    ) A sincronização entre o dispositivo móvel e o computador é realizada somente por meio da conexão Wi-Fi.","o":{"A":"V – F – V – F","B":"F – F – V – V","C":"F – V – F – V","D":"V – V – V – F"},"t":"Redes de computadores","tp":"Protocolos, endereçamento e arquitetura de redes","src":"EAGS_2020_codigo_43_SIN.pdf · p. 8","vr":1},{"id":"EAGS2020-C43-INF-043","s":"inf","y":2020,"c":"43","n":43,"a":"A","an":false,"du":false,"l":"","e":"“A partir do processador 486DX, o coprocessador\nmatemático passou a estar embutido dentro do processador; não\nsó aumentou o desempenho do coprocessador matemático como também permitiu a programadores usarem mais as instruções matemáticas, acelerando a execução dos programas.”\nDe acordo com texto acima, assinale a alternativa que indica como passou a ser chamado esse coprocessador.","o":{"A":"Unidade de Ponto Flutuante.","B":"Arquitetura ARM.","C":"Cache L1 e L2.","D":"Overdrive."},"t":"Hardware e arquitetura","tp":"Componentes, memória, processamento e sistemas digitais","src":"EAGS_2020_codigo_43_SIN.pdf · p. 8"},{"id":"EAGS2020-C43-INF-044","s":"inf","y":2020,"c":"43","n":44,"a":"A","an":false,"du":false,"l":"","e":"Um sistema\nGED\n(Gerenciamento\nEletrônico de\nDocumentos) tem como objetivo gerenciar os ciclos de vida dos documentos, desde a criação ou recebimento, até a distribuição, arquivamento ou descarte, possibilitando acessos oportunos e controle eficaz, confiável e econômico.\nNo que diz respeito às três funcionalidades básicas de um GED, analise as assertivas abaixo.\nI  –   Document Imaging – representa a captação da informação.\nII –  Document Management – é o controle do histórico do documento.\nIII – Workflow – é o repositório de dados.\nEstão corretas as afirmativas","o":{"A":"I e II.","B":"I e III.","C":"II e III.","D":"I, II e III."},"t":"Redes de computadores","tp":"Protocolos, endereçamento e arquitetura de redes","src":"EAGS_2020_codigo_43_SIN.pdf · p. 8"},{"id":"EAGS2020-C43-INF-045","s":"inf","y":2020,"c":"43","n":45,"a":"C","an":false,"du":false,"l":"","e":"Assinale a alternativa que preenche corretamente a lacuna abaixo.\n“No LibreOffice Writer, a _____________ auxilia na orientação e posicionamento de parágrafos e de diversos elementos do documento e é  são representada por marcas posicionadas na régua horizontal.”","o":{"A":"seção","B":"margem","C":"tabulação","D":"autocorreção"},"t":"Redes de computadores","tp":"Protocolos, endereçamento e arquitetura de redes","src":"EAGS_2020_codigo_43_SIN.pdf · p. 8"},{"id":"EAGS2020-C43-INF-046","s":"inf","y":2020,"c":"43","n":46,"a":"B","an":false,"du":false,"l":"","e":"Associe corretamente os módulos de memória, conforme seu clock rotulado, e assinale a alternativa correspondente. Os números podem ser utilizados mais de uma vez.\nClock Rotulado:\nMódulo:\n1 – 400 MHz\n(\n) PC2-3200\n2 – 800 MHz\n(\n) PC2-8500\n3 – 1066 MHz\n(\n) PC3-6400\n(\n) PC3-8500","o":{"A":"1 – 2 – 3 – 2","B":"1 – 3 – 2 – 3","C":"2 – 2 – 3 – 3","D":"2 – 2 – 3 – 2"},"t":"Hardware e arquitetura","tp":"Componentes, memória, processamento e sistemas digitais","src":"EAGS_2020_codigo_43_SIN.pdf · p. 8"},{"id":"EAGS2020-C43-INF-047","s":"inf","y":2020,"c":"43","n":47,"a":"C","an":false,"du":false,"l":"","e":"“A ITIL oferece uma abordagem sistemática para a entrega de serviços de TI de qualidade.”\nQuanto ao Acordo de Nível Operacional, analise as frases a seguir e assinale a alternativa que contém apenas as assertivas verdadeiras.\nI – É um acordo entre fornecedor de serviços de TI e outra parte de outra organização.\nII – Ele dá apoio à entrega, pelo provedor de serviço de TI, de serviços de TI a clientes.\nIII – Define os produtos ou serviços a serem oferecidos.","o":{"A":"I e II","B":"I e III","C":"II e III","D":"I , II e III"},"t":"Governança e serviços de TI","tp":"ITIL, gestão de serviços e processos de TI","src":"EAGS_2020_codigo_43_SIN.pdf · p. 8"},{"id":"EAGS2020-C43-INF-048","s":"inf","y":2020,"c":"43","n":48,"a":"D","an":false,"du":false,"l":"","e":"A ITIL contém cinco livros básicos – um para cada fase do ciclo de vida. Cada um dos cinco estágios do ciclo de vida descreve processos, funções e “atividades diversas”.\nPara os tipos de processos de transição de serviço, marque V para verdadeiro ou F para falso e, a seguir, assinale a alternativa com a sequência correta.\n(    ) Gerenciamento de liberação e implantação.\n(    ) Gerenciamento de disponibilidade.\n(    ) Gerenciamento de capacidade.\n(    ) Gerenciamento de mudança.","o":{"A":"F – V – F – F","B":"V – V – F – V","C":"F – F – V – F","D":"V – F – F – V"},"t":"Sistemas operacionais","tp":"Linux, Unix, processos, arquivos e comandos","src":"EAGS_2020_codigo_43_SIN.pdf · p. 9"},{"id":"EAGS2020-C43-INF-049","s":"inf","y":2020,"c":"43","n":49,"a":"A","an":false,"du":false,"l":"","e":"A ITIL contém cinco livros básicos – um para cada fase do ciclo de vida. Cada um dos cinco estágios do ciclo de vida descreve processos, funções e “atividades diversas”.\nPara os tipos de processos de operação de serviço, marque V para verdadeiro ou F para falso e, a seguir, assinale a alternativa com a sequência correta.\n(    ) Gerenciamento de disponibilidade.\n(    ) Gerenciamento de incidente.\n(    ) Gerenciamento de demanda.\n(    ) Gerenciamento de evento.","o":{"A":"F – V – F – V","B":"V – V – F – V","C":"F – F – V – F","D":"V – F – V – F"},"t":"Sistemas operacionais","tp":"Linux, Unix, processos, arquivos e comandos","src":"EAGS_2020_codigo_43_SIN.pdf · p. 9"},{"id":"EAGS2020-C43-INF-050","s":"inf","y":2020,"c":"43","n":50,"a":"C","an":false,"du":false,"l":"","e":"Considerando os conceitos de introdução a UML, assinale a alternativa cuja assertiva é verdadeira.","o":{"A":"Um estereótipo descreve um relacionamento ‘é um’ entre duas classes.","B":"Uma linguagem de modelagem é uma notação hexadecimal para descrever projetos de software.","C":"Uma agregação é um tipo especial de associação que modela o reclacionamento ‘tem um’ entre pares.","D":"Uma composição é menos rigorosa do que a agregação, pois é um relacionamento entre pares completamente independentes."},"t":"Redes de computadores","tp":"Protocolos, endereçamento e arquitetura de redes","src":"EAGS_2020_codigo_43_SIN.pdf · p. 9"},{"id":"EAGS2020-C43-INF-051","s":"inf","y":2020,"c":"43","n":51,"a":"D","an":false,"du":false,"l":"","e":"Quanto à segurança em redes de computadores, analise as frases abaixo e assinale a alternativa que contém apenas as assertivas verdadeiras.\nI –   A autenticação é a técnica pela qual um processo confirma que seu parceiro na comunicação é quem deve ser e não um impostor.\nII –  Uma organização que certifica chaves públicas é chamada de autoridade de certificação.\nIII – SSL (Secure Sockets Layer) é um tipo de pacote de segurança.","o":{"A":"I e II","B":"I e III","C":"II e III","D":"I, II e III"},"t":"Redes de computadores","tp":"Protocolos, endereçamento e arquitetura de redes","src":"EAGS_2020_codigo_43_SIN.pdf · p. 9"},{"id":"EAGS2020-C43-INF-052","s":"inf","y":2020,"c":"43","n":52,"a":"C","an":false,"du":false,"l":"","e":"Assinale a alternativa que completa a lacuna do texto a seguir, o qual está relacionado à Tecnologia da Informação.\n“____________ é o processo em que se estabelece ligação eletrônica entre uma organização, seus clientes, seus fornecedores e demais elementos de seu relacionamento, com o objetivo de obter maiores ganhos nos negócios.”","o":{"A":"Internet","B":"Intranet","C":"E-business","D":"E-mail"},"t":"Sistemas operacionais","tp":"Linux, Unix, processos, arquivos e comandos","src":"EAGS_2020_codigo_43_SIN.pdf · p. 9"},{"id":"EAGS2020-C43-INF-053","s":"inf","y":2020,"c":"43","n":53,"a":"A","an":false,"du":false,"l":"","e":"Com relação à segurança em redes de computadores, assinale V para verdadeiro ou F para falso. Em seguida, assinale a alternativa com a sequência correta.\n(    ) A criptografia é uma ferramenta que pode ser usada para manter informações confidenciais e garantir sua integridade e autenticidade.\n(    ) Os algoritmos criptográficos podem ser divididos como de chave simétrica e de chave pública.\n(    ) Os algoritmos de chave simétrica utilizam chaves diferentes para codificação e decodificação.\n(    ) O algoritmo RSA é um tipo de algoritmo de chave pública.","o":{"A":"V – V – F – V","B":"F – V – F – V","C":"F – F – V – F","D":"V – F – V – F"},"t":"Redes de computadores","tp":"Protocolos, endereçamento e arquitetura de redes","src":"EAGS_2020_codigo_43_SIN.pdf · p. 9","vr":1},{"id":"EAGS2020-C43-INF-054","s":"inf","y":2020,"c":"43","n":54,"a":"B","an":false,"du":false,"l":"","e":"Considerando-se a solução de problemas usando a técnica de lógica modular, pode-se afirmar que","o":{"A":"não deve ser desenvolvida em diferentes níveis.","B":"deve ser estruturada de partes independentes, denominados modulos.","C":"essa técnica é baseada em uma PDL (Program Design\nLanguage).","D":"não pode ser representada graficamente em forma de fluxogramas."},"t":"Algoritmos e lógica","tp":"Fluxogramas, estruturas de controle e pseudocódigo","src":"EAGS_2020_codigo_43_SIN.pdf · p. 9"},{"id":"EAGS2020-C43-INF-055","s":"inf","y":2020,"c":"43","n":55,"a":"D","an":false,"du":false,"l":"","e":"Analise o algoritmo abaixo, escrito em português estruturado. Considerando o valor lido para A como 9 e para B como 15, qual a saída de X?\nprograma TESTA_LOGICA var\nA, B, X: inteiro início leia A,B\nse (A<B) .e. .não. (B/5 >= 1) então\nX  (B/5 - A)\n-2 senão\nX  (A - B) * 3 * -1 fim_se escreva X fim","o":{"A":"–18","B":"–6","C":"6","D":"18"},"t":"Algoritmos e lógica","tp":"Fluxogramas, estruturas de controle e pseudocódigo","src":"EAGS_2020_codigo_43_SIN.pdf · p. 9"},{"id":"EAGS2020-C43-INF-056","s":"inf","y":2020,"c":"43","n":56,"a":"B","an":false,"du":false,"l":"","e":"Relacione as duas colunas sobre topologia das redes sem fio e assinale a alternativa correta. Os números poderão ser utilizados mais de uma vez.\n(\n) Caracterizam-se por possuir dois\n1 – Cliente/servidor tipos de elementos: as estações\n(infraestrutura) móveis e os pontos de acesso.\n2 – Ad-hoc\n(\n) Nessa topologia, as comunicações são estabelecidas entre múltiplas estações, sem o uso de um ponto de acesso ao servidor.\n(\n) Nessa rede, qualquer um dos equipamentos envolvidos poderá assumir o papel de um roteador e compartilhar o acesso à Internet com os demais equipamentos.","o":{"A":"1 – 2 – 1","B":"1 – 2 – 2","C":"2 – 1 – 2","D":"2 – 1 – 1"},"t":"Redes de computadores","tp":"Protocolos, endereçamento e arquitetura de redes","src":"EAGS_2020_codigo_43_SIN.pdf · p. 10"},{"id":"EAGS2020-C43-INF-057","s":"inf","y":2020,"c":"43","n":57,"a":"D","an":false,"du":false,"l":"","e":"Relacione as colunas e, em seguida, assinale a alternativa que contém a sequência correta.\n1 – Portfólio de serviço\n(\n) É um banco de dados ou documento estruturado com\n2 – Catálogo de serviço informações sobre todos os serviços de TI em uso na produção.\n(\n) Contém informações de serviços voltados para o cliente que são visíveis para o negócio.\n(\n) É o conjunto completo de serviços que é gerenciado por um provedor de serviço.\n(\n) É utilizado para gerenciar o ciclo de vida de todos os serviços.\n(\n) Uma de suas categorias é o funil de serviços.","o":{"A":"2 – 1 – 2 – 2 – 2","B":"1 – 1 – 2 – 1 – 2","C":"1 – 2 – 2 – 2 – 1","D":"2 – 2 – 1 – 1 – 1"},"t":"Banco de dados","tp":"SQL, SGBD, modelagem e administração de dados","src":"EAGS_2020_codigo_43_SIN.pdf · p. 10"},{"id":"EAGS2020-C43-INF-058","s":"inf","y":2020,"c":"43","n":58,"a":"D","an":false,"du":false,"l":"","e":"Considerando que a sintaxe está correta, qual das estruturas de repetição, representadas em pseudocódigo, atende a condição de se somar todos os números inteiros no intervalo de 1 a 100?\nPara a resolução, considere o seguinte:\n• Valor inicial de SOMA é igual a 0(zero).\n• Os números 1 e 100 devem ser incluídos no intervalo.","o":{"A":"para CONTADOR de 1 até 100 passo 2 faça\nSOMA  SOMA + CONTADOR fim_para","B":"para CONTADOR de 0 até 99 passo 1 faça\nSOMA  SOMA + CONTADOR fim_para","C":"para CONTADOR de 1 até 100 passo 1 faça\nSOMA  SOMA + CONTADOR – 1 fim_para","D":"para CONTADOR de 0 até 99 passo 1 faça\nSOMA  SOMA + CONTADOR + 1 fim_para"},"t":"Algoritmos e lógica","tp":"Fluxogramas, estruturas de controle e pseudocódigo","src":"EAGS_2020_codigo_43_SIN.pdf · p. 10"},{"id":"EAGS2020-C43-INF-059","s":"inf","y":2020,"c":"43","n":59,"a":"B","an":false,"du":false,"l":"","e":"O ciclo de vida de serviço consiste em cinco etapas. Cada um dos novos volumes básicos da ITIL descreve uma dessas etapas. Em se tratando das fases do ciclo de vida de um serviço, assinale a alternativa que preenche corretamente a lacuna do texto abaixo.\n“____________ é a etapa que define os requisitos para um provedor de serviços ser capaz de dar suporte aos requisitos do negócio.”","o":{"A":"Transição de serviço","B":"Estratégia de serviço","C":"Operação de serviço","D":"Desenho de serviço"},"t":"Engenharia de software","tp":"Modelagem, qualidade, desenvolvimento e documentação","src":"EAGS_2020_codigo_43_SIN.pdf · p. 10"},{"id":"EAGS2020-C43-INF-060","s":"inf","y":2020,"c":"43","n":60,"a":"A","an":false,"du":false,"l":"","e":"Considerando-se a solução de problemas usando a técnica de lógica linear, pode-se afirmar que","o":{"A":"não está ligada a regras de hierarquia ou de estruturas de linguagens específicas de programação de computadores.","B":"não pode ser representada graficamente em forma de diagramas.","C":"essa técnica é baseada em uma PDL (Program Design\nLanguage).","D":"deve ser estruturada de partes independentes, denominados módulos."},"t":"Algoritmos e lógica","tp":"Fluxogramas, estruturas de controle e pseudocódigo","src":"EAGS_2020_codigo_43_SIN.pdf · p. 10","vr":1},{"id":"EAGS2020-C43-INF-061","s":"inf","y":2020,"c":"43","n":61,"a":"B","an":false,"du":false,"l":"","e":"Indique a opção que completa corretamente a lacuna da assertiva a seguir.\n“Considerando-se as definições de herança na programação orientada a objetos, um método ou atributo _______________ é simplesmente herdado de uma classe progenitora.”","o":{"A":"novo","B":"recursivo","C":"construtor","D":"sobreposto"},"t":"Programação orientada a objetos","tp":"Classes, herança, encapsulamento e polimorfismo","src":"EAGS_2020_codigo_43_SIN.pdf · p. 10"},{"id":"EAGS2020-C43-INF-062","s":"inf","y":2020,"c":"43","n":62,"a":"B","an":false,"du":false,"l":"","e":"Considere as representações UML das classes abaixo e assinale a alternativa que possui dois atributos privados.","o":{"A":"MilitarAeronautica\n# idade : int\n+ posto : String\n# especialidade·: String","B":"MilitarAeronautica\n- idade : int\n- posto : String\n+ especialidade·: String","C":"MilitarAeronautica\n+ idade : int\n- posto : String\n# especialidade·: String","D":"MilitarAeronautica\n+ idade : int\n+ posto : String\n# especialidade·: String"},"t":"Programação orientada a objetos","tp":"Classes, herança, encapsulamento e polimorfismo","src":"EAGS_2020_codigo_43_SIN.pdf · p. 10"},{"id":"EAGS2020-C43-INF-063","s":"inf","y":2020,"c":"43","n":63,"a":"B","an":false,"du":false,"l":"","e":"Quanto ao resultado lógico das expressões descritas em pseudocódigo abaixo, assinale V quando o resultado for verdadeiro ou F quando falso. Em seguida, assinale a alternativa com a sequência correta. Considere os seguintes valores para as variáveis:\nA = 1\nB = 6\nC = 7\nD = 2\n(    ) (C = 6) .e. (D <> 7)\n(    ) .não.( D>2) .e. (C>B)\n(    ) (A>=B).ou. .não.(D > 8)\n(    ) .não. (A >= B) .e. .não. (C < D)","o":{"A":"F – F – V – V","B":"F – V – V – V","C":"V – V – F – F","D":"V – F – F – V"},"t":"Algoritmos e lógica","tp":"Fluxogramas, estruturas de controle e pseudocódigo","src":"EAGS_2020_codigo_43_SIN.pdf · p. 11"},{"id":"EAGS2020-C43-INF-064","s":"inf","y":2020,"c":"43","n":64,"a":"C","an":false,"du":false,"l":"","e":"Tratando-se dos tipos de teste de software, assinale a alternativa que fala sobre testes de integração.","o":{"A":"Examinam todo o sistema.","B":"Verificam apenas um recurso por vez.","C":"Verificam se dois ou mais objetos funcionam em conjunto corretamente.","D":"Examinam as alterações nas partes do sistema que foram validadas anteriormente."},"t":"Engenharia de software","tp":"Modelagem, qualidade, desenvolvimento e documentação","src":"EAGS_2020_codigo_43_SIN.pdf · p. 11"},{"id":"EAGS2020-C43-INF-065","s":"inf","y":2020,"c":"43","n":65,"a":"A","an":false,"du":false,"l":"","e":"Considerando os operadores de atribuição e aritméticos do código PHP abaixo, assinale a alternativa que corresponde à saída do programa.\n<?php\n$a = 120;\n$b = 20;\n$a -= ++$b;\necho \"a = $a e b = $b\";\n?>","o":{"A":"a = 99 e b = 21","B":"a = 99 e b = 20","C":"a = 100 e b = 20","D":"a = 100 e b = 21"},"t":"Linguagens de programação","tp":"PHP, Java e sintaxe de linguagens","src":"EAGS_2020_codigo_43_SIN.pdf · p. 11"},{"id":"EAGS2020-C43-INF-066","s":"inf","y":2020,"c":"43","n":66,"a":"C","an":false,"du":false,"l":"","e":"Em se tratando de Sistemas Gerenciadores de Banco de\nDados, relacione as duas colunas e, em seguida, assinale a alternativa que contém a sequência correta.\n1 – insert\n(\n) É o comando que realiza alterações nos valores dos registros de\n2 – update determinada tabela.\n3 – alter table\n(\n) Por meio deste comando, podemos\n4 – drop table incluir campos em uma tabela.\n(\n) É o comando responsável por incluir dados em uma tabela.\n(\n) Serve para excluir uma tabela do banco de dados.","o":{"A":"2 – 1 – 3 – 4","B":"4 – 3 – 1 – 2","C":"2 – 3 – 1 – 4","D":"2 – 1 – 4 – 3"},"t":"Banco de dados","tp":"SQL, SGBD, modelagem e administração de dados","src":"EAGS_2020_codigo_43_SIN.pdf · p. 11"},{"id":"EAGS2020-C43-INF-067","s":"inf","y":2020,"c":"43","n":67,"a":"D","an":false,"du":false,"l":"","e":"Levando em consideração os conceitos básicos de análise orientada a objetos (AOO) e a introdução à UML, assinale a alternativa correta.","o":{"A":"Requisitos descrevem a interação entre o usuário e o sistema.","B":"Um processo de desenvolvimento de software mostra exclusivamente o estágio de implementação do código.","C":"Uma variante de caso de uso é um atributo que deve ser usado em todas as classes que envolvem o caso de uso no sistema.","D":"Denomina-se ator tudo que interage com o sistema. Pode ser um usuário humano ou outro sistema de computador."},"t":"Sistemas operacionais","tp":"Linux, Unix, processos, arquivos e comandos","src":"EAGS_2020_codigo_43_SIN.pdf · p. 11"},{"id":"EAGS2020-C43-INF-068","s":"inf","y":2020,"c":"43","n":68,"a":"D","an":false,"du":false,"l":"","e":"Qual das características abaixo a linguagem PHP não possui?","o":{"A":"É gratuita.","B":"É um software com código-fonte aberto.","C":"Funciona com programação orientada a objetos.","D":"É executado no lado do cliente em um relacionamento cliente/servidor."},"t":"Programação orientada a objetos","tp":"Classes, herança, encapsulamento e polimorfismo","src":"EAGS_2020_codigo_43_SIN.pdf · p. 11"},{"id":"EAGS2020-C43-INF-069","s":"inf","y":2020,"c":"43","n":69,"a":"B","an":false,"du":false,"l":"","e":"A fim de tratar as informações retomadas por comandos\nSQL, o PHP apresenta uma série de funções a serem utilizadas.\nDadas as funções PHP existentes para tratar informações vindas de bancos de dados MySQL, relacione a coluna da esquerda com a da direita e, em seguida, assinale a alternativa correta.\n1 – mysq1_affected_rows\n(\n) Armazena a linha atual do resultado em um array\n2 – mysql_fetch_object associativo.\n3 – mysql_fetch_array\n(\n) Retoma o número de linhas\n4 – mysql_num_fields afetadas por uma operação.\n5 – mysql_num_rows\n(\n) Retoma o número de colunas de uma consulta.\n(\n) Retoma o número de linhas de uma consulta.\n(\n) Retoma uma linha como um objeto.","o":{"A":"5 – 1 – 4 – 2 – 3","B":"3 – 1 – 4 – 5 – 2","C":"3 – 4 – 1 – 5 – 2","D":"5 – 4 – 1 – 2 – 3"},"t":"Banco de dados","tp":"SQL, SGBD, modelagem e administração de dados","src":"EAGS_2020_codigo_43_SIN.pdf · p. 11"},{"id":"EAGS2020-C43-INF-070","s":"inf","y":2020,"c":"43","n":70,"a":"D","an":false,"du":false,"l":"","e":"Qual dos pilares de orientação a objetos abaixo permite ao desenvolvedor criar um programa dividido em várias partes menores e independentes, ao invés de um programa com uma única entidade grande e monolítica?","o":{"A":"Herança","B":"Abstração","C":"Polimorfismo","D":"Encapsulamento"},"t":"Programação orientada a objetos","tp":"Classes, herança, encapsulamento e polimorfismo","src":"EAGS_2020_codigo_43_SIN.pdf · p. 11"},{"id":"EAGS2020-C43-INF-071","s":"inf","y":2020,"c":"43","n":71,"a":"B","an":false,"du":false,"l":"","e":"O protocolo SMTP (Simple Mail Transfer Protocol), usado no sistema de correio eletrônico da Internet, utiliza o protocolo\nTCP na camada de transporte, escutando as requisições na porta","o":{"A":"23.","B":"25.","C":"80.","D":"110."},"t":"Redes de computadores","tp":"Protocolos, endereçamento e arquitetura de redes","src":"EAGS_2020_codigo_43_SIN.pdf · p. 11"},{"id":"EAGS2020-C43-INF-072","s":"inf","y":2020,"c":"43","n":72,"a":"C","an":false,"du":false,"l":"","e":"Analise o algoritmo abaixo representado em pseudocódigo.\nConsiderando que a sintaxe está correta, e o valor lido para A é\n18 e para B é 5, qual a saída de X?\nprograma TESTA_LOGICA var\nA, B, X: inteiro início leia A,B\nse (A>=B) .e. (B/5 <= 1) então\nX    (B – A/3) + 1 senão\nX    (A*2 – B) fim_se escreva  X fim","o":{"A":"–54","B":"–31","C":"0","D":"31"},"t":"Algoritmos e lógica","tp":"Fluxogramas, estruturas de controle e pseudocódigo","src":"EAGS_2020_codigo_43_SIN.pdf · p. 12"},{"id":"EAGS2020-C43-INF-073","s":"inf","y":2020,"c":"43","n":73,"a":"B","an":false,"du":false,"l":"","e":"Assinale a alternativa correta quanto a definição abaixo.\n“É uma unidade de armazenamento totalmente eletrônica formada por três tipos de componentes: um chip controlador, um chip de\nRAM dinâmico usada como cache e os chips de memória flash do tipo NAND”.","o":{"A":"HD","B":"SSD","C":"SCSI","D":"Superdisk"},"t":"Hardware e arquitetura","tp":"Componentes, memória, processamento e sistemas digitais","src":"EAGS_2020_codigo_43_SIN.pdf · p. 12"},{"id":"EAGS2020-C43-INF-074","s":"inf","y":2020,"c":"43","n":74,"a":"A","an":false,"du":false,"l":"","e":"Levando em consideração a linguagem PHP e a orientação a objetos, assinale a alternativa que completa a frase abaixo.\n“Os métodos que forem declarados com a palavra _________ não poderão ser sobrescritos pelas subclasses.”","o":{"A":"final","B":"fixed","C":"strict","D":"public"},"t":"Programação orientada a objetos","tp":"Classes, herança, encapsulamento e polimorfismo","src":"EAGS_2020_codigo_43_SIN.pdf · p. 12"},{"id":"EAGS2020-C43-INF-075","s":"inf","y":2020,"c":"43","n":75,"a":"B","an":false,"du":false,"l":"","e":"Relacione as colunas e, em seguida, assinale a alternativa que contém a sequência correta. Os números podem ser utilizados mais de uma vez.\n1 – Protocolo UDP\n(\n) Acrescenta confiabilidade com retransmissões, junto com controle de\n2 – Protocolo TCP fluxo e controle de congestionamento.\n(\n) Protocolo de transporte não orientado a conexão.\n(\n) Protocolo de transporte orientado a conexão.\n(\n) Não realiza controle de fluxo.","o":{"A":"1 – 2 – 1 – 1","B":"2 – 1 – 2 – 1","C":"1 – 2 – 2 – 1","D":"2 – 1 – 1 – 2"},"t":"Redes de computadores","tp":"Protocolos, endereçamento e arquitetura de redes","src":"EAGS_2020_codigo_43_SIN.pdf · p. 12"},{"id":"EAGS2020-C43-INF-076","s":"inf","y":2020,"c":"43","n":76,"a":"B","an":false,"du":false,"l":"","e":"Sabe-se que a linguagem PHP usa determinados tipos de operadores para comparar e manipular valores de dados. Assinale a alternativa que não representa um tipo de operador existente na linguagem PHP.","o":{"A":"Operador ternário.","B":"Operador de reversão.","C":"Operadores aritméticos.","D":"Operador de atribuição."},"t":"Linguagens de programação","tp":"PHP, Java e sintaxe de linguagens","src":"EAGS_2020_codigo_43_SIN.pdf · p. 12"},{"id":"EAGS2020-C43-INF-077","s":"inf","y":2020,"c":"43","n":77,"a":"D","an":false,"du":false,"l":"","e":"Analise as frases abaixo e coloque V para verdadeiro ou\nF para falso. Em seguida, assinale a alternativa com a sequência correta.\n(    ) Existem dois modos de execução dentro de virtualização:\nraiz e não-raiz (root e non-root).\n(    ) Com a tecnologia de virtualização, o HD traz algumas instruções para controlar a virtualização.\n(    ) Sistemas operacionais sendo executados nas máquinas virtuais são também chamados de “programas convidados”.\n(    ) Processadores com tecnologia de virtualização possuem um conjunto de instruções extra, que é chamado VMX em processadores Intel, ou SVM em processadores AMD.","o":{"A":"F – V – F – V","B":"F – V – V – V","C":"V – F – V – F","D":"V – F – V – V"},"t":"Hardware e arquitetura","tp":"Componentes, memória, processamento e sistemas digitais","src":"EAGS_2020_codigo_43_SIN.pdf · p. 12"},{"id":"EAGS2020-C43-INF-078","s":"inf","y":2020,"c":"43","n":78,"a":"C","an":false,"du":false,"l":"","e":"Em Linux, as teclas e as expressões de escape permitem sair de situações como loops infinitos, programas em execução etc.\nRelacione a coluna da esquerda com a da direita, e em seguida selecione a alternativa correta.\nTecla (s)\nSituação\n(\n) Fará com que um processo que esteja\n1 – Ctrl + c em execução em primeiro plano fique\n2 – Ctrl + z suspenso.\n3 – Esc\n(\n) Esse é o break de uma execução.\n(\n) É utilizado para abortar janelas de programas.","o":{"A":"1 – 2 – 3","B":"3 – 2 – 1","C":"2 – 1 – 3","D":"3 – 1 – 2"},"t":"Sistemas operacionais","tp":"Linux, Unix, processos, arquivos e comandos","src":"EAGS_2020_codigo_43_SIN.pdf · p. 12"},{"id":"EAGS2020-C43-INF-079","s":"inf","y":2020,"c":"43","n":79,"a":"B","an":false,"du":false,"l":"","e":"Analise a tabela SQL abaixo chamada “escola”.\ncodigo_aluno nome_aluno\n1100\nAna\n1200\nEdilene\n1300\nMaria\n1400\nAline\n1500\nAriana\nConsiderando o comando SQL abaixo, assinale a alternativa que apresenta todos os registros encontrados.\nSELECT nome_aluno FROM escola WHERE\nnome_aluno LIKE ‘%a’;","o":{"A":"“Ana”, “Edilene”, “Maria”, “Aline”, “Ariana”","B":"“Ana”, “Maria”, “Ariana”","C":"“Edilene”, “Aline”","D":"“Ana”, “Ariana”"},"t":"Banco de dados","tp":"SQL, SGBD, modelagem e administração de dados","src":"EAGS_2020_codigo_43_SIN.pdf · p. 12"},{"id":"EAGS2020-C43-INF-080","s":"inf","y":2020,"c":"43","n":80,"a":"C","an":false,"du":false,"l":"","e":"Qual protocolo permite aos computadores sincronização dos relógios a milissegundos um do outro, e que também pode ser utilizado como uma diretiva representa a temperatura em\nFahrenheit.","o":{"A":"function converteParaCelsius($tf){\nreturn ($tf – 32)/9*5;\n}","B":"function converteParaCelsius($tf){\nreturn ($tf – 32)/9.5;\n}","C":"function converteParaCelsius($tf){\nreturn $tf – 32/9*5;\n}","D":"Function converteParaCelsius($tf){\nreturn $tf – 32 – 9*5;\n}"},"t":"Linguagens de programação","tp":"PHP, Java e sintaxe de linguagens","src":"EAGS_2020_codigo_43_SIN.pdf · p. 14"},{"id":"EAGS2020-C43-INF-096","s":"inf","y":2020,"c":"43","n":96,"a":"B","an":false,"du":false,"l":"","e":"Considerando-se os operadores disponíveis na linguagem\nPHP, assinale a alternativa que corresponde à saída script abaixo.\n<?php\n$x=45;\n$y=9;\n$resultado=!($x%$y<>O)?($x/$y):($x*$y/9);\necho ++$resultado;\n?>","o":{"A":"5","B":"6","C":"45","D":"46"},"t":"Linguagens de programação","tp":"PHP, Java e sintaxe de linguagens","src":"EAGS_2020_codigo_43_SIN.pdf · p. 15"},{"id":"EAGS2020-C43-INF-097","s":"inf","y":2020,"c":"43","n":97,"a":"C","an":false,"du":false,"l":"","e":"Assinale a alternativa que completa corretamente as lacunas da assertiva abaixo.\n“Os principais equipamentos ativos utilizados para a interligação das estações de trabalho a outros computadores da rede são os\n_________________ (também conhecidos por ___________) e os _________________ ( chamados de ___________).”","o":{"A":"comutadores – hub – concentradores – hub","B":"concentradores – switch – comutadores hub","C":"concentradores – hub – comutadores – switch","D":"comutadores – switch – concentradores – switch"},"t":"Algoritmos e lógica","tp":"Fluxogramas, estruturas de controle e pseudocódigo","src":"EAGS_2020_codigo_43_SIN.pdf · p. 15"},{"id":"EAGS2020-C43-INF-098","s":"inf","y":2020,"c":"43","n":98,"a":"C","an":false,"du":false,"l":"","e":"Considerando os conceitos básicos de funcionamento de hardware, assinale a alternativa correta quanto à definição abaixo.\n“Parte da memória (RAM) do computador pode ser acessada como uma memória temporária para uso interno do processador.\nSua principal característica é que o último dado armazenado será o primeiro a sair.”","o":{"A":"CISC","B":"RISC","C":"Pilha","D":"Flags"},"t":"Hardware e arquitetura","tp":"Componentes, memória, processamento e sistemas digitais","src":"EAGS_2020_codigo_43_SIN.pdf · p. 15"},{"id":"EAGS2020-C43-INF-099","s":"inf","y":2020,"c":"43","n":99,"a":"D","an":false,"du":false,"l":"","e":"Sobre a tecnologia de transmissão de dados do tipo enlaces de broadcast, marque V para verdadeiro ou F para falso. A seguir, assinale a alternativa que apresenta a sequência correta.\n(    ) Conectam pares de máquinas individuais.\n(    ) Os pacotes enviados por qualquer máquina são recebidos por todas as outras.\n(    ) Têm apenas um canal de comunicação, compartilhado por todas as maquinas da rede.\n(    ) Oferecem possibilidade de endereçamento de um pacote a todos os destinos usando um código especial no campo de endereço.","o":{"A":"F – V – F – F","B":"V – F – V – V","C":"V – V – V – F","D":"F – V – V – V"},"t":"Redes de computadores","tp":"Redes de difusão (broadcast) e transmissão de dados","src":"EAGS_2020_codigo_43_SIN.pdf · p. 15"},{"id":"EAGS2020-C43-INF-100","s":"inf","y":2020,"c":"43","n":100,"a":"C","an":false,"du":false,"l":"","e":"Analise o código PHP abaixo e assinale a alternativa que corresponde à saída do programa.\n<?php\n$x=20.1;\n$y=2.2;\nfunction provaEAGS($a, $b){\nreturn $b + $a*(int)2;\n}\n$resultado = provaEAGS($x, $y);\necho $resultado;\n?>","o":{"A":"25","B":"42.2","C":"42.4","D":"43"},"t":"Linguagens de programação","tp":"PHP, Java e sintaxe de linguagens","src":"EAGS_2020_codigo_43_SIN.pdf · p. 15"},{"id":"EAGS2021-C86-PT-001","s":"por","y":2021,"c":"86","n":1,"a":"C","an":false,"du":false,"l":"","e":"Pode-se dizer que, na crônica Vergonha de Viver, Clarice\nLispector tem por objetivo","o":{"A":"confidenciar que a timidez é, na verdade, uma arma para aqueles que são ousados.","B":"mostrar que aos tímidos, entre os quais ela se inclui, resta só a constatação de que o medo lhes fechará todas as portas.","C":"revelar, com os sinais de sua história, que todo tímido deseja chegar ao outro, no entanto tem ele de gritar contra a solidão porque sua alma grita.","D":"esclarecer ao leitor que, apesar dos momentos de ousadia dos tímidos, suas tentativas acabam em fracassos, como os vários exemplos de sua vida."},"t":"Ortografia e acentuação","tp":"Ortografia, grafia e hífen","src":"EAGS_2021_codigo_86_SAD.pdf · p. 3","esp":"Administração","sp":4},{"id":"EAGS2021-C86-PT-002","s":"por","y":2021,"c":"86","n":2,"a":"C","an":false,"du":false,"l":"","e":"No último parágrafo, a autora","o":{"A":"apresenta, por meio de reminiscências da infância, a valorização de seu dom como escritora.","B":"mostra que a insistência em escrever histórias foi determinante para o reconhecimento de uma grande cronista.","C":"sugere que a teimosia em escrever, apesar das recusas, pode tê- la impulsionado para a senda da literatura.","D":"leva à conclusão, por ser autobiográfico e contraditório, de que escrever na infância foi o embrião de seu futuro ofício."},"t":"Interpretação de texto","tp":"Compreensão de crônica: posicionamento da autora","src":"EAGS_2021_codigo_86_SAD.pdf · p. 3","vr":1,"esp":"Administração","sp":4},{"id":"EAGS2021-C86-PT-003","s":"por","y":2021,"c":"86","n":3,"a":"A","an":false,"du":false,"l":"","e":"Em relação aos recursos de escrita utilizados pela autora, assinale a alternativa correta.","o":{"A":"O uso de 1.ª e 3.ª pessoas é o recurso que lhe permite apresentar a essência do tímido e dela afastar-se.","B":"A autora recorre, em todos os parágrafos e de forma predominante, à figura de pensamento antítese, a fim de apresentar a condição de conflito dos tímidos.","C":"O discurso direto é escolhido como recurso expressivo fundamental para a autora mostrar seu desejo de lutar contra a essência dos tímidos.","D":"O primeiro parágrafo do texto foge à estrutura narrativa, valendo-se da sequência dissertativa para defender sua
