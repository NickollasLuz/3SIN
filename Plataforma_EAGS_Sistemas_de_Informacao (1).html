 tese sobre a timidez: a de que ela pode ser enfrentada."},"t":"Semântica e estilística","tp":"Sentido, relações semânticas e figuras de linguagem","src":"EAGS_2021_codigo_86_SAD.pdf · p. 3","vr":1,"esp":"Administração","sp":4},{"id":"EAGS2021-C86-PT-004","s":"por","y":2021,"c":"86","n":4,"a":"C","an":false,"du":false,"l":"","e":"O relato presente no segundo e no terceiro parágrafos do texto revela o embate entre os seguintes sentimentos:","o":{"A":"rebeldia e fracasso.","B":"teimosia e vergonha.","C":"determinação e medo.","D":"ousadia e arrependimento."},"t":"Interpretação de texto","tp":"Inferência de sentimentos e conflito no relato","src":"EAGS_2021_codigo_86_SAD.pdf · p. 3","esp":"Administração","sp":4},{"id":"EAGS2021-C86-PT-005","s":"por","y":2021,"c":"86","n":5,"a":"A","an":false,"du":false,"l":"","e":"Assinale a alternativa em que o uso do acento grave, indicador de crase, é facultativo.","o":{"A":"“E pareciam a sua imaginação em três figuras vivas: uma\nmulher muito formosa; uma figura negra de olho de brasa e pé\nde cabra; e o mundo, coisa vaga e maravilhosa (...).” (Eça de\nQueirós)","B":"“Por mais que eu mesmo conhecesse o dano/ a que dava ocasião minha brandura,/ nunca pude fugir ao ledo engano.” (Cláudio\nM. da Costa)","C":"“Talvez, prezado amigo, que imagine/ que neste momento se conserve/ eterna a sua glória.” (Tomá A. Gonzaga)","D":"“Deixei os dois na varanda e fiquei no pátio, a respeitosa distância.” (Mia Couto)"},"t":"Crase","tp":"Emprego do acento indicativo de crase","src":"EAGS_2021_codigo_86_SAD.pdf · p. 3","vr":1,"esp":"Administração"},{"id":"EAGS2021-C86-PT-006","s":"por","y":2021,"c":"86","n":6,"a":"B","an":false,"du":false,"l":"","e":"Assinale a alternativa em que há erro no emprego do pronome de tratamento.","o":{"A":"Sua Excelência discursou muito bem, em sua posse como prefeito municipal.","B":"Sua Majestade encontrou entre os plebeus sua esposa, a princesa Emiliana.","C":"Sua Reverência, o sacerdote José, celebrou com o povoado a festa de Pentecostes.","D":"O Papa visitou a cidade, e a missa foi ao ar livre. Sua Santidade elogiou o empenho de todos."},"t":"Pronomes","tp":"Emprego e classificação dos pronomes","src":"EAGS_2021_codigo_86_SAD.pdf · p. 3","esp":"Administração"},{"id":"EAGS2021-C86-PT-007","s":"por","y":2021,"c":"86","n":7,"a":"D","an":false,"du":false,"l":"","e":"Leia:\nNas cidades todas as pessoas se parecem./ Aqui não: sente-se bem que cada um traz a sua alma. (Manuel Bandeira)\nA oração em destaque nos versos acima classifica-se como subordinada substantiva","o":{"A":"completiva nominal.","B":"objetiva direta.","C":"consecutiva.","D":"subjetiva."},"t":"Sintaxe","tp":"Período composto e orações","src":"EAGS_2021_codigo_86_SAD.pdf · p. 3","esp":"Administração"},{"id":"EAGS2021-C86-PT-008","s":"por","y":2021,"c":"86","n":8,"a":"A","an":false,"du":false,"l":"","e":"Assinale a alternativa em que o aposto se refere a outro aposto.","o":{"A":"Consultou o filósofo, filho do professor Siqueira, diretor da universidade.","B":"Apenas o irmão Maciel, vez ou outra, compreendia meus problemas.","C":"D. Ritinha, empregada doméstica, não estava muito bem de saúde.","D":"Homem de princípios, Murilo opinou com serenidade na reunião."},"t":"Sintaxe","tp":"Termos da oração: complementos e adjuntos","src":"EAGS_2021_codigo_86_SAD.pdf · p. 4","esp":"Administração"},{"id":"EAGS2021-C86-PT-009","s":"por","y":2021,"c":"86","n":9,"a":"A","an":false,"du":false,"l":"","e":"Considerando as orações subordinadas adjetivas em destaque, coloque (E) para explicativa e (R) para restritiva. Em seguida, assinale a alternativa com a sequência correta.\n(    ) “Bastante experimentei a verdade deste aviso, que me despia, num gesto, das ilusões de criança (...).” (Raul Pompeia)\n(    ) Era uma poesia descuidada, que não possuía escola (...).\n(José Lins do Rego, adaptado)\n(    ) “Tais são, sumariamente, as capitais inovações que este livro apresenta.” (Eugênio de Castro)\n(    ) “Era sua irmã que cantava um dos hinos sagrados (...).”\n(Alexandre Herculano)","o":{"A":"E – E – R – R","B":"E – R – E – R","C":"R – E – E – R","D":"R – R – E – E"},"t":"Sintaxe","tp":"Período composto e orações","src":"EAGS_2021_codigo_86_SAD.pdf · p. 4","esp":"Administração"},{"id":"EAGS2021-C86-PT-010","s":"por","y":2021,"c":"86","n":10,"a":"B","an":false,"du":false,"l":"","e":"A lição da história é que a humanidade conseguiu interromper as espirais de violência através do perdão. (...)\n(Thomaz Favaro, adaptado)\nA oração substantiva destacada classifica-se em","o":{"A":"subjetiva.","B":"predicativa.","C":"objetiva direta.","D":"completiva nominal."},"t":"Sintaxe","tp":"Período composto e orações","src":"EAGS_2021_codigo_86_SAD.pdf · p. 4","esp":"Administração"},{"id":"EAGS2021-C86-PT-011","s":"por","y":2021,"c":"86","n":11,"a":"D","an":false,"du":false,"l":"","e":"Marque a alternativa em que um dos termos destacados não é adjunto adnominal.","o":{"A":"A tecnologia facilita nossa vida e carreira profissional.","B":"No capítulo sexto, morre o personagem sem escrúpulos.","C":"Em apartamentos de fundos, a vista são as janelas ao redor.","D":"Na cidade de Manaus, o clima quente às vezes castiga a população."},"t":"Sintaxe","tp":"Termos da oração: complementos e adjuntos","src":"EAGS_2021_codigo_86_SAD.pdf · p. 4","esp":"Administração"},{"id":"EAGS2021-C86-PT-012","s":"por","y":2021,"c":"86","n":12,"a":"D","an":false,"du":false,"l":"","e":"Assinale a alternativa que apresenta em destaque oração coordenada explicativa.","o":{"A":"“Gato que brincas na rua/ Como se fosse na cama,/ Invejo a sorte que é tua/ Porque nem sorte se chama.” (Fernando\nPessoa)","B":"“Fui por ali dentro, sem arder, porque as almas são incombustíveis.” (Machado de Assis)","C":"“Ema experimentava uma sensação de vingança. Pois não sofrera já bastante? (Gustave Flaubert)","D":"“— A bênção não senhor, que eu nunca mais lhe tomo a bênção.” (Rachel de Queiroz)"},"t":"Sintaxe","tp":"Período composto e orações","src":"EAGS_2021_codigo_86_SAD.pdf · p. 4","esp":"Administração"},{"id":"EAGS2021-C86-PT-013","s":"por","y":2021,"c":"86","n":13,"a":"A","an":false,"du":false,"l":"","e":"Assinale a alternativa em que a palavra destacada forma-se por derivação imprópria.","o":{"A":"O tilintar das moedas em seu bolso incomodava-o. Um judas!\nAssim seria tratado.","B":"Estava inquieto. Pensava nos afagos que receberia de sua namorada tão logo terminasse o dia.","C":"Andava a pensar por onde diabo estaria o Zé, que não aparecera no botequim uma única vezinha na semana.","D":"Enfim o perfume (e a ilusão)! Como trabalhara para poder ter em sua pele as gotinhas que lhe fariam ser notada e cortejada!"},"t":"Formação de palavras","tp":"Estrutura e formação de palavras","src":"EAGS_2021_codigo_86_SAD.pdf · p. 4","esp":"Administração"},{"id":"EAGS2021-C86-PT-014","s":"por","y":2021,"c":"86","n":14,"a":"C","an":false,"du":false,"l":"","e":"Assinale a alternativa que contém a correta classificação das orações destacadas em Enviados os sinais a um computador, foi permitido a ele controlar cursos em uma tela, abrir e-mail, jogar videogame e comandar um braço robótico.","o":{"A":"coordenadas assindéticas","B":"subordinadas adverbiais de finalidade","C":"subordinadas substantivas subjetivas reduzidas de infinitivo","D":"subordinadas substantivas objetivas diretas reduzidas de infinitivo"},"t":"Sintaxe","tp":"Período composto e orações","src":"EAGS_2021_codigo_86_SAD.pdf · p. 4","esp":"Administração"},{"id":"EAGS2021-C86-PT-015","s":"por","y":2021,"c":"86","n":15,"a":"C","an":false,"du":false,"l":"","e":"Assinale a alternativa em que há erro na classificação da voz verbal em destaque.","o":{"A":"“A Rua Sampson se move inteira na direção das fábricas.”\n(reflexiva) Patrícia Galvão","B":"“A pobre cidade de São Luís do Maranhão parecia entorpecida pelo calor. Quase não se podia sair à rua.” (passiva sintética)\nAluísio Azevedo","C":"“Desde dez dias que se entregava a essa árdua tarefa, quando\n(era domingo) lhe bateram à porta, em meio de seu trabalho.”\n(passiva sintética) Lima Barreto","D":"“Andava sem rumo certo, de um pouso para o outro, indiferente à vida e aos perigos, alimentando-se mal e ocasionalmente\n(...).” (reflexiva) Euclides da Cunha"},"t":"Verbos","tp":"Tempos, modos e formas verbais","src":"EAGS_2021_codigo_86_SAD.pdf · p. 4","esp":"Administração"},{"id":"EAGS2021-C86-PT-016","s":"por","y":2021,"c":"86","n":16,"a":"A","an":false,"du":false,"l":"","e":"Em qual alternativa destacou-se o complemento nominal?","o":{"A":"“Dentro de poucos dias achou-se Leonardo instalado no seu posto, muito cheio e contente de si.” (Manuel Antonio de\nAlmeida)","B":"“A casinha, defronte de Coimbra, cercada de árvores, flores e aves.” (Camilo Castelo Branco)","C":"“A chuva de junho cai sobre eles, encharcando as roupas, fazendo-os tremer.” (Jorge Amado)","D":"“Vou-me embora pra Pasárgada / Lá sou amigo do rei.”\n(Manuel Bandeira)"},"t":"Sintaxe","tp":"Termos da oração: complementos e adjuntos","src":"EAGS_2021_codigo_86_SAD.pdf · p. 5","esp":"Administração"},{"id":"EAGS2021-C86-PT-017","s":"por","y":2021,"c":"86","n":17,"a":"C","an":false,"du":false,"l":"","e":"Assinale a alternativa em que a classificação do advérbio da frase seguinte está incorreta:\nNão (1) digo que ficou em paz (2) com os meninos, porque o nosso Inácio não era propriamente (3) um menino. Tinha quinze anos feitos e bem (4) feitos. (Machado de Assis)","o":{"A":"(1) negação","B":"(2) modo","C":"(3) dúvida","D":"(4) intensidade"},"t":"Classes de palavras","tp":"Substantivo, adjetivo, advérbio e demais classes","src":"EAGS_2021_codigo_86_SAD.pdf · p. 5","esp":"Administração"},{"id":"EAGS2021-C86-PT-018","s":"por","y":2021,"c":"86","n":18,"a":"B","an":false,"du":false,"l":"","e":"Coloque (PN) para predicado nominal, (PV) para verbal e\n(PVN) para verbo-nominal. Em seguida, assinale a alternativa com a sequência correta.\n(    ) Apareceu ontem na fazenda um cavaleiro errante.\n(    ) O quarto abrigava segredos e doces recordações.\n(    ) O homem assistiu à própria saga desolado.\n(    ) Os irmãos ficaram admirados com a semelhança entre eles.","o":{"A":"PN – PVN – PV – PV","B":"PV – PV – PVN – PN","C":"PV – PN – PVN – PN","D":"PV – PN – PV – PVN"},"t":"Sintaxe","tp":"Termos da oração: sujeito e predicado","src":"EAGS_2021_codigo_86_SAD.pdf · p. 5","esp":"Administração"},{"id":"EAGS2021-C86-PT-019","s":"por","y":2021,"c":"86","n":19,"a":"B","an":false,"du":false,"l":"","e":"Assinale a alternativa que traz a regra ortográfica pertinente ao termo em destaque no seguinte trecho: O som da sanfona e os mexidos dos corpos a dançar nem de longe davam sinal de cansaço.","o":{"A":"A letra x é usada em palavras de origem exótica.","B":"A letra x está correta em palavras que apresentam o grupo inicial me.","C":"A letra x faz-se presente em palavras de origem indígena, africana ou aportuguesadas do inglês.","D":"A letra x determina a homonímia com mexido(s) (particípio passado)."},"t":"Verbos","tp":"Tempos, modos e formas verbais","src":"EAGS_2021_codigo_86_SAD.pdf · p. 5","esp":"Administração"},{"id":"EAGS2021-C86-PT-020","s":"por","y":2021,"c":"86","n":20,"a":"C","an":false,"du":false,"l":"","e":"Assinale a alternativa em que o contexto determina a necessidade de acentuação gráfica de um de seus termos.","o":{"A":"Não encontrava forma de dizer a ele que seu coração havia secado.","B":"Saiu feliz a comprar conjuntos de formas para os muitos bolos que desejava confeccionar.","C":"Hoje ele pode descansar dos dias de medo e aflição que descaradamente lhe invadem a alma.","D":"De repente ele para e fica a olhar para tudo e para o nada meio embevecido — coisa de gente enamorada."},"t":"Ortografia e acentuação","tp":"Acentuação gráfica e encontros vocálicos","src":"EAGS_2021_codigo_86_SAD.pdf · p. 5","esp":"Administração"},{"id":"EAGS2021-C86-PT-021","s":"por","y":2021,"c":"86","n":21,"a":"C","an":false,"du":false,"l":"","e":"Complete as lacunas considerando a regência nominal, e assinale a alternativa com a sequência correta.\nAlheio _____ qualquer comentário, o estudante permaneceu atencioso ______ seus estudos e coerente _____ seus valores.","o":{"A":"de – para com – de","B":"com – para com – a","C":"a – com – com","D":"a – de – com"},"t":"Regência","tp":"Regência verbal e nominal","src":"EAGS_2021_codigo_86_SAD.pdf · p. 5","esp":"Administração"},{"id":"EAGS2021-C86-PT-022","s":"por","y":2021,"c":"86","n":22,"a":"A","an":false,"du":false,"l":"","e":"Assinale a alternativa em que o verbo destacado é regular.","o":{"A":"Esperou que a música tocasse e que todos se deleitassem com sua beleza.","B":"Os rojões incendiavam o céu com luzes coloridas na famosa festa de São João.","C":"Eu me divirto muito olhando as crianças que brincam no parque do meu condomínio.","D":"As torcidas colorem o estádio, exibindo, com orgulho e paixão, as cores de seus times."},"t":"Verbos","tp":"Tempos, modos e formas verbais","src":"EAGS_2021_codigo_86_SAD.pdf · p. 5","esp":"Administração"},{"id":"EAGS2021-C86-PT-023","s":"por","y":2021,"c":"86","n":23,"a":"B","an":false,"du":false,"l":"","e":"Marque a alternativa em que o adjetivo está no grau comparativo de superioridade.","o":{"A":"No banquete, as frutas pareciam tão saborosas quanto as hortaliças.","B":"A lembrança de Aureliano foi mais imposta do que desejada.","C":"Ambas eram amicíssimas do proprietário do casarão.","D":"A viúva ficou excessivamente triste com o episódio."},"t":"Classes de palavras","tp":"Substantivo, adjetivo, advérbio e demais classes","src":"EAGS_2021_codigo_86_SAD.pdf · p. 5","esp":"Administração"},{"id":"EAGS2021-C86-PT-024","s":"por","y":2021,"c":"86","n":24,"a":"A","an":false,"du":false,"l":"","e":"Leia: O homem deixou a sala cabisbaixo, envergonhado, exsudado, como se sobre ele houvesse um sol de 40 graus. As consoantes destacadas na palavra acima pertencem a sílabas distintas pela mesma razão das consoantes destacadas em:","o":{"A":"“Tem tantas belezas, tantas,/ A minha terra natal,/ Que nem as sonha um poeta/ E nem as canta um mortal!” (Casimiro de\nAbreu)","B":"A garota olhava com convicção para o pai a informar-lhe, desse modo, que não desistia de seu pedido.","C":"“Ocupado como sempre estava com os obséquios, o rei demorava a resposta (...).” (José Saramago)","D":"Em êxtase, as cerejeiras oferecem aos olhos o espetáculo de uma florada."},"t":"Ortografia e acentuação","tp":"Acentuação gráfica e encontros vocálicos","src":"EAGS_2021_codigo_86_SAD.pdf · p. 5","esp":"Administração"},{"id":"EAGS2021-C86-PT-025","s":"por","y":2021,"c":"86","n":25,"a":"D","an":false,"du":false,"l":"","e":"Leia:\nMulher Tupperware - s.f. A que tem orgulho de ser mulher.\nQue é ousada e audaciosa. Contemporânea. Vencedora. Que tem objetivos de vida e luta por eles. Sintonizada com seu tempo. Que rejeita imitações. Que aprecia o belo e o poético! (Da sabedoria popular) Revista Veja, 5 mar, 1997\nEm relação à expressão em destaque no texto publicitário acima, observa-se a presença da seguinte figura de linguagem:","o":{"A":"prosopopeia","B":"metonímia","C":"hipérbole","D":"metáfora"},"t":"Semântica e estilística","tp":"Sentido, relações semânticas e figuras de linguagem","src":"EAGS_2021_codigo_86_SAD.pdf · p. 5","vr":1,"esp":"Administração"},{"id":"EAGS2021-C86-PT-026","s":"por","y":2021,"c":"86","n":26,"a":"D","an":false,"du":false,"l":"","e":"Assinale a alternativa em que o termo em destaque classifica-se como vocativo.","o":{"A":"“Amor, que vence os tigres, por empresa/ Tomou logo render-\nme; ele declara/ Contra meu coração guerra tão rara/ Que não\nme foi bastante a fortaleza.” (Cláudio M. da Costa)","B":"“Talvez espante ao leitor a franqueza com que lhe exponho e\nrealço a minha mediocridade; advirto que a franqueza é a\nprimeira virtude de um defunto.” (M. Assis)","C":"“Iracema, a virgem dos lábios de mel, que tinha os cabelos mais negros que a asa da graúna, e mais longos que seu talhe de palmeira.” (José de Alencar)","D":"“Lingua que me cativas, que me enleias/ (...)/ Amo-te (...)/ pelas frases mudas que proferes/ nos silêncios de Amor!” (C.\nMachado)"},"t":"Sintaxe","tp":"Termos da oração: complementos e adjuntos","src":"EAGS_2021_codigo_86_SAD.pdf · p. 6","esp":"Administração"},{"id":"EAGS2021-C86-PT-027","s":"por","y":2021,"c":"86","n":27,"a":"C","an":false,"du":false,"l":"","e":"Em ...tudo indicava uma atitude de arrogância adolescente, talvez até infantil — menos arrogância que pirraça. (Paulo\nHenrique Britto), a conjunção em destaque classifica-se como subordinada","o":{"A":"integrante.","B":"concessiva.","C":"comparativa.","D":"proporcional."},"t":"Sintaxe","tp":"Período composto e orações","src":"EAGS_2021_codigo_86_SAD.pdf · p. 6","esp":"Administração"},{"id":"EAGS2021-C86-PT-028","s":"por","y":2021,"c":"86","n":28,"a":"B","an":false,"du":false,"l":"","e":"Qual alternativa apresenta um substantivo coletivo?","o":{"A":"“A vida da gente nunca tem termo real.” (Guimarães Rosa)","B":"“Eu, Marília, não sou algum vaqueiro, / que viva de guardar alheio gado.” (Tomás Antônio Gonzaga)","C":"“Todos os jardins deviam ser fechados, / com altos muros de um cinza muito pálido.” (Mário Quintana)","D":"“Certa raposa esfaimada encontrou uma parreira carregadinha\n(...), coisa de fazer vir água à boca.” (Monteiro Lobato)"},"t":"Classes de palavras","tp":"Substantivo, adjetivo, advérbio e demais classes","src":"EAGS_2021_codigo_86_SAD.pdf · p. 6","esp":"Administração"},{"id":"EAGS2021-C86-PT-029","s":"por","y":2021,"c":"86","n":29,"a":"A","an":false,"du":false,"l":"","e":"Assinale a alternativa que apresenta adjunto adverbial.","o":{"A":"Desceu do telhado — seu esconderijo usual — e pisou com força a grama.","B":"Acordou tranquila e satisfeita, e seu dia foi uma festa.","C":"Realizou a defesa daquele pobre homem sem família.","D":"O incêndio causou desordem e pânico."},"t":"Sintaxe","tp":"Termos da oração: complementos e adjuntos","src":"EAGS_2021_codigo_86_SAD.pdf · p. 6","esp":"Administração"},{"id":"EAGS2021-C86-PT-030","s":"por","y":2021,"c":"86","n":30,"a":"B","an":false,"du":false,"l":"","e":"Relacione as colunas quanto à conjugação do verbo ir no indicativo. Em seguida, assinale a alternativa com a sequência correta.\n1 – ia\n(    ) Depois do jogo, ___ a uma boate magnífica.\n(pretérito perfeito)\n2 – foi\n(    ) Às vezes, o menino ___ sozinho para casa.\n(pretérito imperfeito)\n3 – iria\n(    ) O mesmo rio ___ despoluído três anos atrás.\n(pretérito mais que perfeito)\n4 – fora\n(    ) ___ pelo caminho mais difícil?\n(futuro do pretérito)","o":{"A":"1 – 2 – 3 – 4","B":"2 – 1 – 4 – 3","C":"4 – 3 – 1 – 2","D":"2 – 1 – 3 – 4"},"t":"Verbos","tp":"Tempos, modos e formas verbais","src":"EAGS_2021_codigo_86_SAD.pdf · p. 6","esp":"Administração"},{"id":"EAGS2021-C86-PT-031","s":"por","y":2021,"c":"86","n":31,"a":"B","an":false,"du":false,"l":"","e":"Assinale a alternativa em que o termo destacado não é agente da passiva.","o":{"A":"A vingança é impulsionada por muitas etapas.","B":"Inúmeras mães sacrificam suas vidas pelos seus filhos.","C":"A realização de exames é muitas vezes prejudicada pela ansiedade.","D":"Dois experimentos foram realizados pelos pesquisadores universitários."},"t":"Sintaxe","tp":"Termos da oração: complementos e adjuntos","src":"EAGS_2021_codigo_86_SAD.pdf · p. 6","esp":"Administração"},{"id":"EAGS2021-C86-PT-032","s":"por","y":2021,"c":"86","n":32,"a":"B","an":false,"du":false,"l":"","e":"Observando a concordância, assinale a alternativa que traz a correta disposição dos termos que completam as lacunas do texto abaixo:\nNovamente, no país, as secretarias de saúde ______ , _____ e o Ministério da Saúde mobilizam-se para a vacinação contra a gripe influenza. Haverá _______________, a fim de que\n__________ a campanha e o seu resultado.","o":{"A":"municipal - estadual - bastante profissionais envolvidos - seja vitoriosa","B":"municipais - estaduais - bastantes profissionais envolvidos - seja vitoriosa","C":"municipais - estaduais - bastante profissionais envolvidos;\nsejam vitoriosos","D":"municipal - estadual - bastante profissional envolvido - sejam vitoriosos"},"t":"Concordância","tp":"Concordância verbal e nominal","src":"EAGS_2021_codigo_86_SAD.pdf · p. 6","esp":"Administração"},{"id":"EAGS2021-C86-PT-033","s":"por","y":2021,"c":"86","n":33,"a":"A","an":false,"du":false,"l":"","e":"Assinale a alternativa que apresenta sujeito composto.","o":{"A":"“Mui grande é o vosso amor e o meu delito (...).” (Gregório de\nMatos)","B":"“Senhora, doei-vos de mim e lembrai-vos do que me prometestes.” (João de Barros)","C":"“Ela foi descendo até o portão, onde passava um bonde em que entrou e partiu.” (Machado de Assis)","D":"“Houve um momento de silêncio:\ntodos os rostos\nempalideceram;\ntodos os lábios calaram.”\n(Alexandre\nHerculano)"},"t":"Sintaxe","tp":"Termos da oração: sujeito e predicado","src":"EAGS_2021_codigo_86_SAD.pdf · p. 6","esp":"Administração"},{"id":"EAGS2021-C86-PT-034","s":"por","y":2021,"c":"86","n":34,"a":"C","an":false,"du":false,"l":"","e":"Leia:\nCuriosa palavra. Idoso. O que acumulou idade. Também tem o sentido de quem se apega à idade. Ou que a esbanja (como gostoso ou dengoso). Se é que não significa alguém que está indo, alguém em processo de ida. Em constraste com os que ficam, os ficosos... (Luís Fernando Veríssimo)\nO texto acima define o vocábulo idoso com liberdade expressiva do autor. Ao ser reescrito, observando-se as regras de pontuação, algumas opções são possíveis. Assinale a alternativa em que a pontuação não atende às normas gramaticais.","o":{"A":"Curiosa palavra: idoso, o que acumulou idade. Também tem o sentido de quem se apega à idade, ou que a esbanja (como gostoso ou dengoso), se é que não significa alguém que está indo, alguém em processo de ida, em contraste com os que ficam, os ficosos...","B":"Curiosa palavra: idoso, o que acumulou idade; também tem o\nsentido de quem se apega à idade, ou que a esbanja — como gostoso ou dengoso —, se é que não significa alguém que está indo, alguém em  processo de ida, em contraste com os que ficam, os ficosos...","C":"Curiosa palavra (idoso): o que acumulou idade, também tem o sentido de quem se apega à idade ou que a esbanja (como\ngostoso ou dengoso); se é que não significa alguém que está\nindo; alguém em  processo de ida, em contraste com os que\nficam: os ficosos.","D":"Curiosa palavra — idoso: o que acumulou idade. Também tem o sentido de quem se apega à idade ou que a esbanja (como gostoso ou dengoso). Se é que não significa alguém que está indo, alguém em processo de ida, em constraste com os que ficam (os ficosos!)."},"t":"Pontuação","tp":"Sinais de pontuação","src":"EAGS_2021_codigo_86_SAD.pdf · p. 6","esp":"Administração"},{"id":"EAGS2021-C86-PT-035","s":"por","y":2021,"c":"86","n":35,"a":"","an":true,"du":false,"l":"","e":"Em qual alternativa a concordância do verbo em destaque está incorreta?","o":{"A":"Murmurou a ela que um ou outro relógio lhe ficavam muito bem.","B":"A maior parte das palavras continuariam incompreensíveis para ela.","C":"Algumas verdades que devem ser reveladas não adiantam esconder.","D":"O voluntário, com seu colega de serviço, realizou um projeto de cidadania no bairro."},"t":"Concordância","tp":"Concordância verbal e nominal","src":"EAGS_2021_codigo_86_SAD.pdf · p. 7","esp":"Administração"},{"id":"EAGS2021-C86-PT-036","s":"por","y":2021,"c":"86","n":36,"a":"D","an":false,"du":false,"l":"","e":"Em qual alternativa há erro no emprego do pronome pessoal?","o":{"A":"Foi difícil escolher entre mim e te fazer feliz.","B":"A minha mãe, nunca a vi desanimada com a vida.","C":"Ela fez-me sentar a contragosto naquele ambiente hostil.","D":"Terminou o namoro entre eu e ela por mensagem via celular!"},"t":"Pronomes","tp":"Emprego e classificação dos pronomes","src":"EAGS_2021_codigo_86_SAD.pdf · p. 7","esp":"Administração"},{"id":"EAGS2021-C86-PT-037","s":"por","y":2021,"c":"86","n":37,"a":"D","an":false,"du":false,"l":"","e":"Observe as orações subordinadas adverbiais em destaque:\nA escuridão era tão viscosa, que se eu estendesse a mão, poderia senti-la amoitada como um bicho por entre os degraus. (Lygia\nFagundes Telles)\nAssinale a alternativa que apresenta classificação ausente no período.","o":{"A":"consecutiva","B":"condicional","C":"comparativa","D":"conformativa"},"t":"Sintaxe","tp":"Período composto e orações","src":"EAGS_2021_codigo_86_SAD.pdf · p. 7","esp":"Administração"},{"id":"EAGS2021-C86-PT-038","s":"por","y":2021,"c":"86","n":38,"a":"B","an":false,"du":false,"l":"","e":"Observando a possível mudança de regência verbal, assinale a alternativa em que o significado do verbo lembrar mantém-se como no exemplo abaixo:\nFélix despediu-se de Meneses e seguiu para as Laranjeiras.\nIa palpitante e receoso; pela primeira vez lembrou a doença da\nviúva. Temeu que fosse tarde. (Machado de Assis)","o":{"A":"Se encontrares Madalena, lembra-nos a ela, dá-lhe um grande beijo.","B":"Andando pelas ruas, lembrou-se do presente prometido ao sobrinho.","C":"O aroma das amoras lembrou-lhe o perfume adocicado e suave de seu primeiro amor.","D":"O baladar dos sinos lembrou-a de que devia estar bem longe dali havia mais de uma hora."},"t":"Verbos","tp":"Tempos, modos e formas verbais","src":"EAGS_2021_codigo_86_SAD.pdf · p. 7","esp":"Administração"},{"id":"EAGS2021-C86-PT-039","s":"por","y":2021,"c":"86","n":39,"a":"D","an":false,"du":false,"l":"","e":"Marque a alternativa em que há conjunção coordenativa adversativa.","o":{"A":"“O pirralho não se mexeu, e Fabiano desejou matá-lo.”\n(Graciliano Ramos)","B":"“Namoro à moda velha, já se vê, pois que nesse tempo não existia a gostosura dos cinemas.” (Monteiro Lobato)","C":"“Por fim, no porém, passados anos, foi tempo de missão, e chegaram no arraial os missionários.” (Guimarães Rosa)","D":"“Ele não exigira dos filhos devoção à lavoura, / porém nenhum deixara de seguir a fatalidade pela terra.” (Nélida Piñon)"},"t":"Sintaxe","tp":"Período composto e orações","src":"EAGS_2021_codigo_86_SAD.pdf · p. 7","esp":"Administração"},{"id":"EAGS2021-C86-PT-040","s":"por","y":2021,"c":"86","n":40,"a":"B","an":false,"du":false,"l":"","e":"Assinale a alternativa em que os versos apresentados contêm discurso direto.","o":{"A":"“São casas simples/ Com cadeiras nas calçadas/ E na fachada/\nEscrito em cima que é um lar” (Vinícius de Moraes)","B":"“Perdoem a cara amarrada/ Perdoem a falta de abraço/ Perdoem a falta de escolha / Os dias eram assim” (Ivan Lins e Vítor\nMartins)","C":"“Eu preparo uma canção/ em que minha mãe se reconheça,/ todas as mães se reconheçam,/ e que fale com os dois olhos.”\n(Carlos D. de Andrade)","D":"“Dizem que finjo ou minto/ Tudo que escrevo. Não/ Eu simplesmente sinto/ Com a imaginação./ Não com o coração.”\n(Fernando Pessoa)"},"t":"Coesão e discurso","tp":"Discurso direto e indireto","src":"EAGS_2021_codigo_86_SAD.pdf · p. 7","esp":"Administração"},{"id":"EAGS2022-C27-PT-001","s":"por","y":2022,"c":"27","n":1,"a":"A","an":false,"du":false,"l":"","e":"A expressão “pulo do gato” no título faz referência a quê?","o":{"A":"Ao uso correto de palavras que só a experiência porporciona.","B":"À diferenciação entre jornalismo e psicologia.","C":"À distinção entre razão e emoção.","D":"Ao uso de adjetivos."},"t":"Classes de palavras","tp":"Substantivo, adjetivo, advérbio e demais classes","src":"EAGS_2022_codigo_27_SIN.pdf · p. 3","sp":5},{"id":"EAGS2022-C27-PT-002","s":"por","y":2022,"c":"27","n":2,"a":"B","an":false,"du":false,"l":"","e":"No terceiro parágrafo, o autor narra um episódio fictício.\nPode-se depreender que sua intenção, com isso, é","o":{"A":"denunciar crimes bárbaros que acontecem sem que a população saiba.","B":"mostrar que não é necessário usar adjetivos para emocionar.","C":"exemplificar o pulo do gato, numa referência ao título.","D":"mostrar que um texto pode ser racional e frio."},"t":"Classes de palavras","tp":"Substantivo, adjetivo, advérbio e demais classes","src":"EAGS_2022_codigo_27_SIN.pdf · p. 3","sp":5},{"id":"EAGS2022-C27-PT-003","s":"por","y":2022,"c":"27","n":3,"a":"D","an":false,"du":false,"l":"","e":"O autor do texto afirma que jornalismo é equilíbrio entre razão e emoção — o que resulta no chamado “pulo do gato”. Essa ideia equivale a dizer que","o":{"A":"a redação de uma frase despida e cortante nada tem que ver com estilo e com capacidade de articulação linguística.","B":"o texto jornalístico não pode ser feito sem uso de linguagem literária, que possibilita muitos usos para além da adjetivação.","C":"tudo tem de ser usado no texto com parcimônia: a sociologia, a literariedade e a objetividade, principalmente em se tratando de reportagem.","D":"o uso consciente e racional do recurso linguístico é o que pode\nestar no texto jornalístico em si; a emoção esperada segue\nimplícita, como jogo entre escritor e leitor."},"t":"Interpretação de texto","tp":"Compreensão, inferência e finalidade textual","src":"EAGS_2022_codigo_27_SIN.pdf · p. 3","sp":5},{"id":"EAGS2022-C27-PT-004","s":"por","y":2022,"c":"27","n":4,"a":"D","an":false,"du":false,"l":"","e":"Considerando as manchetes fictícias apresentadas abaixo, sobre a pandemia de 2020, assinale aquela que está de acordo com o que o texto defende.","o":{"A":"Desleixadas campanhas não conseguiram conter a pandemia.","B":"A irremediável Covid-19 afetou grande parte da população.","C":"O brilhante caso das pessoas que se recuperaram.","D":"Governo propõe retomada das atividades."},"t":"Interpretação de texto","tp":"Inferência e identificação da tese defendida no texto","src":"EAGS_2022_codigo_27_SIN.pdf · p. 3","sp":5},{"id":"EAGS2022-C27-PT-005","s":"por","y":2022,"c":"27","n":5,"a":"B","an":false,"du":false,"l":"","e":"Assinale a alternativa que contém locução adverbial.","o":{"A":"As vezes em que ele fez os exercícios de halteres foram proveitosas.","B":"Precisou olhar de perto tudo que estava acontecendo.","C":"As autoridades fizeram elogios à noite da festa.","D":"À medida que ele falava, ia ficando aliviado."},"t":"Classes de palavras","tp":"Substantivo, adjetivo, advérbio e demais classes","src":"EAGS_2022_codigo_27_SIN.pdf · p. 3"},{"id":"EAGS2022-C27-PT-006","s":"por","y":2022,"c":"27","n":6,"a":"D","an":false,"du":false,"l":"","e":"Ocorreu-lhe desde logo que ao americano poderia parecer estranha tal amizade. (Fernando Sabino)\nA oração subordinada substantiva presente na frase acima classifica-se como","o":{"A":"objetiva indireta.","B":"objetiva direta.","C":"predicativa.","D":"subjetiva."},"t":"Sintaxe","tp":"Período composto e orações","src":"EAGS_2022_codigo_27_SIN.pdf · p. 3"},{"id":"EAGS2022-C27-PT-007","s":"por","y":2022,"c":"27","n":7,"a":"D","an":false,"du":false,"l":"","e":"Apenas uma das alternativas abaixo apresenta uma forma de concordância nominal para a qual não há outra possibilidade de concordância. Assinale-a.","o":{"A":"Era a casa dos sonhos! Apresentava tamanho e localização perfeita!","B":"São maravilhosos a ternura e o perdão. Ambos mostram que belo pode ser o homem.","C":"O passeio tão esperado contaria apenas com alunos da segunda e terceira série do Ensino Médio.","D":"Os Sertões e Memórias Póstumas de Brás Cubas são, respectivamente, obras-primas dos gigantes Guimarães Rosa e\nMachado de Assis."},"t":"Concordância","tp":"Concordância verbal e nominal","src":"EAGS_2022_codigo_27_SIN.pdf · p. 3"},{"id":"EAGS2022-C27-PT-008","s":"por","y":2022,"c":"27","n":8,"a":"D","an":false,"du":false,"l":"","e":"Um rei fraco faz fraca a forte gente! Essa verdade sempre esteve clara na mente do soberado Plínio, por isso ele fazia tudo em defesa de seu povo.\nO texto acima contém três predicados, cada qual centrado em um verbo. Esses predicados classificam-se, respectivamente, como","o":{"A":"verbal, nominal e verbo-nominal.","B":"verbo-nominal, verbal e nominal.","C":"nominal, verbo-nominal e verbal.","D":"verbo-nominal, nominal e verbal."},"t":"Verbos","tp":"Tempos, modos e formas verbais","src":"EAGS_2022_codigo_27_SIN.pdf · p. 3"},{"id":"EAGS2022-C27-PT-009","s":"por","y":2022,"c":"27","n":9,"a":"A","an":false,"du":false,"l":"","e":"Assinale a alternativa em que todos os termos destacados classificam-se como sujeito.","o":{"A":"“Por onde passava ficava um fermento de desassossego, os homens não reconheciam suas mulheres que subitamente se punham a olhar para eles, com pena de que não tivessem desaparecido.” (José Saramago)","B":"“O episódio da metrópole apavorada pela penumbra descreve bem a má reputação que as sombras carregam.”\n(Superinteressante, SP: Abril, jun. 2009)","C":"“As rosas desabrocharam/ Com a luz do sol/ E a beleza das mulheres/ Com o creme Rugol.” (antigo texto publicitário)","D":"“Olha, Marília, as flautas dos pastores/ Que bom que soam, como estão cadentes!/ Olha o Tejo a sorrir-se!” (Bocage)"},"t":"Sintaxe","tp":"Termos da oração: sujeito e predicado","src":"EAGS_2022_codigo_27_SIN.pdf · p. 3"},{"id":"EAGS2022-C27-PT-010","s":"por","y":2022,"c":"27","n":10,"a":"C","an":false,"du":false,"l":"","e":"Leia:\nSe eu convencesse Madalena de que ela não tem razão... Se eu lhe explicasse que é necessário vivermos em paz... Não me entende. Não nos entendemos. O que vai acontecer será muito diferente do que esperamos. (Graciliano Ramos)\nSe, no texto acima, fossem colocadas conjunções ou locuções conjuntivas coordenativas entre os períodos, a sequência correta seria a presente em qual alternativa?","o":{"A":"e - ora - ora - conquanto","B":"ou - mas - mas - não obstante","C":"e - contudo - e - por conseguinte","D":"ou - porquanto - nem - de sorte que"},"t":"Sintaxe","tp":"Período composto e orações","src":"EAGS_2022_codigo_27_SIN.pdf · p. 4"},{"id":"EAGS2022-C27-PT-011","s":"por","y":2022,"c":"27","n":11,"a":"D","an":false,"du":false,"l":"","e":"Considerando a flexão dos verbos, assinale a alternativa correta.","o":{"A":"Edgar se entreteu diante daquela cena.","B":"Tudo dará certo, se você manter a boca fechada.","C":"Ele só poderá fazer a prova depois que repor as aulas.","D":"Assim que interpuséssemos recurso, as providências seriam tomadas."},"t":"Verbos","tp":"Tempos, modos e formas verbais","src":"EAGS_2022_codigo_27_SIN.pdf · p. 4"},{"id":"EAGS2022-C27-PT-012","s":"por","y":2022,"c":"27","n":12,"a":"A","an":false,"du":false,"l":"","e":"Assinale a alternativa que completa os espaços da frase abaixo.\nSe ele estivesse fazendo alguma coisa errada, não estaria agindo ___ claras, ___ luz da percepção alheia, e sim no sótão do comportamento, vendo sem ser visto, que é assim que agem os dissimulados, sempre insensíveis ___ dor do próximo e jamais face ___ face com a verdade.","o":{"A":"às - à - à - a","B":"as - a - à - a","C":"às - a - a - à","D":"as - à - a - à"},"t":"Crase","tp":"Emprego de crase em expressões e locuções","src":"EAGS_2022_codigo_27_SIN.pdf · p. 4"},{"id":"EAGS2022-C27-PT-013","s":"por","y":2022,"c":"27","n":13,"a":"C","an":false,"du":false,"l":"","e":"Assinale a alternativa em que todos os verbos são irregulares.","o":{"A":"repartir - passear - construir","B":"lutar - averiguar - conferir","C":"frear - conseguir - dormir","D":"colocar - pedir - ouvir"},"t":"Verbos","tp":"Tempos, modos e formas verbais","src":"EAGS_2022_codigo_27_SIN.pdf · p. 4"},{"id":"EAGS2022-C27-PT-014","s":"por","y":2022,"c":"27","n":14,"a":"B","an":false,"du":false,"l":"","e":"Assinale a alternativa que preenche correta e respectivamente as lacunas das frases abaixo.\nI- O olhar e o sorriso faceiro deixaram(-) ___ atordoado.\nII- “... nunca os que a amaram e sugaram(-) ___ o leite, tiveram sossego no seu colo.” (Lima Barreto).\nIII- “Tanto tenho falado, tanto tenho escrito. (...) Imprudente ofício é ___, de viver em voz alta” (Rubem Braga).\nIV- “E nesta maneira, Senhor, dou aqui a ___ Alteza conta do que nesta terra vi.” (Carta de Pero Vaz de Caminha a El-Rei D.\nManuel).","o":{"A":"a mim - te - esse - Sua","B":"no - lhe - este - Vossa","C":"me - lhe - esse - Vossa","D":"ele - a ela - este - Sua"},"t":"Pronomes","tp":"Emprego de pronomes pessoais e de tratamento","src":"EAGS_2022_codigo_27_SIN.pdf · p. 4"},{"id":"EAGS2022-C27-PT-015","s":"por","y":2022,"c":"27","n":15,"a":"B","an":false,"du":false,"l":"","e":"Apenas uma das frases abaixo está com a concordância verbal correta. Assinale-a.","o":{"A":"Talvez houvessem motivos justos para sua atitude.","B":"Foi encontrado um livro, dois cadernos e um estojo no pátio da escola.","C":"Dois átomos de hidrogênio e um de oxigênio compõe a molécula da água.","D":"Vai restar, até a semana que vem, apenas alguns poucos exemplares deste livro."},"t":"Concordância","tp":"Concordância verbal e nominal","src":"EAGS_2022_codigo_27_SIN.pdf · p. 4"},{"id":"EAGS2022-C27-PT-016","s":"por","y":2022,"c":"27","n":16,"a":"B","an":false,"du":false,"l":"","e":"Atentando para a regência dos verbos das orações adjetivas, assinale a alternativa cuja lacuna não deve ser preenchida com nenhuma preposição.","o":{"A":"Vestiu a camisa ___ cujo bolso havia uma caneta espiã.","B":"Veja esse recibo! Este é o valor ___ que investi no imóvel.","C":"Aquela era a banca de verduras ___ que ele tirava seu sustento.","D":"Pelo tempo ___ que disponho, não vou conseguir fazer muita coisa."},"t":"Verbos","tp":"Tempos, modos e formas verbais","src":"EAGS_2022_codigo_27_SIN.pdf · p. 4"},{"id":"EAGS2022-C27-PT-017","s":"por","y":2022,"c":"27","n":17,"a":"D","an":false,"du":false,"l":"","e":"Assinale a alternativa que contém a mesma figura de linguagem presente na seguinte frase:\nE viram-se chegar, quase sem intermitência, homens carregados de gigos de champanha, caixas de Porto e Bordéus, barricas de cerveja... (Aluísio Azevedo)","o":{"A":"“...leva no boletim uma galáxia de zeros.” (Carlos D. de\nAndrade)","B":"“E o vento brinca nos bigodes do construtor.” (Carlos D. de\nAndrade)","C":"O Ensino Médio bem ministrado é a porta para alto rendimento universitário.","D":"“Um barulho na rua, logo cedo, fê-lo despertar do seu sono.\nEra o lixo que estava passando.” (Josué Solar)"},"t":"Semântica e estilística","tp":"Sentido, relações semânticas e figuras de linguagem","src":"EAGS_2022_codigo_27_SIN.pdf · p. 4","vr":1},{"id":"EAGS2022-C27-PT-018","s":"por","y":2022,"c":"27","n":18,"a":"A","an":false,"du":false,"l":"","e":"Considere o diálogo abaixo.\n— Será que, depois de tudo que aconteceu, o Zeca vai se atrever a vir aqui.\n— Eu acho que... Não sei... Creio que sim. Se a necessidade for maior que o escrúpulo...\n— Tem gente de todo tipo neste mundo mesmo!\nQuanto à pontuação, quais falas estão corretas?","o":{"A":"A segunda e a terceira.","B":"A primeira e a segunda.","C":"A primeira e a terceira.","D":"Todas."},"t":"Pontuação","tp":"Sinais de pontuação","src":"EAGS_2022_codigo_27_SIN.pdf · p. 4"},{"id":"EAGS2022-C27-PT-019","s":"por","y":2022,"c":"27","n":19,"a":"C","an":false,"du":false,"l":"","e":"O texto abaixo foi reproduzido sem os acentos agudos.\nQuantos desses acentos devem ser colocados para torná-lo correto?\nO olhar da opinião, esse olhar agudo e judicial, perde a\nvirtude logo que pisamos o territorio da morte; não digo que ele\nnão se estenda para ca, e nos não alcance e julgue; mas a nos e\nque não se nos da do exame nem do julgamento. Senhores vivos, não ha nada tão incomensuravel como o desdem dos finados.\n(Machado de Assis)","o":{"A":"6","B":"7","C":"8","D":"9"},"t":"Ortografia e acentuação","tp":"Acentuação gráfica e encontros vocálicos","src":"EAGS_2022_codigo_27_SIN.pdf · p. 4"},{"id":"EAGS2022-C27-PT-020","s":"por","y":2022,"c":"27","n":20,"a":"A","an":false,"du":false,"l":"","e":"Assinale a alternativa que contém vocativo.","o":{"A":"Amariam o mar se prestassem bem atenção ao ruído da vaga, filhos de pescadores.","B":"Os colegas — o equilibrista e o lançador de fogo — sabiam emocionar seus companheiros.","C":"Aeromoça, limitada à burocracia, é como gerânio intimidado a florir dentro  do  armário.","D":"“Cessa o estrondo da cachoeira / (...) Já desperta o mínimo arrepio.” (Carlos D. de Andrade)"},"t":"Sintaxe","tp":"Termos da oração: complementos e adjuntos","src":"EAGS_2022_codigo_27_SIN.pdf · p. 5"},{"id":"EAGS2022-C27-PT-021","s":"por","y":2022,"c":"27","n":21,"a":"C","an":false,"du":false,"l":"","e":"Leia:\nO cérebro é capaz de quase qualquer coisa. Ele consegue parar o tempo, ficar vários dias numa boa sem dormir, ler pensamentos, mover objetos a distância e se reconstruir de acordo com a necessidade. Parecem superpoderes de histórias em quadrinhos, mas são apenas algumas descobertas que os neurocientistas fizeram ao longo da última década.\n(Superinteressante, São Paulo: Abril, ago. 2006)\nColoque V (verdadeiro) ou F (falso) nas sentenças abaixo e, a seguir, assinale a alternativa que traz a sequência correta.\nPode-se afirmar que, no texto acima, há\n(    ) dois períodos compostos apenas por coordenação, com o total de nove orações coordenadas, sendo sete assindéticas e duas sindéticas.\n(    ) um período composto apenas por coordenação, com duas orações assindéticas.\n(    ) um período composto por subordinação, com uma oração principal e seis orações subordinadas objetivas diretas, coordenadas entre si.\n(    ) um período composto apenas por coordenação e outro por coordenação e subordinação, com uma oração subordinada adjetiva restritiva.","o":{"A":"F - V - V - F","B":"V - F - F - F","C":"F - F - V - F","D":"V - V - F - V"},"t":"Sintaxe","tp":"Período composto e orações","src":"EAGS_2022_codigo_27_SIN.pdf · p. 5"},{"id":"EAGS2022-C27-PT-022","s":"por","y":2022,"c":"27","n":22,"a":"B","an":false,"du":false,"l":"","e":"Assinale a alternativa em que o termo negritado tem a mesma classificação sintática do que está destacado na seguinte frase:\nO sistema ortográfico de qualquer língua é comandado por convenções rígidas de caráter uniformizador que tendem a neutralizar as diferenças de pronúncia que envolvem a fala.\n(Platão e Fiorin)","o":{"A":"“Amo-te até nas coisas mais pequenas / Por toda a vida.”\n(Manuel Bandeira)","B":"“O garrafão de pinga, dali a pouco, era levado por um velho perrengue.” (Cornélio Pires)","C":"“...aferindo tudo por esse padrão, procedia em conformidade com ele.” (Alexandre Herculano)","D":"“Durante quinze anos lutou por conservar intacta a independência da terra.” (Alexandre Herculano)"},"t":"Sintaxe","tp":"Termos da oração: complementos e adjuntos","src":"EAGS_2022_codigo_27_SIN.pdf · p. 5","vr":1},{"id":"EAGS2022-C27-PT-023","s":"por","y":2022,"c":"27","n":23,"a":"A","an":false,"du":false,"l":"","e":"Dos termos destacados nas alternativas abaixo, apenas um se classifica como complemento nominal. Assinale-o.","o":{"A":"Desejaria ser-lhe obediente, mas o coração transgride as regras da razão.","B":"“... Não percas tempo em mentir. / Não te aborreças.” (C. D.\nAndrade)","C":"É quase como se a língua falasse através do homem, como se o usasse para se expressar.","D":"“Digam-lhe que estou tristíssimo, mas não posso ir esta noite ao seu encontro.” (V. Moraes)"},"t":"Sintaxe","tp":"Termos da oração: complementos e adjuntos","src":"EAGS_2022_codigo_27_SIN.pdf · p. 5"},{"id":"EAGS2022-C27-PT-024","s":"por","y":2022,"c":"27","n":24,"a":"A","an":false,"du":false,"l":"","e":"Quantas orações subordinadas adverbiais há no texto abaixo?\nAssim que Acácio deixou sua cidade, um drama emocional o invadiu. É certo que ele precisava tomar essa atitude, se quisesse realmente uma vida diferente daquela em que estava. Os últimos acontecimentos tinham chegado a tal ponto que não lhe figurava melhor panorama, mas, conforme os dias se passavam, ele via que não seria fácil viver segregado do grande amor da sua vida. Ah, essas ciladas do coração... Quem as poderá, um dia, explicar?","o":{"A":"4","B":"3","C":"6","D":"5"},"t":"Sintaxe","tp":"Período composto e orações","src":"EAGS_2022_codigo_27_SIN.pdf · p. 5","vr":1},{"id":"EAGS2022-C27-PT-025","s":"por","y":2022,"c":"27","n":25,"a":"A","an":false,"du":false,"l":"","e":"Assinale a alternativa em que o verbo auxiliar destacado nas locuções verbais é também formador de tempo composto.","o":{"A":"“Se a gente não tivesse feito tanta coisa / (...) Podia ter vivido um grande amor.” (Grand’ Hotel, Kid Abelha)","B":"“E a minha namorada... / (...) dá a impressão que está entrando por uma nuvem adentro.” (V. Moraes)","C":"Os olhos infantis boiavam em lágrimas vendo os homens que começavam a desmontar o circo.","D":"O que poderia ter havido para que ela não descesse radiante e luminosa do trem?"},"t":"Verbos","tp":"Tempos, modos e formas verbais","src":"EAGS_2022_codigo_27_SIN.pdf · p. 5"},{"id":"EAGS2022-C27-PT-026","s":"por","y":2022,"c":"27","n":26,"a":"C","an":false,"du":false,"l":"","e":"Leia:\nA viagem parecia-lhe sem jeito, nem acreditava nela.\nPreparava-a lentamente, e só se resolvera a partir quando tudo estava definitivamente perdido. (Graciliano Ramos)\nColoque V (verdadeiro) ou F (falso) nas afirmativas que seguem sobre o uso das vírgulas no texto acima e assinale a alternativa que corresponde à sequência correta.\n(    ) Todas as vírgulas são de coordenação.\n(    ) Há uso de vírgula antes da conjunção e  para separar oração com sujeito diferente.\n(    ) A vírgula antes da conjunção e separa oração subordinada consecutiva.\n(    ) A vírgula antes da conjunção e marca a separação de oração coordenada adversativa.","o":{"A":"F - V - F - V","B":"V - F - V - F","C":"V - F - F - V","D":"F - V - V - F"},"t":"Sintaxe","tp":"Termos da oração: sujeito e predicado","src":"EAGS_2022_codigo_27_SIN.pdf · p. 5"},{"id":"EAGS2022-C27-PT-027","s":"por","y":2022,"c":"27","n":27,"a":"","an":true,"du":false,"l":"","e":"Leia:\nDesde os cinco anos merecera eu a alcunha de ‘menino do\ndiabo’; e verdadeiramente não era outra coisa; fui dos mais\nmalignos do meu tempo, arguto, indiscreto, traquinas e voluntarioso. (Machado de Assis)\nEm relação aos encontros vocálicos existentes no texto, é correto afirmar que","o":{"A":"oito são ditongos crescentes e três são hiatos.","B":"oito são ditongos decrescentes e dois são hiatos.","C":"sete são ditongos decrescentes, um é ditongo crescente e dois são hiatos.","D":"sete são ditongos decrescentes, dois são ditongos crescentes e dois são hiatos."},"t":"Ortografia e acentuação","tp":"Acentuação gráfica e encontros vocálicos","src":"EAGS_2022_codigo_27_SIN.pdf · p. 6"},{"id":"EAGS2022-C27-PT-028","s":"por","y":2022,"c":"27","n":28,"a":"A","an":false,"du":false,"l":"","e":"Respeitando-se a ordem natural dos termos sintáticos da oração, assinale a alternativa que apresenta o termo faltante na frase No teu colo é o meu abrigo, modificada de uma canção popular.","o":{"A":"Sujeito","B":"Objeto direto","C":"Adjunto adnominal","D":"Predicativo do sujeito"},"t":"Sintaxe","tp":"Termos da oração: sujeito e predicado","src":"EAGS_2022_codigo_27_SIN.pdf · p. 6"},{"id":"EAGS2022-C27-PT-029","s":"por","y":2022,"c":"27","n":29,"a":"B","an":false,"du":false,"l":"","e":"Assinale a alternativa em que a palavra em destaque não corresponde a um homônimo perfeito de outra classe gramatical.","o":{"A":"“Quem pensa que cabelo é mato / Quem pensa que cabelo é pasto” (Jorge Ben e Arnaldo Antunes)","B":"A menina exibia um olhar tão belo e, ao mesmo tempo, tão choroso, que comovia deveras!","C":"A palavra tique tem clara origem onomatopaica, segundo alguns estudiosos.","D":"Era triste ver a degradação do vilarejo e a piora da condição das almas do lugar."},"t":"Classes de palavras","tp":"Substantivo, adjetivo, advérbio e demais classes","src":"EAGS_2022_codigo_27_SIN.pdf · p. 6"},{"id":"EAGS2022-C27-PT-030","s":"por","y":2022,"c":"27","n":30,"a":"C","an":false,"du":false,"l":"","e":"Leia:\nAo contrário do vinho, o conhaque não amadurece na garrafa, apenas nos tonéis de carvalho. Para fazer-se um litro de aguardente que os ingleses chamam brandy, são necessários nove litros de vinho branco. Sua fermentação é feita anualmente em novembro, e a destilação dura os próximos três meses.\nAssinale o processo de formação de palavras que não encontra exemplo no texto.","o":{"A":"Derivação parassintética ou parssintetismo","B":"Composição por aglutinação","C":"Derivação prefixal","D":"Derivação sufixal"},"t":"Formação de palavras","tp":"Estrutura e formação de palavras","src":"EAGS_2022_codigo_27_SIN.pdf · p. 6"},{"id":"EAGS2022-C27-PT-031","s":"por","y":2022,"c":"27","n":31,"a":"D","an":false,"du":false,"l":"","e":"Leia:\nUma mancha negra gigantesca escureceu e apavorou Nova\nIorque. Era o ano de 1915 e acabara de ser erguido o primeiro arranha-céu da cidade, o Equitable Building, com quarenta e dois andares. (...) Os nova-iorquinos se enfureceram, temendo que a cidade fosse devorada pelas sombras, se os construtores de\nManhatan decidissem seguir o modelo estabelecido pelo\nEquitable. (Superinteressante, SP: Abril, jun., 2004)\nObservando o contexto, pode-se dizer que, no texto acima, existe uma oração reduzida que se classifica como","o":{"A":"subordinada substantiva objetiva direta.","B":"subordinada substantiva subjetiva.","C":"coordenada explicativa.","D":"coordenada aditiva."},"t":"Sintaxe","tp":"Período composto e orações","src":"EAGS_2022_codigo_27_SIN.pdf · p. 6"},{"id":"EAGS2022-C27-PT-032","s":"por","y":2022,"c":"27","n":32,"a":"B","an":false,"du":false,"l":"","e":"Leia as sentenças abaixo:\nI- Comprou tudo. Queria tudo.\nII- É a hora. O sino faz estremecer a cidade na hora.\nIII- Vivemos tempos difíceis. Nada possibilita certezas nos tempos difíceis.\nIV- O empresário quer ir embora do país. O filho do empresário foi sequestrado.\nAssinale a altenativa que traz a correta sequência de pronomes relativos (acompanhados ou não de preposição) a serem empregados na transformação das sentenças em períodos compostos por orações subordinadas adjetivas.","o":{"A":"que - na qual - que - onde","B":"quanto - quando - em que - cujo","C":"quanto - onde - nos quais - o qual","D":"que - que - onde - cujo"},"t":"Sintaxe","tp":"Período composto e orações","src":"EAGS_2022_codigo_27_SIN.pdf · p. 6"},{"id":"EAGS2022-C27-PT-033","s":"por","y":2022,"c":"27","n":33,"a":"D","an":false,"du":false,"l":"","e":"Assinale a alternativa em que o termo grifado não é objeto direto.","o":{"A":"“Em vez das mágoas de agora,\nEu tinha nessas delícias\nDe minha mãe as carícias\nE beijos da minha irmã.” (Álvares de Azevedo)","B":"“Este lugar delicioso e triste, cansada de viver, tinha escolhido para morrer a mísera Lindoia.” (Santa Rita Durão)","C":"“Julgando inúteis as cautelas, curvei-me à fatalidade.”\n(G. Rosa)","D":"“As flores leva-as a brisa.” (José de Alencar)"},"t":"Sintaxe","tp":"Termos da oração: complementos e adjuntos","src":"EAGS_2022_codigo_27_SIN.pdf · p. 6"},{"id":"EAGS2022-C27-PT-034","s":"por","y":2022,"c":"27","n":34,"a":"C","an":false,"du":false,"l":"","e":"Leia o texto abaixo e avalie as informações sobre ele.\nNão existem crianças de rua. Existem crianças na rua. E toda vez que um menino está na rua é porque alguém o botou lá.\n(Marina Colasanti)\nI- Nos dois casos, os termos grifados são adjuntos adnominais.\nII- A expressão “de rua” denota qualidade, e “na rua” expressa localização.\nIII- Com a troca da preposição no adjunto, o texto passou a fazer uma crítica à sociedade.\nEstá correto o que se afirma em","o":{"A":"I e II.","B":"I e III.","C":"II e III.","D":"I, II e III."},"t":"Classes de palavras","tp":"Substantivo, adjetivo, advérbio e demais classes","src":"EAGS_2022_codigo_27_SIN.pdf · p. 6"},{"id":"EAGS2022-C27-PT-035","s":"por","y":2022,"c":"27","n":35,"a":"C","an":false,"du":false,"l":"","e":"Assinale a alternativa correta a respeito do que se afirma sobre substantivo.","o":{"A":"Está correto afirmar que a História registrou uma grande cisma religiosa, porque a cisma significa dissidência.","B":"Na expressão Rebeldes Brasileiros, o substantivo é rebelde e classifica-se como sobrecomum.","C":"Quando o substantivo mantém o gênero para designar seres do sexo masculino e do feminino, é classificado de substantivo uniforme, caso de criatura.","D":"O substantivo coletivo junta pode ser usado de forma ampla, indicando, por exemplo, conjunto de médicos, examinadores, pessoas em geral, atletas e artistas."},"t":"Classes de palavras","tp":"Substantivo, adjetivo, advérbio e demais classes","src":"EAGS_2022_codigo_27_SIN.pdf · p. 7"},{"id":"EAGS2022-C27-PT-036","s":"por","y":2022,"c":"27","n":36,"a":"C","an":false,"du":false,"l":"","e":"Assinale a frase em que a locução adjetiva não apresenta adjetivo correspondente.","o":{"A":"Uma pessoa sem habilidade não pode executar essa tarefa.","B":"Os sons da tarde eram somente de um ou outro pássaro.","C":"Foi difícil encontrar a peça da impressora que estragou.","D":"Todos passamos por devaneios de paixão."},"t":"Classes de palavras","tp":"Substantivo, adjetivo, advérbio e demais classes","src":"EAGS_2022_codigo_27_SIN.pdf · p. 7"},{"id":"EAGS2022-C27-PT-037","s":"por","y":2022,"c":"27","n":37,"a":"A","an":false,"du":false,"l":"","e":"Observe o diálogo:\n— Não posso fazer o relatório agora porque estou muito ocupado, esclareceu Jorge.\n— Então me entregue até amanhã, pediu Alice.\nAssinale a alternativa que contém a correta transposição do diálogo acima para o discurso indireto.","o":{"A":"Jorge esclareceu que não podia fazer o relatório naquele momento porque estava muito ocupado. Alice então lhe pediu que entregasse até o dia seguinte.","B":"Jorge disse que não ia fazer o relatório nesse momento porque estava muito ocupado. Alice lhe pediu então que entregue até o dia seguinte.","C":"Jorge esclareceu que não poderia fazer o relatório agora porque estou muito ocupado. Alice então lhe pediu que entregasse até amanhã.","D":"Jorge disse que não irá fazer o relatório hoje. Estou muito ocupado, disse. Alice então lhe solicitou que entregue até o dia seguinte."},"t":"Ortografia e acentuação","tp":"Ortografia, grafia e hífen","src":"EAGS_2022_codigo_27_SIN.pdf · p. 7"},{"id":"EAGS2022-C27-PT-038","s":"por","y":2022,"c":"27","n":38,"a":"A","an":false,"du":false,"l":"","e":"Assinale a alternativa que apresenta desvio de norma padrão, em relação à regência nominal.","o":{"A":"Era um homem ambicioso com a fama. Não descansava sua mente, que projetava delírios de sucesso.","B":"A moça era filha da melhor doceira que já existira na região. E ela seguiu os passos de sua mãe, mas não era delicada de mão.","C":"Sim, havia um fato, e ele percorreu ruas, casas, redes sociais...\nEvidente era mais a curiosidade em dizer do que em saber.","D":"O filho queria brincar. Pedia que pedia à mãe. Coitada! Estava tão atarefada em encomendas! Suas mãos sabiam, e o coração doía."},"t":"Regência","tp":"Regência verbal e nominal","src":"EAGS_2022_codigo_27_SIN.pdf · p. 7"},{"id":"EAGS2022-C27-PT-039","s":"por","y":2022,"c":"27","n":39,"a":"A","an":false,"du":false,"l":"","e":"Leia:\nI- Forte herança africana no país, o Samba de Roda do\nRecôncavo Baiano foi reconhecido pela Unesco como\nPatrimônio Oral e Imaterial da Humanidade.\nII- O horror da cena atraía os olhos, mas eu os desviava, talvez pensando assim: tudo desaparece, tudo é fantasia.\nIII- “A pátria que quisera ter era um mito; um fantasma criado\npor ele no silêncio de seu gabinete.” (Lima Barreto).\nHá aposto em","o":{"A":"I e II.","B":"II e III.","C":"I apenas.","D":"III apenas."},"t":"Sintaxe","tp":"Termos da oração: complementos e adjuntos","src":"EAGS_2022_codigo_27_SIN.pdf · p. 7"},{"id":"EAGS2022-C27-PT-040","s":"por","y":2022,"c":"27","n":40,"a":"D","an":false,"du":false,"l":"","e":"Assinale a alternativa em que o termo destacado não desempenha a mesma função sintática do que se destaca na seguinte frase de Machado de Assis: O ponto cresceu, fez sol. Fui por ali dentro, sem arder, porque as almas são incombustíveis.","o":{"A":"Carlos saiu estudante e voltou como doutor.","B":"A sensação vibrante da arena, o vaqueiro já não o era.","C":"O médico deixou a sala de cirurgia, muito fatigado, muito cabisbaixo.","D":"“Oh! Como se me alonga, de ano em ano/ a peregrinação cansada minha”. (Camões)\nRascunho"},"t":"Sintaxe","tp":"Termos da oração: complementos e adjuntos","src":"EAGS_2022_codigo_27_SIN.pdf · p. 7"},{"id":"EAGS2022-C27-INF-041","s":"inf","y":2022,"c":"27","n":41,"a":"A","an":false,"du":false,"l":"","e":"Selecione a alternativa que representa um endereço IP da classe B.","o":{"A":"160.0.10.8","B":"15.16.17.18","C":"195.0.0.255","D":"126.255.255.255"},"t":"Redes de computadores","tp":"Protocolos, endereçamento e arquitetura de redes","src":"EAGS_2022_codigo_27_SIN.pdf · p. 8"},{"id":"EAGS2022-C27-INF-042","s":"inf","y":2022,"c":"27","n":42,"a":"A","an":false,"du":false,"l":"","e":"Assinale a alternativa que contém um componente que não faz parte da refrigeração de um computador.","o":{"A":"crossfire","B":"heatpipes","C":"ventoinha","D":"pasta térmica"},"t":"Hardware e arquitetura","tp":"Componentes, memória, processamento e sistemas digitais","src":"EAGS_2022_codigo_27_SIN.pdf · p. 8"},{"id":"EAGS2022-C27-INF-043","s":"inf","y":2022,"c":"27","n":43,"a":"D","an":false,"du":false,"l":"","e":"Complete os espaços da frase abaixo e assinale a sequência correta.\nEm um __________ o escalonamento é __________. O escalonador deve decidir quais são os __________ e sobre quais\nCPUs eles serão executados.","o":{"A":"monoprocessador - bidimensional - programas","B":"monoprocessador - unidimensional - modelos","C":"multiprocessador - unidimensional - períodos","D":"multiprocessador -bidimensional - processos"},"t":"Sistemas operacionais","tp":"Linux, Unix, processos, arquivos e comandos","src":"EAGS_2022_codigo_27_SIN.pdf · p. 8"},{"id":"EAGS2022-C27-INF-044","s":"inf","y":2022,"c":"27","n":44,"a":"C","an":false,"du":false,"l":"","e":"Sequências de escape são úteis para a exibição de caracteres na janela de comando. Assinale a alternativa que representa a sequência de escape responsável pela tabulação horizontal, ou seja, move o cursor de tela para a próxima parada de tabulação.","o":{"A":"\\new","B":"\\n","C":"\\t","D":"\\\\"},"t":"Sistemas operacionais","tp":"Linux, Unix, processos, arquivos e comandos","src":"EAGS_2022_codigo_27_SIN.pdf · p. 8"},{"id":"EAGS2022-C27-INF-045","s":"inf","y":2022,"c":"27","n":45,"a":"C","an":false,"du":false,"l":"","e":"Com relação aos operadores aritméticos, assinale a alternativa que apresenta a sequência correta da ordem de prioridade de operações.","o":{"A":"divisão, adição, subtração e multiplicação","B":"exponenciação, multiplicação, adição e inversão de sinal","C":"inversão de sinal, exponenciação, multiplicação e subtração","D":"multiplicação, adição, manutenção de sinal e inversão de sinal"},"t":"Algoritmos e lógica","tp":"Fluxogramas, estruturas de controle e pseudocódigo","src":"EAGS_2022_codigo_27_SIN.pdf · p. 8"},{"id":"EAGS2022-C27-INF-046","s":"inf","y":2022,"c":"27","n":46,"a":"B","an":false,"du":false,"l":"","e":"Qual o nome da técnica pela qual um processo confirma que seu parceiro na comunicação é quem afirma ser e não um impostor?","o":{"A":"Three Way Hand Shake","B":"autenticação","C":"criptografia","D":"IPSec"},"t":"Sistemas operacionais","tp":"Linux, Unix, processos, arquivos e comandos","src":"EAGS_2022_codigo_27_SIN.pdf · p. 8"},{"id":"EAGS2022-C27-INF-047","s":"inf","y":2022,"c":"27","n":47,"a":"B","an":false,"du":false,"l":"","e":"Em relação ao conceito de roteamento em rede de computadores, marque V para verdadeiro e F para falso. Em seguida, assinale a alternativa com a sequência correta.\n(    ) O algoritmo de roteamento é a parte do software da camada de rede responsável pela decisão sobre a interface de saída a ser usada na transmissão do pacote de entrada.\n(    ) Algoritmos não adaptativos baseiam suas rotas através da análise da rede em tempo real.\n(    ) O algoritmo de roteamento RIP pertence à classe “Vetor de\nDistância”\n(    ) Flooding é uma técnica na qual cada pacote de entrada é enviado para todas as interfaces de saída, exceto para aquela em que chegou.","o":{"A":"V - V - F - F","B":"V - F - V - V","C":"F - F - V - F","D":"F - V - F - V"},"t":"Algoritmos e lógica","tp":"Fluxogramas, estruturas de controle e pseudocódigo","src":"EAGS_2022_codigo_27_SIN.pdf · p. 8"},{"id":"EAGS2022-C27-INF-048","s":"inf","y":2022,"c":"27","n":48,"a":"A","an":false,"du":false,"l":"","e":"Considerando o contexto de segurança da informação, existe um termo que faz referência a e-mails não solicitados, e que comumente são enviados a muitos destinatários. Assinale a alternativa que contém esse termo.","o":{"A":"spam","B":"cookies","C":"flooding","D":"defacement"},"t":"Segurança da informação","tp":"Autenticação, controle de acesso e proteção","src":"EAGS_2022_codigo_27_SIN.pdf · p. 8"},{"id":"EAGS2022-C27-INF-049","s":"inf","y":2022,"c":"27","n":49,"a":"D","an":false,"du":false,"l":"","e":"Em JAVA, os tipos são divididos em primitivos e por referência. Assinale a alternativa que contém todos os tipos primitivos de JAVA.","o":{"A":"boolean, short, int, long e real.","B":"boolean, short, int, long, byte, timestamp e real.","C":"boolean, short, int, long, char, float e complex.","D":"boolean, short, int, long, char, byte, float e double."},"t":"Linguagens de programação","tp":"PHP, Java e sintaxe de linguagens","src":"EAGS_2022_codigo_27_SIN.pdf · p. 8"},{"id":"EAGS2022-C27-INF-050","s":"inf","y":2022,"c":"27","n":50,"a":"C","an":false,"du":false,"l":"","e":"A técnica de interceptação de tráfego, também conhecida pelo termo sniffing, tem por objetivo monitorar a comunicação em redes de computadores. Assinale a alternativa que apresenta as duas formas de aplicação dessa técnica.","o":{"A":"ativa e passiva","B":"cliente e servidor","C":"legítima e maliciosa","D":"análises de tráfego interno e externo"},"t":"Redes de computadores","tp":"Protocolos, endereçamento e arquitetura de redes","src":"EAGS_2022_codigo_27_SIN.pdf · p. 8"},{"id":"EAGS2022-C27-INF-051","s":"inf","y":2022,"c":"27","n":51,"a":"C","an":false,"du":false,"l":"","e":"Relacione as colunas quanto às funções de cada trecho de código. Em seguida, assinale a alternativa com a sequência correta.\n(    ) Leitura de cada um\n1 – para a de 1 até 150 passo 1 faça dos 150 valores da leia e[a] matriz.\nfim_para\n2 – para a de 1 até 150 passo 1 faça\n(    ) Criação da matriz escreva f[a] com as seguintes fim_para premissas:\n• caso o elemento\n3 – para a de 1 até 150 passo 1 faça seja divisível por i ← e[a] div 5\n5, somar 7 a seu\nse (i = 0) então\nvalor;\nf[a] ← e[a] + 7\n• senão, somar 12 a senão seu valor.\nf[a] ← e[a] + 12 fim_se\n(    ) Apresentação da fim_para matriz resultante.","o":{"A":"3 - 1 - 2","B":"1 - 2 - 3","C":"1 - 3 - 2","D":"2 - 3 - 1"},"t":"Algoritmos e lógica","tp":"Fluxogramas, estruturas de controle e pseudocódigo","src":"EAGS_2022_codigo_27_SIN.pdf · p. 9"},{"id":"EAGS2022-C27-INF-052","s":"inf","y":2022,"c":"27","n":52,"a":"A","an":false,"du":false,"l":"","e":"No contexto de segurança da informação, cada ator que faz uso de recursos computacionais tem suas obrigações e direitos definidos, de acordo com sua organização. Assinale a alternativa que apresenta o termo relativo a essa definição.","o":{"A":"política de segurança","B":"identity theft","C":"patch","D":"SSID"},"t":"Segurança da informação","tp":"Autenticação, controle de acesso e proteção","src":"EAGS_2022_codigo_27_SIN.pdf · p. 9"},{"id":"EAGS2022-C27-INF-053","s":"inf","y":2022,"c":"27","n":53,"a":"D","an":false,"du":false,"l":"","e":"É um dos principais tipos aceitos pelo MySQL e armazena a data em formato padrão UNIX (número de segundos após a data base).","o":{"A":"time","B":"year [(2/4)]","C":"real [(M,D)]","D":"timestamp [(M)]"},"t":"Banco de dados","tp":"SQL, SGBD, modelagem e administração de dados","src":"EAGS_2022_codigo_27_SIN.pdf · p. 9"},{"id":"EAGS2022-C27-INF-054","s":"inf","y":2022,"c":"27","n":54,"a":"C","an":false,"du":false,"l":"","e":"Considere um ambiente PHP configurado e funcionando corretamente. A execução do código abaixo resultará em qual saída em tela?","o":{"A":"O código possui um erro e não executará.","B":"123","C":"1234","D":"12345"},"t":"Linguagens de programação","tp":"PHP, Java e sintaxe de linguagens","src":"EAGS_2022_codigo_27_SIN.pdf · p. 9","vr":1},{"id":"EAGS2022-C27-INF-055","s":"inf","y":2022,"c":"27","n":55,"a":"D","an":false,"du":false,"l":"","e":"A crescente demanda, na rede mundial de computadores, de transações financeiras criou a necessidade de conexões seguras.\nTal fenômeno desencadeou a criação de um pacote de segurança chamado","o":{"A":"PFSense.","B":"Debian.","C":"TCP.","D":"SSL."},"t":"Redes de computadores","tp":"Protocolos, endereçamento e arquitetura de redes","src":"EAGS_2022_codigo_27_SIN.pdf · p. 9"},{"id":"EAGS2022-C27-INF-056","s":"inf","y":2022,"c":"27","n":56,"a":"","an":true,"du":false,"l":"","e":"O profissional que desempenha tarefas relacionadas à programação pode fazer uso de uma ferramenta capaz de descrever um programa detalhadamente, chegando ao nível de instruções.\nAssinale a alternativa que apresenta o termo que descreve tal definição.","o":{"A":"conjunto de registros","B":"diagrama de blocos","C":"fluxograma","D":"variável"},"t":"Algoritmos e lógica","tp":"Fluxogramas, estruturas de controle e pseudocódigo","src":"EAGS_2022_codigo_27_SIN.pdf · p. 9","vr":1},{"id":"EAGS2022-C27-INF-057","s":"inf","y":2022,"c":"27","n":57,"a":"B","an":false,"du":false,"l":"","e":"Acerca dos principais comandos de controle e gerenciamento de um banco de dados MySQL, assinale a alternativa correta.","o":{"A":"Pode-se afirmar que o comando Insert não tem a função de inserir dados em uma tabela.","B":"Pode-se afirmar que o comando Update salva alterações feitas em uma tabela.","C":"Pode-se afirmar que a função Drop Table executa uma inserção dentro de uma tabela.","D":"Pode-se afirmar que o comando Alter Table serve apenas para travar qualquer modificação dentro de uma tabela."},"t":"Banco de dados","tp":"SQL, SGBD, modelagem e administração de dados","src":"EAGS_2022_codigo_27_SIN.pdf · p. 9"},{"id":"EAGS2022-C27-INF-058","s":"inf","y":2022,"c":"27","n":58,"a":"C","an":false,"du":false,"l":"","e":"Relacione as colunas quanto aos tipos de memória. Em seguida, assinale a alternativa com a sequência correta.\n(    ) Não utiliza sinal síncrono\n1 – Memória estática separado.\n2 – Memória síncrona\n3 – Memória dinâmica\n(    ) É rotulada com o clock\n4 – Memória assíncrona máximo suportado.\n(    ) É utilizada na memória principal do computador.\n(    ) Usa flip-flop, circuito para armazenamento de cada bit de informação em seu interior.","o":{"A":"1 - 2 - 3 - 4","B":"2 - 3 - 1 - 4","C":"4 - 2 - 3 - 1","D":"4 - 1 - 2 - 3"},"t":"Hardware e arquitetura","tp":"Componentes, memória, processamento e sistemas digitais","src":"EAGS_2022_codigo_27_SIN.pdf · p. 9","vr":1},{"id":"EAGS2022-C27-INF-059","s":"inf","y":2022,"c":"27","n":59,"a":"C","an":false,"du":false,"l":"","e":"Para tratar problemas de inconsistência nos sistemas de arquivos, a maioria dos computadores tem um programa utilitário que realiza essa verificação. Assinale a alternativa que corresponde, respectivamente, a exemplos em Unix e Windows.","o":{"A":"fsck e setup","B":"reboot e setup","C":"fsck e scandisk","D":"memória cache e scandisk"},"t":"Sistemas operacionais","tp":"Linux, Unix, processos, arquivos e comandos","src":"EAGS_2022_codigo_27_SIN.pdf · p. 9"},{"id":"EAGS2022-C27-INF-060","s":"inf","y":2022,"c":"27","n":60,"a":"A","an":false,"du":false,"l":"","e":"Considerando o contexto de lógica de programação, assinale a alternativa que apresenta, respectivamente, a quantidade e os tipos de passagem de parâmetros.","o":{"A":"2: valor e referência","B":"2: formal e informal","C":"2: dado e informação","D":"3: booleano, real e inteiro"},"t":"Linguagens de programação","tp":"PHP, Java e sintaxe de linguagens","src":"EAGS_2022_codigo_27_SIN.pdf · p. 10"},{"id":"EAGS2022-C27-INF-061","s":"inf","y":2022,"c":"27","n":61,"a":"C","an":false,"du":false,"l":"","e":"O que se caracteriza por utilizar um mesmo nome para vários métodos diferentes e também é conhecido(a) como polimorfismo ad-hoc?","o":{"A":"sobreposição","B":"paramétrico","C":"sobrecarga","D":"inclusão"},"t":"Programação orientada a objetos","tp":"Classes, herança, encapsulamento e polimorfismo","src":"EAGS_2022_codigo_27_SIN.pdf · p. 10"},{"id":"EAGS2022-C27-INF-062","s":"inf","y":2022,"c":"27","n":62,"a":"D","an":false,"du":false,"l":"","e":"Complete os espaços da frase abaixo e assinale a alternativa com a sequência correta.\nDois métodos gerais para o gerenciamento de memória podem ser usados, dependendo (em parte) dos recursos de\n__________ disponíveis. A estratégia mais simples, denominada\n_____________, consiste em trazer totalmente cada processo para a memória, executá-lo durante um certo tempo e então devolvê-lo ao disco. A outra estratégia, denominada ___________, permite que programas possam ser executados mesmo que estejam apenas parcialmente carregados na memória principal.","o":{"A":"software -  troca de processos - memória virtual","B":"hardware  - memória virtual - troca de processos","C":"software  - memória virtual - troca de processos","D":"hardware - troca de processos - memória virtual"},"t":"Programação orientada a objetos","tp":"Classes, herança, encapsulamento e polimorfismo","src":"EAGS_2022_codigo_27_SIN.pdf · p. 10"},{"id":"EAGS2022-C27-INF-063","s":"inf","y":2022,"c":"27","n":63,"a":"D","an":false,"du":false,"l":"","e":"Assinale a alternativa que apresenta a técnica de programação que cria novas sub-rotinas a partir de uma primeira sub-rotina.","o":{"A":"teste lógico","B":"escrita de registros","C":"escopo de variáveis","D":"refinamento sucessivo"},"t":"Algoritmos e lógica","tp":"Fluxogramas, estruturas de controle e pseudocódigo","src":"EAGS_2022_codigo_27_SIN.pdf · p. 10"},{"id":"EAGS2022-C27-INF-064","s":"inf","y":2022,"c":"27","n":64,"a":"B","an":false,"du":false,"l":"","e":"Sabe-se que em JAVA, todas as classes herdam características direta, ou indiretamente, de uma classe específica.\nAssinale a alternativa que contém tal classe.","o":{"A":"this","B":"object","C":"string","D":"override"},"t":"Linguagens de programação","tp":"PHP, Java e sintaxe de linguagens","src":"EAGS_2022_codigo_27_SIN.pdf · p. 10"},{"id":"EAGS2022-C27-INF-065","s":"inf","y":2022,"c":"27","n":65,"a":"D","an":false,"du":false,"l":"","e":"Sabendo-se que no Unix, todos os arquivos especiais\n(dispositivos de E/S) são mantidos em um diretório /dev. Avalie as informações abaixo\nI - O ideal é fazer cópias de segurança apenas de diretórios específicos e de tudo que está neles, ao invés de fazer de todo o sistema de arquivos.\nII - Fazer uma cópia de segurança é extremamente perigoso, pois o programa de cópia de segurança poderia não voltar mais a funcionar se ele fosse tentar ler cada um desses arquivos até terminar.\nIII - Em muitas instalações, os programas (binários) executáveis residem em uma parte limitada da árvore do sistema de arquivos.\nAssim, não é necessário fazer cópias de segurança desses arquivos se eles puderem ser instalados a partir do CD-ROM fornecido pelo fabricante.\nEstá apenas correto o que se afirma em","o":{"A":"I e II.","B":"II e III.","C":"I e III.","D":"I, II e III."},"t":"Redes de computadores","tp":"Protocolos, endereçamento e arquitetura de redes","src":"EAGS_2022_codigo_27_SIN.pdf · p. 10"},{"id":"EAGS2022-C27-INF-066","s":"inf","y":2022,"c":"27","n":66,"a":"B","an":false,"du":false,"l":"","e":"No contexto de lógica de programação, o símbolo em destaque tem um dado significado. Assinale a alternativa que corresponde e esse símbolo.","o":{"A":"entrada de dados","B":"processamento","C":"conector","D":"display"},"t":"Algoritmos e lógica","tp":"Símbolos de representação de algoritmos e fluxogramas","src":"EAGS_2022_codigo_27_SIN.pdf · p. 10","vr":1},{"id":"EAGS2022-C27-INF-067","s":"inf","y":2022,"c":"27","n":67,"a":"C","an":false,"du":false,"l":"","e":"Considerando a segurança de computadores, os sistemas operacionais geralmente dispõem de 3 tipos de contas de usuário.\nAssinale a alternativa que não apresenta um desses tipos de conta.","o":{"A":"administrador","B":"convidado","C":"técnico","D":"padrão"},"t":"Segurança da informação","tp":"Autenticação, controle de acesso e proteção","src":"EAGS_2022_codigo_27_SIN.pdf · p. 10"},{"id":"EAGS2022-C27-INF-068","s":"inf","y":2022,"c":"27","n":68,"a":"A","an":false,"du":false,"l":"","e":"Qual instrução, quando executada dentro de um while, for, do...while ou switch, ocasiona a saída imediata dessa instrução?","o":{"A":"break","B":"public","C":"private","D":"extends"},"t":"Algoritmos e lógica","tp":"Fluxogramas, estruturas de controle e pseudocódigo","src":"EAGS_2022_codigo_27_SIN.pdf · p. 10"},{"id":"EAGS2022-C27-INF-069","s":"inf","y":2022,"c":"27","n":69,"a":"B","an":false,"du":false,"l":"","e":"Após a criação de um novo banco de dados, deseja-se listar todos os bancos de dados existentes num dado servidor. Assinale a alternativa que representa o comando que realiza essa função:","o":{"A":"create table","B":"show databases","C":"drop database","D":"create database"},"t":"Banco de dados","tp":"SQL, SGBD, modelagem e administração de dados","src":"EAGS_2022_codigo_27_SIN.pdf · p. 10"},{"id":"EAGS2022-C27-INF-070","s":"inf","y":2022,"c":"27","n":70,"a":"A","an":false,"du":false,"l":"","e":"Em JAVA, qual a palavra-chave responsável por estabelecer um novo objeto da classe especificada?","o":{"A":"new","B":"public","C":"private","D":"protected"},"t":"Linguagens de programação","tp":"PHP, Java e sintaxe de linguagens","src":"EAGS_2022_codigo_27_SIN.pdf · p. 11"},{"id":"EAGS2022-C27-INF-071","s":"inf","y":2022,"c":"27","n":71,"a":"D","an":false,"du":false,"l":"","e":"A configuração dos adaptadores de rede no Linux é feita dentro do arquivo /etc/network/interfaces como mostra o exemplo abaixo auto eth0 iface eth0 inet static address 10.0.0.10 netmask 255.0.0.0 network 10.0.0.0 broadcast 10.255.255.255 gateway 10.0.0.250\nAssinale a alternativa que descreve uma opção correta para a configuração de uma segunda placa de rede.","o":{"A":"Basta apagar o bloco.","B":"Não é possível configurar uma segunda placa de rede.","C":"Basta criar um novo arquivo /etc/network/interfaces1, inserir um novo bloco, similar ao anterior, e substituir eth0 por eth1.","D":"Basta criar, dentro do mesmo arquivo, um novo bloco, similar ao anterior, substituindo o número de IP e trocando o eth0 por eth1 em todas as ocorrências em que o mesmo aparecer."},"t":"Redes de computadores","tp":"Protocolos, endereçamento e arquitetura de redes","src":"EAGS_2022_codigo_27_SIN.pdf · p. 11","vr":1},{"id":"EAGS2022-C27-INF-072","s":"inf","y":2022,"c":"27","n":72,"a":"D","an":false,"du":false,"l":"","e":"Assinale a alternativa correta sobre a técnica de compactação de memória.","o":{"A":"O esperado é que a maioria dos processos não cresça durante a execução.","B":"É geralmente usada devido à otimização de tempo de processamento necessária.","C":"Em processos com um tamanho fixo e inalterável, a alocação é complexa, podendo o sistema operacional fragmentá-lo.","D":"Quando troca de processos deixam muitos espaços vazios na memória, é possível combiná-los todos em um único espaço contíguo de memória, movendo-os, o máximo possível, para endereços mais baixos."},"t":"Sistemas operacionais","tp":"Linux, Unix, processos, arquivos e comandos","src":"EAGS_2022_codigo_27_SIN.pdf · p. 11"},{"id":"EAGS2022-C27-INF-073","s":"inf","y":2022,"c":"27","n":73,"a":"D","an":false,"du":false,"l":"","e":"Considerando Tabela “ALUNOS” a seguir, que contém os campos “ID”, “NOME” e “ESPEC”, assinale a alternativa que retorne todos os campos da Tabela “ALUNOS” que possuem o nome iniciando com a letra L:","o":{"A":"SELECT * FROM ALUNOS WHERE NOME = ‘L’;","B":"SELECT * FROM ALUNOS WHERE NOME IS EQUAL = ‘L’;","C":"SELECT * FROM ALUNOS WHERE NOME = ‘L$’;","D":"SELECT * FROM ALUNOS WHERE NOME LIKE ‘L%’;"},"t":"Banco de dados","tp":"SQL, SGBD, modelagem e administração de dados","src":"EAGS_2022_codigo_27_SIN.pdf · p. 11"},{"id":"EAGS2022-C27-INF-074","s":"inf","y":2022,"c":"27","n":74,"a":"D","an":false,"du":false,"l":"","e":"Em gerenciamento de memórias, há uma memória que não pode ser modificada, pois ela já vem gravada de fábrica. Assinale a alternativa que representa esse padrão.","o":{"A":"PROM","B":"Flash","C":"EPROM","D":"Mask ROM"},"t":"Hardware e arquitetura","tp":"Componentes, memória, processamento e sistemas digitais","src":"EAGS_2022_codigo_27_SIN.pdf · p. 11"},{"id":"EAGS2022-C27-INF-075","s":"inf","y":2022,"c":"27","n":75,"a":"D","an":false,"du":false,"l":"","e":"Pode haver, em um programa, a necessidade de se executar um mesmo bloco de instruções seguidas vezes. Assinale a alternativa que apresenta a correta denominação das estruturas responsáveis por tal funcionalidade.","o":{"A":"PDL","B":"flag","C":"modularização","D":"laços de repetição"},"t":"Algoritmos e lógica","tp":"Fluxogramas, estruturas de controle e pseudocódigo","src":"EAGS_2022_codigo_27_SIN.pdf · p. 11"},{"id":"EAGS2022-C27-INF-076","s":"inf","y":2022,"c":"27","n":76,"a":"B","an":false,"du":false,"l":"","e":"Considerando o modelo de “Von Neumann”, temos um componente responsável pela execução de dados, conhecido atualmente como unidade lógica. Assinale a alternativa que representa essa função.","o":{"A":"memória","B":"central aritmética","C":"central de controle","D":"meio externo de gravação"},"t":"Linguagens de programação","tp":"PHP, Java e sintaxe de linguagens","src":"EAGS_2022_codigo_27_SIN.pdf · p. 11"},{"id":"EAGS2022-C27-INF-077","s":"inf","y":2022,"c":"27","n":77,"a":"","an":true,"du":false,"l":"","e":"Analise o algoritmo a seguir, escrito em português estruturado. Em seguida assinale a alternativa correta.\nprograma prova procedimento diminuir (x, y : inteiro) var\nW: inteiro início\nW ← x-y escreva w fim início var A, B : inteiro leia A leia B diminuir(A,B) fim","o":{"A":"As variáveis A, B e W são variáveis reais.","B":"As variáveis A, B e W são variáveis formais.","C":"A variável W é parâmetro formal, e as variáveis A e B são parâmetros reais.","D":"A variável W é parâmetro real, e as variáveis A e B são parâmetros formais."},"t":"Algoritmos e lógica","tp":"Fluxogramas, estruturas de controle e pseudocódigo","src":"EAGS_2022_codigo_27_SIN.pdf · p. 11"},{"id":"EAGS2022-C27-INF-078","s":"inf","y":2022,"c":"27","n":78,"a":"A","an":false,"du":false,"l":"","e":"Assinale a alternativa que contém a sintaxe que permite monitorar, em tempo real, as atividades de log.","o":{"A":"tail -f /var/log/syslog","B":"head  /var/log/syslog","C":"tail -n 10 /var/log/syslog","D":"head -n 10 /var/log/syslog"},"t":"Sistemas operacionais","tp":"Linux, Unix, processos, arquivos e comandos","src":"EAGS_2022_codigo_27_SIN.pdf · p. 11"},{"id":"EAGS2022-C27-INF-079","s":"inf","y":2022,"c":"27","n":79,"a":"D","an":false,"du":false,"l":"","e":"Qual o nome da solução encontrada para a necessidade mundial de envio de mensagens que contêm acentos, imagens, áudios e programas binários?","o":{"A":"ITIL","B":"SQL","C":"RJ-45","D":"MIME"},"t":"Banco de dados","tp":"SQL, SGBD, modelagem e administração de dados","src":"EAGS_2022_codigo_27_SIN.pdf · p. 12"},{"id":"EAGS2022-C27-INF-080","s":"inf","y":2022,"c":"27","n":80,"a":"B","an":false,"du":false,"l":"","e":"Qual a técnica utilizada para configurar o processador com um clock acima do seu valor padrão?","o":{"A":"potência","B":"overclock","C":"jumpeamento","D":"multiplexação"},"t":"Hardware e arquitetura","tp":"Componentes, memória, processamento e sistemas digitais","src":"EAGS_2022_codigo_27_SIN.pdf · p. 12","vr":1},{"id":"EAGS2022-C27-INF-081","s":"inf","y":2022,"c":"27","n":81,"a":"B","an":false,"du":false,"l":"","e":"No contexto de lógica de programação, o símbolo em destaque possui um dado significado. Assinale a alternativa que corresponde e esse símbolo.","o":{"A":"teclado","B":"decisão","C":"terminal","D":"modificação de programas"},"t":"Algoritmos e lógica","tp":"Símbolos de representação de algoritmos e fluxogramas","src":"EAGS_2022_codigo_27_SIN.pdf · p. 12","vr":1},{"id":"EAGS2022-C27-INF-082","s":"inf","y":2022,"c":"27","n":82,"a":"A","an":false,"du":false,"l":"","e":"Relacione as colunas de acordo com os padrões de reutilização de projetos e, em seguida, assinale a alternativa com a sequência correta. OBS.: os núme
